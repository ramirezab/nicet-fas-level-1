":"Directly above the elevator call button, regardless of distance"},{"en":"On the ceiling within 30 ft (9.1 m) of the farthest elevator door"},{"en":"On the ceiling within 21 ft (6.4 m) of the centerline of each elevator door within the elevator bank"}],"ans":[3],"ref":"NFPA 72-2022 §21.3","exp":"The lobby detector used for elevator recall is installed on the ceiling within 21 ft (6.4 m) of the centerline of each elevator door in the bank served (§21.3). The 30 ft figure is the nominal smoke detector spacing on smooth ceilings, not this rule."},{"id":"sys-033","task":"1.2.1","type":"single","diff":2,"freq":true,"q":{"en":"During testing, the technician activates the elevator lobby smoke detector located at the designated level (main lobby). Where should the elevators be recalled?"},"opts":[{"en":"To the alternate level"},{"en":"To the designated level"},{"en":"To the top floor"},{"en":"They remain in normal service"}],"ans":[0],"ref":"NFPA 72-2022 §21.3","exp":"If the lobby detector at the designated level operates, the elevators must not carry passengers toward the fire, so they are sent to the alternate level. Lobby detectors on any other floor send the elevators to the designated level (§21.3). Verify both outputs (designated and alternate) when testing."},{"id":"sys-034","task":"1.2.1","type":"multi","select":2,"diff":3,"q":{"en":"A technician activates the smoke detector in an elevator machine room located on the top floor (not the designated level). Which TWO results should be verified? (Select TWO.)"},"opts":[{"en":"Elevators recall to the alternate level"},{"en":"Elevators recall to the designated level"},{"en":"The visual warning signal ('fire hat') in the elevator car flashes"},{"en":"Elevator main-line power is immediately shunt-tripped"},{"en":"No elevator action occurs; only a supervisory signal is sent"}],"ans":[1,2],"ref":"NFPA 72-2022 §21.3 and ASME A17.1","exp":"Machine room, control room, or hoistway detectors recall the elevators to the designated level (or to the alternate level if the machine room is on the designated level) and activate a separate output that flashes the visual warning signal ('fire hat') in the car, warning of fire in the hoistway or machine room (§21.3, ASME A17.1). Power shutdown is initiated by heat detectors or waterflow devices (§21.4), not by this smoke detector."},{"id":"sys-035","task":"1.1.1","type":"single","diff":2,"freq":true,"q":{"en":"Heat detectors are being installed in an elevator machine room to shut down elevator power before sprinkler discharge. Which installation meets NFPA 72?"},"opts":[{"en":"One detector anywhere in the room, with the same temperature rating as the sprinklers"},{"en":"Detectors within 2 ft (610 mm) of each sprinkler, with a lower temperature rating and higher sensitivity than the sprinkler"},{"en":"Detectors within 10 ft (3 m) of each sprinkler, with a higher temperature rating than the sprinkler"},{"en":"Smoke detectors with 60-second alarm verification instead of heat detectors"}],"ans":[1],"ref":"NFPA 72-2022 §21.4.1 and §21.4.2","exp":"§21.4.1 requires the heat detector to be within 2 ft (610 mm) of each sprinkler (or spaced by engineering analysis), and §21.4.2 requires it to have a lower temperature rating and higher sensitivity than the sprinkler, so power is shut off before water reaches the elevator equipment."},{"id":"sys-036","task":"1.2.2","type":"single","diff":3,"q":{"en":"A waterflow switch used to shut down elevator power (shunt trip) must be replaced. The replacement on the truck has an adjustable retard, factory-set at 60 seconds. What is correct?"},"opts":[{"en":"Use it with the 60-second retard; NFPA 72 allows up to 90 seconds"},{"en":"Use it with the retard set to 30 seconds"},{"en":"Use a switch without time-delay capability, because time-delay devices are not permitted for elevator power shutdown"},{"en":"Use it and add alarm verification at the FACU"}],"ans":[2],"ref":"NFPA 72-2022 §21.4.3","exp":"If pressure or waterflow switches are used to shut down elevator power at or before sprinkler discharge, §21.4.3 prohibits devices with time-delay switches or time-delay capability. The 90-second limit applies to waterflow as an alarm (Ch. 17), not to this function."},{"id":"sys-037","task":"1.2.2","type":"single","diff":2,"q":{"en":"After a repair in the elevator machine room, the FACU shows an off-normal condition because the control circuit voltage for the elevator shunt-trip disconnect has been lost. How does NFPA 72 require this condition to be indicated?"},"opts":[{"en":"As a fire alarm signal"},{"en":"It is not required to be monitored"},{"en":"As a supervisory signal at the control unit and required remote annunciators"},{"en":"Only on the elevator controller display"}],"ans":[2],"ref":"NFPA 72-2022 §21.4.4","exp":"§21.4.4 requires the presence of operating voltage in the elevator power shutdown control circuit to be monitored; its loss must produce a supervisory signal at the control unit and at required remote annunciators. That way everyone knows the shunt trip could not operate."},{"id":"sys-038","task":"1.2.1","type":"single","diff":2,"q":{"en":"During an acceptance test, a fire alarm is initiated in an area served by electrically locked egress doors that the fire alarm system must unlock. When must the doors unlock?"},"opts":[{"en":"Only after the fire department arrives"},{"en":"Prior to, or at the same time as, the activation of public-mode notification appliances in the area"},{"en":"60 seconds after the notification appliances start"},{"en":"Only when the alarm is silenced"}],"ans":[1],"ref":"NFPA 72-2022 Ch. 21 (electrically locked doors)","exp":"Electrically locked egress doors controlled by the system must unlock prior to, or at the same time as, activation of the public-mode notification appliances in the area they serve (NFPA 72 Ch. 21), and they must not relock until the system is reset. When testing, physically verify every door."},{"id":"sys-039","task":"1.3.1","type":"single","diff":2,"q":{"en":"A sequence of operations (input/output) matrix shows this row: Input 'Duct smoke detector – AHU-2'; outputs marked: 'Supervisory signal', 'Transmit supervisory to central station', 'Shut down AHU-2'. 'General alarm' is NOT marked. What should happen when that duct detector activates?"},"opts":[{"en":"General evacuation alarm throughout the building"},{"en":"Only AHU-2 shuts down; nothing is shown at the panel"},{"en":"A trouble signal, and all air handlers shut down"},{"en":"A supervisory signal at the panel and to the central station, and AHU-2 shuts down, with no building evacuation signal"}],"ans":[3],"ref":"NFPA 72-2022 Ch. 7 (sequence of operations matrix) and Ch. 21 (HVAC)","exp":"The input/output matrix shows exactly what each device does: here the duct detector produces a supervisory signal (locally and to the central station) and shuts down only AHU-2, with no general alarm. NFPA 72 allows duct detectors to initiate alarm or supervisory signals according to the design; follow the approved matrix and verify every output when testing."},{"id":"sys-040","task":"1.2.1","type":"single","diff":2,"q":{"en":"During an EVACS test, the system is broadcasting the automatic alert tone followed by the prerecorded evacuation message. A firefighter then makes a live voice announcement from the fire command center to that zone. What should happen?"},"opts":[{"en":"The live voice is mixed at equal volume with the recorded message"},{"en":"The live voice is blocked until the recorded message finishes all cycles"},{"en":"The live voice overrides the automatic message in the selected zone(s)"},{"en":"The system goes into trouble"}],"ans":[2],"ref":"NFPA 72-2022 Ch. 24 (§24.4, EVACS)","exp":"In an emergency voice/alarm communications system (EVACS), the typical automatic sequence is an alert tone followed by a prerecorded message; live voice instructions must override previous signals in the selected zones and take priority over subsequent automatic signals (Ch. 24). Every message, recorded or live, must be intelligible."},{"id":"sys-041","task":"1.3.1","type":"single","diff":2,"q":{"en":"EVACS drawings divide the building into 'ADSs.' What does ADS mean, and why does it matter?"},"opts":[{"en":"Addressable Device Segment; it limits the number of devices per SLC"},{"en":"Acoustically Distinguishable Space; voice intelligibility is planned and evaluated for each such space"},{"en":"Alarm Delay Sequence; it sets the PAS timers"},{"en":"Auxiliary Detection System; it identifies non-required detectors"}],"ans":[1],"ref":"NFPA 72-2022 Ch. 3 (ADS definition), Ch. 18, and Ch. 24","exp":"ADS = acoustically distinguishable space: a notification zone or subdivision with its own acoustic, environmental, or use characteristics. Voice intelligibility is designed and evaluated per ADS, and the design identifies which ADSs require it (Ch. 18 and 24)."},{"id":"sys-042","task":"1.3.1","type":"single","diff":1,"q":{"en":"A university's fire alarm signals from all its campus buildings (one owner) are monitored at a supervising station on campus staffed at all times by the university's own personnel. What type of supervising station is this?"},"opts":[{"en":"Central station"},{"en":"Remote supervising station"},{"en":"Proprietary supervising station"},{"en":"Public emergency alarm reporting system"}],"ans":[2],"ref":"NFPA 72-2022 Ch. 26 (§26.4)","exp":"A proprietary supervising station (§26.4) belongs to the same owner as the properties it supervises and is staffed at all times by the owner's own personnel. A central station (§26.3) is a listed company providing central station service (including runners); a remote supervising station (§26.5) is used where central station service is not required, for example signals sent to a communications center."},{"id":"sys-043","task":"1.3.1","type":"single","diff":2,"freq":true,"q":{"en":"A central station receives a fire alarm signal from a protected premises. Under NFPA 72, which response is required?"},"opts":[{"en":"Call the subscriber first and wait up to 10 minutes for confirmation before contacting the fire department"},{"en":"Immediately retransmit the alarm to the communications center, and dispatch a runner or technician to arrive within 2 hours if equipment needs to be manually reset"},{"en":"Dispatch a runner within 4 hours, then notify the fire department"},{"en":"Log the signal and notify the AHJ at the end of the month"}],"ans":[1],"ref":"NFPA 72-2022 §26.3.8 and §26.2","exp":"For alarms, the central station must immediately retransmit to the communications center, notify the subscriber, and, if equipment must be manually reset, dispatch a runner or technician to arrive within 2 hours (§26.3.8). Where the AHJ requires alarm verification, it must not delay retransmission more than 90 seconds (§26.2). Supervisory: runner within 2 hours; trouble: service personnel within 4 hours."},{"id":"sys-044","task":"1.1.2","type":"single","diff":2,"q":{"en":"A technician is installing a digital alarm communicator transmitter (DACT) that will use one telephone line (number). According to NFPA 72-2022, what else is required?"},"opts":[{"en":"Nothing else, as long as the DACT has line seizure"},{"en":"A local bell on the exterior of the building"},{"en":"A second telephone line on the same cable, with no further conditions"},{"en":"A second transmission means, such as a cellular or other performance-based path or a one-way private radio system"}],"ans":[3],"ref":"NFPA 72-2022 §26.6.4","exp":"A DACT using one telephone line must have a second transmission means: a one-way private radio system or a performance-based technology per §26.6.3 (cellular, IP). A second telephone line is permitted only under limited conditions. The DACT must also have line seizure, each channel is tested at intervals not exceeding 6 hours, and each attempt must not exceed 90 seconds from off-hook to on-hook (§26.6.4)."},{"id":"sys-045","task":"1.3.1","type":"single","diff":3,"q":{"en":"A protected premises reports to a central station over a single communications path (cellular only), as approved by the AHJ. Within what time must a failure of that path be annunciated at the supervising station?"},"opts":[{"en":"200 seconds"},{"en":"60 minutes"},{"en":"6 hours"},{"en":"24 hours"}],"ans":[1],"ref":"NFPA 72-2022 §26.6.3","exp":"With performance-based technologies (IP, cellular), when a single communications path is used, its failure must be annunciated at the supervising station within 60 minutes; with multiple paths, each path is verified at intervals not exceeding 6 hours (§26.6.3). 24 hours was the old DACT test interval (before 2013)."}]},{"topic":{"id":"nec","title":"NEC 2020 (NFPA 70): Article 760 and Wiring Methods","short":"NEC 760","tasks":["1.1.2","1.3.1","1.2.2"],"refs":["NFPA 70 (NEC) 2020 Art. 760, Parts I through IV","NEC 2020 §90.3, §90.5, §110.12, §110.26, §250.4","NEC 2020 §300.4, §300.11, §300.15, §300.21, §300.22, §314.16","NEC 2020 Art. 770 (optical fiber)"],"guide":"\n<h3>What NICET expects at Level I</h3>\n<p>Task 1.1.2 (install cabling and associated infrastructure) is one of the most heavily weighted tasks on the exam, and its main reference is <strong>NEC 2020 (NFPA 70), Article 760</strong>. A Level I technician does not design: you must choose the right cable for each space (plenum, riser, general use), support and protect it, keep it separated from power circuits, firestop penetrations, and know where the panel (FACU) gets its power and how that circuit is identified. Points go to whoever can <em>navigate</em> Article 760 in seconds, not to whoever memorized it.</p>\n<p>Remember that Article 760 is in Chapter 7 and, per 90.3, it <strong>supplements or modifies</strong> the general rules. Key example: per 760.3, only the Article 300 sections that Article 760 itself references apply.</p>\n\n<h3>Structure of Article 760</h3>\n<table>\n<thead><tr><th>Part</th><th>Sections</th><th>What it contains</th></tr></thead>\n<tbody>\n<tr><td>I. General</td><td>760.1 to 760.35</td><td>Scope, definitions (760.2), other articles (760.3), access (760.21), execution of work (760.24), abandoned cables (760.25), identification (760.30), circuits extending beyond one building (760.32), which Parts apply (760.35)</td></tr>\n<tr><td>II. NPLFA</td><td>760.41 to 760.53</td><td>Power source and branch circuit, overcurrent protection, wiring methods, conductors, NPLF/NPLFR/NPLFP cables</td></tr>\n<tr><td>III. PLFA</td><td>760.121 to 760.154</td><td>PLFA sources, marking, supply-side and load-side wiring methods, separation, circuit mixing, conductor size, support, cable applications and substitutions</td></tr>\n<tr><td>IV. Listing</td><td>760.176 and 760.179</td><td>Listing and marking of NPLFA and PLFA cables (including the CI suffix)</td></tr>\n</tbody>\n</table>\n<p>760.35 rule: <strong>NPLFA = Parts I and II</strong>; <strong>PLFA = Parts I and III</strong>. Most modern systems (SLCs, NACs, 24-V initiating circuits) are PLFA.</p>\n\n<h3>Definitions to master (760.2)</h3>\n<ul>\n<li><strong>Fire alarm circuit:</strong> the portion of the wiring and connected equipment powered and controlled by the fire alarm system; classified as PLFA or NPLFA.</li>\n<li><strong>PLFA:</strong> a circuit powered by a source that complies with 760.121 (a listed PLFA or Class 3 transformer or power supply, or listed equipment marked as a PLFA source).</li>\n<li><strong>NPLFA:</strong> a circuit powered by a source that complies with 760.41 and 760.43 (up to 600 V nominal).</li>\n<li><strong>Abandoned fire alarm cable:</strong> cable that is not terminated at equipment and not identified for future use with a tag.</li>\n<li><strong>Circuit integrity (CI) cable:</strong> cable that keeps critical circuits operating for a specified time under fire conditions.</li>\n</ul>\n\n<h3>Part I: general installation rules</h3>\n<ul>\n<li><strong>760.3:</strong> points to other rules that apply, including 300.21 (firestopping penetrations of fire-resistance-rated construction), 300.22 (ducts, plenums, and other air-handling spaces), Article 725 for building control circuits not powered by the fire alarm system, Article 770 for optical fiber, and a few other listed Chapter 3 sections.</li>\n<li><strong>760.21:</strong> an accumulation of cables must not prevent removal of access panels, including suspended ceiling panels.</li>\n<li><strong>760.24(A):</strong> neat and workmanlike installation; exposed cables supported by the <em>building structure</em> using straps, staples, cable ties, hangers, or similar fittings that do not damage the cable; comply with 300.4(D) and 300.11. Nonmetallic cable ties and accessories used in plenums must be listed for low smoke and heat release.</li>\n<li><strong>760.24(B):</strong> CI cable supported at no more than 24 in. (610 mm); within 7 ft of the floor, fastened every 18 in. (450 mm); supports and fasteners <strong>of steel</strong>.</li>\n<li><strong>760.25:</strong> remove the accessible portion of abandoned cables; cable left for future use needs a tag durable enough for the environment.</li>\n<li><strong>760.30:</strong> identify fire alarm circuits at terminal and junction locations to prevent unintentional signals while testing or servicing other systems. The NEC does not require the color red.</li>\n</ul>\n\n<h3>FACU power supply (760.41(B) and 760.121(B))</h3>\n<ol>\n<li>The branch circuit supplies no other loads.</li>\n<li>It may not be supplied through a GFCI or AFCI.</li>\n<li>The location of the overcurrent device is permanently identified at the FACU.</li>\n<li>The disconnecting means has red identification, is accessible only to qualified personnel, and is identified as 'FIRE ALARM CIRCUIT'; the red identification must not damage the breaker or obscure the manufacturer's markings.</li>\n</ol>\n<div class=\"callout\">NFPA 72 (Ch. 10) has parallel requirements for the branch-circuit disconnect, including an approved breaker locking device (NFPA 72 §10.6.5.4). If a question cites the NEC, answer with 760.41/760.121; if it cites NFPA 72, look in Chapter 10.</div>\n\n<h3>Key numbers</h3>\n<table>\n<thead><tr><th>Requirement</th><th>Value</th><th>Section</th></tr></thead>\n<tbody>\n<tr><td>Maximum NPLFA source voltage</td><td>600 V nominal</td><td>760.41(A)</td></tr>\n<tr><td>NPLFA overcurrent, 18 AWG / 16 AWG</td><td>7 A / 10 A</td><td>760.43</td></tr>\n<tr><td>Ampacity of 18 and 16 AWG NPLFA</td><td>Table 402.5 (6 A / 8 A)</td><td>760.49(A)</td></tr>\n<tr><td>NPLFA conductor insulation</td><td>not less than 600 V</td><td>760.49(B)</td></tr>\n<tr><td>Supply-side overcurrent for a PLFA source</td><td>not over 20 A</td><td>760.127</td></tr>\n<tr><td>PLFA cable voltage rating</td><td>not less than 300 V (and 60°C)</td><td>760.179(C)</td></tr>\n<tr><td>Single PLFA conductor</td><td>not smaller than 18 AWG (26 AWG only with listed connectors or equipment)</td><td>760.142</td></tr>\n<tr><td>Exposed PLFA cable within 7 ft of the floor</td><td>fastened every 18 in. (450 mm) max.</td><td>760.130(B)(1)</td></tr>\n<tr><td>PLFA passing through a floor or wall</td><td>metal raceway or RNC up to 7 ft (2.1 m)</td><td>760.130(B)(2)</td></tr>\n<tr><td>PLFA in hoistways</td><td>in raceway (RMC, IMC, RNC, LFNC, or EMT), or per 620.21 for elevator equipment</td><td>760.130(B)(3)</td></tr>\n<tr><td>PLFA separation from power/Class 1/NPLFA (open runs)</td><td>2 in. (50 mm)</td><td>760.136(G)</td></tr>\n<tr><td>Separation inside enclosures (associated equipment)</td><td>1/4 in. (6 mm)</td><td>760.136(D)</td></tr>\n<tr><td>CI cable support</td><td>24 in. max., steel</td><td>760.24(B)</td></tr>\n<tr><td>Cable parallel to wood studs</td><td>1¼ in. from the edge or a 1/16 in. steel plate</td><td>300.4(D)</td></tr>\n<tr><td>Working space, 0 to 150 V to ground</td><td>3 ft deep, 30 in. wide, 6½ ft high</td><td>110.26(A)</td></tr>\n<tr><td>Box volume per 14 AWG conductor</td><td>2.00 in³</td><td>Table 314.16(B)</td></tr>\n</tbody>\n</table>\n\n<h3>Cable types and substitutions</h3>\n<table>\n<thead><tr><th>Space</th><th>PLFA</th><th>NPLFA</th><th>PLFA substitutes (Table 760.154(A))</th></tr></thead>\n<tbody>\n<tr><td>Plenum: other space used for environmental air (300.22(C))</td><td>FPLP</td><td>NPLFP</td><td>CMP</td></tr>\n<tr><td>Riser: vertical runs between floors</td><td>FPLR</td><td>NPLFR</td><td>CMP, FPLP, CMR</td></tr>\n<tr><td>General use</td><td>FPL</td><td>NPLF</td><td>CMP, FPLP, CMR, FPLR, CMG, CM</td></tr>\n</tbody>\n</table>\n<p>Core idea: you can always use a cable <strong>higher</strong> in the hierarchy, never a lower one. Table 760.154 says where each type goes; for example, in a plenum FPLR and FPL are permitted only inside metal raceway that complies with 300.22(C). When a substitute is used, Parts I and III still apply. The <code>-CI</code> suffix (FPLP-CI, FPLR-CI, FPL-CI) indicates 2-hour circuit integrity cable. For optical fiber (Art. 770): OFNP/OFCP in plenums, OFNR/OFCR in risers, and OFN/OFNG for general use.</p>\n\n<h3>Mixing circuits</h3>\n<ul>\n<li><strong>760.48:</strong> Class 1 and NPLFA may share a raceway if all conductors are insulated for the maximum voltage present; power and fire alarm conductors only where connected to the same equipment.</li>\n<li><strong>760.136(A):</strong> PLFA may not share a cable, box, raceway, or cable tray with light, power, Class 1, or NPLFA conductors, except with a barrier (B), a raceway within the enclosure (C), or associated equipment with 1/4 in. separation (D), among other cases.</li>\n<li><strong>760.139:</strong> multiple PLFA circuits together, yes; Class 2 with PLFA, yes, if its insulation is at least that required for PLFA; audio circuits (640.9(C)) with PLFA, <strong>no</strong>.</li>\n<li><strong>760.130(A), Exception No. 3:</strong> a PLFA circuit may be reclassified as NPLFA if the 760.124 markings are eliminated and the entire circuit is installed with Part II wiring methods and materials.</li>\n<li><strong>760.143:</strong> never strap or tape PLFA cable to the outside of a raceway as a means of support.</li>\n</ul>\n\n<div class=\"callout warn\"><strong>Frequent traps:</strong>\n<ul>\n<li>Confusing 7 A / 10 A (maximum protection, 760.43) with the Table 402.5 ampacity.</li>\n<li>Believing the NEC requires red conduit or red boxes: the mandatory red is the identification of the branch-circuit disconnect.</li>\n<li>Assuming a FACU may be fed from a GFCI/AFCI circuit or from a circuit shared with other loads.</li>\n<li>Thinking FPL can never enter a plenum: it can, inside metal raceway that complies with 300.22(C).</li>\n<li>Mixing up 2 in. (open runs, 760.136(G)) and 1/4 in. (inside enclosures, 760.136(D)).</li>\n<li>300 V (PLFA cable) vs. 600 V (NPLFA conductors). And the voltage is <em>not</em> printed on PLFA cables (760.179(I)).</li>\n<li>Using the suspended ceiling grid or its wires as support (prohibited by 300.11(B)).</li>\n<li>Older guides cite '760.154(D)'; in NEC 2020 the substitutions are in 760.154(A) and Table 760.154(A).</li>\n</ul></div>\n\n<h3>How to find it fast in the printed code</h3>\n<ol>\n<li>First decide whether the question is about PLFA (Part III, 760.121 and up) or NPLFA (Part II, 760.41 to 760.53).</li>\n<li>Article 760 sits in Chapter 7 of the NEC; place a permanent tab at 760.1 and another at Table 760.154 / Table 760.154(A), the most-used pages of the article.</li>\n<li>In the NEC index, look under \"Fire alarm systems\" and \"Power-limited fire alarm circuits,\" and for terms such as \"Abandoned cable,\" \"Plenums,\" and \"Circuit integrity cable.\"</li>\n<li>For Article 300, confirm in 760.3 that the section is referenced; if it is not, it probably does not apply to the fire alarm wiring.</li>\n<li>Highlight the key numbers in your book: 7 A/10 A (760.43), 18 in. and 7 ft (760.130), 2 in. and 1/4 in. (760.136), 24 in. steel (760.24(B)). Informational Notes are explanatory, not requirements (90.5(C)).</li>\n</ol>\n<div class=\"callout\">Edition note: NEC 2023 created Article 722 (cables for power-limited circuits) and moved part of the cable installation and listing requirements there, and it added a surge-protection requirement for the FACU. The NICET exam uses <strong>NEC 2020</strong>: answer with the 2020 numbering.</div>\n","tabs":[{"ref":"NEC 2020 §760.2","what":"Definitions: PLFA, NPLFA, abandoned cable, CI cable"},{"ref":"NEC 2020 §760.3","what":"Other articles that apply (300.21, 300.22, Art. 725, Art. 770)"},{"ref":"NEC 2020 §760.21","what":"Access: cables must not prevent removal of ceiling panels"},{"ref":"NEC 2020 §760.24","what":"Workmanship, support, plenum cable ties; CI supported every 24 in. with steel"},{"ref":"NEC 2020 §760.25","what":"Abandoned cables and future-use tags"},{"ref":"NEC 2020 §760.41 / §760.121","what":"FACU branch circuit: no other loads, no GFCI/AFCI, red, 'FIRE ALARM CIRCUIT'"},{"ref":"NEC 2020 §760.43","what":"NPLFA protection: 7 A (18 AWG), 10 A (16 AWG)"},{"ref":"NEC 2020 §760.49","what":"NPLFA conductors: Table 402.5, 600 V insulation"},{"ref":"NEC 2020 §760.53","what":"NPLFA cables: NPLF, NPLFR, NPLFP"},{"ref":"NEC 2020 §760.127","what":"Supply side of a PLFA source: 20 A max. protection"},{"ref":"NEC 2020 §760.130","what":"PLFA load-side methods: 18 in. below 7 ft, floor/wall penetrations, hoistways, splices, reclassification"},{"ref":"NEC 2020 §760.136","what":"Separation from power: barriers, 1/4 in. in enclosures, 2 in. in open runs"},{"ref":"NEC 2020 §760.139","what":"PLFA with Class 2/3 and communications; audio prohibited"},{"ref":"NEC 2020 §760.143","what":"Do not use the outside of raceways as support"},{"ref":"NEC 2020 Table 760.154 and 760.154(A)","what":"PLFA cable applications and substitution hierarchy"},{"ref":"NEC 2020 §760.179","what":"PLFA listing and marking: 300 V, FPLP/FPLR/FPL, CI, no voltage marking"},{"ref":"NEC 2020 §300.4 and §300.11","what":"Protection against nails (1¼ in., 1/16 in. plate) and support above suspended ceilings"},{"ref":"NEC 2020 §300.21 and §300.22","what":"Firestopping penetrations and environmental air spaces (plenums)"},{"ref":"NEC 2020 Table 110.26(A)(1)","what":"Working space in front of the FACU (3 ft at 0–150 V)"},{"ref":"NEC 2020 Table 314.16(B)","what":"Volume allowance per conductor for box fill"}],"glossary":[{"en":"Fire alarm circuit","def":"The portion of the wiring and connected equipment powered and controlled by the fire alarm system; PLFA or NPLFA."},{"en":"Power-limited fire alarm (PLFA) circuit","def":"Circuit powered by a source that complies with 760.121; installed per Parts I and III of Article 760."},{"en":"Non-power-limited fire alarm (NPLFA) circuit","def":"Circuit powered by a source that complies with 760.41 and 760.43, up to 600 V; Parts I and II."},{"en":"Abandoned fire alarm cable","def":"Cable not terminated at equipment and not identified for future use with a tag; its accessible portion must be removed."},{"en":"Circuit integrity (CI) cable","def":"Cable listed to keep critical circuits operating for a specified time under fire conditions; carries the CI suffix."},{"en":"Other space used for environmental air (plenum)","def":"Space, such as above a return-air suspended ceiling, that forms part of the air-handling system (300.22(C))."},{"en":"Riser","def":"Vertical cable run penetrating more than one floor or in a vertical shaft; requires riser-type cable (FPLR) or better."},{"en":"Cable substitution","def":"Using a cable with equal or better fire performance in place of the one required, per Table 760.154(A)."},{"en":"Firestopping","def":"Approved sealing of penetrations in fire-resistance-rated walls, floors, or ceilings (300.21)."},{"en":"Branch circuit","def":"Conductors between the final overcurrent device and the outlets; the FACU branch circuit must not supply other loads."},{"en":"Overcurrent protective device (OCPD)","def":"Breaker or fuse that protects the conductors; for the FACU circuit, its location is identified at the FACU."},{"en":"Disconnecting means","def":"Device that disconnects a circuit from its source; for fire alarm it has red identification and is labeled 'FIRE ALARM CIRCUIT'."},{"en":"Qualified person","def":"Person with the skills, knowledge, and safety training to install and operate the equipment; only such persons may access the fire alarm disconnect."},{"en":"Raceway","def":"Enclosed channel designed to hold conductors or cables, such as EMT, RMC, or rigid PVC conduit."},{"en":"Electrical metallic tubing (EMT)","def":"Thin-wall metal raceway; FPL and FPLR are permitted inside it in plenums (Table 760.154)."},{"en":"Equipment grounding conductor (EGC)","def":"Conductor that connects the metal parts of equipment back to the source so ground faults are cleared."},{"en":"Effective ground-fault current path","def":"Low-impedance path that allows the overcurrent device to operate; the earth is not considered one."},{"en":"Working space","def":"Clear space in front of equipment examined or serviced while energized (110.26): 3 ft deep at 0–150 V."},{"en":"Box fill","def":"Calculation of the minimum box volume based on the conductors and devices it contains (314.16)."},{"en":"Barrier","def":"Fixed divider that allows PLFA and power conductors in the same enclosure (760.136(B))."},{"en":"Informational note","def":"Explanatory NEC material that is not an enforceable requirement (90.5(C))."},{"en":"Listed","def":"Equipment or material included in a list published by a certification organization acceptable to the AHJ, showing it meets defined standards."},{"en":"Neat and workmanlike manner","def":"Quality of workmanship required by 110.12 and 760.24(A): cables orderly, supported, and undamaged."},{"en":"Cable tie","def":"Cable fastener; nonmetallic ties used in plenums must be listed for low smoke and heat release."},{"en":"Optical fiber cable (OFNP/OFNR/OFN)","def":"Cable installed per Article 770; OFNP for plenums, OFNR for risers, OFN/OFNG for general use."}]},"questions":[{"id":"nec-001","task":"1.1.2","type":"single","diff":1,"q":{"en":"According to NFPA 70 (NEC) 2020, which article covers the installation of wiring and equipment of fire alarm systems, including all circuits controlled and powered by the fire alarm system?"},"opts":[{"en":"Article 725"},{"en":"Article 770"},{"en":"Article 760"},{"en":"Article 800"}],"ans":[2],"ref":"NEC 2020 §760.1","exp":"The scope of Article 760 (760.1) covers fire alarm wiring and equipment, including all circuits controlled and powered by the fire alarm system. Article 725 covers Class 1, 2, and 3 circuits (for example, building controls not powered by the FACU), Article 770 covers optical fiber, and Article 800 covers communications."},{"id":"nec-002","task":"1.1.2","type":"single","diff":1,"q":{"en":"Per NEC 760.2, a power-limited fire alarm (PLFA) circuit is a fire alarm circuit powered by a source that complies with which section?"},"opts":[{"en":"760.41"},{"en":"760.121"},{"en":"760.43"},{"en":"760.154"}],"ans":[1],"ref":"NEC 2020 §760.2","exp":"760.2 defines a PLFA circuit as one powered by a source that complies with 760.121 (a listed PLFA or Class 3 transformer or power supply, or listed equipment marked as a PLFA source). An NPLFA circuit is powered per 760.41 and 760.43; 760.154 covers cable applications."},{"id":"nec-003","task":"1.1.2","type":"single","diff":2,"q":{"en":"A technician is securing FPLP cables with nonmetallic cable ties above a suspended ceiling that is used as a return-air plenum. Per NEC 2020 Article 760, what is required of the cable ties?"},"opts":[{"en":"They must be listed as having low smoke and heat release properties"},{"en":"They must be red to identify the fire alarm circuit"},{"en":"They must be metallic; nonmetallic ties are prohibited in plenums"},{"en":"No requirement applies because the cable itself is plenum-rated"}],"ans":[0],"ref":"NEC 2020 §760.24(A); §300.22(C)","exp":"760.24(A) requires nonmetallic cable ties and other nonmetallic accessories used to secure cables in other spaces used for environmental air (plenums) to be listed as having low smoke and heat release properties. A plenum-rated cable does not exempt the accessories, and metallic or red ties are not required."},{"id":"nec-004","task":"1.1.2","type":"single","diff":2,"freq":true,"q":{"en":"During installation of a new FACU in an office building, the electrician plans to feed it from a 20-A AFCI circuit breaker that also serves the corridor lighting. What does NEC 2020 require?"},"opts":[{"en":"This is acceptable if the circuit breaker handle is marked red"},{"en":"This is acceptable because the FACU has standby batteries"},{"en":"This is acceptable only if a combination-type AFCI is used"},{"en":"The FACU must be supplied by a branch circuit that supplies no other loads and is not supplied through a GFCI or AFCI"}],"ans":[3],"ref":"NEC 2020 §760.121(B); §760.41(B)","exp":"The branch circuit supplying fire alarm equipment must supply no other loads and must not be supplied through a GFCI or AFCI (760.41(B) for NPLFA and 760.121(B) for PLFA sources). Batteries do not change the rule, and marking the breaker red is an additional requirement, not a substitute."},{"id":"nec-005","task":"1.1.2","type":"multi","select":2,"diff":2,"q":{"en":"A power-limited fire alarm (PLFA) circuit will be reclassified and installed as a non-power-limited (NPLFA) circuit. Under NEC 2020, which TWO conditions must be met? (Select TWO.)"},"opts":[{"en":"The power-limited circuit markings required by 760.124 are eliminated"},{"en":"The circuit is supplied through a GFCI-protected branch circuit"},{"en":"The entire circuit is installed using the wiring methods and materials of Part II (NPLFA)"},{"en":"Only the portions of the circuit in risers are installed in raceway"},{"en":"The existing FPL cable is relabeled 'NPLFA' at each junction box"}],"ans":[0,2],"ref":"NEC 2020 §760.130(A), Exception No. 3; §760.124","exp":"760.130(A), Exception No. 3, permits a power-limited circuit to be reclassified and installed as non-power-limited only if the PLFA markings required by 760.124 are eliminated and the entire circuit is installed using the Part II (NPLFA) wiring methods and materials. Converting only part of the circuit or relabeling PLFA cable is not enough, and fire alarm branch circuits may not be supplied through a GFCI (760.41(B), 760.121(B))."},{"id":"nec-006","task":"1.1.2","type":"single","diff":2,"q":{"en":"Fire alarm cables above a lay-in ceiling have been bundled so that they prevent several ceiling tiles from being lifted out. Apart from the cable support rules, which NEC 2020 section specifically prohibits this condition?"},"opts":[{"en":"760.30 (identification of circuits at terminal and junction locations)"},{"en":"760.21 (access to electrical equipment behind panels designed to allow access)"},{"en":"760.25 (abandoned cables)"},{"en":"760.143 (no support from the outside of raceways)"}],"ans":[1],"ref":"NEC 2020 §760.21","exp":"760.21 requires that access to electrical equipment behind panels designed to allow access, including suspended ceiling panels, not be denied by an accumulation of wires and cables that prevents removal of the panels. The cables must also be supported from the building structure (760.24(A), 300.11), never from the tiles or the ceiling grid."},{"id":"nec-007","task":"1.1.2","type":"single","diff":1,"freq":true,"q":{"en":"According to NEC 760.43, overcurrent protection for 18 AWG conductors of a non-power-limited fire alarm (NPLFA) circuit must not exceed:"},"opts":[{"en":"10 A"},{"en":"6 A"},{"en":"15 A"},{"en":"7 A"}],"ans":[3],"ref":"NEC 2020 §760.43","exp":"760.43 limits NPLFA overcurrent protection to 7 A for 18 AWG and 10 A for 16 AWG. For 14 AWG and larger, the conductor ampacity is used without applying the ampacity adjustment and correction factors."},{"id":"nec-008","task":"1.1.2","type":"single","diff":3,"q":{"en":"An NPLFA circuit is wired with 16 AWG TFFN conductors in raceway and is protected by a 15-A circuit breaker. What is the correct conclusion under NEC 2020?"},"opts":[{"en":"Acceptable, because the circuit operates below 600 V"},{"en":"Acceptable, because TFFN is rated for 600 V"},{"en":"Not acceptable; the breaker must be increased to 20 A"},{"en":"Not acceptable; overcurrent protection for 16 AWG NPLFA conductors must not exceed 10 A"}],"ans":[3],"ref":"NEC 2020 §760.43; §760.49(A)","exp":"760.43 limits the protection for 16 AWG to 10 A (7 A for 18 AWG). In addition, 760.49(A) requires loads on 18 and 16 AWG not to exceed the ampacities in Table 402.5. The insulation rating does not permit a larger breaker, and increasing it to 20 A makes the problem worse."},{"id":"nec-009","task":"1.1.2","type":"single","diff":2,"q":{"en":"What is the minimum insulation voltage rating for conductors of non-power-limited fire alarm (NPLFA) circuits?"},"opts":[{"en":"300 V"},{"en":"150 V"},{"en":"600 V"},{"en":"1000 V"}],"ans":[2],"ref":"NEC 2020 §760.49(B)","exp":"760.49(B) requires NPLFA conductor insulation to be suitable for the system voltage and not less than 600 V, consistent with NPLFA sources operating at up to 600 V (760.41(A)). PLFA cables, by contrast, are listed for not less than 300 V (760.179(C))."},{"id":"nec-010","task":"1.1.2","type":"single","diff":1,"q":{"en":"Listed PLFA cables (Types FPL, FPLR, and FPLP) must have a voltage rating of not less than:"},"opts":[{"en":"300 V"},{"en":"150 V"},{"en":"600 V"},{"en":"50 V"}],"ans":[0],"ref":"NEC 2020 §760.179(C)","exp":"760.179(C) requires PLFA cables to have a voltage rating of not less than 300 V and a temperature rating of not less than 60°C. Do not confuse it with the 600 V of NPLFA insulation (760.49(B)) or the 150 V typical of Class 2 cables."},{"id":"nec-011","task":"1.1.2","type":"single","diff":3,"q":{"en":"An inspector questions a reel of Type FPL cable because no voltage rating is printed on the jacket. What does NEC 2020 say about this?"},"opts":[{"en":"The cable is defective; every PLFA cable must show '300V' on its jacket"},{"en":"The cable must be tagged with its voltage rating every 10 ft"},{"en":"Voltage ratings are not permitted to be marked on PLFA cables, except where multiple listings require it"},{"en":"Only plenum cable (FPLP) is required to show its voltage rating"}],"ans":[2],"ref":"NEC 2020 §760.179(I)","exp":"760.179(I) says PLFA cables are marked per Table 760.179(I) and the voltage rating must not be marked on the cable (except cables with multiple listings that require it), so nobody assumes they are suitable for Class 1 or power circuits. A missing voltage marking is normal."},{"id":"nec-012","task":"1.1.2","type":"multi","select":2,"diff":2,"freq":true,"q":{"en":"Which TWO cable types may be installed exposed (not in raceway) for PLFA wiring in the space above a suspended ceiling that is used for return air? (Select TWO.)"},"opts":[{"en":"FPLR"},{"en":"FPLP"},{"en":"FPL"},{"en":"CMR"},{"en":"CMP"}],"ans":[1,4],"ref":"NEC 2020 Table 760.154; §760.154(A); §300.22(C)","exp":"The space above a suspended ceiling used for return air is an 'other space used for environmental air' (300.22(C)). There, only FPLP, or its substitute CMP, is permitted exposed (Table 760.154 and Table 760.154(A)). FPLR, FPL, and CMR could be used only inside metal raceway complying with 300.22(C)."},{"id":"nec-013","task":"1.1.2","type":"single","diff":2,"q":{"en":"PLFA cable is being installed in a vertical run in a shaft, penetrating several floors, without a raceway. What is the minimum cable listing permitted?"},"opts":[{"en":"FPLR"},{"en":"FPL"},{"en":"CM"},{"en":"NPLF"}],"ans":[0],"ref":"NEC 2020 Table 760.154; §760.179(E)","exp":"Cables in vertical runs penetrating more than one floor, or in a vertical shaft, must be riser type: FPLR (listed to prevent fire from spreading floor to floor, 760.179(E)) or a higher-rated substitute (CMR, FPLP, CMP). FPL, CM, and NPLF are general-purpose cables and are not suitable for a riser without the raceway permitted by Table 760.154."},{"id":"nec-014","task":"1.1.2","type":"single","diff":2,"q":{"en":"Type FPL cable is listed for general-purpose fire alarm use. In which locations is it NOT permitted without additional measures such as a suitable raceway?"},"opts":[{"en":"Risers, ducts, plenums, and other spaces used for environmental air"},{"en":"Dry locations inside stud walls"},{"en":"Exposed on the walls of a one-family dwelling"},{"en":"Inside EMT in an office area"}],"ans":[0],"ref":"NEC 2020 §760.179(F); Table 760.154","exp":"760.179(F) lists FPL for general-purpose fire alarm use except in risers, ducts, plenums, and other spaces used for environmental air. In those locations FPLR or FPLP (or their substitutes) is required, or the raceway permitted by Table 760.154."},{"id":"nec-015","task":"1.1.2","type":"multi","select":2,"diff":3,"q":{"en":"Per NEC 2020 Table 760.154(A), which TWO cable types may be substituted for Type FPL? (Select TWO.)"},"opts":[{"en":"CMX"},{"en":"CM"},{"en":"CATV"},{"en":"FPLR"},{"en":"CMUC"}],"ans":[1,3],"ref":"NEC 2020 §760.154(A), Table 760.154(A)","exp":"Table 760.154(A) permits FPL to be replaced by CMP, FPLP, CMR, FPLR, CMG, or CM, that is, by cables with equal or better fire performance. CMX (residential), CATV (coaxial), and CMUC (undercarpet) are not substitutes. When substituting, Parts I and III of Article 760 still apply."},{"id":"nec-016","task":"1.1.2","type":"single","diff":2,"q":{"en":"A contractor installed Type FPL cable inside EMT through a ceiling space used for environmental air (a return-air plenum). Is this installation permitted?"},"opts":[{"en":"No; only FPLP may be used in a plenum, even inside raceway"},{"en":"Yes, but only if the EMT is painted red"},{"en":"Yes; listed PLFA cables are permitted inside metal raceway that complies with 300.22(C)"},{"en":"No; only Type MI cable is allowed in plenums"}],"ans":[2],"ref":"NEC 2020 Table 760.154; §300.22(C)","exp":"Table 760.154 permits FPLP, FPLR, and FPL inside metal raceway complying with 300.22(C) in spaces used for environmental air; the EMT is what protects the plenum. Exposed, only FPLP (or CMP) is permitted. A red raceway is not an NEC requirement."},{"id":"nec-017","task":"1.1.2","type":"single","diff":1,"q":{"en":"Which multiconductor NPLFA cable type is listed for use in other spaces used for environmental air (plenums)?"},"opts":[{"en":"NPLF"},{"en":"NPLFR"},{"en":"FPLP"},{"en":"NPLFP"}],"ans":[3],"ref":"NEC 2020 §760.53(B); §760.176","exp":"Multiconductor NPLFA cables are NPLF (general purpose), NPLFR (riser), and NPLFP (plenum), per 760.53 and 760.176. FPLP is a PLFA cable, not NPLFA. Tip: the leading 'N' means 'non-power-limited'."},{"id":"nec-018","task":"1.1.2","type":"single","diff":1,"freq":true,"q":{"en":"A technician wants to pull a PLFA signaling line circuit (SLC) cable into a junction box that already contains 120-V lighting branch-circuit conductors unrelated to the fire alarm equipment. What does NEC 2020 require?"},"opts":[{"en":"It is permitted if the PLFA cable is rated 300 V"},{"en":"It is not permitted unless the circuits are separated by a barrier or another 760.136 provision is met"},{"en":"It is permitted if all splices are taped"},{"en":"It is permitted if the box cover is painted red"}],"ans":[1],"ref":"NEC 2020 §760.136(A), (B)","exp":"760.136(A) prohibits PLFA conductors in the same box, raceway, cable, or enclosure as light, power, Class 1, or NPLFA conductors, except as permitted in 760.136(B) through (G), such as a barrier (760.136(B)). The 300-V cable rating does not permit mixing with power circuits."},{"id":"nec-019","task":"1.1.2","type":"single","diff":2,"freq":true,"q":{"en":"Where PLFA cable runs open (not in raceway) near electric light and power conductors that are also not in a raceway or cable, what minimum separation does NEC 760.136 require?"},"opts":[{"en":"6 in. (150 mm)"},{"en":"12 in. (300 mm)"},{"en":"1/4 in. (6 mm)"},{"en":"2 in. (50 mm)"}],"ans":[3],"ref":"NEC 2020 §760.136(G)","exp":"For other applications, 760.136(G) requires at least 2 in. (50 mm) between PLFA conductors and light, power, Class 1, or NPLFA conductors, unless one group or the other is in raceway or in metal-sheathed, metal-clad, nonmetallic-sheathed, or Type UF cable, or they are separated by a continuous, firmly fixed nonconductor. The 1/4 in. value applies inside enclosures (760.136(D))."},{"id":"nec-020","task":"1.1.2","type":"single","diff":3,"q":{"en":"Inside a FACU enclosure, 120-V supply conductors enter solely to power the panel. Per NEC 760.136(D), what minimum separation must be maintained between these power conductors and the PLFA conductors (absent other qualifying conditions)?"},"opts":[{"en":"1/4 in. (6 mm)"},{"en":"2 in. (50 mm)"},{"en":"1 in. (25 mm)"},{"en":"1/2 in. (13 mm)"}],"ans":[0],"ref":"NEC 2020 §760.136(D)","exp":"760.136(D) permits power conductors in the same enclosure when they are introduced solely to connect equipment associated with the PLFA circuits, with at least 1/4 in. (6 mm) of separation from the PLFA conductors (or compliance with the other conditions in that section). That is why panels have the 120-V entry in a separate area."},{"id":"nec-021","task":"1.1.2","type":"multi","select":2,"diff":3,"q":{"en":"Under NEC 760.136(G), PLFA conductors are permitted closer than 2 in. to electric light and power conductors when which TWO conditions exist? (Select TWO.)"},"opts":[{"en":"The light and power conductors are enclosed in a raceway"},{"en":"The PLFA cable is Type FPLP"},{"en":"The power circuit operates at 120 V or less"},{"en":"The PLFA conductors are permanently separated by a continuous, firmly fixed nonconductor (such as flexible tubing) in addition to their insulation"},{"en":"Both cables are neatly bundled with listed cable ties"}],"ans":[0,3],"ref":"NEC 2020 §760.136(G)","exp":"760.136(G) requires 2 in. of separation unless (1) either all the light, power, Class 1, and NPLFA conductors, or all the PLFA conductors, are in raceway or in metal-sheathed, metal-clad, nonmetallic-sheathed, or Type UF cable; or (2) they are permanently separated by a continuous, firmly fixed nonconductor (porcelain tubes or flexible tubing) in addition to the insulation. The PLFA cable type or a 120-V circuit voltage does not remove the requirement."},{"id":"nec-022","task":"1.1.2","type":"single","diff":2,"q":{"en":"May the conductors of a Class 2 circuit (for example, an access-control circuit) be installed in the same raceway as PLFA conductors?"},"opts":[{"en":"Never; Class 2 and PLFA must always be in separate raceways"},{"en":"Yes, but only if the raceway is at least trade size 1"},{"en":"Yes, but only when both circuits come from the same power supply"},{"en":"Yes, provided the Class 2 conductors' insulation is at least that required for the PLFA circuits"}],"ans":[3],"ref":"NEC 2020 §760.139(B)","exp":"760.139(B) permits Class 2 conductors with PLFA conductors in the same cable, enclosure, raceway, or cable tray if the Class 2 insulation is at least that required for the PLFA circuits. Note: PLFA cables are listed for 300 V minimum, while many Class 2 cables are rated 150 V."},{"id":"nec-023","task":"1.1.2","type":"single","diff":3,"q":{"en":"A building's background-music speaker circuits (audio amplifier circuits per 640.9(C)) installed with Class 2 wiring methods are proposed to share a raceway with the fire alarm's PLFA notification circuits. Per NEC 2020, this is:"},"opts":[{"en":"Permitted if the speaker wire is listed CL3"},{"en":"Permitted if both systems use 70-V speakers"},{"en":"Not permitted; such audio system circuits may not share a cable or raceway with PLFA conductors"},{"en":"Permitted only in a plenum-rated raceway"}],"ans":[2],"ref":"NEC 2020 §760.139(D)","exp":"760.139(D) prohibits audio system circuits (640.9(C)) installed with Class 2 or Class 3 wiring methods from sharing a cable or raceway with PLFA conductors, because an amplifier fault could affect the fire alarm. This does not apply to the voice evacuation circuits of the fire alarm system itself."},{"id":"nec-024","task":"1.1.2","type":"single","diff":1,"freq":true,"q":{"en":"To save time, an installer secures a run of FPL cable to the outside of an existing EMT conduit with cable ties. Per NEC 2020, this is:"},"opts":[{"en":"Permitted if the ties are spaced no more than 18 in. apart"},{"en":"Permitted if the EMT contains only fire alarm conductors"},{"en":"Permitted above a suspended ceiling only"},{"en":"Not permitted; PLFA conductors may not be strapped, taped, or attached to the exterior of a raceway as a means of support"}],"ans":[3],"ref":"NEC 2020 §760.143","exp":"760.143 prohibits using the outside of a conduit or other raceway to support PLFA conductors, whether by strapping, taping, or any other attachment. The cable must be supported by the building structure (760.24(A))."},{"id":"nec-025","task":"1.1.2","type":"single","diff":2,"freq":true,"q":{"en":"Above a lay-in suspended ceiling, which support method for fire alarm cables is acceptable?"},"opts":[{"en":"Laying the cables directly on the ceiling tiles"},{"en":"Tying the cables to the ceiling grid support wires"},{"en":"Independent support wires secured at both ends, or supports attached to the building structure"},{"en":"Tying the cables to the ceiling grid T-bars"}],"ans":[2],"ref":"NEC 2020 §760.24(A); §300.11(B)","exp":"760.24(A) requires cables to be supported by the building structure, and 300.11(B) prohibits using the ceiling grid or its support wires as support; independent support wires secured at both ends are permitted. Also, 760.21 requires that cables not prevent removal of the ceiling panels."},{"id":"nec-026","task":"1.1.2","type":"single","diff":2,"q":{"en":"A PLFA cable passes through a floor and continues up a wall in an area where building construction provides no protection. Per NEC 760.130(B)(2), how must it be protected?"},"opts":[{"en":"In metal raceway or rigid nonmetallic conduit to a height of 7 ft (2.1 m) above the floor"},{"en":"In flexible nonmetallic tubing to a height of 4 ft"},{"en":"Wrapped with electrical tape to a height of 7 ft"},{"en":"No protection is required for power-limited cable"}],"ans":[0],"ref":"NEC 2020 §760.130(B)(2)","exp":"Where PLFA cable passes through a floor or wall, 760.130(B)(2) requires metal raceway or rigid nonmetallic conduit to a height of 7 ft (2.1 m) above the floor, unless the building construction or an equivalent solid guard provides adequate protection."},{"id":"nec-027","task":"1.1.2","type":"single","diff":3,"q":{"en":"A 2-hour circuit integrity (CI) cable is installed exposed on a masonry wall 10 ft above the floor. Per NEC 2020, what is the maximum support spacing and what support material is required?"},"opts":[{"en":"18 in., using nylon cable ties"},{"en":"24 in., using steel supports and fasteners"},{"en":"4½ ft, using any listed straps"},{"en":"36 in., using plenum-rated cable ties"}],"ans":[1],"ref":"NEC 2020 §760.24(B)","exp":"760.24(B) requires CI cable to be supported at intervals not exceeding 24 in. (610 mm) and, within 7 ft (2.1 m) of the floor, fastened at intervals not exceeding 18 in. (450 mm). Supports and fasteners must be steel, because plastic ties burn and the cable would fall during a fire."},{"id":"nec-028","task":"1.1.2","type":"single","diff":2,"q":{"en":"A PLFA circuit serving hoistway smoke detectors must run inside an elevator hoistway; it is not elevator equipment wiring covered by 620.21. Per NEC 760.130(B), how must it be installed?"},"opts":[{"en":"Exposed Type FPLR cable fastened every 18 in."},{"en":"In a raceway such as rigid metal conduit, intermediate metal conduit, rigid nonmetallic conduit, liquidtight flexible nonmetallic conduit, or EMT"},{"en":"Exposed Type FPLP cable, because the hoistway is an air-handling space"},{"en":"Any listed PLFA cable laid on the hoistway beams"}],"ans":[1],"ref":"NEC 2020 §760.130(B)(3)","exp":"760.130(B)(3) requires PLFA circuits in hoistways to be installed in rigid metal conduit, rigid nonmetallic conduit, intermediate metal conduit, liquidtight flexible nonmetallic conduit, or electrical metallic tubing; wiring for elevators or similar equipment may instead follow 620.21. Exposed cable, whatever its type, does not meet this rule."},{"id":"nec-029","task":"1.1.2","type":"single","diff":1,"freq":true,"q":{"en":"PLFA cables pass through a 2-hour fire-rated wall. Which NEC section, referenced by 760.3, requires that the opening be firestopped using approved methods to maintain the fire resistance rating?"},"opts":[{"en":"300.22"},{"en":"300.4"},{"en":"300.11"},{"en":"300.21"}],"ans":[3],"ref":"NEC 2020 §760.3(A); §300.21","exp":"760.3(A) refers to 300.21: penetrations of fire-resistance-rated walls, floors, or ceilings must be firestopped using approved methods to maintain the rating. 300.22 covers ducts and plenums, 300.4 protection against physical damage, and 300.11 support."},{"id":"nec-030","task":"1.1.2","type":"single","diff":2,"q":{"en":"A PLFA cable is run parallel to wood studs in a wall where nails or screws could be driven. Per 760.24(A) and 300.4(D), the cable must be at least what distance from the nearest edge of the framing member, or else be protected by a steel plate?"},"opts":[{"en":"1¼ in. (32 mm)"},{"en":"1 in. (25 mm)"},{"en":"¾ in. (19 mm)"},{"en":"2 in. (50 mm)"}],"ans":[0],"ref":"NEC 2020 §760.24(A); §300.4(D)","exp":"760.24(A) refers to 300.4(D): the cable must be at least 1¼ in. (32 mm) from the nearest edge of the wood framing member, or be protected by a steel plate at least 1/16 in. (1.6 mm) thick, so a nail or screw cannot penetrate it."},{"id":"nec-031","task":"1.1.2","type":"single","diff":1,"freq":true,"q":{"en":"During a renovation, a technician finds old fire alarm cables in an accessible ceiling space that are no longer terminated at equipment and are not tagged for future use. Per NEC 2020, what must be done?"},"opts":[{"en":"Leave them in place; removal is optional"},{"en":"Cut them flush at both ends and leave them"},{"en":"Remove the accessible portion of the cables"},{"en":"Remove them only if they are not plenum-rated"}],"ans":[2],"ref":"NEC 2020 §760.2; §760.25","exp":"Abandoned cable (760.2) is cable that is not terminated at equipment and not identified for future use with a tag. 760.25 requires the accessible portion of abandoned cable to be removed to reduce fuel load and smoke, regardless of its fire rating."},{"id":"nec-032","task":"1.1.2","type":"multi","select":2,"diff":2,"q":{"en":"Which TWO statements about fire alarm cable left in place during a renovation are correct under NEC 2020? (Select TWO.)"},"opts":[{"en":"Abandoned cable may remain if it is Type FPLP"},{"en":"Abandoned cable may remain in an accessible ceiling if both ends are cut flush"},{"en":"A cable identified for future use with a tag is not considered abandoned"},{"en":"A tag is needed only where the cable is in a riser"},{"en":"The tag must be durable enough to withstand the environment involved"}],"ans":[2,4],"ref":"NEC 2020 §760.2; §760.25","exp":"Cable left for future use must be identified with a tag, and the tag must be durable enough for the environment involved (760.25). Unterminated, untagged cables are abandoned and their accessible portion must be removed, even if they are FPLP or cut flush."},{"id":"nec-033","task":"1.1.2","type":"single","diff":2,"q":{"en":"Why does NEC 760.30 require fire alarm circuits to be identified at terminal and junction locations?"},"opts":[{"en":"To help prevent unintentional signals on fire alarm circuits during testing and servicing of other systems"},{"en":"Because the NEC requires all fire alarm raceways to be red"},{"en":"To show the AHJ the ampacity of each conductor"},{"en":"To record the installation date of each circuit"}],"ans":[0],"ref":"NEC 2020 §760.30","exp":"760.30 requires fire alarm circuits to be identified at terminal and junction locations to help prevent unintentional signals during testing and servicing of other systems. The NEC does not require red; many specifications or AHJs ask for it, but that is a local requirement, not 760.30."},{"id":"nec-034","task":"1.1.2","type":"single","diff":1,"q":{"en":"A FACU supplied at 120 V (120 V to ground) is likely to require examination and servicing while energized. What minimum depth of working space does NEC Table 110.26(A)(1) require in front of it?"},"opts":[{"en":"2½ ft (750 mm)"},{"en":"3½ ft (1.0 m)"},{"en":"4 ft (1.2 m)"},{"en":"3 ft (900 mm)"}],"ans":[3],"ref":"NEC 2020 §110.26(A)(1), Table 110.26(A)(1)","exp":"For 0–150 V to ground, Table 110.26(A)(1) requires 3 ft (900 mm) of depth for all three conditions. The minimum width is 30 in. (or the width of the equipment) and the height 6½ ft (2.0 m). Do not block the front of the FACU with storage."},{"id":"nec-035","task":"1.1.2","type":"single","diff":3,"q":{"en":"A junction box for an NPLFA circuit will contain six 14 AWG conductors that are spliced inside it, with no devices, clamps, fittings, or equipment grounding conductors. Using Table 314.16(B), what minimum box volume is required for the conductors?"},"opts":[{"en":"9.0 in³"},{"en":"12.0 in³"},{"en":"10.5 in³"},{"en":"13.5 in³"}],"ans":[1],"ref":"NEC 2020 §314.16(B), Table 314.16(B); §760.46","exp":"NPLFA circuits are installed with Chapter 3 wiring methods (760.46), so box-fill calculations apply. Table 314.16(B) allows 2.00 in³ for each 14 AWG conductor: 6 × 2.00 = 12.0 in³. The other values come from using 18 AWG (1.50), 16 AWG (1.75), or 12 AWG (2.25)."},{"id":"nec-036","task":"1.1.2","type":"single","diff":2,"q":{"en":"A technician suggests driving a ground rod at the FACU and using it instead of the branch-circuit equipment grounding conductor to ground the panel enclosure. Why is this NOT acceptable?"},"opts":[{"en":"Ground rods are only allowed outdoors"},{"en":"The earth is not considered an effective ground-fault current path"},{"en":"Fire alarm panels must never be grounded"},{"en":"The ground rod would turn the circuit into a PLFA circuit"}],"ans":[1],"ref":"NEC 2020 §250.4(A)(5)","exp":"250.4(A)(5) states that the earth is not considered an effective ground-fault current path; the FACU's metal enclosure must be connected to the branch circuit's equipment grounding conductor (EGC) so the breaker trips on a fault. An additional electrode may be added, but it never replaces the EGC."},{"id":"nec-037","task":"1.1.2","type":"single","diff":1,"q":{"en":"Fiber-optic cable linking networked FACUs is routed exposed through a return-air ceiling plenum. Per NEC 760.3 and Article 770, which nonconductive optical fiber cable type is suitable?"},"opts":[{"en":"OFNR"},{"en":"OFN"},{"en":"OFNP"},{"en":"OFCR"}],"ans":[2],"ref":"NEC 2020 §760.3; Art. 770","exp":"760.3 refers to Article 770 for fire alarm optical fiber cables. In plenums use OFNP (nonconductive, plenum) or OFCP (conductive, plenum); OFNR and OFCR are riser types and OFN/OFNG are general purpose."},{"id":"nec-038","task":"1.1.2","type":"single","diff":2,"q":{"en":"May Class 1 circuit conductors and NPLFA circuit conductors be installed in the same raceway?"},"opts":[{"en":"Yes, provided all conductors are insulated for the maximum voltage of any conductor in the raceway"},{"en":"No, never"},{"en":"Yes, but only if all circuits are dc"},{"en":"Yes, but only if the raceway is red"}],"ans":[0],"ref":"NEC 2020 §760.48(A)","exp":"760.48(A) permits Class 1 and NPLFA circuits in the same cable, enclosure, or raceway, ac or dc, provided all conductors are insulated for the maximum voltage of any conductor present. PLFA is different: it may not be mixed with Class 1 except as 760.136 permits."},{"id":"nec-039","task":"1.1.2","type":"single","diff":2,"q":{"en":"Per NEC 760.142, what is the minimum size of a single PLFA conductor (one that is not part of a multiconductor cable)?"},"opts":[{"en":"26 AWG"},{"en":"18 AWG"},{"en":"22 AWG"},{"en":"14 AWG"}],"ans":[1],"ref":"NEC 2020 §760.142","exp":"760.142 permits 26 AWG conductors only where spliced with connectors listed for that size or terminated on equipment listed for 26 AWG, but single conductors may not be smaller than 18 AWG. The actual NAC or SLC wire size is set by voltage drop and the manufacturer."},{"id":"nec-040","task":"1.1.2","type":"single","diff":2,"q":{"en":"A remote PLFA power supply (NAC extender) is connected on its supply side to building power. Per NEC 760.127, the overcurrent device protecting the power-supply conductors that feed it must be rated not over:"},"opts":[{"en":"15 A"},{"en":"30 A"},{"en":"10 A"},{"en":"20 A"}],"ans":[3],"ref":"NEC 2020 §760.127","exp":"760.127 requires transformers or other devices supplied from power-supply conductors to be protected by an overcurrent device rated not over 20 A; the supply side is installed per Chapters 1 through 4. That branch circuit also may not supply other loads or be supplied through a GFCI or AFCI (760.121(B))."},{"id":"nec-041","task":"1.3.1","type":"single","diff":2,"q":{"en":"Article 760 is located in Chapter 7 of the NEC. According to NEC 90.3, how do Chapter 7 requirements relate to the general requirements of the Code?"},"opts":[{"en":"Chapter 7 replaces Chapters 1 through 4 entirely"},{"en":"Chapter 7 may supplement or modify the requirements in Chapters 1 through 7"},{"en":"Chapter 7 applies only to dwelling units"},{"en":"Chapter 7 is informational and not enforceable"}],"ans":[1],"ref":"NEC 2020 §90.3","exp":"Per 90.3, Chapters 1 through 4 apply generally, and Chapters 5, 6, and 7 (special occupancies, equipment, and conditions) may supplement or modify Chapters 1 through 7. That is why Article 760 modifies general rules; for example, only the Article 300 sections referenced by Article 760 apply (760.3)."},{"id":"nec-042","task":"1.3.1","type":"single","diff":2,"q":{"en":"While looking up a requirement in Article 760 during the open-book exam, you find an Informational Note. How should it be treated?"},"opts":[{"en":"As a mandatory requirement equal to the main text"},{"en":"As a requirement only if the AHJ adopts it"},{"en":"As explanatory material that is not enforceable as a Code requirement"},{"en":"As a requirement that applies only to PLFA circuits"}],"ans":[2],"ref":"NEC 2020 §90.5(C)","exp":"90.5(C): informational notes are explanatory material and are not enforceable requirements. Mandatory rules use 'shall' or 'shall not' (90.5(A)), and permissive rules use 'shall be permitted' (90.5(B))."},{"id":"nec-043","task":"1.3.1","type":"single","diff":1,"q":{"en":"Per NEC 760.35, power-limited fire alarm (PLFA) circuits must comply with which Parts of Article 760?"},"opts":[{"en":"Parts I and II"},{"en":"Parts II and III"},{"en":"Part III only"},{"en":"Parts I and III"}],"ans":[3],"ref":"NEC 2020 §760.35","exp":"760.35: NPLFA circuits comply with Parts I and II; PLFA circuits comply with Parts I and III. Part I (general) always applies, and Part IV contains the cable listing requirements (760.176 and 760.179)."},{"id":"nec-044","task":"1.3.1","type":"single","diff":1,"q":{"en":"Which NEC table shows where each listed PLFA cable type (FPLP, FPLR, FPL) is permitted within buildings, such as in plenums and risers?"},"opts":[{"en":"Table 760.179(I)"},{"en":"Table 760.154"},{"en":"Table 310.16"},{"en":"Chapter 9, Table 1"}],"ans":[1],"ref":"NEC 2020 §760.154, Table 760.154","exp":"Table 760.154 (applications of PLFA cables in buildings) shows where each type is permitted, and Table 760.154(A) gives the substitutions. Table 760.179(I) covers only cable marking; Table 310.16 lists ampacities, and Chapter 9, Table 1 covers conduit fill."},{"id":"nec-045","task":"1.3.1","type":"single","diff":2,"q":{"en":"A project drawing note reads: 'All NAC riser cabling shall be FPLR-CI.' What is the drawing specifying?"},"opts":[{"en":"Riser-rated PLFA cable that is also listed as circuit integrity (CI) cable for survivability under fire conditions"},{"en":"Riser-rated cable with a red jacket ('CI' = color identified)"},{"en":"Riser cable for communications circuits only"},{"en":"Riser cable that must be installed in conduit ('CI' = conduit installed)"}],"ans":[0],"ref":"NEC 2020 §760.2; §760.154; §760.179","exp":"The 'CI' suffix indicates circuit integrity cable, which keeps critical circuits operating for a specified time under fire conditions. 760.154 permits FPLP-CI, FPLR-CI, and FPL-CI cables to provide 2-hour circuit integrity, and 760.24(B) requires steel supports at no more than 24 in."},{"id":"nec-046","task":"1.2.2","type":"single","diff":2,"q":{"en":"A section of FPLR cable in a riser shaft was damaged and must be replaced. The technician has only a reel of Type CMR cable with suitable conductors. Per NEC 2020, may it be used?"},"opts":[{"en":"No; only FPLR is permitted in a riser"},{"en":"No; CMR is a communications cable and can never carry fire alarm circuits"},{"en":"Yes, but only inside metal conduit"},{"en":"Yes; Table 760.154(A) permits CMR as a substitute for FPLR"}],"ans":[3],"ref":"NEC 2020 §760.154(A), Table 760.154(A)","exp":"Per Table 760.154(A), FPLR may be replaced by CMP, FPLP, or CMR. When a substitute is used, Parts I and III of Article 760 still apply (support, separation, etc.). Also verify that the wire size meets the voltage drop calculation and the panel manufacturer's instructions."},{"id":"nec-047","task":"1.2.2","type":"single","diff":2,"q":{"en":"While replacing a failed smoke detector, a technician finds that the SLC cable was spliced with taped twist-on connectors lying loose above the ceiling. What is the proper corrective action?"},"opts":[{"en":"Re-tape the splice with fresh electrical tape"},{"en":"Relocate the splice into a listed box, fitting, enclosure, or fire alarm device"},{"en":"Leave it, since PLFA circuits are low energy"},{"en":"Wrap the splice with plenum-rated cable ties"}],"ans":[1],"ref":"NEC 2020 §760.130(B)(1)","exp":"760.130(B)(1) requires PLFA splices and terminations to be made in listed fittings, boxes, enclosures, fire alarm devices, or utilization equipment. Low energy does not exempt the rule. Correct the deficiency and document it in the service report."},{"id":"nec-048","task":"1.2.2","type":"single","diff":1,"q":{"en":"A technician replaces the failed circuit breaker that feeds the FACU. How must the disconnecting means be identified after the replacement?"},"opts":[{"en":"Paint the entire breaker red, including its labels"},{"en":"Mark it 'FACP' with a black marker only"},{"en":"With red identification that does not damage the breaker or obscure the manufacturer's markings, identified as 'FIRE ALARM CIRCUIT'"},{"en":"No marking is needed if the panel schedule is updated"}],"ans":[2],"ref":"NEC 2020 §760.41(B); §760.121(B)","exp":"The disconnecting means must have red identification, be identified as 'FIRE ALARM CIRCUIT', and be accessible only to qualified personnel; the red identification must not damage the device or obscure the manufacturer's markings, so painting the entire breaker is wrong (760.41(B), 760.121(B)). Also verify that its location is still identified at the FACU."},{"id":"nec-049","task":"1.2.2","type":"single","diff":3,"q":{"en":"A section of 2-hour circuit integrity (CI) cable serving a critical notification circuit was damaged. The technician proposes replacing that section with standard FPLR cable secured with nylon cable ties. What is the problem?"},"opts":[{"en":"There is no problem; FPLR is a higher rating than CI"},{"en":"The required survivability is lost; the replacement must be listed CI cable (or a listed electrical circuit protective system) with steel supports per 760.24(B)"},{"en":"The only issue is that the ties must be plenum-rated"},{"en":"There is no problem as long as the replaced section is shorter than 10 ft"}],"ans":[1],"ref":"NEC 2020 §760.24(B); §760.179","exp":"Circuits that require survivability (NFPA 72 Ch. 12) use CI cable or a listed electrical circuit protective system. Ordinary FPLR has no circuit integrity rating, and nylon ties fail in a fire: 760.24(B) requires steel supports and fasteners at no more than 24 in."},{"id":"nec-050","task":"1.2.2","type":"single","diff":2,"freq":true,"q":{"en":"Exposed PLFA cable on a corridor wall, about 5 ft above the floor, was damaged by carts. When repairing it with exposed cable, what does NEC 760.130(B)(1) require?"},"opts":[{"en":"Secure it at intervals of not more than 18 in. and route it for maximum protection by building construction (door frames, baseboards, ledges)"},{"en":"Secure it at intervals of not more than 4½ ft"},{"en":"No securing is needed for cable below 7 ft"},{"en":"Leave it loose so it can move when struck"}],"ans":[0],"ref":"NEC 2020 §760.130(B)(1)","exp":"760.130(B)(1): exposed PLFA cable must be adequately supported and routed where the building construction gives maximum protection against damage (door frames, baseboards, ledges). Within 7 ft (2.1 m) of the floor it is fastened at intervals not exceeding 18 in. (450 mm). If physical damage recurs, consider using raceway."}]},{"topic":{"id":"elec","title":"Basic Electricity and Calculations (Ugly's / NEC Ch. 9)","short":"Electricity","tasks":["1.1.2","1.2.2","1.3.1","1.1.1"],"refs":["Ugly's Electrical References 2020 (Ohm's law, power, series/parallel, voltage drop)","NEC 2020 Ch. 9 (Tables 1, 4, 5, and 8; Notes to Tables) and Annex C","NFPA 72-2022 §7.2.1, §10.6.7.2.1, and Table 14.4.3.2"],"guide":"\n<h3>What NICET expects at Level I</h3>\n<p>At Level I, electrical calculations show up mainly in tasks 1.1.2 (cabling and infrastructure) and 1.2.2 (repair or replace). You are not asked to design but to <strong>verify</strong>: add up NAC currents, calculate voltage drop, check the voltage at the last appliance, size batteries, and use a multimeter correctly. Tools: the on-screen exam calculator, <em>Ugly's Electrical References</em>, NEC 2020 Chapter 9, and NFPA 72-2022.</p>\n\n<h3>Formula sheet</h3>\n<table>\n<thead><tr><th>Concept</th><th>Formula</th><th>Note</th></tr></thead>\n<tbody>\n<tr><td>Ohm's law</td><td><code>E = I × R</code>; <code>I = E ÷ R</code>; <code>R = E ÷ I</code></td><td>Ugly's uses E for voltage</td></tr>\n<tr><td>Power (watts)</td><td><code>P = E × I = I² × R = E² ÷ R</code></td><td>Ugly's formula \"wheel\"</td></tr>\n<tr><td>Resistors in series</td><td><code>RT = R1 + R2 + ...</code></td><td>The same current flows through the whole loop</td></tr>\n<tr><td>Resistors in parallel</td><td><code>1/RT = 1/R1 + 1/R2 + ...</code>; equal values: <code>R ÷ n</code></td><td>The same voltage across each branch</td></tr>\n<tr><td>Kirchhoff (currents)</td><td><code>IT = I1 + I2 + ...</code></td><td>Total current of a NAC</td></tr>\n<tr><td>Kirchhoff (voltages)</td><td><code>E source = sum of drops</code></td><td>V at last appliance = starting V − VD</td></tr>\n<tr><td>DC voltage drop, 2-wire (K method)</td><td><code>VD = 2 × K × I × L ÷ CM</code></td><td>K = 12.9 copper, 21.2 aluminum (Ugly's); L = one-way distance</td></tr>\n<tr><td>Voltage drop (resistance method)</td><td><code>VD = I × (Ω/kft × 2L ÷ 1000)</code></td><td>Ω/kft from NEC Ch. 9, Table 8</td></tr>\n<tr><td>Three-phase drop (Ugly's)</td><td><code>VD = 1.732 × K × I × L ÷ CM</code></td><td>Rarely used in fire alarm</td></tr>\n<tr><td>Batteries</td><td><code>Ah = (I standby × 24 h) + (I alarm × 5/60 h)</code>, then × margin</td><td>NFPA 72-2022 §10.6.7.2.1; EVACS: 15/60 h</td></tr>\n</tbody>\n</table>\n<p>Prefixes: 1 mA = 0.001 A; 1 kΩ = 1000 Ω; 1 MΩ = 1,000,000 Ω; 1 mW = 0.001 W. <strong>Always</strong> convert mA to A before multiplying. 5 min = 0.0833 h; 15 min = 0.25 h.</p>\n\n<h3>NEC 2020 Ch. 9, Table 8: values to keep handy</h3>\n<p>DC resistance at 75°C (167°F), uncoated copper, in ohms per 1000 ft. Values checked against Table 8; for these sizes they have not changed in recent NEC editions.</p>\n<table>\n<thead><tr><th>AWG</th><th>Area (cmil)</th><th>Solid (Ω/kft)</th><th>Stranded, 7 strands (Ω/kft)</th></tr></thead>\n<tbody>\n<tr><td>18</td><td>1620</td><td>7.77</td><td>7.95</td></tr>\n<tr><td>16</td><td>2580</td><td>4.89</td><td>4.99</td></tr>\n<tr><td>14</td><td>4110</td><td>3.07</td><td>3.14</td></tr>\n<tr><td>12</td><td>6530</td><td>1.93</td><td>1.98</td></tr>\n<tr><td>10</td><td>10,380</td><td>1.21</td><td>1.24</td></tr>\n</tbody>\n</table>\n<p>Coated copper has slightly higher resistance (for example, 14 AWG stranded coated = 3.26 Ω/kft). Quick rule: smaller AWG number = thicker conductor = less resistance = less voltage drop.</p>\n<div class=\"callout\"><strong>About the K value:</strong> Ugly's uses K = 12.9 Ω·cmil/ft for copper (equivalent to the resistance at 75°C). Other texts use 10.4 or 10.7 (copper at about 20–25°C), which give smaller drops. On the exam, use the K the question gives; if none is given, use 12.9 or Table 8. Both methods agree: 12.9 ÷ 4110 cmil × 1000 ≈ 3.14 Ω/kft, the same as 14 AWG stranded. This question bank uses K = 12.9.</div>\n\n<h3>Worked example: NAC voltage drop</h3>\n<p>24 VDC NAC with a 1.8 A total load; last appliance 250 ft away (one way); 16 AWG stranded cable; appliances listed for 16–33 VDC; the manufacturer says to start from 20.4 V (85% of 24 V, battery at end of discharge).</p>\n<ol>\n<li>Loop length: 2 × 250 ft = 500 ft = 0.5 kft.</li>\n<li>Loop resistance: 4.99 Ω/kft × 0.5 kft = 2.495 Ω.</li>\n<li>VD = 1.8 A × 2.495 Ω ≈ 4.49 V. With the K method: 2 × 12.9 × 1.8 × 250 ÷ 2580 = 4.50 V.</li>\n<li>Voltage at the last appliance: 20.4 − 4.49 = 15.91 V → <strong>does not comply</strong> (below 16 V).</li>\n<li>With 14 AWG stranded: 3.14 × 0.5 = 1.57 Ω; VD = 1.8 × 1.57 ≈ 2.83 V; 20.4 − 2.83 = 17.57 V → complies.</li>\n</ol>\n<p>The lumped-load method (all current at the end of the circuit) is conservative: if it passes this way, it also passes a point-to-point calculation. The acceptance criterion is the appliance's listed operating range from the manufacturer, not an NFPA 72 number.</p>\n\n<h3>Worked example: batteries</h3>\n<p>Total standby current 0.320 A; total alarm current 2.75 A; non-voice system.</p>\n<ol>\n<li>Standby: 0.320 A × 24 h = 7.68 Ah.</li>\n<li>Alarm: 2.75 A × (5 ÷ 60) h ≈ 0.229 Ah.</li>\n<li>Subtotal: 7.68 + 0.229 ≈ 7.91 Ah.</li>\n<li>25% capacity margin (factor 1.25): 7.91 × 1.25 ≈ 9.89 Ah. With the 20% of earlier editions it would be ≈ 9.49 Ah.</li>\n<li>Choose the next commercial battery size the panel charger can recharge (for example, 12 Ah). Two 12-V batteries in series give 24 V with the same Ah capacity.</li>\n</ol>\n<div class=\"callout warn\"><strong>Battery margin:</strong> technical summaries of the 2022 edition of NFPA 72 report that the capacity margin went from 20% to 25% (factor 1.25) to cover battery aging over its service life. Many manufacturer worksheets and older books still use 1.2. On the exam, use the factor the question gives.</div>\n\n<h3>EOL, supervision, and typical readings</h3>\n<p>On Class B, the end-of-line (EOL) resistor goes at the last device on the circuit; the panel watches a small supervisory current (for example, 24 V ÷ 4.7 kΩ ≈ 5.1 mA). The wire must go in and out of each terminal, with no T-taps on conventional circuits, and the wire run must be broken at each terminal rather than looped under it. In standby a NAC supervises with reversed polarity and polarized appliances block that current, so + and − must be respected. Readings with the circuit disconnected from the panel:</p>\n<table>\n<thead><tr><th>Condition</th><th>Between the two conductors</th><th>Conductor to ground</th></tr></thead>\n<tbody>\n<tr><td>Normal</td><td>≈ EOL value + wire (e.g., 4.72 kΩ)</td><td>Very high (MΩ or OL)</td></tr>\n<tr><td>Open</td><td>OL (infinite)</td><td>Very high</td></tr>\n<tr><td>Short or closed contact</td><td>A few ohms (wire only)</td><td>Very high</td></tr>\n<tr><td>Ground fault</td><td>Normal</td><td>Low</td></tr>\n</tbody>\n</table>\n<p>A wrong EOL (47 kΩ instead of 4.7 kΩ) cuts the supervisory current to one-tenth and the panel may see it as an open. Two equal EOLs in parallel give half the value.</p>\n\n<h3>Multimeter and megohmmeter</h3>\n<ul>\n<li><strong>Voltage:</strong> in parallel, across the component (for example, at the terminals of the last appliance with the NAC in alarm).</li>\n<li><strong>Current:</strong> in series, opening the circuit and using the A/mA input. Never across the power source.</li>\n<li><strong>Resistance and continuity:</strong> only with the circuit de-energized and disconnected from the panel.</li>\n<li><strong>Megohmmeter:</strong> applies high dc voltage to measure insulation in MΩ; disconnect the panel and all devices before testing.</li>\n<li><strong>Tests of new conductors</strong> (NFPA 72-2022, Table 14.4.3.2): maximum stray voltage of 1 V ac/dc unless the manufacturer specifies otherwise; insulation to ground; insulation between conductors; loop resistance (pair shorted at the far end) within the manufacturer's limit.</li>\n</ul>\n\n<h3>Alternating current and distribution systems</h3>\n<p>In the U.S., ac is 60 Hz. Common systems in Ugly's: single-phase 120/240 V (120 V hot to neutral, 240 V between hots), three-phase 208Y/120 V (208 ÷ 1.732 ≈ 120 V to neutral), and 480Y/277 V. The fire alarm panel is normally fed with 120 V ac (hot and neutral; never use the equipment grounding conductor as a return) and supplies 24 V dc to its circuits; the batteries are dc.</p>\n\n<h3>Conduit fill (NEC Ch. 9)</h3>\n<table>\n<thead><tr><th>Case</th><th>Maximum</th><th>Where</th></tr></thead>\n<tbody>\n<tr><td>1 conductor (or 1 multiconductor cable)</td><td>53%</td><td>Table 1 + Note 9</td></tr>\n<tr><td>2 conductors</td><td>31%</td><td>Table 1</td></tr>\n<tr><td>More than 2 conductors</td><td>40%</td><td>Table 1</td></tr>\n<tr><td>Nipple of 24 in. (600 mm) or less between boxes</td><td>60%</td><td>Note 4</td></tr>\n</tbody>\n</table>\n<p>Same-size conductors: Annex C (Table C.1 = EMT). Mixed sizes: add the areas from Table 5 (14 AWG THHN = 0.0097 in²; 12 AWG THHN = 0.0133 in²) and compare with the matching column of Table 4 (1/2 in. EMT at 40% = 0.122 in²). Round up only if the decimal is 0.8 or more (Note 7).</p>\n<p>NFPA 72 does not set a color code for fire alarm conductors: follow the project drawings and specifications.</p>\n\n<div class=\"callout warn\"><strong>Common traps</strong>\n<ul>\n<li>Forgetting the × 2 (out and back) in voltage drop, or applying it twice.</li>\n<li>Using mA as if they were A.</li>\n<li>Using 5 minutes as 5 hours (5 ÷ 60 = 0.0833 h).</li>\n<li>Confusing solid with stranded, or coated with uncoated, in Table 8.</li>\n<li>Using 31% when there are more than 2 conductors.</li>\n<li>Believing that changing the EOL fixes voltage drop.</li>\n<li>Measuring current with the meter in parallel.</li>\n<li>Accepting an appliance that \"works\" at a voltage below its listed range.</li>\n</ul>\n</div>\n\n<h3>How to find it fast in the printed books</h3>\n<ul>\n<li><strong>NEC:</strong> Chapter 9 tables follow Chapter 8 near the back of the book, just before the Informative Annexes. Tab Table 1 together with the Notes to Tables (Notes 4, 7, and 9 are on the same pages), Table 4, Table 5, and Table 8 (Conductor Properties). Tab Annex C at Table C.1 (EMT); the annex is organized by raceway type.</li>\n<li><strong>NFPA 72:</strong> in the index, look up \"Batteries,\" \"Power supplies, secondary,\" and \"Documentation.\" Tab §10.6.7 for battery capacity (§10.6.7.2.1), §7.2.1 for the minimum documentation (battery and voltage drop calculations), and Table 14.4.3.2 for conductor and battery tests (stray voltage, loop resistance).</li>\n<li><strong>Ugly's:</strong> use the table of contents to tab Ohm's Law / Power Formulas, Series and Parallel Circuits, and Voltage Drop Calculations.</li>\n</ul>\n","tabs":[{"ref":"NEC 2020 Ch. 9, Table 8","what":"Conductor properties: cmil and dc resistance at 75°C (Ω/kft), solid and stranded"},{"ref":"NEC 2020 Ch. 9, Table 1","what":"Percent fill: 1 conductor 53%, 2 conductors 31%, over 2: 40%"},{"ref":"NEC 2020 Ch. 9, Notes to
