your click before moving on.</li><li>If in doubt, flag it for review and move on: do not spend more than 2 minutes on one figure.</li><li>The numbers behind these figures are the same ones you tab and highlight in your printed NFPA 72: §17.6.3.1.3 and §17.7.4.2 (detectors on walls), §17.15 (manual boxes), §18.4.9 and §18.5.5 (appliance heights), and §18.5.5.8 (corridors).</li></ul><div class=\"callout warn\"><p><strong>Common trap:</strong> for visual appliances the <em>entire lens</em> counts (80–96 in.), not the center of the appliance. For audible appliances the <em>top</em> of the appliance counts (at least 90 in. above the floor and at least 6 in. below the ceiling).</p></div>","tabs":[],"glossary":[{"en":"Exhibit","def":"A drawing, table, or diagram that accompanies an exam question."},{"en":"Above finished floor (AFF)","def":"The reference used to measure mounting heights."},{"en":"Hotspot item","def":"A question answered by clicking on an area of the figure."}]},"questions":[{"id":"visual-001","task":"1.1.1","type":"hotspot","diff":2,"freq":true,"q":{"en":"The exhibit shows a section through a smooth, flat ceiling and its sidewall. Click the area of the SIDEWALL where a spot-type SMOKE detector is permitted to be mounted."},"svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 400\" role=\"img\" aria-label=\"Section view of a sidewall meeting a smooth ceiling with a scale of inches below the ceiling\"><rect class=\"hs-wall\" x=\"0\" y=\"0\" width=\"760\" height=\"60\"/><rect class=\"hs-wall\" x=\"100\" y=\"0\" width=\"50\" height=\"400\"/><path class=\"hs-line\" d=\"M150 400 V60 H760\"/><text class=\"hs-label\" x=\"470\" y=\"38\">CEILING (smooth, flat)</text><text class=\"hs-label\" x=\"14\" y=\"226\">SIDE-</text><text class=\"hs-label\" x=\"14\" y=\"244\">WALL</text><text class=\"hs-text\" x=\"560\" y=\"260\">ROOM</text><path class=\"hs-line\" d=\"M360 60 V348\"/><path class=\"hs-line\" d=\"M352 60 H368\"/><text class=\"hs-text\" x=\"376\" y=\"64\">0 in.</text><path class=\"hs-line\" d=\"M352 92 H368\"/><text class=\"hs-text\" x=\"376\" y=\"96\">4 in.</text><path class=\"hs-thin\" d=\"M150 92 H352\"/><path class=\"hs-line\" d=\"M352 124 H368\"/><text class=\"hs-text\" x=\"376\" y=\"128\">8 in.</text><path class=\"hs-thin\" d=\"M150 124 H352\"/><path class=\"hs-line\" d=\"M352 156 H368\"/><text class=\"hs-text\" x=\"376\" y=\"160\">12 in.</text><path class=\"hs-thin\" d=\"M150 156 H352\"/><path class=\"hs-line\" d=\"M352 188 H368\"/><text class=\"hs-text\" x=\"376\" y=\"192\">16 in.</text><path class=\"hs-thin\" d=\"M150 188 H352\"/><path class=\"hs-line\" d=\"M352 220 H368\"/><text class=\"hs-text\" x=\"376\" y=\"224\">20 in.</text><path class=\"hs-thin\" d=\"M150 220 H352\"/><path class=\"hs-line\" d=\"M352 252 H368\"/><text class=\"hs-text\" x=\"376\" y=\"256\">24 in.</text><path class=\"hs-thin\" d=\"M150 252 H352\"/><path class=\"hs-line\" d=\"M352 300 H368\"/><text class=\"hs-text\" x=\"376\" y=\"304\">30 in.</text><path class=\"hs-thin\" d=\"M150 300 H352\"/><path class=\"hs-line\" d=\"M352 348 H368\"/><text class=\"hs-text\" x=\"376\" y=\"352\">36 in.</text><path class=\"hs-thin\" d=\"M150 348 H352\"/><text class=\"hs-text\" x=\"376\" y=\"384\">distance below ceiling</text></svg>","regions":[{"x":100,"y":60,"w":210,"h":96,"ok":true}],"ref":"NFPA 72-2022 §17.7.4.2 (location of spot-type smoke detectors)","exp":"Spot-type smoke detectors go on the ceiling or, if mounted on the sidewall, between the ceiling and 12 in. (300 mm) below it, measured to the top of the detector. For smoke detectors there is no longer a 4-in. dead zone; that rule now applies only to heat detectors."},{"id":"visual-002","task":"1.1.1","type":"hotspot","diff":2,"freq":true,"q":{"en":"The exhibit shows a section through a smooth, flat ceiling and its sidewall. Click the area of the SIDEWALL where a spot-type HEAT detector is permitted to be mounted."},"svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 400\" role=\"img\" aria-label=\"Section view of a sidewall meeting a smooth ceiling with a scale of inches below the ceiling\"><rect class=\"hs-wall\" x=\"0\" y=\"0\" width=\"760\" height=\"60\"/><rect class=\"hs-wall\" x=\"100\" y=\"0\" width=\"50\" height=\"400\"/><path class=\"hs-line\" d=\"M150 400 V60 H760\"/><text class=\"hs-label\" x=\"470\" y=\"38\">CEILING (smooth, flat)</text><text class=\"hs-label\" x=\"14\" y=\"226\">SIDE-</text><text class=\"hs-label\" x=\"14\" y=\"244\">WALL</text><text class=\"hs-text\" x=\"560\" y=\"260\">ROOM</text><path class=\"hs-line\" d=\"M360 60 V348\"/><path class=\"hs-line\" d=\"M352 60 H368\"/><text class=\"hs-text\" x=\"376\" y=\"64\">0 in.</text><path class=\"hs-line\" d=\"M352 92 H368\"/><text class=\"hs-text\" x=\"376\" y=\"96\">4 in.</text><path class=\"hs-thin\" d=\"M150 92 H352\"/><path class=\"hs-line\" d=\"M352 124 H368\"/><text class=\"hs-text\" x=\"376\" y=\"128\">8 in.</text><path class=\"hs-thin\" d=\"M150 124 H352\"/><path class=\"hs-line\" d=\"M352 156 H368\"/><text class=\"hs-text\" x=\"376\" y=\"160\">12 in.</text><path class=\"hs-thin\" d=\"M150 156 H352\"/><path class=\"hs-line\" d=\"M352 188 H368\"/><text class=\"hs-text\" x=\"376\" y=\"192\">16 in.</text><path class=\"hs-thin\" d=\"M150 188 H352\"/><path class=\"hs-line\" d=\"M352 220 H368\"/><text class=\"hs-text\" x=\"376\" y=\"224\">20 in.</text><path class=\"hs-thin\" d=\"M150 220 H352\"/><path class=\"hs-line\" d=\"M352 252 H368\"/><text class=\"hs-text\" x=\"376\" y=\"256\">24 in.</text><path class=\"hs-thin\" d=\"M150 252 H352\"/><path class=\"hs-line\" d=\"M352 300 H368\"/><text class=\"hs-text\" x=\"376\" y=\"304\">30 in.</text><path class=\"hs-thin\" d=\"M150 300 H352\"/><path class=\"hs-line\" d=\"M352 348 H368\"/><text class=\"hs-text\" x=\"376\" y=\"352\">36 in.</text><path class=\"hs-thin\" d=\"M150 348 H352\"/><text class=\"hs-text\" x=\"376\" y=\"384\">distance below ceiling</text></svg>","regions":[{"x":100,"y":92,"w":210,"h":64,"ok":true}],"ref": \" x=\"714\" y=\"154\">EOL</text><path class=\"hs-line\" d=\"M220 110 V52 M260 52 V110\"/><circle class=\"hs-dev\" cx=\"240\" cy=\"52\" r=\"20\"/><text class=\"hs-label\" x=\"240\" y=\"57\" text-anchor=\"middle\">M</text><circle class=\"hs-dot\" cx=\"220\" cy=\"110\" r=\"3\"/><circle class=\"hs-dot\" cx=\"260\" cy=\"110\" r=\"3\"/><path class=\"hs-line\" d=\"M320 110 V130 M320 170 V190\"/><circle class=\"hs-dev\" cx=\"320\" cy=\"150\" r=\"20\"/><text class=\"hs-label\" x=\"320\" y=\"155\" text-anchor=\"middle\">M</text><circle class=\"hs-dot\" cx=\"320\" cy=\"110\" r=\"3\"/><circle class=\"hs-dot\" cx=\"320\" cy=\"190\" r=\"3\"/><path class=\"hs-line\" d=\"M500 110 V52 M540 52 V110\"/><circle class=\"hs-dev\" cx=\"520\" cy=\"52\" r=\"20\"/><text class=\"hs-label\" x=\"520\" y=\"57\" text-anchor=\"middle\">M</text><circle class=\"hs-dot\" cx=\"500\" cy=\"110\" r=\"3\"/><circle class=\"hs-dot\" cx=\"540\" cy=\"110\" r=\"3\"/><text class=\"hs-text\" x=\"140\" y=\"250\">M = digital multimeter. For one connection the + conductor is opened.</text></svg>","regions":[{"x":214,"y":28,"w":52,"h":86,"ok":true}],"ref":"Ugly’s Electrical References (2020) — Ohm’s law and meter use","exp":"Current is measured with the meter in series: open the conductor and insert the ammeter so that all of the circuit current passes through it (the connection across the opened section). Between the two conductors the meter measures voltage, and between two points on the same conductor it measures the voltage drop of that section."},{"id":"visual-013","task":"1.2.2","type":"hotspot","diff":1,"q":{"en":"Click the meter connection that will correctly measure the VOLTAGE available between the NAC conductors."},"svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 262\" role=\"img\" aria-label=\"Notification appliance circuit with two horn/strobes, an end-of-line resistor and three different meter connections\"><rect class=\"hs-fill\" x=\"20\" y=\"80\" width=\"120\" height=\"140\" rx=\"6\"/><text class=\"hs-label\" x=\"80\" y=\"142\" text-anchor=\"middle\">NAC</text><text class=\"hs-text\" x=\"80\" y=\"162\" text-anchor=\"middle\">24 VDC</text><text class=\"hs-label\" x=\"132\" y=\"106\" text-anchor=\"end\">+</text><text class=\"hs-label\" x=\"132\" y=\"196\" text-anchor=\"end\">–</text><path class=\"hs-line\" d=\"M140 110 H220 M260 110 H700 M140 190 H700\"/><path class=\"hs-line\" d=\"M420 110 V128 M420 172 V190\"/><rect class=\"hs-dev\" x=\"398\" y=\"128\" width=\"44\" height=\"44\" rx=\"4\"/><text class=\"hs-text\" x=\"420\" y=\"155\" text-anchor=\"middle\">H/S</text><path class=\"hs-line\" d=\"M600 110 V128 M600 172 V190\"/><rect class=\"hs-dev\" x=\"578\" y=\"128\" width=\"44\" height=\"44\" rx=\"4\"/><text class=\"hs-text\" x=\"600\" y=\"155\" text-anchor=\"middle\">H/S</text><path class=\"hs-line\" d=\"M700 110 V128 l8 5 -16 8 16 8 -16 8 16 8 -8 5 V190\"/><text class=\"hs-text\" x=\"714\" y=\"154\">EOL</text><path class=\"hs-line\" d=\"M220 110 V52 M260 52 V110\"/><circle class=\"hs-dev\" cx=\"240\" cy=\"52\" r=\"20\"/><text class=\"hs-label\" x=\"240\" y=\"57\" text-anchor=\"middle\">M</text><circle class=\"hs-dot\" cx=\"220\" cy=\"110\" r=\"3\"/><circle class=\"hs-dot\" cx=\"260\" cy=\"110\" r=\"3\"/><path class=\"hs-line\" d=\"M320 110 V130 M320 170 V190\"/><circle class=\"hs-dev\" cx=\"320\" cy=\"150\" r=\"20\"/><text class=\"hs-label\" x=\"320\" y=\"155\" text-anchor=\"middle\">M</text><circle class=\"hs-dot\" cx=\"320\" cy=\"110\" r=\"3\"/><circle class=\"hs-dot\" cx=\"320\" cy=\"190\" r=\"3\"/><path class=\"hs-line\" d=\"M500 110 V52 M540 52 V110\"/><circle class=\"hs-dev\" cx=\"520\" cy=\"52\" r=\"20\"/><text class=\"hs-label\" x=\"520\" y=\"57\" text-anchor=\"middle\">M</text><circle class=\"hs-dot\" cx=\"500\" cy=\"110\" r=\"3\"/><circle class=\"hs-dot\" cx=\"540\" cy=\"110\" r=\"3\"/><text class=\"hs-text\" x=\"140\" y=\"250\">M = digital multimeter. For one connection the + conductor is opened.</text></svg>","regions":[{"x":296,"y":108,"w":48,"h":86,"ok":true}],"ref":"Ugly’s Electrical References (2020) — meter use","exp":"Voltage is measured in parallel: one probe on the positive conductor and the other on the negative, without opening the circuit. To check the voltage at the last appliance, measure this way between + and – at that appliance, with the circuit in alarm."}]},{"topic":{"id":"comm","title":"Community-Reported Topics","short":"Community","tasks":["1.1.1","1.1.2","1.1.3","1.2.2","1.3.1"],"refs":["NFPA 72-2022 Ch. 17","NEC 2020 Ch. 9, Annex C, 314.16, 760","Ugly’s 2020","OSHA 1926"],"guide":"\n<p>People preparing for FAS Level I share what they study in public flashcard decks (mostly on Quizlet) and in forums such as The Fire Panel and Mike Holt. Reading them shows which <strong>topics</strong> keep coming up. This chapter has original questions on the topics those decks repeat that the other chapters covered only lightly: counting detectors in a room, the ceiling-height reduction table, conduit and box fill, series-parallel circuits, schematic symbols and reading a plan with a legend.</p>\n<div class=\"callout warn\"><p><strong>Why the deck questions are not copied here.</strong> Several decks look like questions remembered from real NICET exams. Candidates accept a non-disclosure agreement, so sharing exam items breaks NICET rules and can cost a certification. Many deck answers are also wrong or out of date for the 2022/2020 editions (see the table below). The questions in this chapter test the same skills with different numbers and scenarios.</p></div>\n\n<h3>Common errors in community decks</h3>\n<table><thead><tr><th>What some decks say</th><th>What the exam editions say</th><th>Where</th></tr></thead><tbody>\n<tr><td>Waterflow devices are tested annually</td><td>Semiannually</td><td>NFPA 72-2022 Table 14.4.3.2</td></tr>\n<tr><td>Exposed fire alarm cable within 7 ft of the floor is fastened every 24 in.</td><td>Every 18 in. or less</td><td>NEC 2020 760.53(A)(1), 760.130(B)(1)</td></tr>\n<tr><td>Abandoned cable kept for future use is “secured to the conduit”</td><td>It must be tagged for future use (otherwise the accessible portion is removed)</td><td>NEC 2020 760.25</td></tr>\n<tr><td>Test frequencies are in Table 14.4.5</td><td>Table 14.4.3.2, column “Periodic Frequency”</td><td>NFPA 72-2022</td></tr>\n<tr><td>Notify the AHJ when a system is out of service 4 hours</td><td>NFPA 72 uses more than 8 hours; the 4-hour fire watch comes from NFPA 101/IFC</td><td>NFPA 72-2022 §10.21</td></tr>\n<tr><td>Smoke detectors need 4 in. of “dead air” from the wall</td><td>Only heat detectors keep the 4 in. rule; smoke detectors may be on the wall within 12 in. of the ceiling</td><td>NFPA 72-2022 §17.6.3.1.3, §17.7.4.2</td></tr>\n<tr><td>DACT test signal every 24 hours</td><td>At least every 6 hours</td><td>NFPA 72-2022 §26.6.4</td></tr>\n<tr><td>Ladder base 1 ft out for every 4 ft of height</td><td>Horizontal distance ≈ 1/4 of the working length (the length along the ladder)</td><td>OSHA 1926.1053(b)(5)(i)</td></tr>\n</tbody></table>\n\n<h3>Skills these decks emphasize</h3>\n<h4>Counting detectors in a rectangular room</h4>\n<ol>\n<li>Find the spacing S: the listed spacing for heat detectors (reduced for ceilings above 10 ft with Table 17.6.3.5.1), or 30 ft nominal for smoke detectors on smooth ceilings.</li>\n<li>Divide each room dimension by S and round <strong>up</strong> to the next whole number.</li>\n<li>Multiply the two results. Example: 75 × 50 ft with S = 30 ft → 3 × 2 = 6 detectors.</li>\n</ol>\n<h4>Heat detector spacing reduction for high ceilings (Table 17.6.3.5.1)</h4>\n<p>For ceilings above 10 ft and up to 30 ft, multiply the listed spacing by the factor for the ceiling height. Examples verified for the exam edition: 14–16 ft → 0.77; 24–26 ft → 0.46; 28–30 ft → 0.34. At 10 ft or lower there is no reduction. The table applies to heat detectors, not smoke detectors.</p>\n<h4>Conduit fill and box fill</h4>\n<ul>\n<li>When all conductors are the same size and type, read NEC Annex C directly (Table C.1 is EMT). Example: 1/2 in. EMT holds 12 #14 THHN or 9 #12 THHN.</li>\n<li>Box fill: each conductor counts its volume from Table 314.16(B): 18 AWG 1.50 in³, 16 AWG 1.75 in³, 14 AWG 2.00 in³. Compare the total with the box volume in Table 314.16(A), e.g., 4 × 1-1/2 in. square = 21.0 in³, 4 × 2-1/8 in. square = 30.3 in³.</li>\n</ul>\n<h4>Series-parallel circuits</h4>\n<p>Reduce the parallel group first (two equal resistors in parallel = half of one), add the series resistance, find the total current with Ohm’s law, then work back to each resistor. Current is the same in series parts; voltage is the same across parallel branches.</p>\n<h4>Plans and symbols</h4>\n<p>Always read the legend before counting devices: symbols vary between design firms. Schematic symbols (resistor, capacitor, battery, ground, diode, coil) are in the reference pages of Ugly’s.</p>\n\n<h3>Where these resources are</h3>\n<ul>\n<li><a href=\"https://quizlet.com/search?query=nicet-fire-alarm-level-1&amp;type=sets\" target=\"_blank\" rel=\"noopener\">Quizlet decks for NICET FAS Level I</a> — useful to see topics; check every answer against the 2022/2020 editions.</li>\n<li><a href=\"https://forums.thefirepanel.com/t/tips-best-way-to-get-my-nicet-1/3205\" target=\"_blank\" rel=\"noopener\">The Fire Panel forum: tips for NICET 1</a> — advice: know what each chapter contains, and use the index and annex.</li>\n<li><a href=\"https://forums.mikeholt.com/threads/nicet-fire-alarm-best-test-prep.81494/\" target=\"_blank\" rel=\"noopener\">Mike Holt forum: best NICET fire alarm test prep</a> — candidates recommend tabbed books and the NTC “Red Book”.</li>\n<li>NICET sells two official practice tests in its online store; they are the only practice items written by NICET.</li>\n</ul>\n","tabs":[{"ref":"NFPA 72 Table 17.6.3.5.1","what":"Heat detector spacing reduction by ceiling height (multipliers)"},{"ref":"NEC Annex C, Table C.1","what":"Maximum conductors of one size in EMT"},{"ref":"NEC Table 314.16(A) and (B)","what":"Box volumes and volume per conductor"},{"ref":"NEC 760.53(A)(1) / 760.130(B)(1)","what":"Exposed cable within 7 ft of the floor: fasten every 18 in."},{"ref":"Ugly’s: electrical symbols","what":"Schematic symbols for resistor, capacitor, battery, ground, diode, coil"}],"glossary":[{"en":"Listed spacing","def":"The maximum distance between heat detectors determined by the testing laboratory and printed on the detector’s listing; reduced for high ceilings and joists."},{"en":"Single-action manual box","def":"A manual fire alarm box that sends an alarm with one motion, such as pulling the handle."},{"en":"Double-action manual box","def":"A manual fire alarm box that needs two motions, such as lifting or pushing a cover and then pulling the handle."},{"en":"Normally open (N.O.) contact","def":"A contact that is open at rest and closes when the device operates; the usual alarm contact of conventional initiating devices."},{"en":"Box fill","def":"The total volume taken by conductors, devices and fittings in an outlet or junction box, which must not exceed the box volume (NEC 314.16)."},{"en":"Legend","def":"The key on a drawing that defines each symbol used; read it before counting or locating devices."}]},"questions":[{"id":"comm-001","task":"1.1.1","type":"single","diff":2,"freq":true,"q":{"en":"A storage room is 75 ft long and 50 ft wide with a smooth, flat 10 ft ceiling. Spot-type heat detectors with a listed spacing of 30 ft will be used. What is the minimum number of detectors needed using the listed spacing?"},"opts":[{"en":"4"},{"en":"6"},{"en":"9"},{"en":"12"}],"ans":[1],"ref":"NFPA 72-2022 §17.6.3.1.1","exp":"At 10 ft no ceiling-height reduction applies, so S = 30 ft. Length: 75 ÷ 30 = 2.5, rounded up to 3. Width: 50 ÷ 30 = 1.67, rounded up to 2. 3 × 2 = 6 detectors, each no more than 15 ft (S/2) from the walls."},{"id":"comm-002","task":"1.1.1","type":"single","diff":3,"freq":true,"q":{"en":"A room is 100 ft by 60 ft with a smooth, flat ceiling 15 ft high. The heat detectors have a listed spacing of 50 ft. After applying the ceiling-height reduction, how many detectors are required?"},"opts":[{"en":"4"},{"en":"6"},{"en":"8"},{"en":"9"}],"ans":[1],"ref":"NFPA 72-2022 §17.6.3.5, Table 17.6.3.5.1","exp":"A 15 ft ceiling falls in the 14–16 ft band, multiplier 0.77: 50 × 0.77 = 38.5 ft. Length: 100 ÷ 38.5 = 2.6 → 3. Width: 60 ÷ 38.5 = 1.56 → 2. 3 × 2 = 6. Forgetting the reduction gives 2 × 2 = 4, the trap answer."},{"id":"comm-003","task":"1.1.1","type":"single","diff":2,"freq":true,"q":{"en":"A heat detector has a listed spacing of 50 ft. It will be installed on a smooth, flat ceiling 25 ft above the floor. What is the maximum spacing permitted between detectors?"},"opts":[{"en":"50 ft"},{"en":"32 ft"},{"en":"25 ft"},{"en":"23 ft"}],"ans":[3],"ref":"NFPA 72-2022 Table 17.6.3.5.1","exp":"For a ceiling above 24 ft up to 26 ft the multiplier is 0.46: 50 × 0.46 = 23 ft. 32 ft would be the result for an 18–20 ft ceiling (0.64), and 25 ft is half the listed spacing, which is the wall distance rule, not this table."},{"id":"comm-004","task":"1.1.1","type":"single","diff":2,"q":{"en":"A heat detector with a listed spacing of 30 ft will be mounted on a 29 ft high smooth ceiling. What is the maximum spacing between detectors?"},"opts":[{"en":"10.2 ft"},{"en":"15 ft"},{"en":"20.4 ft"},{"en":"30 ft"}],"ans":[0],"ref":"NFPA 72-2022 Table 17.6.3.5.1","exp":"The last band of the table, above 28 ft up to 30 ft, uses a multiplier of 0.34: 30 × 0.34 = 10.2 ft. At these heights heat takes longer to reach the ceiling, so detectors must be much closer together."},{"id":"comm-005","task":"1.1.1","type":"single","diff":1,"q":{"en":"Heat detectors with a listed spacing of 25 ft will be installed on a smooth ceiling 9 ft high. What spacing must be used?"},"opts":[{"en":"22.75 ft, using the 0.91 multiplier"},{"en":"17.5 ft, using 0.7 × the listed spacing"},{"en":"25 ft, the listed spacing, because no ceiling-height reduction applies"},{"en":"12.5 ft, half the listed spacing"}],"ans":[2],"ref":"NFPA 72-2022 §17.6.3.5","exp":"The ceiling-height reductions of Table 17.6.3.5.1 apply only to ceilings higher than 10 ft. At 9 ft the listed spacing of 25 ft is used. Half of the spacing (12.5 ft) is the maximum distance to a wall, and 0.7 × S is the distance from any point to the nearest detector."},{"id":"comm-006","task":"1.1.1","type":"single","diff":2,"freq":true,"q":{"en":"An open office is 90 ft by 60 ft with a smooth, flat 10 ft ceiling. Using the nominal spacing for spot-type smoke detectors, how many detectors are needed?"},"opts":[{"en":"4"},{"en":"6"},{"en":"9"},{"en":"12"}],"ans":[1],"ref":"NFPA 72-2022 §17.7.4.2.3.1","exp":"Smoke detectors on smooth ceilings use a nominal 30 ft spacing. 90 ÷ 30 = 3 and 60 ÷ 30 = 2, so 3 × 2 = 6 detectors, each within 15 ft of the walls and with every point of the ceiling within 0.7 × 30 = 21 ft of a detector."},{"id":"comm-007","task":"1.1.1","type":"multi","select":2,"diff":2,"q":{"en":"Which TWO statements about NFPA 72-2022 Table 17.6.3.5.1 are correct? (Select TWO.)"},"opts":[{"en":"It reduces the spacing of heat detectors on ceilings higher than 10 ft, up to 30 ft"},{"en":"It reduces the 30 ft nominal spacing of spot-type smoke detectors on high ceilings"},{"en":"For a 15 ft ceiling, the listed spacing is multiplied by 0.77"},{"en":"For an 8 ft ceiling, the listed spacing is multiplied by 0.91"},{"en":"For high ceilings, the listed spacing may be increased"}],"ans":[0,2],"ref":"NFPA 72-2022 §17.6.3.5, Table 17.6.3.5.1","exp":"The table only reduces heat detector spacing, and only for ceilings above 10 ft and up to 30 ft; a 14–16 ft ceiling uses 0.77. It does not apply to smoke detectors, there is no reduction at 8 ft (0.91 is the factor for 10–12 ft), and spacing is never increased for height."},{"id":"comm-008","task":"1.1.2","type":"single","diff":1,"freq":true,"q":{"en":"Using NEC 2020 Annex C, what is the maximum number of 14 AWG THHN conductors permitted in 1/2 in. electrical metallic tubing (EMT)?"},"opts":[{"en":"9"},{"en":"12"},{"en":"16"},{"en":"22"}],"ans":[1],"ref":"NEC 2020 Annex C, Table C.1","exp":"When all conductors are the same size and insulation type, Annex C gives the answer directly. Table C.1 (EMT) allows 12 #14 THHN in 1/2 in. EMT. 9 is the value for #12 THHN, and 22 is roughly the 3/4 in. value."},{"id":"comm-009","task":"1.1.2","type":"single","diff":1,"q":{"en":"A NAC extension requires running 12 AWG THHN conductors in 1/2 in. EMT. According to NEC 2020 Annex C, how many conductors may be installed?"},"opts":[{"en":"7"},{"en":"9"},{"en":"12"},{"en":"16"}],"ans":[1],"ref":"NEC 2020 Annex C, Table C.1","exp":"Table C.1 allows 9 #12 THHN conductors in 1/2 in. EMT. The larger conductor takes more area, so fewer fit than the 12 allowed for #14 THHN."},{"id":"comm-010","task":"1.1.2","type":"single","diff":1,"freq":true,"q":{"en":"What is the maximum number of 14 AWG conductors permitted in a 4 in. × 2-1/8 in. square metal box with no devices, clamps or fittings, according to NEC 2020 Table 314.16(A)?"},"opts":[{"en":"10"},{"en":"13"},{"en":"15"},{"en":"18"}],"ans":[2],"ref":"NEC 2020 Table 314.16(A), Table 314.16(B)","exp":"A 4 × 2-1/8 in. square box has 30.3 in³. Each 14 AWG conductor counts 2.00 in³, so 30.3 ÷ 2.00 = 15.15 → 15 conductors, which is the value listed in Table 314.16(A). 10 is the value for the shallower 4 × 1-1/2 in. square box."},{"id":"comm-011","task":"1.1.2","type":"single","diff":2,"q":{"en":"A 4 in. × 1-1/2 in. square box (21.0 in³) will contain only 16 AWG fire alarm conductors, with no devices or internal clamps. How many 16 AWG conductors are permitted?"},"opts":[{"en":"10"},{"en":"12"},{"en":"14"},{"en":"16"}],"ans":[1],"ref":"NEC 2020 Table 314.16(B)","exp":"Table 314.16(B) assigns 1.75 in³ to each 16 AWG conductor: 21.0 ÷ 1.75 = 12. 14 would be the count for 18 AWG (1.50 in³) and 10 for 14 AWG (2.00 in³)."},{"id":"comm-012","task":"1.1.2","type":"single","diff":3,"q":{"en":"A 4 in. × 2-1/8 in. square junction box (30.3 in³) already contains ten 18 AWG and six 14 AWG conductors, with no devices or clamps. How many 16 AWG conductors can still be added?"},"opts":[{"en":"0"},{"en":"1"},{"en":"2"},{"en":"3"}],"ans":[1],"ref":"NEC 2020 §314.16(B), Table 314.16(B)","exp":"Existing fill: 10 × 1.50 = 15.0 in³ plus 6 × 2.00 = 12.0 in³, total 27.0 in³. Space left: 30.3 − 27.0 = 3.3 in³. Each 16 AWG conductor needs 1.75 in³: 3.3 ÷ 1.75 = 1.9, so only 1 more conductor fits."},{"id":"comm-013","task":"1.1.2","type":"single","diff":2,"freq":true,"q":{"en":"Power-limited fire alarm cable is run exposed on a wall surface, 4 ft above the floor. According to NEC 2020, at what maximum interval must the cable be securely fastened?"},"opts":[{"en":"12 in."},{"en":"18 in."},{"en":"24 in."},{"en":"4-1/2 ft"}],"ans":[1],"ref":"NEC 2020 §760.130(B)(1); §760.53(A)(1) for NPLFA","exp":"Where cables are within 7 ft of the floor, they must be securely fastened in an approved manner at intervals of not more than 18 in. (450 mm). The same sentence appears for NPLFA cables in 760.53(A)(1). Some study decks say 24 in., which is wrong."},{"id":"comm-014","task":"1.2.2","type":"single","diff":2,"freq":true,"q":{"en":"A 24 V source feeds resistor R1 (4 Ω) in series with a parallel group of R2 (8 Ω) and R3 (8 Ω). What is the voltage across R2?"},"opts":[{"en":"6 V"},{"en":"8 V"},{"en":"12 V"},{"en":"24 V"}],"ans":[2],"ref":"Ugly’s Electrical References (2020) — Ohm’s law, series and parallel circuits","exp":"Two equal 8 Ω resistors in parallel equal 4 Ω. Total resistance: 4 + 4 = 8 Ω. Current: 24 ÷ 8 = 3 A. Voltage across R1: 3 × 4 = 12 V, so 24 − 12 = 12 V remains across the parallel group, and R2 and R3 each see 12 V."},{"id":"comm-015","task":"1.2.2","type":"single","diff":3,"q":{"en":"A 12 V source feeds R1 (2 Ω) in series with R2 (6 Ω) and R3 (3 Ω), which are connected in parallel with each other. What current flows through R3?"},"opts":[{"en":"1 A"},{"en":"2 A"},{"en":"3 A"},{"en":"6 A"}],"ans":[1],"ref":"Ugly’s Electrical References (2020) — Ohm’s law, series and parallel circuits","exp":"R2 ∥ R3 = (6 × 3) ÷ (6 + 3) = 2 Ω. Total: 2 + 2 = 4 Ω, so the total current is 12 ÷ 4 = 3 A. The parallel group drops 3 × 2 = 6 V, so R3 carries 6 ÷ 3 = 2 A and R2 carries 1 A (1 + 2 = 3 A total)."},{"id":"comm-016","task":"1.1.2","type":"single","diff":2,"q":{"en":"Four 10 Ω resistors are connected as two branches in parallel; each branch has two resistors in series. What is the total resistance?"},"opts":[{"en":"5 Ω"},{"en":"10 Ω"},{"en":"20 Ω"},{"en":"40 Ω"}],"ans":[1],"ref":"Ugly’s Electrical References (2020) — series and parallel resistance","exp":"Each branch is 10 + 10 = 20 Ω. Two equal 20 Ω branches in parallel equal 20 ÷ 2 = 10 Ω."},{"id":"comm-017","task":"1.1.1","type":"single","diff":2,"freq":true,"q":{"en":"On a conventional two-wire initiating device circuit, the alarm contacts of devices such as a waterflow switch, a manual fire alarm box or a fixed-temperature heat detector are normally:"},"opts":[{"en":"Open, closing across the circuit when the device operates"},{"en":"Closed, opening the circuit when the device operates"},{"en":"Closed, and wired in series with the end-of-line resistor"},{"en":"Open, and wired in series with each other"}],"ans":[0],"ref":"Bukowski, Fire Alarm Signaling Systems; manufacturer wiring instructions; NFPA 72-2022 Ch. 12","exp":"Conventional alarm-initiating contacts are normally open and connected in parallel across the circuit. When a device operates its contact closes and the control unit sees alarm current. An open in the wiring instead removes the end-of-line supervisory current and produces a trouble signal."},{"id":"comm-018","task":"1.1.1","type":"single","diff":1,"freq":true,"q":{"en":"A manual fire alarm box requires the user to first push in (or lift) a front panel and then pull the handle down to send an alarm. This type of box is called:"},"opts":[{"en":"Single-action"},{"en":"Double-action"},{"en":"Presignal"},{"en":"Noncoded"}],"ans":[1],"ref":"NFPA 72-2022 §17.15 and Annex A","exp":"A double-action box needs two separate motions (for example, push or lift, then pull), which reduces accidental operation. A single-action box sends the alarm with one motion. Presignal and noncoded describe how signals are handled, not how the box is operated."},{"id":"comm-019","task":"1.1.1","type":"single","diff":2,"q":{"en":"A school has repeated malicious pull-station alarms. The owner asks the installer to add covers over the manual fire alarm boxes. Per NFPA 72-2022, which is acceptable?"},"opts":[{"en":"Listed protective covers may be installed over single- or double-action boxes"},{"en":"Manual boxes may be removed from corridors and placed only in the office"},{"en":"Any locally made cover may be used if it is painted red"},{"en":"The boxes may be disconnected during school hours"}],"ans":[0],"ref":"NFPA 72-2022 §17.15","exp":"NFPA 72 permits listed protective covers over manual fire alarm boxes (many sound a local horn when lifted, which discourages pranks). The boxes must stay at the required locations near exits and in service; homemade covers are not listed, and disconnecting boxes would impair the system."},{"id":"comm-020","task":"1.1.3","type":"single","diff":1,"q":{"en":"While installing devices, a crew leaves wire scraps, empty boxes and cable reels on the stairs and in the corridor. According to OSHA 1926.25, what is required?"},"opts":[{"en":"Debris is allowed until the end of the project"},{"en":"Form and scrap lumber and debris must be kept cleared from work areas, passageways and stairs"},{"en":"Only combustible debris must be removed, and only weekly"},{"en":"The general contractor alone is responsible, so the crew may leave it"}],"ans":[1],"ref":"OSHA 29 CFR 1926.25(a)","exp":"OSHA’s housekeeping rule requires scrap, debris and similar material to be kept cleared from work areas, passageways and stairs in and around buildings during construction. Cleaning up as you go prevents trips and falls, and every employer on site is responsible for its own crew’s debris."},{"id":"comm-021","task":"1.3.1","type":"single","diff":1,"freq":true,"svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 432\" role=\"img\" aria-label=\"Partial fire alarm floor plan of four rooms and a corridor, with a legend of device symbols\"><path class=\"hs-line\" style=\"stroke-width:3\" d=\"M20 20 H740 V170 M740 230 V350 H20 V230 M20 170 V20\"/><path class=\"hs-line\" d=\"M20 170 H160 M200 170 H560 M600 170 H740 M20 230 H200 M240 230 H560 M600 230 H740 M380 20 V170 M420 230 V350\"/><text class=\"hs-label\" x=\"200\" y=\"44\" text-anchor=\"middle\">101 OFFICE</text><text class=\"hs-label\" x=\"560\" y=\"44\" text-anchor=\"middle\">102 STORAGE</text><text class=\"hs-label\" x=\"220\" y=\"340\" text-anchor=\"middle\">103 BREAK ROOM</text><text class=\"hs-label\" x=\"580\" y=\"340\" text-anchor=\"middle\">104 ELECTRICAL</text><text class=\"hs-text\" x=\"500\" y=\"224\" text-anchor=\"middle\">CORRIDOR</text><text class=\"hs-text\" x=\"26\" y=\"205\">EXIT</text><text class=\"hs-text\" x=\"734\" y=\"205\" text-anchor=\"end\">EXIT</text><circle class=\"hs-dev\" cx=\"110\" cy=\"100\" r=\"11\"/><text class=\"hs-text\" x=\"110\" y=\"104\" text-anchor=\"middle\">S</text><circle class=\"hs-dev\" cx=\"270\" cy=\"100\" r=\"11\"/><text class=\"hs-text\" x=\"270\" y=\"104\" text-anchor=\"middle\">S</text><rect class=\"hs-dev\" x=\"22\" y=\"92\" width=\"24\" height=\"14\" style=\"stroke-width:1.5\"/><text class=\"hs-text\" style=\"font-size:10px\" x=\"34\" y=\"103\" text-anchor=\"middle\">HS</text><circle class=\"hs-dev\" cx=\"500\" cy=\"100\" r=\"11\"/><text class=\"hs-text\" x=\"500\" y=\"104\" text-anchor=\"middle\">H</text><circle class=\"hs-dev\" cx=\"640\" cy=\"100\" r=\"11\"/><text class=\"hs-text\" x=\"640\" y=\"104\" text-anchor=\"middle\">S</text><circle c
