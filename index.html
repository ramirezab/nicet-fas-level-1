Troubleshooting technique that opens the circuit at its midpoint to eliminate the good half at each step."},{"en":"Insulation resistance test","def":"High-voltage (megohmmeter) test of insulation between conductors and to ground; devices and panel must be disconnected."},{"en":"Reacceptance testing","def":"Testing required after components, wiring, or software are added, deleted, repaired, or modified (NFPA 72 §14.4.2)."},{"en":"Impairment","def":"A condition in which the system or part of it is out of service, including planned events."},{"en":"Deficiency","def":"A condition that affects or may affect system performance without taking it out of service; reported in writing within 24 h if not corrected."},{"en":"Observation","def":"A suggested improvement that is neither an impairment nor a deficiency; the owner is not required to act on it."},{"en":"Sensitivity testing","def":"Calibrated verification that a smoke detector is within its listed and marked range."},{"en":"Drift compensation / maintenance alert","def":"Feature that adjusts the detector for accumulated dirt and warns when it needs cleaning."},{"en":"Nuisance alarm","def":"Unwanted alarm caused by non-fire conditions (dust, steam, insects, air currents)."},{"en":"Rate-compensated detector","def":"Heat detector that operates when the surrounding air reaches its set point, regardless of how fast the temperature rises."},{"en":"Projected beam smoke detector","def":"Detects smoke by obscuration of a light beam between a transmitter and a receiver or reflector."},{"en":"Air sampling (aspirating) detector","def":"System that draws air through a network of pipes with sampling holes and analyzes it at a central detector."},{"en":"Fault isolation module","def":"SLC device that isolates a shorted segment so the rest of the loop keeps operating."},{"en":"Duplicate address","def":"Trouble that occurs when two devices on an SLC have the same address."}]},"questions":[{"id":"repair-001","task":"1.2.2","type":"single","diff":1,"freq":true,"q":{"en":"A technician disconnects a conventional Class B initiating device circuit (IDC) from the FACU and measures across the two conductors with an ohmmeter. The 4.7 kΩ end-of-line (EOL) resistor is in place and every detector is in its normal (non-alarm) state. The meter reads 0 Ω. What is the most likely cause?"},"opts":[{"en":"An open conductor somewhere on the circuit"},{"en":"A single ground fault on the positive conductor"},{"en":"A wire-to-wire short between the two circuit conductors"},{"en":"An EOL resistor of the wrong value (for example, 3.9 kΩ)"}],"ans":[2],"ref":"Bukowski, Fire Alarm Signaling Systems (4th ed.); NFPA 72-2022 §12.6.1","exp":"A healthy circuit with the EOL in place reads about the EOL value (4.7 kΩ plus wire resistance). A reading of 0 Ω means something joins the conductors before the EOL: a short (staple, pinched cable, bad splice). An open would read OL, a ground fault does not show when measuring between conductors, and a wrong-value EOL gives a different resistance, not 0 Ω. With the circuit connected, a conventional zone reports this short as an alarm."},{"id":"repair-002","task":"1.2.2","type":"single","diff":3,"q":{"en":"A conventional IDC is designed with a single 4.7 kΩ EOL resistor. With the circuit lifted from the panel and all devices normal, the technician reads about 2.35 kΩ across the pair. What does this reading most likely indicate?"},"opts":[{"en":"The circuit is normal; the reading is within tolerance"},{"en":"Two 4.7 kΩ EOL resistors are connected in parallel on the circuit (for example, an old EOL left at a former last device or at a T-tap)"},{"en":"There is an open conductor between the panel and the first device"},{"en":"There is a high-resistance ground fault on one conductor"}],"ans":[1],"ref":"NFPA 72-2022 §12.6.1; Ohm's law (Ugly's Electrical References 2020)","exp":"Two equal resistors in parallel give half the value: 4.7 kΩ ÷ 2 = 2.35 kΩ. This happens when a circuit is extended and the old EOL is left in place, or when a T-tap has an EOL on each branch. It is a defect: if the conductor feeding one EOL opens, the panel still sees 4.7 kΩ and shows no trouble, which violates the monitoring for integrity required by NFPA 72-2022 §12.6.1. Only one EOL may remain, at the end of the circuit."},{"id":"repair-003","task":"1.2.2","type":"multi","select":2,"diff":2,"q":{"en":"On a conventional Class B IDC supervised with an EOL resistor, which TWO conditions would the FACU normally report as a TROUBLE rather than an alarm? (Select TWO.)"},"opts":[{"en":"A broken (open) conductor between two detectors"},{"en":"A wire-to-wire short at a junction box"},{"en":"A single ground fault on one conductor"},{"en":"A smoke detector that has gone into alarm"},{"en":"A manual pull station that has been operated"}],"ans":[0,2],"ref":"NFPA 72-2022 §12.3.2 and §12.6.1","exp":"On a conventional IDC, devices signal an alarm by placing a low resistance (or a short) across the conductors, so the panel reads a short as an alarm. An open interrupts the supervisory current through the EOL, and a ground fault is caught by the ground detection circuit. Both are trouble conditions and must be annunciated within 200 seconds (NFPA 72-2022 §12.3.2 and §12.6.1)."},{"id":"repair-004","task":"1.2.2","type":"single","diff":2,"q":{"en":"After replacing a horn/strobe, the NAC shows a trouble in standby. The technician discovers the new appliance was wired with + and – reversed. Why does reversed polarity cause a trouble on a typical reverse-polarity-supervised NAC?"},"opts":[{"en":"The appliance's internal blocking diode conducts during supervision, so the panel sees a low-resistance (short-like) condition instead of only the EOL"},{"en":"Reversed polarity removes the EOL from the circuit, which the panel reads as a ground fault"},{"en":"The panel sees reversed polarity as an alarm and latches the NAC on"},{"en":"Reversed polarity has no effect in standby; the trouble must come from the battery"}],"ans":[0],"ref":"Bukowski, Fire Alarm Signaling Systems (4th ed.); manufacturer's instructions","exp":"In standby, the panel applies a supervisory voltage to the NAC in reverse polarity. Polarized appliances block that current with a diode, so only the EOL current flows. An appliance wired backward conducts during supervision: the panel sees a low-resistance, short-like load and reports a trouble, and that appliance would not operate in alarm. For the same reason a short on a NAC is reported as a trouble, not an alarm; always follow the manufacturer's + and – markings."},{"id":"repair-005","task":"1.2.2","type":"single","diff":3,"q":{"en":"The FACU reports a ground fault on a NAC. The technician lifts both NAC conductors from the panel and measures each conductor to ground: + to ground reads OL (open) and – to ground reads 0.4 Ω. What is the best next step?"},"opts":[{"en":"Replace the FACU main board, since the field wiring tested good"},{"en":"Swap the + and – conductors at the panel to cancel the ground"},{"en":"Open the circuit at a midpoint junction box and measure each half of the – conductor to ground to find the grounded section"},{"en":"Install a second EOL resistor to rebalance the circuit"}],"ans":[2],"ref":"NFPA 72-2022 Table 14.4.3.2 (item 15, metallic conductors); Bukowski","exp":"With the circuit disconnected, a reading of nearly 0 Ω from the – conductor to ground confirms that conductor is touching ground (box, conduit, staple). The next step is half-splitting: open the circuit at a midpoint and measure each half to ground again until the damaged section is found. Measuring with the circuit still connected to the panel gives misleading readings because of the ground detection circuit. Table 14.4.3.2 (item 15) requires installation conductors to be tested for ground faults."},{"id":"repair-006","task":"1.2.2","type":"single","diff":2,"q":{"en":"Using the half-splitting method, what is the maximum number of splits a technician needs to narrow a fault down to one of 64 equal sections of a circuit?"},"opts":[{"en":"4"},{"en":"6"},{"en":"8"},{"en":"32"}],"ans":[1],"ref":"Standard troubleshooting practice; 2^n calculation","exp":"Each split eliminates half of the circuit: 64 → 32 → 16 → 8 → 4 → 2 → 1, which is 6 splits (2^6 = 64). Checking device by device could take up to 63 checks. Half-splitting is the most efficient way to locate opens, shorts, and ground faults."},{"id":"repair-007","task":"1.2.2","type":"single","diff":1,"freq":true,"q":{"en":"A single open occurs midway along a signaling line circuit. Which statement correctly describes the result according to the NFPA 72 pathway class designations?"},"opts":[{"en":"Class A: devices beyond the open stop working and no trouble is shown; Class B: all devices keep working"},{"en":"Class A: all devices keep working and a trouble is annunciated; Class B: devices beyond the open lose operation and a trouble is annunciated"},{"en":"Both Class A and Class B keep all devices working; only Class X annunciates a trouble"},{"en":"Class A and Class B both go into alarm on a single open"}],"ans":[1],"ref":"NFPA 72-2022 §12.3.1 and §12.3.2","exp":"Per NFPA 72-2022 §12.3.1, Class A has a redundant path: it keeps operating beyond a single open and annunciates the open as a trouble. Per §12.3.2, Class B has no redundant path: operation stops at the open (devices beyond it are lost), and a trouble is also annunciated. In both classes a single ground fault does not prevent operation and is annunciated as a trouble."},{"id":"repair-008","task":"1.2.2","type":"single","diff":3,"freq":true,"q":{"en":"During a service call, a technician finds that a Class B NAC was T-tapped in a junction box: one branch continues to the EOL resistor, and the other branch feeds three strobes and simply ends. What is the problem?"},"opts":[{"en":"None; T-taps are acceptable on any Class B circuit as long as the EOL is installed"},{"en":"The extra branch will cause the panel to show a permanent ground fault"},{"en":"An open on the dead-end branch would not change the current through the EOL, so the panel would not detect it; the circuit must be one continuous path ending at the EOL"},{"en":"The three strobes will flash out of sync, but the circuit is otherwise supervised"}],"ans":[2],"ref":"NFPA 72-2022 §12.6.1; manufacturer's instructions","exp":"Class B supervision works because the supervisory current travels the whole circuit to the EOL at the far end. On the branch without the EOL, an open does not change that current and goes undetected, which violates the monitoring for integrity required by NFPA 72-2022 §12.6.1. On Class B IDCs and NACs the wiring must go into and out of each device and end at the EOL after the last device. Some Class B SLCs do permit T-taps where the manufacturer allows them."},{"id":"repair-009","task":"1.2.2","type":"single","diff":2,"q":{"en":"A technician plans to perform an insulation-resistance (megohmmeter) test on an existing IDC to look for damaged insulation. What must be done first?"},"opts":[{"en":"Leave all devices connected so they are included in the test"},{"en":"Short the circuit at the far end and leave it connected to the panel"},{"en":"Place the panel in drill mode so the circuit is energized during the test"},{"en":"Disconnect the circuit from the FACU and disconnect all devices so the test voltage cannot damage solid-state electronics"}],"ans":[3],"ref":"NFPA 72-2022 Table 14.4.3.2 (item 15); manufacturer's instructions","exp":"A megohmmeter applies high test voltages (for example, 250 to 500 V) that can damage detectors, modules, and the panel's circuit board. That is why the circuit is disconnected from the FACU and the devices are disconnected before the test, per the manufacturer's instructions. NFPA 72-2022 Table 14.4.3.2 (item 15) calls for testing conductor-to-ground and conductor-to-conductor insulation per the manufacturer's published instructions."},{"id":"repair-010","task":"1.2.2","type":"single","diff":3,"q":{"en":"With the NAC activated, a technician measures 24.0 V dc at the FACU NAC terminals and 18.6 V dc at the last appliance. The NAC current is 1.8 A. What is the total (round-trip) resistance of the circuit conductors?"},"opts":[{"en":"0.33 Ω"},{"en":"13.3 Ω"},{"en":"10.3 Ω"},{"en":"3.0 Ω"}],"ans":[3],"ref":"Ohm's law (Ugly's Electrical References 2020); appliance data sheet","exp":"The voltage drop is 24.0 − 18.6 = 5.4 V. By Ohm's law, R = E ÷ I = 5.4 V ÷ 1.8 A = 3.0 Ω (round trip). The voltage at the last appliance is measured with the NAC in alarm (under load) and must stay within the appliance's listed operating range (for example, 16–33 V dc for many regulated 24 V appliances). The 13.3 Ω answer comes from dividing 24 ÷ 1.8, a common mistake."},{"id":"repair-011","task":"1.2.2","type":"multi","select":2,"diff":2,"freq":true,"q":{"en":"A technician is replacing a failed two-wire smoke detector on a conventional IDC. Which TWO requirements apply? (Select TWO.)"},"opts":[{"en":"Any UL-listed smoke detector may be used, regardless of the panel manufacturer"},{"en":"The replacement detector/base must be listed as compatible with the FACU's IDC"},{"en":"Ten percent of all other initiating devices in the building must be retested"},{"en":"After installation, the replaced detector must be functionally tested"},{"en":"A second EOL resistor must be installed at the new detector"}],"ans":[1,3],"ref":"NFPA 72-2022 §10.3.3 and §14.4.2 (A.14.4.2)","exp":"NFPA 72-2022 §10.3.3 requires devices powered from the IDC or SLC to be listed for use with that control unit; this is the compatibility of 2-wire detectors. After the replacement, reacceptance testing (§14.4.2) requires the device to be functionally tested. Per A.14.4.2, replacing a detector with a like detector does not require testing 10 percent of the other devices."},{"id":"repair-012","task":"1.2.2","type":"single","diff":2,"q":{"en":"A wall-mounted horn/strobe in a corridor is damaged. The original was set to 75 cd, and all strobes on the NAC are synchronized by the panel's NAC sync protocol. Which replacement practice is correct?"},"opts":[{"en":"Set the new strobe to the highest candela available, to be safe"},{"en":"Use any listed strobe; synchronization is required only in rooms with more than 10 strobes"},{"en":"Set the new strobe to the candela shown on the design documents (75 cd here) and use an appliance compatible with the sync protocol on that NAC"},{"en":"Set it to 15 cd to reduce NAC current, since corridors do not need visible signaling"}],"ans":[2],"ref":"NFPA 72-2022 Ch. 18 (§18.5, visible appliances)","exp":"A replacement must follow the design: the candela on the drawings (75 cd here) and an appliance compatible with the synchronization protocol of the NAC or power supply. Raising the candela increases current and can invalidate the voltage drop and battery calculations; lowering it leaves the space without the required intensity. NFPA 72-2022 Ch. 18 requires that, where more than two visible appliances are in the same field of view, they flash in synchronization."},{"id":"repair-013","task":"1.2.2","type":"single","diff":1,"q":{"en":"After a technician replaces an addressable smoke detector, the FACU shows a 'duplicate address' trouble for address 045 and a 'no answer' trouble for address 112, which is the location of the replaced detector. What is the most likely cause?"},"opts":[{"en":"The new detector's address was set to 045 instead of 112"},{"en":"The SLC has a ground fault near address 045"},{"en":"The detector at address 112 is dirty and needs cleaning"},{"en":"The EOL resistor on the SLC is missing"}],"ans":[0],"ref":"Manufacturer's instructions; Bukowski, addressable systems","exp":"In an addressable system, each device must have a unique address that matches the programming. If the replacement is set to an address already in use (045), the panel sees two devices answering at that address and, at the same time, nothing answering at 112. The fix is to give the replacement the original address (112), with its switches or the programmer, and verify that the panel recognizes it."},{"id":"repair-014","task":"1.2.2","type":"single","diff":3,"q":{"en":"An addressable photoelectric detector failed. Having no photoelectric detector on the truck, the technician installs an addressable heat detector at the same address. The FACU now reports a 'wrong device type' trouble. What is the correct course of action?"},"opts":[{"en":"Edit the panel program on site to accept a heat detector at that address and leave"},{"en":"Install a listed photoelectric detector of the type programmed for that point; changing the device type is a design and site-specific software change that requires approval and reacceptance testing"},{"en":"Disable the point and leave the heat detector in place until the next annual inspection"},{"en":"Swap addresses with another heat detector in the building so the types match"}],"ans":[1],"ref":"NFPA 72-2022 §14.4.2.4","exp":"The replacement must be the same type, or one listed and approved as equivalent. Swapping a smoke detector for a heat detector changes the design and the programming. Per NFPA 72-2022 §14.4.2.4, a site-specific software change requires 100 percent testing of the affected functions plus 10 percent of the unaffected initiating devices (maximum 50). Leaving a point disabled without notification is an unmanaged impairment."},{"id":"repair-015","task":"1.2.2","type":"single","diff":1,"q":{"en":"Smoke detectors were installed with dust covers during drywall work and were not used for protection during construction. Before the system is placed in service, what must happen?"},"opts":[{"en":"Leave the covers on until the first annual inspection"},{"en":"Remove the dust covers; any detector exposed to construction dust must be cleaned and verified within its listed sensitivity, or replaced"},{"en":"Remove only the covers on detectors near exits"},{"en":"Increase the sensitivity setting of each detector to compensate for dust"}],"ans":[1],"ref":"NFPA 72-2022 §17.7.1 (protection during construction)","exp":"NFPA 72-2022 §17.7.1 (protection during construction) requires detectors to be protected from construction dust per the manufacturer's instructions and, before final commissioning, verified to operate within their listed sensitivity or replaced. A forgotten dust cover leaves the detector blind, so removing the covers is part of returning the system to service."},{"id":"repair-016","task":"1.2.2","type":"single","diff":1,"q":{"en":"A fuse in the FACU has blown. The label next to the fuse holder reads '3 A, 250 V, slow-blow.' Which replacement is correct?"},"opts":[{"en":"A 3 A, 250 V slow-blow fuse, then verify operation of the circuits served by that fuse"},{"en":"A 5 A slow-blow fuse, so it will not blow again"},{"en":"Any 3 A fuse, fast-acting or slow-blow"},{"en":"A wire jumper until the correct fuse arrives"}],"ans":[0],"ref":"NFPA 72-2022 Table 14.4.3.2 (item 2) and A.14.4.2","exp":"A fuse is replaced with one of the same rating and type specified by the manufacturer. NFPA 72-2022 Table 14.4.3.2 (item 2, control unit) calls for verifying fuse rating and supervision, and A.14.4.2 explains that when a fuse is replaced with a like fuse, verifying the circuits it serves is a sufficient reacceptance test. A larger fuse or a jumper removes the protection; find out why it blew before replacing it."},{"id":"repair-017","task":"1.2.2","type":"single","diff":2,"q":{"en":"During the semiannual test of a 24 V system (two 12 V VRLA batteries), one battery measures 12.9 V while fully charged and connected to the charger. What should the technician do?"},"opts":[{"en":"Nothing; 12.9 V is normal for a 12 V battery"},{"en":"Replace both batteries with any batteries that fit the cabinet"},{"en":"Replace the failed battery with one of the same type, voltage, and Ah capacity required by the battery calculation, marked with its month and year of manufacture"},{"en":"Raise the charger output voltage until the battery reads 13.8 V"}],"ans":[2],"ref":"NFPA 72-2022 Table 14.4.3.2 (item 9) and §10.6.10","exp":"NFPA 72-2022 Table 14.4.3.2 (item 9, VRLA batteries) calls for replacing the battery when a cell or unit measures less than 13.26 V while charged and connected to the charger. The replacement must be the same type and have the Ah capacity required by the battery calculation, and batteries must be marked with the month and year of manufacture (§10.6.10). Adjusting the charger to hide a failed battery is not a correction."},{"id":"repair-018","task":"1.2.2","type":"single","diff":2,"freq":true,"q":{"en":"During a renovation, a technician removes (deletes) one smoke detector from the middle of a conventional IDC and splices the circuit through. Per NFPA 72-2022 reacceptance testing, what must be done for this deletion?"},"opts":[{"en":"Operate another device on the same circuit"},{"en":"Test 10 percent of all initiating devices in the building, up to 50 devices"},{"en":"Nothing; testing is required only when a device is added"},{"en":"Perform a complete 100 percent acceptance test of the entire system"}],"ans":[0],"ref":"NFPA 72-2022 §14.4.2","exp":"Per 14.4.2, when an initiating device, notification appliance, or control relay is deleted, another device, appliance, or control relay on the circuit must be operated; this proves the circuit is still intact after the splice. When a device is added, the new device itself is functionally tested. The 10 percent (maximum 50) rule is for site-specific software changes."},{"id":"repair-019","task":"1.2.2","type":"single","diff":1,"freq":true,"q":{"en":"At the end of a service visit, a technician finds a smoke detector mounted too close to an HVAC supply diffuser. It passes its functional test, but the airflow can keep smoke from reaching it; the rest of the system is in service. Under NFPA 72-2022, this condition is best classified as:"},"opts":[{"en":"An impairment, because the system is out of order"},{"en":"A deficiency, which must be corrected; if it is not corrected by the end of the visit, the owner must be informed in writing within 24 hours"},{"en":"An observation, which the owner is not required to address"},{"en":"Not a code issue, because the detector passed its functional test"}],"ans":[1],"ref":"NFPA 72-2022 Ch. 3 (definitions); §14.2.2","exp":"A deficiency is a condition that affects the service or reliability for which the equipment was intended: a detector in the direct airflow of a diffuser may not see smoke in time, but the system is not out of order, so it is not an impairment. It is also more than an observation, which is only a suggested improvement. Per 14.2.2, deficiencies must be corrected, and if one is not corrected at the end of the visit, the owner is informed in writing within 24 hours."},{"id":"repair-020","task":"1.2.2","type":"single","diff":2,"freq":true,"q":{"en":"According to NFPA 72-2022, the service provider must report to the AHJ any fire alarm system that is out of service for more than:"},"opts":[{"en":"24 hours"},{"en":"4 hours"},{"en":"12 hours"},{"en":"8 hours"}],"ans":[3],"ref":"NFPA 72-2022 §10.21","exp":"Per NFPA 72-2022 §10.21 (impairments), the service provider reports to the AHJ any system that is out of service for more than 8 hours. The owner must be notified of the impairment and of when it ends, and keeps the record for 1 year. Trap: the 4-hours-in-24 rule that requires a fire watch or evacuation comes from NFPA 101 and the IFC, not NFPA 72; the local AHJ may enforce both."},{"id":"repair-021","task":"1.2.2","type":"multi","select":2,"diff":2,"q":{"en":"Before placing a monitored system in test and disabling the detectors on one floor for several hours while a contractor sands drywall, which TWO parties must the technician notify? (Select TWO.)"},"opts":[{"en":"NICET"},{"en":"The FACU manufacturer"},{"en":"The supervising station that receives the system's signals"},{"en":"The local electric utility"},{"en":"The system owner or the owner's designated representative"}],"ans":[2,4],"ref":"NFPA 72-2022 §10.21 and §14.2.4","exp":"Disabling part of the system is an impairment: NFPA 72-2022 §10.21 requires notifying the owner or the owner's designated representative, and the AHJ if the impairment lasts more than 8 h. In addition, per §14.2.4, those who receive alarm, supervisory, or trouble signals (the supervising station) must be told before testing to prevent an unnecessary response, and again when the work is finished."},{"id":"repair-022","task":"1.2.2","type":"single","diff":1,"q":{"en":"A technician disabled several duct smoke detectors while HVAC filters were changed. The work is finished. What should the technician do before leaving the site?"},"opts":[{"en":"Leave the points disabled overnight in case the HVAC contractor returns"},{"en":"Silence the trouble buzzer and leave a note on the panel"},{"en":"Reset the panel; a reset automatically re-enables all disabled points"},{"en":"Re-enable every disabled point, confirm the FACU shows no disabled or trouble conditions, notify those previously notified that the work is complete, and document it"}],"ans":[3],"ref":"NFPA 72-2022 §10.21, §14.2.4 and A.14.4.3.2","exp":"A disabled point is an impairment. When the work is done, re-enable every point, verify that the FACU is in its normal state (no 'disabled' or trouble indications), and notify those previously notified that the work is complete (NFPA 72-2022 §14.2.4 and §10.21). The annex to Table 14.4.3.2 also stresses verifying and documenting that every disabled device was restored. On most panels a reset does NOT re-enable disabled points."},{"id":"repair-023","task":"1.2.2","type":"single","diff":1,"q":{"en":"At the FACU, which function turns off the activated notification appliances while the system remains in the alarm state and the initiating device stays latched?"},"opts":[{"en":"Acknowledge"},{"en":"System reset"},{"en":"Alarm silence"},{"en":"Lamp test"}],"ans":[2],"ref":"NFPA 72-2022 Ch. 10 (notification appliance deactivation); manufacturer's manual","exp":"Acknowledge only confirms the event and silences the panel's local buzzer. Alarm silence turns off the notification appliances while the system stays in alarm. Reset returns the system to normal only if the initiating devices have already restored. Per NFPA 72-2022 Ch. 10, a subsequent alarm from another initiating device must reactivate silenced notification appliances."},{"id":"repair-024","task":"1.2.2","type":"single","diff":2,"q":{"en":"After an electrician worked in a ceiling junction box, the FACU shows 'no answer' troubles for the last 14 addressable devices on a Class B SLC, while all devices between the panel and that junction box report normally. What is the most likely cause?"},"opts":[{"en":"An open in the SLC at or near the junction box"},{"en":"A ground fault on the SLC near the panel"},{"en":"Duplicate addresses on the 14 devices"},{"en":"Dirty detectors that need cleaning"}],"ans":[0],"ref":"NFPA 72-2022 §12.3.2","exp":"On a Class B SLC, an open leaves every device beyond the fault without communication (NFPA 72-2022 §12.3.2), which matches what is observed. A ground fault does not disconnect devices, and duplicate addresses or dirty detectors would affect isolated points. Check the splices in that junction box; the event history, with the time of the first 'no answer', helps confirm it."},{"id":"repair-025","task":"1.2.2","type":"single","diff":2,"q":{"en":"A technician replaces a failed NAC output board inside the FACU with an identical board; no programming is changed. Per the NFPA 72-2022 reacceptance requirements for repairs to control equipment hardware, what must be tested?"},"opts":[{"en":"10 percent of all initiating devices, up to a maximum of 50"},{"en":"Nothing, because the board is identical and the program did not change"},{"en":"The control equipment per Table 14.4.3.2, item 2: its functions and its lamps and LEDs"},{"en":"A full 100 percent acceptance test of every device in the building"}],"ans":[2],"ref":"NFPA 72-2022 §14.4.2.3; Table 14.4.3.2, item 2","exp":"Per 14.4.2.3, when control equipment hardware is modified or repaired, the control equipment is tested per Table 14.4.3.2, item 2: its functions and its lamps and LEDs. For a NAC board, that means operating the NACs it serves and checking their indications at the panel. The 10 percent (maximum 50) rule is for site-specific software changes, and a full acceptance test is not required."},{"id":"repair-026","task":"1.2.2","type":"single","diff":2,"q":{"en":"The FACU shows an 'AC power failure' trouble and is running on batteries. The technician goes to the electrical panel to check the FACU branch circuit. According to NFPA 72 and NEC Article 760, how must that branch-circuit disconnecting means be identified?"},"opts":[{"en":"With a red marking, accessible only to authorized/qualified personnel, and identified as 'FIRE ALARM CIRCUIT'"},{"en":"With a yellow label reading 'EMERGENCY' and protected by a GFCI breaker"},{"en":"No marking is required if the breaker is in a locked room"},{"en":"With a green label, and shared with the exit-sign circuit"}],"ans":[0],"ref":"NFPA 72-2022 §10.6.5; NEC 2020 760.41(B) and 760.121(B)","exp":"NFPA 72-2022 §10.6.5 and NEC 2020 760.41(B) and 760.121(B) require a dedicated branch circuit. Its disconnecting means must have a red marking, be accessible only to authorized personnel, and be identified as 'FIRE ALARM CIRCUIT', and its location must be permanently identified at the FACU. The NEC prohibits supplying this branch circuit through GFCI or AFCI devices."},{"id":"repair-027","task":"1.2.2","type":"single","diff":1,"q":{"en":"An addressable photoelectric detector in a dusty warehouse reports a 'maintenance alert/dirty' trouble. It is not in alarm. What is the proper corrective action?"},"opts":[{"en":"Ignore it until the detector produces an alarm"},{"en":"Adjust the detector's sensitivity outside its listed range so it stops reporting"},{"en":"Replace it with an ionization detector, which is not affected by dust"},{"en":"Clean it per the manufacturer's instructions and verify its sensitivity is within the listed range; replace it if it cannot be brought into range"}],"ans":[3],"ref":"NFPA 72-2022 §14.4.4.3 and §14.5","exp":"A maintenance alert means drift compensation has reached its limit because of dirt. NFPA 72-2022 §14.5 requires maintenance per the manufacturer, and §14.4.4.3 says a detector with sensitivity outside its listed and marked range must be cleaned and recalibrated, or replaced. Afterward, test the detector with smoke or a listed aerosol."},{"id":"repair-028","task":"1.2.2","type":"single","diff":1,"freq":true,"q":{"en":"Based on fire-signature principles described by Bukowski, which detector type generally responds faster to a slow, smoldering fire that produces large, visible smoke particles?"},"opts":[{"en":"Ionization smoke detector"},{"en":"Fixed-temperature heat detector"},{"en":"Ultraviolet (UV) flame detector"},{"en":"Photoelectric (light-scattering) smoke detector"}],"ans":[3],"ref":"Bukowski, Fire Alarm Signaling Systems (4th ed.), fire signatures; NFPA 72-2022 Ch. 17","exp":"Photoelectric light-scattering detectors respond better to the large, visible particles of smoldering fires. Ionization detectors measure the reduction of ion current in a chamber with a small radioactive source and respond better to the small, invisible particles of fast flaming fires. Heat and flame detectors need a developed fire or visible flame (Bukowski; NFPA 72 Ch. 17)."},{"id":"repair-029","task":"1.2.2","type":"single","diff":2,"q":{"en":"Which heat detector type is designed to respond when the air surrounding the device reaches a predetermined temperature, regardless of the rate of temperature rise, by compensating for thermal lag?"},"opts":[{"en":"Rate-of-rise detector"},{"en":"Fixed-temperature detector with a fusible element"},{"en":"Rate-compensated detector"},{"en":"Pneumatic line-type rate-of-rise detector"}],"ans":[2],"ref":"NFPA 72-2022 Ch. 3 (heat detector definitions); Bukowski","exp":"A rate-compensated detector responds when the air around it reaches its set point, regardless of how fast the temperature rises, which eliminates thermal lag. A fixed-temperature detector responds when its element reaches the set point; by then, because of thermal lag, the air is already hotter. A rate-of-rise detector responds when the temperature rises faster than a preset rate (NFPA 72-2022 Ch. 3 heat detector definitions; Bukowski)."},{"id":"repair-030","task":"1.2.2","type":"single","diff":3,"q":{"en":"A projected-beam smoke detector mounted on the steel walls of a warehouse goes into trouble on hot afternoons and restores at night. The beam path is clear. What is the most likely cause and correction?"},"opts":[{"en":"Building movement from thermal expansion is misaligning the beam; realign it and make sure the transmitter and receiver are firmly mounted to stable surfaces"},{"en":"Sunlight is producing smoke particles; replace the detector with an ionization type"},{"en":"The detector is reporting a real fire signature; increase its sensitivity"},{"en":"The SLC has an intermittent ground fault that only appears at night"}],"ans":[0],"ref":"NFPA 72-2022 §17.7.3.7 and Table 14.4.3.2 (item 17)","exp":"Projected beam detectors work by light obscuration and need precise alignment; thermal expansion or structural movement misaligns them and causes troubles (or false alarms). NFPA 72-2022 §17.7.3.7 requires them to be mounted on stable surfaces to prevent erratic operation due to movement. Realign per the manufacturer and, if needed, relocate to rigid structure; then test with a filter or smoke per Table 14.4.3.2."},{"id":"repair-031","task":"1.2.2","type":"single","diff":2,"q":{"en":"An air-sampling (aspirating) smoke detection system reports a 'low airflow' trouble shortly after the protected space was repainted. What is the most likely cause?"},"opts":[{"en":"A broken or disconnected sampling pipe"},{"en":"Sampling holes or the filter clogged (for example, by paint overspray or dust)"},{"en":"A missing end cap on the pipe run"},{"en":"A fire signature in the protected area"}],"ans":[1],"ref":"NFPA 72-2022 §17.7.3.6 and Table 14.4.3.2 (item 17)","exp":"An aspirating detector supervises the airflow through its pipe network: low flow usually means clogged sampling holes or filter, and high flow means a broken or disconnected pipe or a missing end cap. Correct the cause and test per the manufacturer; Table 14.4.3.2 (item 17) calls for testing from the end sampling port of each pipe run and verifying airflow through all other ports. NFPA 72-2022 §17.7.3.6 limits transport time from the farthest sampling point to 120 seconds."},{"id":"repair-032","task":"1.2.2","type":"multi","select":2,"diff":2,"q":{"en":"A photoelectric detector mounted near an HVAC supply diffuser in a dusty area causes repeated nuisance alarms. Which TWO corrective actions are appropriate? (Select TWO.)"},"opts":[{"en":"Leave a dust cover on the detector permanently"},{"en":"Clean the detector per the manufacturer's instructions and verify its sensitivity"},{"en":"Disable the point until the dusty season ends"},{"en":"Set the detector's sensitivity outside its listed range"},{"en":"Relocate the detector out of the direct airflow of the diffuser, keeping the required spacing, with approval of the designer/AHJ"}],"ans":[1,4],"ref":"NFPA 72-2022 §14.5, §17.7.1.8 and §17.7.4","exp":"Nuisance alarms are corrected by removing the cause: first, cleaning or replacement per the manufacturer (NFPA 72-2022 §14.5); second, a proper location out of direct airflow (§17.7.4). Per §17.7.1.8, where air velocity exceeds 300 ft/min, a detector listed for that condition is required. Covering the detector, disabling it, or setting it outside its listed range leaves the area unprotected."},{"id":"repair-033","task":"1.2.1","type":"single","diff":2,"freq":true,"q":{"en":"Addressable smoke detectors were installed and accepted in March 2025. Their first sensitivity test was performed in February 2026, and all were within their listed and marked range. Unless the interval has been extended, in what year is the next sensitivity test required?"},"opts":[{"en":"2027"},{"en":"2031"},{"en":"2028"},{"en":"2030"}],"ans":[2],"ref":"NFPA 72-2022 §14.4.4.3","exp":"Per 14.4.4.3, sensitivity is checked within 1 year after installation and every alternate year after that: first test 2026, next test 2028. Only after the second required calibration test (2028), if the detectors stayed in range, may the interval be extended, to a maximum of 5 years. 2027 treats the test as annual, and 2030 or 2031 apply an extension too early."},{"id":"repair-034","task":"1.2.1","type":"single","diff":3,"q":{"en":"A system has 350 initiating devices. A site-specific software change directly affects the programming of 30 of them. According to NFPA 72-2022, what is the minimum number of initiating devices that must be tested?"},"opts":[{"en":"30"},{"en":"65"},{"en":"80"},{"en":"62"}],"ans":[3],"ref":"NFPA 72-2022 §14.4.2.4","exp":"Per 14.4.2.4, the 30 affected devices are tested 100 percent, plus 10 percent of the devices not directly affected, up to a maximum of 50. There are 320 unaffected devices; 10 percent is 32, which is under the cap, so the total is 30 + 32 = 62. The 65 wrongly takes 10 percent of all 350, and the 80 applies the 50-device cap even though it was not reached."},{"id":"repair-035","task":"1.2.1","type":"single","diff":2,"q":{"en":"A control unit has a listed automated self-test feature that tests its detectors by a means equivalent to Table 14.4.3.2, at least as often as Chapter 14 requires. Per NFPA 72-2022, what must happen when a device fails an automated test?"},"opts":[{"en":"An audible and visual trouble signal must result"},{"en":"An alarm signal must be transmitted and the building evacuated"},{"en":"The failure is only stored in the event log until the next annual inspection"},{"en":"The panel must automatically notify the AHJ"}],"ans":[0],"ref":"NFPA 72-2022 §14.2 (Automated Testing)","exp":"Chapter 14 (14.2, Automated Testing) permits automated testing arrangements that provide means of testing equivalent to Table 14.4.3.2, at a frequency at least equal to Chapter 14, to satisfy the testing requirements. Failure of a device under automated test must result in an audible and visual trouble signal, which is then handled like any other trouble: investigate, correct, and report any uncorrected deficiency."},{"id":"repair-036","task":"1.2.1","type":"single","diff":2,"q":{"en":"During acceptance testing of a newly installed NAC with 40 notification appliances, NFPA 72-2022 requires confirming that a fault produces a trouble indication by opening one connection at a minimum of how many appliances on that circuit?"},"opts":[{"en":"1"},{"en":"4"},{"en":"10"},{"en":"20"}],"ans":[1],"ref":"NFPA 72-2022 Table 14.4.3.2 (item 15)","exp":"NFPA 72-2022 Table 14.4.3.2 (item 15, circuit integrity) says that for initial and reacceptance tests, a connection is opened at not less than 10 percent of the initiating devices, notification appliances, and controlled devices on every IDC, NAC, and SLC, and the trouble indication is confirmed. 10 percent of 40 is 4."},{"id":"repair-037","task":"1.2.1","type":"single","diff":2,"q":{"en":"Fifteen years after installation, an owner sends 2 of every 100 nonrestorable fixed-temperature spot-type heat detectors to a laboratory instead of replacing them all. One of the sample detectors fails the laboratory test. Per NFPA 72-2022, what is required next?"},"opts":[{"en":"Replace only the failed detector and retest the sample in 5 years"},{"en":"Nothing further; one failure in the sample is acceptable"},{"en":"Remove and test additional detectors to determine whether there is a general problem with the detectors or a localized problem with one or two defective units"},{"en":"Heat test all remaining detectors in the field with a heat gun"}],"ans":[2],"ref":"NFPA 72-2022 Table 14.4.3.2 (item 17)","exp":"Table 14.4.3.2 (item 17, heat detectors) says that if a failure occurs on any of the detectors removed, additional detectors are removed and tested to determine whether there is a general problem involving faulty detectors or a localized problem involving one or two defective detectors. The detectors removed are always replaced with new ones, and if the owner keeps testing instead of replacing, the tests repeat every 5 years. A field heat test would destroy nonrestorable detectors."},{"id":"repair-038","task":"1.1.2","type":"single","diff":2,"q":{"en":"A damaged section of FPLR (riser) power-limited fire alarm cable in a vertical shaft must be replaced. The only cable available is FPLP (plenum). According to NEC 2020, may FPLP be used?"},"opts":[{"en":"No; only the exact same cable type may be used"},{"en":"Only if the FPLP is installed in rigid metal conduit"},{"en":"No; but FPL may be used instead"},{"en":"Yes; FPLP is permitted as a substitute for FPLR"}],"ans":[3],"ref":"NEC 2020 760.154","exp":"NEC 2020 760.154 (PLFA cable substitutions) permits a higher-rated cable to replace a lower-rated one: FPLP may substitute for FPLR and FPL, and FPLR may substitute for FPL. The reverse is not permitted: FPL cannot be used where FPLR is required. Also respect the conductor size and type required by the panel manufacturer."},{"id":"repair-039","task":"1.1.2","type":"single","diff":3,"q":{"en":"A technician is replacing a fire-damaged section of a Class A SLC. To save time, they want to run the outgoing and return conductors in the same cable for the entire 300 ft (91 m) replacement run. According to NFPA 72-2022, is this permitted?"},"opts":[{"en":"Yes, as long as the conductors are different colors"},{"en":"Yes, if the cable is installed in metal conduit"},{"en":"No; outgoing and return conductors must be routed separately, except in limited cases such as up to 10 ft (3.0 m) where they enter or exit a device or control unit enclosure"},{"en":"No; Class A conductors may never share a cable or raceway anywhere"}],"ans":[2],"ref":"NFPA 72-2022 §12.3.8","exp":"NFPA 72-2022 §12.3.8 requires the outgoing and return conductors of Class A circuits (and Class N and X) to be routed separately so that a single damage event cannot cut both. Limited exceptions: up to 10 ft (3.0 m) where they enter or exit device, appliance, or control unit enclosures; single drops to individual devices; and a single room of up to 1000 ft² (93 m²). A 300 ft run in one cable removes the redundancy."},{"id":"repair-040","task":"1.1.2","type":"single","diff":1,"q":{"en":"While repairing a damaged circuit, a technician installs a new junction box containing fire alarm splices above a ceiling shared with other low-voltage systems. According to NEC 2020, what is required?"},"opts":[{"en":"The fire alarm circuits must be identified at terminal and junction locations to help prevent unintentional signals during testing and servicing of other systems"},{"en":"Fire alarm splices are not permitted in junction boxes"},{"en":"The box must be painted yellow"},{"en":"No identification is needed for power-limited circuits"}],"ans":[0],"ref":"NEC 2020 760.30","exp":"NEC 2020 760.30 requires fire alarm circuits to be identified at terminal and junction locations, so that other technicians do not cause unwanted signals while testing or servicing other systems. In practice, red boxes or covers or 'FIRE ALARM' labels are used. Use listed splicing devices and keep the box accessible."}]},{"topic":{"id":"safety","title":"Job Site Safety: OSHA 1910/1926 and First Aid","short":"Safety","tasks":["1.1.3"],"refs":["29 CFR 1926 (Subparts E, F, K, L, M, P, X, Z, AA)","29 CFR 1910 (1910.23, 1910.28, 1910.95, 1910.134, 1910.137, 1910.146, 1910.147, 1910.333, 1910.1200)","29 CFR 1904 (recordkeeping and reporting)","American Red Cross First Aid/CPR/AED"],"guide":"\n<h3>What NICET expects at Level I</h3>\n<p>Task 1.1.3 (<em>Comply with job site safety requirements</em>) belongs to the Installation domain (44–54% of the exam). Its references — OSHA 29 CFR 1910, OSHA 29 CFR 1926, and the American Red Cross First Aid/CPR/AED Participant's Manual — are <strong>study-only: they are not allowed in the test center</strong>. You will have only the printed NFPA 72, NFPA 70, and Ugly's, so this page is a <strong>memorization sheet</strong>. The questions are practical: ladders over drop ceilings, drilling concrete overhead, working near energized panelboards, elevator machine rooms, and hot attics.</p>\n<p><strong>1926 or 1910?</strong> Part 1926 (construction) applies to new installation, renovation, and alterations. Part 1910 (general industry) applies to maintenance, inspection, and testing in existing buildings. If the question says <em>construction site</em>, think 1926; if it says <em>annual testing in an occupied building</em>, think 1910.</p>\n\n<h3>Portable ladders (1926 Subpart X; 1910.23)</h3>\n<table>\n<thead><tr><th>Rule</th><th>Number</th><th>Section</th></tr></thead>\n<tbody>\n<tr><td>Side rails above the upper landing surface</td><td>≥ 3 ft (0.9 m)</td><td>1926.1053(b)(1); 1910.23(c)(11)</td></tr>\n<tr><td>Angle (non-self-supporting ladder)</td><td>1:4 — base out ¼ of the working length (≈ 75°)</td><td>1926.1053(b)(5)(i)</td></tr>\n<tr><td>Strength</td><td>4 × the maximum intended load (extra-heavy-duty Type IA metal/plastic: 3.3 ×)</td><td>1926.1053(a)(1)</td></tr>\n<tr><td>Rung spacing</td><td>10–14 in.</td><td>1926.1053(a)(3)(i)</td></tr>\n<tr><td>Break in elevation that requires a stairway or ladder</td><td>≥ 19 in.</td><td>1926.1051(a)</td></tr>\n<tr><td>ANSI duty rating (person + tools + material)</td><td>IAA 375 · IA 300 · I 250 · II 225 · III 200 lb</td><td>ANSI A14 / ladder label</td></tr>\n</tbody>\n</table>\n<ul>\n<li>Never stand on the <strong>top cap or the top step</strong> of a stepladder, and never climb the rear cross-bracing (1926.1053(b)(13)–(14)).</li>\n<li><strong>Nonconductive</strong> (fiberglass) side rails where the worker or the ladder could contact exposed energized parts ((b)(12)).</li>\n<li>Face the ladder and hold on with at least one hand; good practice: <strong>three points of contact</strong>. Do not carry objects that could cause loss of balance; do not move or extend an occupied ladder.</li>\n<li>Inspect before initial use in each work shift (1910.23(b)(9)); on construction sites a competent person inspects ladders periodically. If defective: tag <em>Do Not Use</em> and remove from service ((b)(16)).</li>\n</ul>\n\n<h3>Falls, scaffolds, and lifts</h3>\n<table>\n<thead><tr><th>Rule</th><th>Number</th><th>Section</th></tr></thead>\n<tbody>\n<tr><td>Trigger in construction (edges, holes)</td><td>6 ft</td><td>1926.501(b)(1)</td></tr>\n<tr><td>Trigger in general industry</td><td>4 ft</td><td>1910.28(b)(1)</td></tr>\n<tr><td>Trigger on scaffolds</td><td>more than 10 ft</td><td>1926.451(g)(1)</td></tr>\n<tr><td>Guardrail (Subpart M)</td><td>42 in. ± 3 in.; top rail 200 lb; midrail 150 lb; not below 39 in. under load</td><td>1926.502(b)</td></tr>\n<tr><td>Scaffold guardrail (placed in service after 1/1/2000)</td><td>38–45 in.</td><td>1926.451(g)(4)(ii)</td></tr>\n<tr><td>Scaffold capacity</td><td>its own weight + 4 × the intended load</td><td>1926.451(a)(1)</td></tr>\n<tr><td>Scaffold access (never by the cross braces)</td><td>platform more than 2 ft above/below the access point</td><td>1926.451(e)(1)</td></tr>\n<tr><td>Platform</td><td>width ≥ 18 in.; ≤ 14 in. from the work face; toeboard ≥ 3.5 in.</td><td>1926.451(b), (h)</td></tr>\n<tr><td>Fall arrest anchorage</td><td>5,000 lb per person</td><td>1926.502(d)(15)</td></tr>\n<tr><td>Free fall / deceleration / maximum force</td><td>≤ 6 ft / ≤ 3.5 ft / ≤ 1,800 lb with a harness</td><td>1926.502(d)(16)</td></tr>\n<tr><td>Hole covers</td><td>2 × the load; secured; marked HOLE or COVER</td><td>1926.502(i)</td></tr>\n</tbody>\n</table>\n<ul>\n<li>Scaffolds: a competent person inspects before each shift; a height-to-base ratio over 4:1 requires restraint; no ladders on the platform; casters of mobile scaffolds locked.</li>\n<li><strong>Scissor lift</strong> = mobile supported scaffold: the guardrails are the primary protection; never stand on them.</li>\n<li><strong>Articulating or telescoping boom lift (1926.453)</strong>: test the controls daily; full-body harness with the lanyard attached to the boom or basket; never tie off to adjacent structure; feet always on the basket floor. Body belts are not acceptable for fall arrest.</li>\n<li>Equipment that has arrested a fall is removed from service until a competent person approves it.</li>\n</ul>\n\n<h3>Electrical safety</h3>\n<p>Lockout/tagout sequence (1910.147(d); 1910.333(b)(2)):</p>\n<ol>\n<li>Prepare: identify every energy source.</li>\n<li>Shut the equipment down.</li>\n<li>Isolate: open the breaker or disconnect.</li>\n<li>Apply lock and tag: <strong>each worker applies his or her own</strong>; only the person who applied it removes it.</li>\n<li>Relieve stored energy.</li>\n<li><strong>Verify</strong> zero energy before touching anything.</li>\n</ol>\n<ul>\n<li>A fire alarm panel has <strong>two sources</strong>: the 120-V branch circuit and the batteries. Disconnect both.</li>\n<li>Test for absence of voltage with a properly rated tester: <em>live-dead-live</em> (NFPA 70E, general awareness only). Only qualified persons work on parts that have not been de-energized (1910.333(c)(2)).</li>\n<li>Remove rings, watches, and metal chains near energized parts (1910.333(c)(8)).</li>\n<li>On construction sites: GFCI on every 120-V, single-phase, 15- and 20-A receptacle that is not part of the permanent wiring, or an assured equipment grounding conductor program (AEGCP): daily visual inspection and tests every ≤ 3 months (1926.404(b)(1)). NEC 2020 Art. 590 (temporary installations), which you do have in the printed NEC, also requires GFCI protection.</li>\n<li>Extension cords: three-wire, hard or extra-hard usage; no splices or taps; never through holes in walls or ceilings, and never as a substitute for fixed wiring (1926.405).</li>\n<li>Rubber insulating gloves: Class 00 = 500 V ac, Class 0 = 1,000 V ac; inspect and air test before each use; electrical test every 6 months (1910.137).</li>\n</ul>\n\n<h3>PPE and health hazards</h3>\n<table>\n<thead><tr><th>Topic</th><th>Key fact</th><th>Section</th></tr></thead>\n<tbody>\n<tr><td>Noise</td><td>action level 85 dBA; PEL 90 dBA (8 h), 95 (4 h), 100 (2 h), 105 (1 h), 115 (¼ h)</td><td>1910.95, Table G-16</td></tr>\n<tr><td>Eyes</td><td>ANSI Z87.1 with side protection</td><td>1926.102</td></tr>\n<tr><td>Hard hat</td><td>ANSI Z89.1 (Class E 20,000 V; G 2,200 V; C no electrical protection)</td><td>1926.100</td></tr>\n<tr><td>Required respirator</td><td>medical evaluation, fit test before use and every year, no facial hair at the seal</td><td>1910.134</td></tr>\n<tr><td>Silica (handheld drill)</td><td>PEL 50 µg/m³; shroud with dust collection (filter ≥ 99%) and HEPA vacuum; no respirator</td><td>1926.1153, Table 1</td></tr>\n<tr><td>Asbestos</td><td>PACM: thermal system insulation and surfacing material in buildings built in 1980 or earlier</td><td>1926.1101</td></tr>\n<tr><td>Lead</td><td>PEL 50 µg/m³; action level 30 µg/m³</td><td>1926.62</td></tr>\n<tr><td>Safety Data Sheet (SDS)</td><td>16 sections: 2 hazards, 4 first aid, 7 handling, 8 PPE</td><td>1910.1200(g)</td></tr>\n<tr><td>GHS label</td><td>product identifier, signal word (Danger &gt; Warning), hazard statements, pictograms, precautionary statements, manufacturer</td><td>1910.1200(f)</td></tr>\n</tbody>\n</table>\n<p>For suspected asbestos (pipe insulation, fireproofing): <strong>stop, do not touch it, and report it</strong>. With silica: no dry sweeping and no blowing with compressed air.</p>\n\n<h3>Other job site hazards</h3>\n<ul>\n<li>Permit-required confined space: hazardous atmosphere if O₂ &lt; 19.5% or &gt; 23.5%, or flammables &gt; 10% of the LFL; test O₂ first, then flammables, then toxics. The attendant stays outside and summons rescue (1910.146; 1926 Subpart AA).</li>\n<li>Excavations: protective system from 5 ft deep; egress at 4 ft deep or more, within 25 ft of lateral travel; spoil at least 2 ft from the edge (1926.651–.652).</li>\n<li>Tools: guards in place (1926.300(b)); compressed air for cleaning below 30 psi; powder-actuated tools only with training on that tool, tested each day, and never into hard or brittle materials (1926.302).</li>\n<li>Fire extinguishers on construction sites: one 2A per 3,000 ft², travel ≤ 100 ft (1926.150). Classes: A ordinary combustibles, B flammable liquids, C energized equipment, D metals, K cooking oils. PASS technique.</li>\n</ul>\n\n<h3>Rights, responsibilities, and records</h3>\n<ul>\n<li>Employer: a workplace free of recognized hazards (General Duty Clause, Sec. 5(a)(1)), comply with standards, train, and provide most PPE at no cost. Employee: comply with the standards (Sec. 5(b)).</li>\n<li>Reporting hazards is a right; a retaliation complaint (Sec. 11(c)) must be filed within 30 days.</li>\n<li>OSHA 300 log: record within 7 calendar days; the 300A is posted February 1 to April 30; records kept 5 years. First aid cases are not recorded.</li>\n<li>Report to OSHA: a fatality within 8 h; an in-patient hospitalization, amputation, or loss of an eye within 24 h (1904.39).</li>\n</ul>\n\n<h3>First aid, CPR, and AED (Red Cross)</h3>\n<table>\n<thead><tr><th>Situation</th><th>What to do</th></tr></thead>\n<tbody>\n<tr><td>Emergency action steps</td><td>Check (scene safe; responsiveness and breathing ≤ 10 s) → Call (911, AED) → Care</td></tr>\n<tr><td>Adult CPR</td><td>100–120/min; ≥ 2 in.; full recoil; 30:2; minimal interruptions</td></tr>\n<tr><td>AED</td><td>turn on → expose and dry the chest → pads (upper right / lower left) → \"CLEAR\" → analyze → shock → resume CPR immediately</td></tr>\n<tr><td>Electrical injury</td><td>shut off power before touching; 911; CPR/AED; entry and exit burns</td></tr>\n<tr><td>Severe bleeding</td><td>direct pressure; tourniquet 2–3 in. above the wound, not on a joint; note the time</td></tr>\n<tr><td>Thermal burn</td><td>cool running water ≥ 10 min; no ice and no butter</td></tr>\n<tr><td>Shock</td><td>have the person lie flat on the back, keep from getting chilled, 911, nothing to eat or drink</td></tr>\n<tr><td>Heat exhaustion vs. heat stroke</td><td>exhaustion: cool place and fluids; heat stroke (confusion, very hot skin): 911 and rapid cooling, ideally cold-water immersion</td></tr>\n<tr><td>Adult choking</td><td>5 back blows + 5 abdominal thrusts, repeat</td></tr>\n<tr><td>Eye</td><td>chemical: flush with water continuously; embedded object: do not remove it, stabilize, get medical care</td></tr>\n</tbody>\n</table>\n\n<div class=\"callout warn\"><strong>Frequent traps:</strong> confusing 6 ft (construction), 4 ft (general industry), and more than 10 ft (scaffolds); 42 ± 3 in. (Subpart M guardrail) with 38–45 in. (scaffold); 5,000 lb (anchorage) with 1,800 lb (maximum arresting force); 85 dBA (action level) with 90 dBA (PEL); believing a scissor lift is an \"aerial lift\" that requires tying off to the structure; thinking a locked-out breaker de-energizes a panel that has batteries; using a tag alone without a lock; CPR \"at least 100\" instead of 100–120/min.</div>\n\n<h3>How to memorize it (OSHA and Red Cross books are not allowed in the test center)</h3>\n<div class=\"callout\"><strong>Number ladder:</strong> <em>3 – 4 – 6 – 10</em> = 3 ft of side rail, 1:4 angle and 4 ft in general industry, 6 ft in construction, 10 ft on scaffolds. <strong>Harness:</strong> \"5-6-3.5-18\" = 5,000 lb anchorage, 6 ft free fall, 3.5 ft deceleration, 1,800 lb force. <strong>Four times:</strong> ladders and scaffolds hold 4 × their load. <strong>CPR:</strong> \"100–120, 2 inches, 30 and 2\". <strong>Reports:</strong> \"8 hours fatality, 24 hours hospital, 7 days to the 300 log\". Drill these with flash cards — you cannot look them up on exam day.</div>\n","tabs":[{"ref":"29 CFR 1926.1053(b)(1)","what":"Side rails 3 ft above the upper landing surface"},{"ref":"29 CFR 1926.1053(b)(5)(i)","what":"1:4 angle (base = ¼ of the working length)"},{"ref":"29 CFR 1926.1053(b)(12)–(16)","what":"Nonconductive near energized parts; no standing on the top cap; inspection and Do Not Use tag"},{"ref":"29 CFR 1926.1051(a)","what":"Stairway or ladder at a break in elevation of 19 in. or more"},{"ref":"29 CFR 1926.451(a)(1), (e)(1), (g)(1)","what":"Scaffolds: 4 × load, access above 2 ft, fall protection above 10 ft"},{"ref":"29 CFR 1926.451(g)(4)(ii)","what":"Scaffold guardrail 38–45 in."},{"ref":"29 CFR 1926.453(b)(2)","what":"Aerial lifts: daily control test, tie off to the boom or basket"},{"ref":"29 CFR 1926.501(b)(1) / 1910.28(b)(1)","what":"Fall protection trigger: 6 ft / 4 ft"},{"ref":"29 CFR 1926.502(b), (d), (i)","what":"Guardrail 42 ± 3 in. and 200 lb; anchorage 5,000 lb; free fall 6 ft; hole covers"},{"ref":"29 CFR 1910.147(d), (e)(3), (f)(3)","what":"Lockout steps, lock removal, group lockout"},{"ref":"29 CFR 1910.333(b)(2), (c)(8)","what":"Electrical lockout, verification, conductive jewelry"},{"ref":"29 CFR 1926.404(b)(1)","what":"GFCI or AEGCP on construction sites"},{"ref":"29 CFR 1926.405(a)(2), (g)","what":"Extension cords and flexible cords"},{"ref":"29 CFR 1910.95, Table G-16","what":"Noise: 85 dBA action level, 90 dBA PEL"},{"ref":"29 CFR 1926.102 / 1910.134","what":"Z87.1 eye protection; respirators"},{"ref":"29 CFR 1910.1200(f), (g)","what":"GHS labels and 16-section SDS"},{"ref":"29 CFR 1926.1153, Table 1","what":"Silica: controls for drills"},{"ref":"29 CFR 1910.146","what":"Permit-required confined spaces"},{"ref":"29 CFR 1926.150(c)","what":"Construction site extinguishers: 2A per 3,000 ft², 100 ft"},{"ref":"Red Cross CPR/AED","what":"100–120/min, ≥ 2 in., 30:2, AED"}],"glossary":[{"en":"Competent person","def":"Person capable of identifying existing and predictable hazards and authorized to take prompt corrective measures (1926.32(f))."},{"en":"Qualified person","def":"Person trained in the construction and operation of the equipment and its hazards; in electrical work, the only one allowed to work on parts that are not de-energized."},{"en":"Authorized employee","def":"The person who applies lockout/tagout to service or maintain the equipment."},{"en":"Affected employee","def":"A person who operates or works near the locked-out equipment; must be notified before and after the lockout."},{"en":"Lockout/tagout (LOTO)","def":"Procedure to isolate energy with locks and tags and verify zero energy before work."},{"en":"Energy-isolating device","def":"Breaker, disconnect, or valve that physically prevents the transmission of energy; a push button is not one."},{"en":"Ground-fault circuit interrupter (GFCI)","def":"Device that opens the circuit when it detects leakage current to ground; protects people from shock."},{"en":"Assured equipment grounding conductor program (AEGCP)","def":"Written alternative to GFCIs on construction sites: daily inspection and continuity and connection tests every ≤ 3 months."},{"en":"Personal fall arrest system (PFAS)","def":"Anchorage, connector, and full-body harness that stop a fall in progress."},{"en":"Free fall","def":"Distance a person falls before the system starts to slow the fall; 6 ft maximum."},{"en":"Guardrail system","def":"Top rail, midrail, and posts that prevent falls from an edge."},{"en":"Toeboard","def":"Low barrier (≥ 3.5 in.) at the platform edge that keeps objects from falling."},{"en":"Side rail","def":"Either of the two long side members of a ladder."},{"en":"Top cap","def":"The top of a stepladder; never used as a step."},{"en":"Duty rating","def":"Maximum ladder load (person + tools + material): IAA 375, IA 300, I 250, II 225, III 200 lb."},{"en":"Permit-required confined space","def":"Confined space with a hazardous atmosphere, engulfment or entrapment hazard, or other serious hazard."},{"en":"Attendant","def":"Person who stays outside the confined space, monitors the entrants, and summons rescue."},{"en":"Safety Data Sheet (SDS)","def":"16-section document with a chemical's hazards, PPE, and first aid."},{"en":"Signal word","def":"\"Danger\" (more severe hazard) or \"Warning\" (less severe) on a GHS label."},{"en":"Action level","def":"Exposure that triggers measures such as monitoring or conservation programs (for example, 85 dBA for noise)."},{"en":"Permissible exposure limit (PEL)","def":"Maximum legal exposure, usually as an 8-hour time-weighted average (TWA)."},{"en":"Time-weighted average (TWA)","def":"Average exposure over the work shift, usually 8 hours."},{"en":"Presumed asbestos-containing material (PACM)","def":"Thermal system insulation and surfacing material in buildings constructed in 1980 or earlier."},{"en":"Automated external defibrillator (AED)","def":"Device that analyzes the heart rhythm and delivers a shock if needed."},{"en":"Tourniquet","def":"Band tightened 2–3 in. above a limb wound to stop life-threatening bleeding."}]},"questions":[{"id":"safety-001","task":"1.1.3","type":"single","diff":1,"freq":true,"q":{"en":"According to OSHA 1926.1053, when a portable ladder is used to reach an upper landing surface (for example, a mezzanine where a horn/strobe will be mounted), the side rails must extend at least how far above the upper landing?"},"opts":[{"en":"2 ft"},{"en":"2.5 ft"},{"en":"3 ft"},{"en":"4 ft"}],"ans":[2],"ref":"29 CFR 1926.1053(b)(1); 1910.23(c)(11)","exp":"The side rails must extend at least 3 ft (0.9 m) above the upper landing surface (1926.1053(b)(1)). If the ladder is too short for that, it must be secured at the top to a rigid support and a grasping device such as a grab rail provided. The same 3 ft rule appears in general industry, 1910.23(c)(11)."},{"id":"safety-002","task":"1.1.3","type":"single","diff":1,"freq":true,"q":{"en":"A technician sets up an extension ladder against a wall to reach a junction box. The working length of the ladder (from the foot to the top support) is 20 ft. Using the OSHA 1:4 rule, approximately how far from the wall should the base of the ladder be?"},"opts":[{"en":"5 ft"},{"en":"4 ft"},{"en":"6.7 ft"},{"en":"2.5 ft"}],"ans":[0],"ref":"29 CFR 1926.1053(b)(5)(i)","exp":"Non-self-supporting ladders are set so the horizontal distance from the base to the wall is about one-quarter of the working length (1926.1053(b)(5)(i)): 20 ft ÷ 4 = 5 ft, an angle of about 75°. Shortcut: for every 4 ft of working length, 1 ft out."},{"id":"safety-003","task":"1.1.3","type":"single","diff":1,"freq":true,"q":{"en":"A technician on a 6-ft stepladder is pulling cable above a suspended (drop) ceiling and cannot quite reach the far side of the cable path. What is the correct action?"},"opts":[{"en":"Stand on the top cap briefly while a coworker holds the ladder"},{"en":"Climb the rear cross-bracing to gain extra height"},{"en":"Set the stepladder on a rolling cart to reach farther"},{"en":"Climb down and get a taller ladder or a suitable lift"}],"ans":[3],"ref":"29 CFR 1926.1053(b)(6), (b)(13)–(14); 1910.23(c)(8)","exp":"OSHA prohibits using the top cap or top step of a stepladder as a step and climbing the rear cross-bracing unless it is designed with steps (1926.1053(b)(13)–(14)). Ladders may be used only on stable, level surfaces ((b)(6)), which rules out a rolling cart. The correct action is to climb down and use taller equipment."},{"id":"safety-004","task":"1.1.3","type":"single","diff":1,"freq":true,"q":{"en":"A technician must install a heat detector in an elevator machine room where the controller cabinet doors are open and energized parts are exposed nearby. Which ladder should be used?"},"opts":[{"en":"An aluminum stepladder with rubber feet"},{"en":"A stepladder with nonconductive (fiberglass) side rails"},{"en":"Any ladder, as long as the technician wears leather gloves"},{"en":"An aluminum ladder with its rails wrapped in electrical tape"}],"ans":[1],"ref":"29 CFR 1926.1053(b)(12); 1910.333(c)(7)","exp":"Where the worker or the ladder could contact exposed energized electrical equipment, the ladder must have nonconductive side rails, such as fiberglass (1926.1053(b)(12)). Rubber feet, electrical tape, or leather gloves do not make a metal ladder nonconductive."},{"id":"safety-005","task":"1.1.3","type":"single","diff":2,"q":{"en":"A technician weighs 210 lb and will carry 45 lb of tools and devices (including a hammer drill) up a stepladder. What is the MINIMUM ladder duty rating that should be selected?"},"opts":[{"en":"Type III (200 lb)"},{"en":"Type II (225 lb)"},{"en":"Type I (250 lb)"},{"en":"Type IA (300 lb)"}],"ans":[3],"ref":"29 CFR 1926.1053(b)(3); ANSI A14 (ladder label)","exp":"The load is person + tools + materials: 210 + 45 = 255 lb, which exceeds Type I (250 lb), so a Type IA (300 lb) or IAA (375 lb) ladder is required. OSHA prohibits loading a ladder beyond its maximum intended load (1926.1053(b)(3)); the duty ratings come from ANSI A14 and appear on the ladder label."},{"id":"safety-006","task":"1.1.3","type":"single","diff":1,"q":{"en":"While setting up, a technician notices that a fiberglass stepladder has a cracked side rail. What does OSHA require?"},"opts":[{"en":"Tag it \"Do Not Use\" (or similar) and withdraw it from service until repaired"},{"en":"Use it only for work below 6 ft"},{"en":"Wrap the crack with duct tape and recheck it at the end of the shift"},{"en":"Keep using it as long as a coworker holds the base"}],"ans":[0],"ref":"29 CFR 1926.1053(b)(15)–(16); 1910.23(b)(9)–(10)","exp":"A portable ladder with structural defects (cracked side rail, damaged step) must be marked as defective or tagged 'Do Not Use' and withdrawn from service until repaired (1926.1053(b)(16)). In general industry it is also inspected before initial use in each work shift (1910.23(b)(9))."},{"id":"safety-007","task":"1.1.3","type":"multi","select":2,"diff":1,"q":{"en":"Which TWO practices are required by OSHA when climbing a portable ladder? (Select TWO.)"},"opts":[{"en":"Slide down the side rails when descending to save time"},{"en":"Face the ladder when ascending or descending"},{"en":"Use the rear cross-bracing of a stepladder as a step when the front is blocked"},{"en":"Move or extend the ladder while standing on it if the move is less than 2 ft"},{"en":"Use at least one hand to grasp the ladder when going up or down"}],"ans":[1,4],"ref":"29 CFR 1926.1053(b)(11), (b)(14), (b)(20)–(22); 1910.23(b)(11)–(13)","exp":"OSHA requires facing the ladder when ascending or descending and using at least one hand to grasp it ((b)(20)–(21)); good practice is three points of contact and raising tools with a belt or a hand line. Moving or extending an occupied ladder ((b)(11)) and using the rear cross-bracing of a stepladder ((b)(14)) are prohibited."},{"id":"safety-008","task":"1.1.3","type":"single","diff":2,"q":{"en":"According to OSHA 1926 Subpart X, a stairway or ladder must be provided at all personnel points of access where there is a break in elevation of at least:"},"opts":[{"en":"12 in."},{"en":"16 in."},{"en":"24 in."},{"en":"19 in."}],"ans":[3],"ref":"29 CFR 1926.1051(a)","exp":"A stairway or ladder must be provided at every personnel point of access where there is a break in elevation of 19 in. (48 cm) or more and no ramp, runway, sloped embankment, or personnel hoist is provided (1926.1051(a))."},{"id":"safety-009","task":"1.1.3","type":"single","diff":2,"q":{"en":"A rolling scaffold will hold two technicians (250 lb each, including tools) plus 200 lb of conduit and devices. Per OSHA, each scaffold component must support its own weight plus at least:"},"opts":[{"en":"1,400 lb (2 times the intended load)"},{"en":"2,800 lb (4 times the intended load)"},{"en":"4,200 lb (6 times the intended load)"},{"en":"770 lb (the intended load plus 10%)"}],"ans":[1],"ref":"29 CFR 1926.451(a)(1)","exp":"Each scaffold and scaffold component must support, without failure, its own weight and at least 4 times the maximum intended load (1926.451(a)(1)): (2 × 250 + 200) = 700 lb × 4 = 2,800 lb. The factor of 6 applies to suspension ropes on suspended scaffolds, not to supported scaffolds."},{"id":"safety-010","task":"1.1.3","type":"single","diff":1,"freq":true,"q":{"en":"OSHA requires fall protection (guardrails or personal fall arrest) for each employee on a scaffold more than how far above a lower level?"},"opts":[{"en":"10 ft"},{"en":"6 ft"},{"en":"4 ft"},{"en":"15 ft"}],"ans":[0],"ref":"29 CFR 1926.451(g)(1)","exp":"On scaffolds the trigger is more than 10 ft (3.1 m) above a lower level (1926.451(g)(1)), different from the 6 ft of Subpart M (construction edges and holes) and the 4 ft of general industry (1910.28). Typical trap: applying 6 ft to a scaffold."},{"id":"safety-011","task":"1.1.3","type":"single","diff":3,"q":{"en":"For a supported scaffold placed in service after January 1, 2000, the top edge of the guardrail must be installed at what height above the platform surface?"},"opts":[{"en":"30 to 36 in."},{"en":"36 to 42 in."},{"en":"42 to 48 in."},{"en":"38 to 45 in."}],"ans":[3],"ref":"29 CFR 1926.451(g)(4)(ii)","exp":"For scaffolds manufactured or placed in service after January 1, 2000, the top edge of the guardrail must be between 38 and 45 in. (0.97–1.2 m) above the platform (1926.451(g)(4)(ii)); older scaffolds could be 36–45 in. Do not confuse it with the Subpart M guardrail, 42 in. ± 3 in. A scaffold toprail must withstand 200 lb and a midrail 150 lb."},{"id":"safety-012","task":"1.1.3","type":"single","diff":2,"q":{"en":"A frame scaffold platform is 6 ft above the floor. The crew has no ladder and plans to climb the cross braces to reach the platform. What does OSHA require?"},"opts":[{"en":"Cross braces may be used for access if the scaffold is less than 10 ft high"},{"en":"Climbing the frame is allowed if the worker wears a full-body harness"},{"en":"Access means are required only when the platform is more than 6 ft above the floor"},{"en":"Cross braces must not be used for access; a ladder, stair tower, ramp, or similar means is required when the platform is more than 2 ft above or below the point of access"}],"ans":[3],"ref":"29 CFR 1926.451(e)(1)","exp":"When the platform is more than 2 ft (0.6 m) above or below the point of access, an access means is required (hook-on or attachable ladder, integral frame ladder, stair tower, ramp, etc.), and cross braces must never be used as a means of access (1926.451(e)(1))."},{"id":"safety-013","task":"1.1.3","type":"single","diff":2,"q":{"en":"A technician on a rolling (baker-style) scaffold still cannot reach the mounting location of a beam smoke detector. A coworker suggests setting a small stepladder on the scaffold platform. Per OSHA, this is:"},"opts":[{"en":"Not permitted; ladders must not be used on scaffolds to increase working height (except on large-area scaffolds meeting specific conditions)"},{"en":"Permitted if the stepladder has fiberglass side rails"},{"en":"Permitted if the scaffold guardrails are at least 42 in. high"},{"en":"Permitted if the scaffold casters are locked"}],"ans":[0],"ref":"29 CFR 1926.451(f)(15)","exp":"OSHA prohibits using ladders on scaffolds to increase the working level height, except on large-area scaffolds under specific conditions (1926.451(f)(15)). The ladder defeats the guardrail protection. Raise the scaffold properly with added frames or use a lift instead."},{"id":"safety-014","task":"1.1.3","type":"single","diff":2,"q":{"en":"A technician is using a scissor lift with a complete guardrail system to install duct detectors. According to OSHA guidance, how are scissor lifts classified, and what is the primary fall protection?"},"opts":[{"en":"Aerial lifts under 1926.453; a body belt tied off to the nearest beam"},{"en":"Ladders under Subpart X; three points of contact"},{"en":"Mobile supported scaffolds; the guardrail system, with workers standing on the platform and never on the rails"},{"en":"Personnel hoists; a harness anchored to the building structure"}],"ans":[2],"ref":"OSHA Hazard Alert: Working Safely with Scissor Lifts; 29 CFR 1926.451(g), 1926.452(w)","exp":"OSHA treats scissor lifts as mobile supported scaffolds (1926.452(w)); the primary fall protection is the guardrail system (1926.451(g)). Do not climb on the guardrails or use ladders or planks on the platform. If the manufacturer or the employer requires a harness, attach it only to the manufacturer's designated anchor point."},{"id":"safety-015","task":"1.1.3","type":"single","diff":2,"freq":true,"q":{"en":"While working from an articulating boom lift to install a horn/strobe high on a wall, what fall protection practice does OSHA require?"},"opts":[{"en":"Tie off to an adjacent building column once the basket is in position"},{"en":"Wear a full-body harness with the lanyard attached to the boom or basket anchor"},{"en":"No fall protection is needed if the basket gate is closed"},{"en":"Stand on the mid-rail for extra reach while tied off"}],"ans":[1],"ref":"29 CFR 1926.453(b)(2)(iii)–(v); 1926.502(d)","exp":"In aerial lifts, the worker wears fall protection attached to the boom or basket; belting off to an adjacent pole, structure, or equipment is prohibited, and the worker must keep both feet on the basket floor, never sitting or climbing on the edge (1926.453(b)(2)). The regulation text says 'body belt', but body belts are no longer acceptable for fall arrest, so a full-body harness is used."},{"id":"safety-016","task":"1.1.3","type":"single","diff":1,"freq":true,"q":{"en":"On a construction site, OSHA Subpart M requires fall protection for an employee on a walking/working surface with an unprotected side or edge located how far above a lower level?"},"opts":[{"en":"4 ft or more"},{"en":"10 ft or more"},{"en":"6 ft or more"},{"en":"8 ft or more"}],"ans":[2],"ref":"29 CFR 1926.501(b)(1)","exp":"In construction, an unprotected side or edge 6 ft (1.8 m) or more above a lower level requires guardrails, safety nets, or a personal fall arrest system (1926.501(b)(1)). Remember: 4 ft in general industry and more than 10 ft on scaffolds."},{"id":"safety-017","task":"1.1.3","type":"single","diff":3,"freq":true,"q":{"en":"A technician performs annual fire alarm testing (maintenance, not construction) in an existing warehouse and must work beside an open mezzanine edge 5 ft above the floor. Which OSHA rule applies, and is fall protection required?"},"opts":[{"en":"1926 Subpart M; no, protection is not required below 6 ft"},{"en":"1910.28; yes, general industry requires protection at 4 ft or more"},{"en":"1926.451; only above 10 ft"},{"en":"No OSHA rule applies to testing work"}],"ans":[1],"ref":"29 CFR 1910.28(b)(1)(i)","exp":"Maintenance and testing in an existing building normally fall under general industry (1910), where the trigger is 4 ft (1.2 m) (1910.28(b)(1)(i)). In construction (new installation, 1926 Subpart M) it would be 6 ft. Rule: 4 in general industry, 6 in construction, more than 10 on scaffolds."},{"id":"safety-018","task":"1.1.3","type":"single","diff":2,"q":{"en":"Per OSHA 1926.502, the top edge of a guardrail system must be at what height above the walking/working level?"},"opts":[{"en":"42 in. ± 3 in."},{"en":"36 in. minimum"},{"en":"45 in. ± 3 in."},{"en":"39 in. maximum"}],"ans":[0],"ref":"29 CFR 1926.502(b)(1)","exp":"The top rail is 42 in. (1.1 m) ± 3 in. above the walking/working level (1926.502(b)(1)) and, under load, must not deflect below 39 in. The midrail is installed midway and withstands 150 lb. Scaffolds use a different figure: 38–45 in."},{"id":"safety-019","task":"1.1.3","type":"single","diff":3,"q":{"en":"A guardrail top rail must withstand, without failure, a force of at least how much applied within 2 in. of the top edge in any outward or downward direction?"},"opts":[{"en":"100 lb"},{"en":"150 lb"},{"en":"300 lb"},{"en":"200 lb"}],"ans":[3],"ref":"29 CFR 1926.502(b)(3), (b)(5)","exp":"The top rail must withstand at least 200 lb (890 N) applied in any outward or downward direction (1926.502(b)(3)); the midrail, at least 150 lb ((b)(5)). 100 lb is the toprail figure for single-point and two-point adjustable suspension scaffolds."},{"id":"safety-020","task":"1.1.3","type":"single","diff":2,"freq":true,"q":{"en":"Anchorages used for attaching personal fall arrest equipment must be capable of supporting at least how much per employee attached (unless designed with a safety factor of at least two under a qualified person's supervision)?"},"opts":[{"en":"1,800 lb"},{"en":"3,600 lb"},{"en":"5,000 lb"},{"en":"10,000 lb"}],"ans":[2],"ref":"29 CFR 1926.502(d)(15)","exp":"Each anchorage must support at least 5,000 lb (22.2 kN) per employee attached, or be designed with a safety factor of at least two under the supervision of a qualified person (1926.502(d)(15)). Lanyards also have a 5,000 lb minimum breaking strength; 1,800 lb is the maximum arresting force with a body harness."},{"id":"safety-021","task":"1.1.3","type":"single","diff":3,"q":{"en":"Using OSHA's maximum limits for a personal fall arrest system, what is the greatest combined distance a worker can travel from the start of a fall until stopped, counting only free fall plus deceleration distance?"},"opts":[{"en":"6 ft"},{"en":"9.5 ft"},{"en":"8 ft"},{"en":"11.5 ft"}],"ans":[1],"ref":"29 CFR 1926.502(d)(16)(iii)–(iv)","exp":"The system must limit free fall to 6 ft (1.8 m) and deceleration distance to 3.5 ft (1.07 m): 6 + 3.5 = 9.5 ft, and the worker must not contact any lower level (1926.502(d)(16)). For total clearance, also add the D-ring-to-feet distance and a safety margin."},{"id":"safety-022","task":"1.1.3","type":"multi","select":2,"diff":2,"q":{"en":"A technician removes a floor-opening cover to pull cable through a penetration and then reinstalls it. Which TWO requirements must the cover meet per OSHA 1926.502(i)? (Select TWO.)"},"opts":[{"en":"Support at least twice the weight of employees, equipment, and materials that may be on it at one time"},{"en":"Be painted safety yellow, with no lettering required"},{"en":"Be left loose so it can be lifted quickly in an emergency"},{"en":"Be secured against accidental displacement and be color coded or marked \"HOLE\" or \"COVER\""},{"en":"Support a fixed 200 lb regardless of the expected loads"}],"ans":[0,3],"ref":"29 CFR 1926.502(i)(2)–(4)","exp":"Hole covers must support at least 2 times the weight of employees, equipment, and materials that may be on them at one time, be secured against accidental displacement, and be color coded or marked 'HOLE' or 'COVER' (1926.502(i)). After pulling the cable, reinstall and secure the cover immediately."},{"id":"safety-023","task":"1.1.3","type":"single","diff":2,"freq":true,"q":{"en":"Three technicians are replacing NAC power supplies fed from the same 120-V branch circuit. The breaker is locked out with a group lockout hasp. What is the correct practice?"},"opts":[{"en":"The lead technician applies one lock for the whole crew and keeps the key"},{"en":"A tag alone is enough because the circuit is only 120 V"},{"en":"Each authorized employee attaches his or her own personal lock to the group lockout device"},{"en":"One lock is applied and the key is hung on the panel door"}],"ans":[2],"ref":"29 CFR 1910.147(f)(3)(ii)(D), (e)(3); 1910.333(b)(2)(iii)","exp":"In group lockout, each authorized employee affixes a personal lock to the group lockout device when starting work and personally removes it when finished (1910.147(f)(3)(ii)(D) and (e)(3)). A single lock applied by the lead does not protect the others, and a tag alone is acceptable only when a lock cannot be applied and an additional equivalent safety measure is used."},{"id":"safety-024","task":"1.1.3","type":"single","diff":2,"freq":true,"q":{"en":"In the OSHA lockout/tagout sequence, what must the authorized employee do after applyi
