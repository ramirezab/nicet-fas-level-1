two revolutions of the handwheel or within one-fifth of the travel distance of the valve, or per the manufacturer's published instructions. A signal at five revolutions is a deficiency: adjust or replace the switch. Also confirm that the off-normal signal does not restore until the valve is back in its normal (fully open) position."},{"id":"itm-024","task":"1.2.1","type":"single","diff":2,"q":{"en":"A dry-pipe system low-air pressure supervisory switch is being tested. Per NFPA 72-2022 (unless the manufacturer's instructions state otherwise), the switch must initiate a signal when the air pressure is decreased from the required pressure by no more than:"},"opts":[{"en":"5 psi (35 kPa)"},{"en":"10 psi (70 kPa)"},{"en":"15 psi (105 kPa)"},{"en":"20 psi (140 kPa)"}],"ans":[1],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(10)(b)","exp":"Table 14.4.3.2 says to operate the switch and verify that the signal is received when the pressure increases or decreases a maximum of 10 psi (70 kPa) from the required level, or per the manufacturer's instructions. This switch is tested annually."},{"id":"itm-025","task":"1.2.1","type":"single","diff":1,"q":{"en":"A room temperature supervisory switch protects a sprinkler valve room. Per NFPA 72-2022, it must signal when the room temperature drops to:"},"opts":[{"en":"32°F (0°C)"},{"en":"35°F (1.7°C)"},{"en":"45°F (7.2°C)"},{"en":"40°F (4.4°C)"}],"ans":[3],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(10)(e)","exp":"Table 14.4.3.2 requires verifying the signal when the room temperature drops to 40°F (4.4°C) and its restoration when the temperature rises above 40°F. The water temperature switch uses the same 40°F value. Both are tested annually."},{"id":"itm-026","task":"1.2.1","type":"single","diff":2,"q":{"en":"To test the waterflow switch on a wet-pipe sprinkler system, NFPA 72-2022 requires the technician to:"},"opts":[{"en":"Trip the switch lever by hand with the retard set to zero"},{"en":"Short the switch terminals at the control unit"},{"en":"Flow water through the inspector's test connection at a rate equal to one sprinkler of the smallest orifice size installed (or use another listed and approved method)"},{"en":"Open the main drain fully for 5 minutes"}],"ans":[2],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(11)","exp":"The Table 14.4.3.2 method for wet-pipe systems is to flow water through the inspector's test connection at a rate equal to one sprinkler of the smallest orifice size installed. Dry-pipe, preaction, and deluge systems use the alarm test bypass connection per NFPA 25. Shorting the terminals does not test the device."},{"id":"itm-027","task":"1.2.1","type":"single","diff":1,"q":{"en":"Which method is NOT acceptable for the annual functional (smoke entry) test of a spot-type smoke detector?"},"opts":[{"en":"Activating the detector's internal test switch with a magnet"},{"en":"Smoke"},{"en":"A listed and labeled aerosol acceptable to the detector manufacturer"},{"en":"Another method in the manufacturer's published instructions that ensures smoke entry from the protected area through the vents into the sensing chamber"}],"ans":[0],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(7)(a) and note","exp":"The functional test must ensure smoke entry into the sensing chamber and an alarm response (Table 14.4.3.2). Smoke, a listed and labeled product acceptable to the manufacturer, or another manufacturer's method that ensures smoke entry is acceptable. A note to the table states that magnets are not acceptable for smoke entry tests."},{"id":"itm-028","task":"1.2.1","type":"single","diff":1,"freq":true,"q":{"en":"Per NFPA 72-2022, when must smoke detector sensitivity first be checked, and how often after that (unless the interval is extended)?"},"opts":[{"en":"At installation, and every year after that"},{"en":"Within 1 year after installation, and every alternate year after that"},{"en":"Within 6 months after installation, and every 18 months after that"},{"en":"Within 5 years after installation, and every 5 years after that"}],"ans":[1],"ref":"NFPA 72-2022 §14.4.4.3","exp":"Section 14.4.4.3 requires sensitivity to be checked within 1 year after installation and every alternate year after that. After the second required calibration test, if the detectors have remained in range, the interval may be extended to a maximum of 5 years."},{"id":"itm-029","task":"1.2.1","type":"single","diff":2,"freq":true,"q":{"en":"After the second required calibration test, smoke detectors that have remained within their listed and marked sensitivity range may have the interval between sensitivity tests extended to a maximum of:"},"opts":[{"en":"2 years"},{"en":"3 years"},{"en":"5 years"},{"en":"10 years"}],"ans":[2],"ref":"NFPA 72-2022 §14.4.4.3","exp":"Per 14.4.4.3, the interval may be extended to a maximum of 5 years. If it is extended, records of nuisance alarms and their trends must be kept, and in zones or areas where nuisance alarms increase over the previous year, calibration tests must be performed."},{"id":"itm-030","task":"1.2.1","type":"multi","select":2,"diff":2,"freq":true,"q":{"en":"Which TWO are acceptable methods in NFPA 72-2022 for verifying that a smoke detector is within its listed and marked sensitivity range? (Select TWO.)"},"opts":[{"en":"The manufacturer's calibrated sensitivity test instrument"},{"en":"Applying an unmeasured burst of aerosol from a test can and timing the response"},{"en":"Observing that the detector's LED blinks during normal standby"},{"en":"Listed control equipment arranged for the purpose"},{"en":"Applying heat with a heat gun until the detector alarms"}],"ans":[0,3],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(8); §14.4.4.3","exp":"Table 14.4.3.2, item 17(8), accepts: a calibrated test method, the manufacturer's calibrated sensitivity test instrument, listed control equipment arranged for the purpose, a detector/control unit arrangement that signals when sensitivity is out of range, or another calibrated method acceptable to the AHJ. NFPA 72 prohibits measuring sensitivity with any device that administers an unmeasured concentration of smoke or aerosol."},{"id":"itm-031","task":"1.2.2","type":"single","diff":1,"freq":true,"q":{"en":"During sensitivity testing, a spot-type smoke detector is found outside its listed and marked sensitivity range. Per NFPA 72-2022, what must be done?"},"opts":[{"en":"Leave it in service and retest it in 5 years"},{"en":"Tape over the vents to reduce nuisance alarms"},{"en":"Note it on the as-built drawings and leave it in place"},{"en":"Clean and recalibrate it, or replace it"}],"ans":[3],"ref":"NFPA 72-2022 §14.4.4.3","exp":"Section 14.4.4.3 requires detectors found outside their listed and marked sensitivity range to be cleaned and recalibrated, or replaced. Detectors listed as field adjustable may also be adjusted within the listed range. An out-of-range detector can cause nuisance alarms (too sensitive) or respond late (not sensitive enough)."},{"id":"itm-032","task":"1.2.1","type":"single","diff":2,"q":{"en":"Per NFPA 72-2022, how is a combination rate-of-rise/fixed-temperature spot-type heat detector (restorable rate-of-rise element, nonrestorable fixed-temperature element) tested in the field?"},"opts":[{"en":"With a listed and labeled heat source or per the manufacturer's instructions, using a method that does not damage the nonrestorable fixed-temperature element"},{"en":"With an open flame held 6 in. (150 mm) below the detector"},{"en":"It is not field tested; only a visual inspection is required"},{"en":"By shorting the detector terminals at its base"}],"ans":[0],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(4)(a)","exp":"Table 14.4.3.2 requires an annual heat test with a listed and labeled heat source, or per the manufacturer's published instructions. The method must not damage the nonrestorable fixed-temperature element of a combination rate-of-rise/fixed-temperature detector. An open flame is dangerous and can destroy that element."},{"id":"itm-033","task":"1.2.1","type":"single","diff":2,"freq":true,"q":{"en":"Fixed-temperature, nonrestorable spot-type heat detectors have now been in service for 15 years. What does NFPA 72-2022 require?"},"opts":[{"en":"Heat test every detector with a heat gun"},{"en":"No action; they are only replaced after they operate"},{"en":"Replace 10 percent of them every year"},{"en":"Replace all of them, or have 2 detectors per 100 laboratory tested (repeating at 5-year intervals if they are tested instead of replaced)"}],"ans":[3],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(4)(c)","exp":"These detectors are not heat tested in the field because their element is destroyed. Per Table 14.4.3.2, 15 years after initial installation either replace all of them or have 2 detectors per 100 laboratory tested, replacing the 2 removed with new ones. If any fails, more are removed and tested to see whether the problem is general or localized; if detectors are tested instead of replaced, the tests are repeated at 5-year intervals."},{"id":"itm-034","task":"1.2.1","type":"single","diff":3,"q":{"en":"A warehouse has 450 fixed-temperature, nonrestorable spot-type heat detectors that were installed 15 years ago. The owner chooses laboratory testing instead of replacing all of them. How many detectors must be removed for laboratory testing?"},"opts":[{"en":"9"},{"en":"2"},{"en":"45"},{"en":"18"}],"ans":[0],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(4)(c)","exp":"The rule in Table 14.4.3.2 is 2 detectors per 100: 450 ÷ 100 = 4.5 groups, and 4.5 × 2 = 9 detectors. The 9 removed are replaced with new detectors; if any fails at the laboratory, more are removed and tested. The 45 would be 10 percent, which is not the rule."},{"id":"itm-035","task":"1.2.1","type":"single","diff":2,"q":{"en":"How does NFPA 72-2022 require fixed-temperature, nonrestorable line-type heat detection (linear heat cable) to be tested periodically?"},"opts":[{"en":"Apply heat to a different section of the cable each year"},{"en":"Do not heat test; test functionality mechanically and electrically, measure and record loop resistance, and investigate changes from the acceptance test"},{"en":"Replace the entire cable every 5 years"},{"en":"A visual inspection is the only requirement"}],"ans":[1],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(4)(b)","exp":"Nonrestorable line-type heat detection is destroyed when heated, so Table 14.4.3.2 says not to heat test it. Annually, test its functionality mechanically and electrically, measure and record loop resistance, and investigate any change from the acceptance test value."},{"id":"itm-036","task":"1.2.1","type":"single","diff":2,"freq":true,"q":{"en":"After a change to site-specific software, what does NFPA 72-2022 require in addition to 100 percent testing of all functions known to be affected by the change?"},"opts":[{"en":"Testing 20 percent of all notification appliances"},{"en":"Testing every initiating device in the building"},{"en":"Testing 5 percent of initiating devices, with no maximum"},{"en":"Testing 10 percent of the initiating devices not directly affected by the change, up to a maximum of 50 devices"}],"ans":[3],"ref":"NFPA 72-2022 §14.4.2.4","exp":"Section 14.4.2.4 requires 100 percent testing of all functions known to be affected, plus 10 percent of the initiating devices not directly affected (up to a maximum of 50 devices) to verify correct system operation, and a revised record of completion. The rule applies even to changes that look minor, such as label edits."},{"id":"itm-037","task":"1.2.1","type":"single","diff":3,"freq":true,"q":{"en":"A system has 800 initiating devices. A site-specific software change directly affects 40 of them. Per NFPA 72-2022, what is the minimum total number of initiating devices that must be tested?"},"opts":[{"en":"40"},{"en":"90"},{"en":"116"},{"en":"80"}],"ans":[1],"ref":"NFPA 72-2022 §14.4.2.4","exp":"Test the 40 affected devices (100 percent). Of the 760 unaffected devices, 10 percent is 76, but the maximum is 50 (14.4.2.4). Total: 40 + 50 = 90. The 116 ignores the 50-device cap, and the 80 applies 10 percent to the whole system without testing the affected devices."},{"id":"itm-038","task":"1.2.1","type":"single","diff":2,"freq":true,"q":{"en":"The manufacturer's executive software (firmware) of a control unit is upgraded. Per NFPA 72-2022, what reacceptance testing is required?"},"opts":[{"en":"None, as long as the site-specific program was not changed"},{"en":"Only a lamp test of the control unit"},{"en":"A 10 percent functional test of the system, including at least one device on each input and output circuit to verify critical functions such as notification appliances, control functions, and off-premises reporting"},{"en":"A 100 percent test of every device in the system"}],"ans":[2],"ref":"NFPA 72-2022 §14.4.2.5","exp":"Section 14.4.2.5 requires, after changes to executive software, a 10 percent functional test of the system. It must include at least one device on each input and output circuit to verify critical functions such as notification appliances, control functions, and off-premises reporting. Do not confuse it with the 10 percent (maximum 50) rule for site-specific software."},{"id":"itm-039","task":"1.2.1","type":"single","diff":2,"q":{"en":"A service company wants to change a control unit's site-specific software remotely from its office, away from the protected premises. What does NFPA 72-2022 require?"},"opts":[{"en":"A qualified individual must be at the protected premises to verify that the testing required by 14.4.2 is accomplished"},{"en":"Remote changes are prohibited"},{"en":"The AHJ must approve each remote change in writing beforehand"},{"en":"Only a log entry at the central station is required"}],"ans":[0],"ref":"NFPA 72-2022 §14.4.2.6","exp":"Section 14.4.2.6, new in 2022, permits executive or site-specific software changes to be made remotely only if a qualified person (per 10.5.3) is at the protected premises to verify the reacceptance testing required by 14.4.2. Nobody can verify from a remote office that a horn sounds or a door releases."},{"id":"itm-040","task":"1.2.2","type":"single","diff":2,"q":{"en":"A technician replaces one failed addressable smoke detector with an identical model on an existing signaling line circuit. No programming changes are made. What reacceptance testing does NFPA 72-2022 call for?"},"opts":[{"en":"Functionally test the replaced detector; testing 10 percent of the other initiating devices is not necessary"},{"en":"Test 10 percent of all initiating devices, up to 50"},{"en":"Perform a complete annual test of the system"},{"en":"No testing is needed because the model is identical"}],"ans":[0],"ref":"NFPA 72-2022 §14.4.2; A.14.4.2","exp":"Reacceptance testing verifies the operation of whatever was added or replaced (14.4.2). Annex A.14.4.2 explains that the intent is not to add cost: when a detector is replaced with a like detector, testing 10 percent of the unaffected initiating devices is not needed, but the new device itself must be tested. The 10 percent (maximum 50) rule applies to site-specific software changes."},{"id":"itm-041","task":"1.2.2","type":"single","diff":2,"q":{"en":"A replacement addressable smoke detector will receive its operating power from the control unit's signaling line circuit (SLC). Per NFPA 72-2022, the replacement detector must be:"},"opts":[{"en":"Any UL 268 smoke detector of the same voltage"},{"en":"Approved by the building owner"},{"en":"Listed for use with the control unit"},{"en":"The same color as the original"}],"ans":[2],"ref":"NFPA 72-2022 §10.3.3","exp":"Section 10.3.3 requires devices that receive their operating power from an initiating device circuit (IDC) or signaling line circuit (SLC) of a control unit to be listed for use with that control unit (compatibility). A detector from another manufacturer, even if UL 268 listed, may not communicate or operate correctly with that panel."},{"id":"itm-042","task":"1.2.1","type":"single","diff":3,"q":{"en":"During the annual test, the owner does not want the elevators recalled every time a lobby smoke detector is tested. What does NFPA 72-2022 require the technician to verify for this emergency control function?"},"opts":[{"en":"Nothing; emergency control functions are outside the scope of NFPA 72"},{"en":"Activation of the emergency control function interface device (for example, the relay output) and, if it was disabled for testing, that it was properly restored"},{"en":"Full elevator recall on every device test, with an elevator mechanic present"},{"en":"Only that the elevator controller has power"}],"ans":[1],"ref":"NFPA 72-2022 Table 14.4.3.2, item 24; A.14.4.3.2","exp":"Table 14.4.3.2, item 24, requires annual verification that the emergency control function interface device activates; if it was disabled or disconnected during testing, verify that it was properly restored. Per the annex, NFPA 72 does not require testing the controlled function itself (the elevator recall); other codes or the AHJ govern that. Anything not tested is documented under the test plan."},{"id":"itm-043","task":"1.2.1","type":"single","diff":2,"q":{"en":"Smoke detectors used for elevator recall are permitted to initiate a supervisory signal instead of an alarm signal. Per the notes to NFPA 72-2022 Table 14.4.3.2, how often should these detectors be functionally tested?"},"opts":[{"en":"Quarterly, like other supervisory devices"},{"en":"Semiannually, like control valve switches"},{"en":"Annually, the same as smoke detectors that initiate alarm signals"},{"en":"Every 5 years"}],"ans":[2],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17 (note)","exp":"A note to Table 14.4.3.2 explains that detectors used for elevator recall, damper closure, or door release that initiate a supervisory signal are not supervisory devices. They are smoke detectors, so they are tested at the same annual frequency as detectors that initiate alarm signals."},{"id":"itm-044","task":"1.2.1","type":"single","diff":2,"freq":true,"q":{"en":"During the annual secondary (standby) power test of a general alarm (non-voice) system, after primary power is disconnected and the trouble indication is verified, the system must be operated in alarm for a minimum of:"},"opts":[{"en":"5 minutes"},{"en":"15 minutes"},{"en":"30 minutes"},{"en":"24 hours"}],"ans":[0],"ref":"NFPA 72-2022 Table 14.4.3.2, item 8","exp":"Table 14.4.3.2, item 8 (annual): disconnect primary power, verify the trouble indication, measure or verify standby and alarm currents against battery capacity (with a safety margin), and operate general alarm systems in alarm for a minimum of 5 minutes and emergency voice/alarm communication systems (EVACS) for a minimum of 15 minutes. Reconnect primary power at the end."},{"id":"itm-045","task":"1.2.1","type":"single","diff":1,"freq":true,"q":{"en":"Per NFPA 72-2022 Table 14.4.3.2, how often are the VRLA battery temperature, charger, cell/unit voltage, and ohmic tests performed?"},"opts":[{"en":"Monthly"},{"en":"Quarterly"},{"en":"Semiannually"},{"en":"Annually"}],"ans":[2],"ref":"NFPA 72-2022 Table 14.4.3.2, item 9","exp":"Table 14.4.3.2, item 9 (VRLA battery and charger), sets the temperature, charger, cell/unit voltage, and ohmic tests as semiannual, performed in order (1) through (4). The replacement or capacity load test is every 3 years. The full secondary power test (item 8) is annual."},{"id":"itm-046","task":"1.2.1","type":"single","diff":2,"freq":true,"q":{"en":"NFPA 72-2022 requires that VRLA batteries be either replaced or load tested for capacity at what interval?"},"opts":[{"en":"Every year"},{"en":"Every 3 years"},{"en":"Every 5 years"},{"en":"Every 10 years"}],"ans":[1],"ref":"NFPA 72-2022 Table 14.4.3.2, item 9(5)","exp":"Table 14.4.3.2, item 9(5) (replacement/load test), requires that every 3 years the battery be either replaced or load tested for capacity, at a 3-hour or longer discharge rate per the manufacturer. Trap: older editions required replacement within 5 years of manufacture; that rule no longer applies."},{"id":"itm-047","task":"1.2.1","type":"single","diff":2,"q":{"en":"How is the semiannual VRLA charger test performed per NFPA 72-2022?"},"opts":[{"en":"Disconnect the charger and measure the battery voltage 24 hours later"},{"en":"Measure the specific gravity of each cell with a hydrometer"},{"en":"Short the charger output briefly to verify current limiting"},{"en":"With the battery fully charged and connected to the charger, measure the voltage across the battery and verify it is within the battery/alarm equipment manufacturer's recommendations; adjust or replace the charger if it is outside the limits"}],"ans":[3],"ref":"NFPA 72-2022 Table 14.4.3.2, item 9(2)","exp":"Item 9(2) of Table 14.4.3.2 uses a voltmeter to measure the voltage across the fully charged battery while it is connected to the charger. If it is outside the manufacturer's recommendations, the charger is adjusted or replaced. A table note gives 2.265 V per cell ±0.015 V at 77°F for adjustable chargers, or per the manufacturer. A hydrometer is for vented batteries, not VRLA."},{"id":"itm-048","task":"1.2.1","type":"single","diff":3,"q":{"en":"A baseline ohmic value was recorded on each VRLA battery unit at installation. Per NFPA 72-2022, the battery must be replaced when a semiannual ohmic reading deviates from that baseline by at least:"},"opts":[{"en":"10 percent for conductance or 20 percent for resistance/impedance"},{"en":"20 percent for conductance or 30 percent for resistance/impedance"},{"en":"30 percent for conductance or 40 percent for resistance/impedance"},{"en":"50 percent for either method"}],"ans":[2],"ref":"NFPA 72-2022 Table 14.4.3.2, item 9(4); A.14.4.3.2","exp":"Item 9(4) requires replacing the battery if the ohmic value of any cell/unit deviates from the baseline by 30 percent or more (conductance) or 40 percent or more (resistance or impedance). Per A.14.4.3.2, these deviations indicate roughly 80 percent capacity or less. The 2022 edition clarified that one of the two methods is used, not both, and a load test may be substituted for the ohmic test."},{"id":"itm-049","task":"1.2.2","type":"single","diff":1,"q":{"en":"During inspection, a technician finds that one of the two 12-volt VRLA batteries in a fire alarm control unit has a visibly bulging (swollen) case. What is the correct action?"},"opts":[{"en":"Perform an ohmic test to decide whether to replace it"},{"en":"Recharge it for 48 hours and retest"},{"en":"Record it as an observation for the next annual visit"},{"en":"Replace the battery; a distorted, cracked, or leaking battery is replaced, not tested"}],"ans":[3],"ref":"NFPA 72-2022 Table 14.3.1, item 9(1)(a); A.14.4.3.2","exp":"Table 14.3.1 (item 9) calls for replacing any cell/unit with corrosion, excessive case or cover distortion, cracks, or electrolyte leakage. Annex A.14.4.3.2 clarifies that a bulging, cracked, or leaking battery should be replaced, not tested. The annex also recommends replacing all units of a battery together so that they float evenly."},{"id":"itm-050","task":"1.2.2","type":"single","diff":3,"q":{"en":"On opening a FACU cabinet, the technician measures an internal ambient temperature of 78°F (25.6°C). The negative terminal of one VRLA battery measures 99°F (37.2°C) with an infrared thermometer. Per NFPA 72-2022, what is required?"},"opts":[{"en":"No action; the battery is within 25°F of ambient"},{"en":"Move the panel to a cooler room and retest next year"},{"en":"Reduce the charger output by 1 volt"},{"en":"Replace the battery, because it is more than 18°F (10°C) above the enclosure's internal ambient temperature"}],"ans":[3],"ref":"NFPA 72-2022 Table 14.4.3.2, item 9(1)","exp":"The semiannual temperature test (Table 14.4.3.2, item 9(1)) first measures the enclosure's internal ambient temperature right after the door is opened, then each cell/unit at the negative terminal with an infrared thermometer. Any unit more than 18°F (10°C) above that ambient is replaced. Here 99 − 78 = 21°F, which exceeds 18°F, so the battery is replaced."},{"id":"itm-051","task":"1.2.2","type":"multi","select":2,"diff":3,"q":{"en":"Which TWO VRLA battery test results require the battery to be replaced per NFPA 72-2022? (Select TWO.)"},"opts":[{"en":"A 12 V unit measures 13.1 V while fully charged and connected to the charger"},{"en":"Unit temperature is 8°F (4.4°C) above the enclosure's internal ambient"},{"en":"Conductance has dropped 35 percent below the established baseline"},{"en":"Charger voltage is within the manufacturer's recommended range"},{"en":"Internal resistance has risen 20 percent above the established baseline"}],"ans":[0,2],"ref":"NFPA 72-2022 Table 14.4.3.2, item 9(3) and 9(4)","exp":"Replace if any cell/unit measures less than 13.26 V while fully charged and on the charger (item 9(3)); 13.1 V is below that. Also replace if the ohmic deviation is 30 percent or more for conductance (item 9(4)), so a 35 percent drop requires replacement. A 20 percent resistance increase does not reach the 40 percent threshold, and 8°F is below the 18°F limit."},{"id":"itm-052","task":"1.2.2","type":"single","diff":3,"q":{"en":"A 3-hour-rate load test of a VRLA battery at 77°F (25°C) (KT = 1.0) lasts 150 minutes before the manufacturer's end voltage is reached. Using % capacity = [T / (180 × KT)] × 100, what does NFPA 72-2022 require?"},"opts":[{"en":"No action; the battery is above 80 percent"},{"en":"Replace the battery immediately because its capacity is at or below 80 percent"},{"en":"Replace the battery at the next scheduled test interval, because its capacity (about 83 percent) is less than 85 percent"},{"en":"Repeat the load test next month"}],"ans":[2],"ref":"NFPA 72-2022 Table 14.4.3.2, item 9(5); A.14.4.3.2","exp":"The calculation is 150 ÷ (180 × 1.0) × 100 = 83.3 percent. Item 9(5) requires replacement if capacity is 80 percent or less, or at the next scheduled test interval if it is less than 85 percent. At 83 percent, replace at the next scheduled test. The formula and the KT temperature-factor table are in Annex A.14.4.3.2."},{"id":"itm-053","task":"1.2.1","type":"single","diff":1,"q":{"en":"How is the ground-fault monitoring of a fire alarm control unit tested per NFPA 72-2022?"},"opts":[{"en":"If the system has a ground detection feature, ground an installation conductor and verify that a ground-fault indication occurs"},{"en":"Measure the resistance of the building's grounding electrode"},{"en":"Remove an end-of-line resistor"},{"en":"Disconnect the standby batteries"}],"ans":[0],"ref":"NFPA 72-2022 Table 14.4.3.2, item 3(3)","exp":"Table 14.4.3.2, item 3(3) (annual): if the system has a ground detection feature, verify the ground-fault indication by grounding any installation conductor. Removing an EOL resistor tests open-circuit supervision, and disconnecting the batteries tests secondary power supervision."},{"id":"itm-054","task":"1.2.1","type":"single","diff":1,"q":{"en":"During the annual test of a monitored system, how is the transmission of signals to the off-premises location verified?"},"opts":[{"en":"By checking that the communicator's power LED is lit"},{"en":"By calling the central station and asking whether the phone line works"},{"en":"By actuating an initiating device, creating a trouble condition, and actuating a supervisory device, and verifying receipt of each signal at the off-premises location"},{"en":"By reviewing last month's event history"}],"ans":[2],"ref":"NFPA 72-2022 Table 14.4.3.2, item 3(4)","exp":"Table 14.4.3.2, item 3(4) (annual): actuate an initiating device and verify receipt of the alarm at the off-premises location, create a trouble condition and verify the trouble signal, and actuate a supervisory device and verify the supervisory signal. Each signal type must be confirmed with the station; an LED or the event history does not prove transmission."},{"id":"itm-055","task":"1.2.1","type":"single","diff":3,"q":{"en":"When the primary telephone line is disconnected from a DACT during testing, NFPA 72-2022 requires the DACT trouble signal to be indicated at the premises fire alarm control unit within:"},"opts":[{"en":"90 seconds"},{"en":"200 seconds"},{"en":"4 minutes"},{"en":"60 minutes"}],"ans":[2],"ref":"NFPA 72-2022 Table 14.4.3.2, item 4(2)","exp":"Table 14.4.3.2, item 4(2): disconnect the primary line and verify that the DACT trouble is indicated at the premises control unit within 4 minutes of detection of the fault, and that the supervising station receives the trouble and then the restoral. Each DACT transmission attempt must be completed within 90 seconds. The 200-second figure is the general limit for annunciating a single open or ground fault on installation conductors (12.6.1), not a DACT test value."},{"id":"itm-056","task":"1.2.1","type":"single","diff":2,"q":{"en":"Which statement about sound pressure level (SPL) measurements for audible notification appliances is correct per NFPA 72-2022?"},"opts":[{"en":"SPL must be measured in every room during every annual test"},{"en":"For initial and reacceptance testing, SPL is measured with a Type 2 sound level meter using FAST time weighting; for periodic testing, operation of the appliances is verified"},{"en":"SPL measurements are never required after the original installation"},{"en":"SPL is measured with the meter set to SLOW response on voice messages"}],"ans":[1],"ref":"NFPA 72-2022 Table 14.4.3.2, item 22","exp":"Table 14.4.3.2, item 22, requires SPL measurements at initial and reacceptance testing with a Type 2 sound level meter using FAST time weighting, measured on the alert and evacuation tones (not on voice) and compared with Chapter 18. At the annual periodic test, only operation is verified. Per the annex, if low levels are suspected, the owner is notified in writing."},{"id":"itm-057","task":"1.2.1","type":"single","diff":1,"q":{"en":"For the periodic (annual) test of visual notification appliances (strobes), what does NFPA 72-2022 require?"},"opts":[{"en":"Measure the candela output of each strobe with a light meter"},{"en":"Replace all strobes every 10 years"},{"en":"Test only 10 percent of the strobes each year"},{"en":"Verify that each appliance flashes"}],"ans":[3],"ref":"NFPA 72-2022 Table 14.4.3.2, item 22(3)","exp":"For periodic (annual) testing, Table 14.4.3.2 requires verifying that each visible appliance flashes. At initial and reacceptance testing, also verify the location per the approved drawings and that the marked candela (or the value reported by the control unit) matches the approved drawings."},{"id":"itm-058","task":"1.2.1","type":"single","diff":1,"q":{"en":"How is a projected beam smoke detector functionally tested per NFPA 72-2022?"},"opts":[{"en":"By introducing smoke, other aerosol, or an optical filter into the beam path"},{"en":"By holding a magnet against the receiver"},{"en":"By completely covering the transmitter lens and waiting for an alarm"},{"en":"Only by visually checking the beam alignment"}],"ans":[0],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(7)(f)","exp":"Table 14.4.3.2 says to test projected beam detectors (annually) by introducing smoke, other aerosol, or an optical filter into the beam path. Blocking the beam completely normally produces a trouble signal, not an alarm. The semiannual visual inspection confirms that the beam path is clear."},{"id":"itm-059","task":"1.2.1","type":"single","diff":2,"q":{"en":"In addition to the functional test, what does NFPA 72-2022 require for duct smoke detectors that use sampling tubes?"},"opts":[{"en":"Replace the sampling tubes every year"},{"en":"Test that the tubes properly sample the airstream, using a method acceptable to the manufacturer (for example, verifying the air pressure differential with a manometer)"},{"en":"Test them only with the HVAC fan turned off"},{"en":"No additional testing is required"}],"ans":[1],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(7)(e)","exp":"Table 14.4.3.2 requires, in addition to the functional and sensitivity tests, an annual test that duct detector sampling tubes properly sample the airstream, using a method acceptable to the manufacturer. Many manufacturers call for measuring the pressure differential across the tubes with a manometer while the fan runs. The duct detector itself is visually inspected semiannually (Table 14.3.1)."},{"id":"itm-060","task":"1.2.1","type":"single","diff":2,"q":{"en":"How often, and how, are carbon monoxide (CO) detectors connected to a protected premises fire alarm system tested?"},"opts":[{"en":"Annually, by introducing CO or a listed and labeled test product acceptable to the manufacturer through the vents into the sensing chamber"},{"en":"Every 5 years, by laboratory testing a sample"},{"en":"Monthly, by pressing the test button"},{"en":"Annually, by reading the analog value at the panel only"}],"ans":[0],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(9); §14.4.3.5","exp":"Table 14.4.3.2, item 17(9)(a), and 14.4.3.5 require system CO detectors to be tested at initial acceptance and then annually, introducing CO (or a listed and labeled product acceptable to the manufacturer) through the vents into the sensing chamber. An electronic check or reading the analog value does not prove gas entry."},{"id":"itm-061","task":"1.2.1","type":"single","diff":3,"q":{"en":"A monitor module supervises a fire pump controller's phase-reversal output. Per NFPA 72-2022, how often must this interface equipment connection be tested?"},"opts":[{"en":"Quarterly, because it is a supervisory device"},{"en":"At the same frequency required by the applicable NFPA standard for the equipment being supervised"},{"en":"Every 5 years"},{"en":"Only at initial acceptance"}],"ans":[1],"ref":"NFPA 72-2022 Table 14.4.3.2, item 20; §14.4.4.4","exp":"Per Table 14.4.3.2, item 20, and 14.4.4.4, interface equipment connections are tested at the same frequency required by the applicable NFPA standard for the equipment being supervised. A table note clarifies that a monitor module on interface equipment is not a supervisory device, so the supervisory-device frequencies do not apply. For a fire pump controller, that standard is NFPA 25."},{"id":"itm-062","task":"1.2.1","type":"single","diff":3,"freq":true,"q":{"en":"An annual test was completed in March 2025. Based on the NFPA 72-2022 definition of an annual frequency, what is the latest month in which the next annual test can be performed and still comply?"},"opts":[{"en":"March 2026"},{"en":"April 2026"},{"en":"June 2026"},{"en":"September 2026"}],"ans":[2],"ref":"NFPA 72-2022 Ch. 3 (definition of Frequency)","exp":"Chapter 3 defines annual as once per year, with a minimum of 9 months and a maximum of 15 months between events. March 2025 plus 15 months is June 2026. The other definitions: semiannual 4 to 8 months, quarterly 2 to 4 months, monthly once per calendar month, and weekly once per calendar week."},{"id":"itm-063","task":"1.2.1","type":"single","diff":1,"freq":true,"q":{"en":"Per NFPA 72-2022, how long must inspection, testing, and maintenance records be retained?"},"opts":[{"en":"30 days"},{"en":"Until the next test only"},{"en":"3 years in all cases"},{"en":"Until the next test and for 1 year thereafter"}],"ans":[3],"ref":"NFPA 72-2022 §14.6.2","exp":"Section 14.6.2 requires ITM records to be retained until the next test and for 1 year thereafter. With off-premises monitoring, the supervising station keeps its records of signals, tests, and operations for at least 1 year. As-built drawings and manuals (14.6.1) are kept for the life of the system, on paper or electronically."},{"id":"itm-064","task":"1.2.2","type":"single","diff":1,"q":{"en":"Unless the manufacturer's published instructions state otherwise, smoke alarms must not remain in service longer than how many years from the date of manufacture?"},"opts":[{"en":"5 years"},{"en":"8 years"},{"en":"10 years"},{"en":"15 years"}],"ans":[2],"ref":"NFPA 72-2022 §14.4.5.6","exp":"NFPA 72 Chapter 14 prohibits keeping smoke alarms in service longer than 10 years from the date of manufacture, unless the manufacturer's published instructions say otherwise. That is why the date of manufacture is marked on the alarm. When replacing one, confirm that the new unit is compatible with the existing interconnection."},{"id":"itm-065","task":"1.3.1","type":"single","diff":2,"q":{"en":"Per NFPA 72-2022, what document must be written to clearly establish the scope of the testing of a fire alarm or signaling system?"},"opts":[{"en":"The record of completion"},{"en":"The input/output matrix"},{"en":"The battery calculation sheet"},{"en":"A test plan"}],"ans":[3],"ref":"NFPA 72-2022 §14.2.10","exp":"Section 14.2.10 requires a written test plan that clearly establishes the scope of the testing, and the plan and its results must be documented with the testing records. Annex A.14.4.3.2 says to document, per the plan, the actual scope, including any devices or functions that were not tested."},{"id":"itm-066","task":"1.3.1","type":"single","diff":2,"q":{"en":"After a site-specific software change and the required reacceptance testing, which document must be revised to reflect the changes?"},"opts":[{"en":"The record of completion"},{"en":"The programmer's NICET certificate"},{"en":"The building's certificate of occupancy"},{"en":"The manufacturer's installation manual"}],"ans":[0],"ref":"NFPA 72-2022 §14.4.2.4; §7.5.6","exp":"Section 14.4.2.4 requires a revised record of completion (per 7.5.6) reflecting site-specific software changes, so the owner's documentation matches what the system actually does. This record uses Figure 7.8.2(a), System Record of Completion."},{"id":"itm-067","task":"1.3.1","type":"single","diff":2,"q":{"en":"Which NFPA 72-2022 form (or an alternative record containing all of its applicable information) is used to document periodic inspection and testing?"},"opts":[{"en":"System Record of Completion, Figure 7.8.2(a)"},{"en":"Deviations from Adopted Codes and Standards, Figure 7.8.2(f)"},{"en":"System Record of Inspection and Testing, Figure 7.8.2(g), with its supplementary records"},{"en":"Installation and Inspection Form for Household Fire Alarm Systems, Figure 7.8.2(m)"}],"ans":[2],"ref":"NFPA 72-2022 §7.6.6; §14.6.2.4; Fig. 7.8.2(g)","exp":"Sections 14.6.2.4 and 7.6.6 require ITM to be documented on the inspection and testing record forms: Figure 7.8.2(g) and its supplements for notification, initiating devices, MNS, ECS, and interface equipment, through 7.8.2(l). An alternative record containing all applicable information is also acceptable. Figures 7.8.2(a) through (f) are for the record of completion of an installation."},{"id":"itm-068","task":"1.3.1","type":"single","diff":2,"q":{"en":"Per NFPA 72-2022 Chapter 7, how must a copy of the site-specific software be kept at the protected premises?"},"opts":[{"en":"Only on the service technician's laptop"},{"en":"Printed and taped inside the FACU door"},{"en":"Only in the supervising station's database"},{"en":"Stored on-site in nonvolatile, nonerasable, nonrewritable memory"}],"ans":[3],"ref":"NFPA 72-2022 §7.5.7","exp":"Section 7.5.7 requires a copy of the site-specific software to be provided to the owner and a copy stored on-site in nonvolatile, nonerasable, nonrewritable memory. The 2022 edition clarified that the owner must receive access to the passwords, or the means to obtain them, so other qualified providers can service the system."},{"id":"itm-069","task":"1.3.1","type":"single","diff":2,"q":{"en":"A technician's old checklist references 'Table 14.4.5, Testing Frequencies.' In NFPA 72-2022, where are the periodic testing frequencies found?"},"opts":[{"en":"In the Periodic Frequency column of Table 14.4.3.2 (Testing)"},{"en":"In Table 14.3.1 (Visual Inspection)"},{"en":"Only in Annex A"},{"en":"In the Chapter 7 forms"}],"ans":[0],"ref":"NFPA 72-2022 Table 14.4.3.2","exp":"Older editions had a separate Table 14.4.5 (Testing Frequencies); the frequencies were later merged into the testing methods table. In 2022, Table 14.4.3.2 (Testing) has the columns Initial Acceptance, Periodic Frequency, and Method. Table 14.3.1 gives visual inspection frequencies, not testing frequencies."},{"id":"itm-070","task":"1.3.1","type":"multi","select":2,"diff":1,"q":{"en":"After successful acceptance testing, which TWO items must be provided to the building owner or the owner's designated representative per NFPA 72-2022 14.6.1? (Select TWO.)"},"opts":[{"en":"A set of reproducible as-built installation drawings"},{"en":"The technicians' NICET wallet cards"},{"en":"Operation and maintenance manuals"},{"en":"The manufacturer's sales catalog for all product lines"},{"en":"Sensitivity test results for the next 5 years"}],"ans":[0,2],"ref":"NFPA 72-2022 §14.6.1","exp":"Section 14.6.1 requires the owner to receive a set of reproducible as-built drawings, operation and maintenance manuals, and a written sequence of operation. The annex suggests an input/output matrix for the sequence. The owner keeps these records for the life of the system, on paper or electronically, available to any AHJ."}]},{"topic":{"id":"itm","title":"Inspection, Testing & Maintenance (NFPA 72-2022 Ch. 14)","short":"ITM Ch. 14","tasks":["1.2.1","1.2.2","1.3.1"],"refs":["NFPA 72-2022 Ch. 14"],"guide":"","tabs":[],"glossary":[]},"questions":[{"id":"itm-071","task":"1.2.1","type":"single","diff":1,"q":{"en":"A fire alarm system is monitored by a central station for alarm, supervisory, and trouble signals. Per NFPA 72-2022 Table 14.3.1, how often must the control unit's trouble signals be visually inspected?"},"opts":[{"en":"Weekly"},{"en":"Annually"},{"en":"Semiannually"},{"en":"Quarterly"}],"ans":[2],"ref":"NFPA 72-2022 Table 14.3.1, item 2(1)","exp":"On a monitored system, Table 14.3.1 item 2(1) sets an annual visual inspection for fuses, interfaced equipment, lamps/LEDs, and the primary power supply, but the trouble signals are inspected semiannually. If the system were not monitored, all of these, including trouble signals, would become weekly (item 2(2)). Do not assume the whole control unit is annual."},{"id":"itm-072","task":"1.2.1","type":"multi","select":2,"diff":2,"q":{"en":"Per NFPA 72-2022 Table 14.3.1, which TWO components require only an ANNUAL visual inspection? (Select TWO.)"},"opts":[{"en":"Manual fire alarm boxes"},{"en":"Supervising station alarm transmitters (DACT, DART, RAT)"},{"en":"Audible and visible notification appliances"},{"en":"Radiant energy (flame) detectors"},{"en":"NAC power extenders and remote power supplies"}],"ans":[1,4],"ref":"NFPA 72-2022 Table 14.3.1","exp":"Table 14.3.1 requires an annual visual inspection of supervising station transmitters (DACT, DART, RAT) and of NAC extenders and remote power supplies. Manual fire alarm boxes and notification appliances are inspected semiannually, and radiant energy (flame) detectors are still inspected quarterly. Remember that visual inspection (Table 14.3.1) and testing (Table 14.4.3.2) have different frequencies."},{"id":"itm-073","task":"1.2.1","type":"single","diff":2,"freq":true,"q":{"en":"An aircraft hangar is protected by radiant energy (UV/IR flame) detectors connected to the fire alarm system. Per NFPA 72-2022, what are the required visual inspection and testing frequencies for these detectors?"},"opts":[{"en":"Visual inspection semiannually; testing annually"},{"en":"Visual inspection quarterly; testing semiannually"},{"en":"Visual inspection quarterly; testing annually"},{"en":"Visual inspection annually; testing annually"}],"ans":[1],"ref":"NFPA 72-2022 Table 14.3.1 (item 17); Table 14.4.3.2 (item 17)","exp":"Table 14.3.1 keeps a quarterly visual inspection for radiant energy (flame) detectors, to confirm that nothing blocks their field of view. Table 14.4.3.2 (item 17) requires them to be tested semiannually. Most other detectors are inspected semiannually and tested annually, which is why the flame detector is a common trap."},{"id":"itm-074","task":"1.2.1","type":"single","diff":1,"q":{"en":"A fire alarm system's secondary power supply includes a dedicated engine-driven generator. Per NFPA 72-2022 Table 14.4.3.2, how is the generator tested?"},"opts":[{"en":"Annually, by the fire alarm contractor, during the 5-minute alarm test"},{"en":"Every 3 years, with a capacity load test like a VRLA battery"},{"en":"Semiannually, together with the battery ohmic test"},{"en":"Monthly, by the owner, in accordance with NFPA 110"}],"ans":[3],"ref":"NFPA 72-2022 Table 14.4.3.2, item 6","exp":"Table 14.4.3.2 (item 6) assigns the dedicated generator to the owner, who tests it monthly in accordance with NFPA 110. The annual secondary power test of item 8 (5 minutes in alarm for general alarm systems, 15 minutes for voice systems) and the VRLA battery tests of item 9 are separate requirements."},{"id":"itm-075","task":"1.2.1","type":"single","diff":2,"q":{"en":"NFPA 72-2022 Table 14.4.3.2 (item 9) lists four semiannual tests for VRLA batteries and their charger, which are performed in order. Which sequence is correct?"},"opts":[{"en":"Temperature test, then charger test, then cell/unit voltage test, then ohmic test"},{"en":"Ohmic test, then cell/unit voltage test, then charger test, then temperature test"},{"en":"Charger test, then ohmic test, then temperature test, then cell/unit voltage test"},{"en":"Cell/unit voltage test, then temperature test, then ohmic test, then charger test"}],"ans":[0],"ref":"NFPA 72-2022 Table 14.4.3.2, item 9","exp":"Item 9 numbers the semiannual tests (1) temperature, (2) charger, (3) cell/unit voltage, and (4) ohmic, and they are performed in that order. The temperature test starts by measuring the enclosure's internal ambient temperature when the cabinet door is opened. Replacement or a capacity load test, item 9(5), is required every 3 years."},{"id":"itm-077","task":"1.2.1","type":"single","diff":2,"q":{"en":"Before starting the semiannual tests of the VRLA batteries in a fire alarm control unit, which precaution does NFPA 72-2022 require?"},"opts":[{"en":"Discharge the batteries to 50 percent so the voltage readings are accurate"},{"en":"Verify that any software stored in volatile memory is protected from loss"},{"en":"Obtain written approval from the AHJ"},{"en":"Replace the charger fuse with a new one"}],"ans":[1],"ref":"NFPA 72-2022 Ch. 14 (battery testing); Table 14.4.3.2, item 9","exp":"Before batteries are tested, NFPA 72 Chapter 14 requires verifying that any software stored in volatile memory is protected, because disconnecting or discharging the secondary supply could otherwise erase the programming. Separately, §7.5.7 requires a copy of the site-specific software to be kept on site in nonvolatile, nonerasable, nonrewritable memory."},{"id":"itm-078","task":"1.2.1","type":"single","diff":2,"q":{"en":"An older fire alarm control unit uses nickel-cadmium (NiCd) standby batteries instead of VRLA batteries. How does NFPA 72-2022 address their periodic testing?"},"opts":[{"en":"They are tested exactly like VRLA batteries, using the 13.26 V replacement criterion"},{"en":"They are exempt from periodic testing because they last longer than VRLA batteries"},{"en":"Table 14.4.3.2 has a separate row requiring a monthly specific-gravity test for them"},{"en":"Table 14.4.3.2 no longer has a separate row for them; they are tested per the manufacturer's published instructions or the applicable IEEE standard (IEEE 450 / IEEE 1106)"}],"ans":[3],"ref":"NFPA 72-2022 Table 14.4.3.2 (batteries)","exp":"In the 2022 edition, Table 14.4.3.2 has its own battery row only for VRLA batteries (item 9). Vented lead-acid and nickel-cadmium batteries no longer have their own rows; they are governed by the manufacturer's instructions or by IEEE 450 / IEEE 1106. The 13.26 V replacement value is a VRLA criterion and does not apply to other battery types."},{"id":"itm-079","task":"1.2.1","type":"single","diff":3,"q":{"en":"A VRLA battery is load tested at the 3-hour rate at 77°F (25°C), so KT = 1.0. It reaches the manufacturer's end voltage after 140 minutes. Using % capacity = [T / (180 × KT)] × 100, what does NFPA 72-2022 require?"},"opts":[{"en":"Replace the battery, because its capacity (about 78 percent) is 80 percent or less"},{"en":"Replace the battery at the next scheduled test interval, because its capacity is less than 85 percent"},{"en":"No action until the next 3-year load test"},{"en":"Recharge the battery and repeat the load test in 6 months"}],"ans":[0],"ref":"NFPA 72-2022 Table 14.4.3.2, item 9(5); A.14.4.3.2","exp":"Capacity = 140 ÷ (180 × 1.0) × 100 = 77.8 percent. Item 9(5) of Table 14.4.3.2 requires replacement when capacity is 80 percent or less; only a battery above 80 percent but below 85 percent may wait until the next scheduled test interval. The formula and the KT temperature factors are in Annex A.14.4.3.2."},{"id":"itm-080","task":"1.2.1","type":"single","diff":3,"q":{"en":"A 24 V standby battery consists of two 12 V VRLA batteries in series (12 cells total). During the semiannual charger test at 77°F (25°C), the charger is adjustable and the manufacturer gives no other value. Per the note to NFPA 72-2022 Table 14.4.3.2, to approximately what voltage should the charger be set?"},"opts":[{"en":"24.0 V"},{"en":"26.52 V"},{"en":"27.18 V"},{"en":"28.8 V"}],"ans":[2],"ref":"NFPA 72-2022 Table 14.4.3.2, item 9(2) (note)","exp":"The note to Table 14.4.3.2 states that an adjustable charger is set to 2.265 V per cell ±0.015 V at 77°F (25°C), or per the manufacturer. With 12 cells: 12 × 2.265 = 27.18 V (range 27.00 to 27.36 V). The 13.26 V value is the minimum per 12 V unit in the voltage test; two units give 26.52 V, which is not the charger setting."},{"id":"itm-081","task":"1.2.1","type":"multi","select":2,"diff":2,"q":{"en":"A high-rise building has an in-building emergency voice/alarm communications system (EVACS). Which TWO are part of its annual secondary power test per NFPA 72-2022 Table 14.4.3.2? (Select TWO.)"},"opts":[{"en":"With primary power disconnected, operate the system in alarm for at least 15 minutes"},{"en":"Operate the system in alarm for only 5 minutes, since that duration applies to every system during periodic tests"},{"en":"Keep the primary power disconnected for 24 hours before starting the alarm portion of the test"},{"en":"Measure or verify the standby and alarm currents and compare them with the battery capacity, allowing for the safety margin"},{"en":"Measure the specific gravity of each VRLA cell with a hydrometer"}],"ans":[0,3],"ref":"NFPA 72-2022 Table 14.4.3.2, item 8","exp":"Item 8 (annual) calls for disconnecting primary power, verifying the trouble signal, measuring or verifying standby and alarm currents against battery capacity (with the safety margin), and operating in alarm for at least 15 minutes on voice systems (5 minutes on general alarm systems), then reconnecting primary power. The 24-hour standby figure is a design capacity requirement (§10.6.7.2), not a step of the annual test, and hydrometers are not used on sealed VRLA batteries."},{"id":"itm-082","task":"1.2.1","type":"single","diff":1,"q":{"en":"During the annual test of a fire alarm control unit, what does NFPA 72-2022 Table 14.4.3.2 (item 2) require for the control unit fuses?"},"opts":[{"en":"Replace every fuse with a new one each year"},{"en":"Verify the fuse rating and supervision"},{"en":"Nothing; fuses are only visually inspected"},{"en":"Measure each fuse's resistance and record it as a baseline value"}],"ans":[1],"ref":"NFPA 72-2022 Table 14.4.3.2, item 2","exp":"Item 2 of Table 14.4.3.2 (annual test of the control unit) requires verifying the rating and supervision of the fuses, along with the control unit functions, lamps/LEDs, and primary power supply. The annual visual inspection of fuses on a monitored system is a separate requirement in Table 14.3.1. A replacement fuse must have the same rating and type."},{"id":"itm-083","task":"1.2.1","type":"single","diff":3,"q":{"en":"A system with addressable smoke detectors was accepted in May 2023. Sensitivity tests were performed in April 2024 and April 2026, and all detectors were within their listed and marked sensitivity range both times. The owner keeps records of nuisance alarms. If the test interval is extended to the maximum NFPA 72-2022 allows, what is the latest date for the next sensitivity test?"},"opts":[{"en":"April 2027"},{"en":"April 2028"},{"en":"May 2028"},{"en":"April 2031"}],"ans":[3],"ref":"NFPA 72-2022 §14.4.4.3","exp":"Per §14.4.4.3, sensitivity is checked within 1 year after installation (April 2024) and then every alternate year (April 2026). After the second required calibration test, if the detectors remained in range, the interval may be extended to a maximum of 5 years: April 2026 + 5 = April 2031. April 2028 would be the normal schedule without an extension, and an extension requires keeping records of nuisance alarms."},{"id":"itm-084","task":"1.2.1","type":"single","diff":2,"q":{"en":"A building's smoke detector sensitivity-test interval has been extended to 5 years. This year's records show that nuisance alarms in the third-floor zone increased compared with the previous year. Per NFPA 72-2022, what is required?"},"opts":[{"en":"Perform calibration (sensitivity) tests on the detectors in that zone"},{"en":"Continue with the 5-year schedule; the records are for information only"},{"en":"Disable the third-floor detectors until the 5-year test date"},{"en":"Replace every smoke detector in the building"}],"ans":[0],"ref":"NFPA 72-2022 §14.4.4.3","exp":"When the sensitivity-test interval is extended (maximum 5 years), §14.4.4.3 requires records of nuisance alarms and their trends. In zones where nuisance alarms increase over the previous year, calibration tests must be performed. Disabling detectors would create an impairment and does not correct the cause."},{"id":"itm-085","task":"1.2.1","type":"single","diff":2,"q":{"en":"The last annual test of a fire alarm system was completed in October 2025. The owner asks to perform the next annual test in May 2026 to coordinate with other trades. Based on the NFPA 72-2022 definition of an annual frequency, is this acceptable?"},"opts":[{"en":"Yes; any month during calendar year 2026 counts as annual"},{"en":"No; an annual interval must be at least 9 months, so the earliest compliant month is July 2026"},{"en":"Yes; the definition sets only a 15-month maximum"},{"en":"No; the next annual test must be performed in October 2026 exactly"}],"ans":[1],"ref":"NFPA 72-2022 Ch. 3 (Frequency definitions)","exp":"Chapter 3 defines annual as once per year with a minimum of 9 months and a maximum of 15 months between events. October 2025 to May 2026 is only 7 months, so it is too short; the compliant window runs from July 2026 to January 2027. The flexible window allows scheduling, but not shortening the interval below 9 months."},{"id":"itm-086","task":"1.2.1","type":"single","diff":1,"q":{"en":"The waterflow alarm devices of a wet-pipe sprinkler system were tested in January 2026. Using the NFPA 72-2022 definition of a semiannual frequency, what is the latest month for the next waterflow test?"},"opts":[{"en":"June 2026"},{"en":"July 2026"},{"en":"September 2026"},{"en":"January 2027"}],"ans":[2],"ref":"NFPA 72-2022 Ch. 3 (Frequency definitions); Table 14.4.3.2, item 17(11)","exp":"Waterflow devices are tested semiannually (Table 14.4.3.2, item 17(11)), and Chapter 3 defines semiannual as an interval of 4 to 8 months between events. January 2026 plus 8 months is September 2026. January 2027 would be an annual interval, which does not satisfy this device's frequency."},{"id":"itm-087","task":"1.2.1","type":"single","diff":2,"q":{"en":"A semiannual waterflow test was performed and documented in March 2026. The next semiannual waterflow test is performed in September 2026. Per NFPA 72-2022, until at least when must the March 2026 test record be retained?"},"opts":[{"en":"September 2026"},{"en":"March 2027"},{"en":"March 2028"},{"en":"September 2027"}],"ans":[3],"ref":"NFPA 72-2022 §14.6.2.1","exp":"Per §14.6.2.1, inspection, testing, and maintenance records are retained until the next test and for 1 year thereafter. The next test is in September 2026, so the March 2026 record is kept until September 2027. Counting 1 year from the record's own date (March 2027) is the most common error."},{"id":"itm-088","task":"1.2.1","type":"single","diff":3,"freq":true,"q":{"en":"A system has 300 initiating devices. A site-specific software change directly affects 20 of them. Per NFPA 72-2022, what is the minimum total number of initiating devices that must be tested?"},"opts":[{"en":"48"},{"en":"70"},{"en":"30"},{"en":"50"}],"ans":[0],"ref":"NFPA 72-2022 §14.4.2.4","exp":"Per §14.4.2.4, the 20 affected devices are tested 100 percent. Of the 280 unaffected devices, 10 percent is 28; because 28 is below the 50-device maximum, the cap does not apply. Total: 20 + 28 = 48. The answer 70 wrongly treats the 50-device cap as a fixed number, and 30 is 10 percent of the total without the 100 percent test of the affected devices."},{"id":"itm-090","task":"1.2.1","type":"single","diff":1,"q":{"en":"A technician must perform the waterflow alarm test on a DRY-PIPE sprinkler system without tripping the dry-pipe valve. Per NFPA 72-2022, which method is used?"},"opts":[{"en":"Open the inspector's test connection, as on a wet-pipe system"},{"en":"Use the alarm test bypass connection, in accordance with NFPA 25"},{"en":"Short the pressure switch terminals at the control unit"},{"en":"Open the main drain fully for 5 minutes"}],"ans":[1],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(11)","exp":"Table 14.4.3.2 item 17(11) requires semiannual testing of waterflow devices. On wet-pipe systems water is flowed through the inspector's test connection; on dry-pipe, preaction, and deluge systems the alarm test bypass connection is used in accordance with NFPA 25. These systems normally use a pressure-type switch rather than a vane-type switch, and shorting terminals does not test the device."},{"id":"itm-091","task":"1.2.1","type":"single","diff":1,"q":{"en":"A supervisory switch monitors the water level of a PRESSURE tank. During its annual test per NFPA 72-2022, the supervisory signal must be initiated when the water level rises or falls by:"},"opts":[{"en":"1 in."},{"en":"6 in."},{"en":"12 in."},{"en":"3 in."}],"ans":[3],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(10)","exp":"Per Table 14.4.3.2 item 17(10), the water level switch is tested annually: on a pressure tank it must signal when the level rises or falls 3 in.; on a non-pressure (gravity) tank it must signal when the level drops 12 in. The other supervisory switches in this group (air pressure, room and water temperature) are also annual; only the control valve switch is semiannual."},{"id":"itm-092","task":"1.2.1","type":"single","diff":3,"q":{"en":"Alarm verification is enabled for the smoke detectors on a system. During the annual test, the technician actuates a manual fire alarm box, and the horn/strobes start operating about 45 seconds later. What is the correct conclusion?"},"opts":[{"en":"Acceptable, because alarm verification allows a delay of up to 60 seconds"},{"en":"Acceptable, because the signal reached the supervising station within 90 seconds"},{"en":"Deficient: alarm verification applies only to smoke detectors, and notification must actuate within 10 seconds after the manual box is activated"},{"en":"Acceptable, as long as the delay is less than the 200-second limit for trouble signals"}],"ans":[2],"ref":"NFPA 72-2022 §10.11.1; §23.8.5.4","exp":"Alarm verification (§23.8.5.4) applies only to smoke detectors, with a retard-reset-restart period of no more than 60 seconds. A manual fire alarm box gets no such delay: per §10.11.1, notification must actuate within 10 seconds after the initiating device is activated. A 45-second delay is a deficiency; check the programming (for example, whether the box was mapped to a verification zone). The 200-second figure is for open and ground-fault trouble indication."},{"id":"itm-093","task":"1.2.1","type":"single","diff":2,"q":{"en":"During an annual test, a technician notices that a tenant has installed loud production machinery in one area, and the horns there now seem hard to hear over the noise. The periodic test requires only verifying that the appliances operate. What is the best action?"},"opts":[{"en":"Verify operation and notify the owner in writing that the audible signal level may be inadequate, so it can be evaluated (for example, with sound level measurements as in a reacceptance test)"},{"en":"Nothing beyond verifying operation; sound levels are never re-evaluated after acceptance"},{"en":"Change the horns in that area to the temporal-4 pattern so they stand out"},{"en":"Raise the candela setting of the strobes in that area to compensate for the noise"}],"ans":[0],"ref":"NFPA 72-2022 Table 14.4.3.2, item 22; Annex A","exp":"For periodic testing, Table 14.4.3.2 item 22 requires only verifying operation; sound pressure level is measured at acceptance and reacceptance (Type 2 meter, FAST). Per the annex, when the level is suspected to be low, the owner is notified in writing, and a change in use or noise in the area can call for new measurements as a reacceptance test. Temporal-4 is the carbon monoxide signal, not the evacuation signal."},{"id":"itm-094","task":"1.2.1","type":"single","diff":1,"q":{"en":"During an annual test, three smoke detectors in a locked tenant space cannot be accessed. What should the technician do with the test documentation?"},"opts":[{"en":"Mark them as passed, because they passed last year"},{"en":"Leave them off the report so the record looks complete"},{"en":"Disable them at the control unit until access is available"},{"en":"Record them as not tested, documenting the actual scope of testing in accordance with the test plan"}],"ans":[3],"ref":"NFPA 72-2022 §14.2.10; A.14.4.3.2","exp":"Section 14.2.10 requires a written test plan that establishes the scope of testing, with the plan and its results documented with the test records. Annex A.14.4.3.2 says to document the actual scope, including the devices or functions that were not tested. Disabling the detectors would create an unnecessary impairment."},{"id":"itm-095","task":"1.2.1","type":"multi","select":2,"diff":2,"q":{"en":"A technician performs the SEMIANNUAL visit on a system whose annual tests were completed 6 months ago. Which TWO must be TESTED during this visit per NFPA 72-2022 Table 14.4.3.2? (Select TWO.)"},"opts":[{"en":"Manual fire alarm boxes"},{"en":"Functional (smoke entry) test of spot-type smoke detectors"},{"en":"VRLA battery temperature, charger, cell/unit voltage, and ohmic tests"},{"en":"Secondary power test with 5 minutes in alarm"},{"en":"Control valve supervisory switches"}],"ans":[2,4],"ref":"NFPA 72-2022 Table 14.4.3.2, items 8, 9, and 17","exp":"Per Table 14.4.3.2, VRLA batteries (item 9: temperature, charger, voltage, ohmic) and control valve switches (item 17) are tested semiannually, as are waterflow devices and flame detectors. Manual fire alarm boxes, the smoke detector functional test, and the secondary power test (item 8) are annual. Most equipment is visually inspected every 6 months (Table 14.3.1), but a visual inspection is not a test."}]},{"topic":{"id":"repair","title":"Troubleshooting, Repair and Device Replacement","short":"Repair","tasks":["1.2.2","1.2.1","1.1.2"],"refs":["NFPA 72-2022 Ch. 10, 12, 14, 17 and 18","Bukowski & O'Laughlin, Fire Alarm Signaling Systems (4th ed., NFPA)","NEC 2020 (NFPA 70) Art. 760"],"guide":"\n<h3>What NICET expects at Level I</h3>\n<p>Task <strong>1.2.2 (Repair/replace impaired/deficient devices)</strong> is part of Maintenance (40–50% of the exam). At Level I, working under supervision, the technician is expected to interpret the panel, locate wiring faults with a multimeter, replace devices with <em>listed and compatible</em> equivalents, apply the correct <strong>reacceptance</strong> test, and handle <strong>impairments</strong>. Most questions are scenarios of the type \"you measure X; what is the cause?\". References: NFPA 72-2022 (printed copy allowed in the exam) and Bukowski (study only).</p>\n\n<h3>Step-by-step troubleshooting method</h3>\n<ol>\n<li><strong>Read the panel and the event history:</strong> type of condition, point, and time. An intermittent trouble that has cleared is still in the history.</li>\n<li><strong>Notify:</strong> the supervising station (§14.2.4) and the owner if anything will be out of service (§10.21).</li>\n<li><strong>Isolate the circuit:</strong> disconnect it from the FACU before measuring resistance. Panel voltage and its ground detection circuit distort the reading.</li>\n<li><strong>Measure:</strong> between conductors (EOL value) and each conductor to ground. Stray voltage ≤ 1 V (Table 14.4.3.2, item 15). On NACs, measure the voltage at the last appliance in alarm.</li>\n<li><strong>Half-split:</strong> open the circuit at a midpoint and continue with the half that has the fault. With 64 sections, 6 splits are enough.</li>\n<li><strong>Repair or replace</strong> with listed, compatible equipment.</li>\n<li><strong>Reacceptance</strong> test (§14.4.2), <strong>restore</strong> points, <strong>notify</strong> that the work is finished, and <strong>document</strong>.</li>\n</ol>\n\n<h4>Typical readings (circuit disconnected, 4.7 kΩ EOL)</h4>\n<table>\n<thead><tr><th>Reading</th><th>Interpretation</th></tr></thead>\n<tbody>\n<tr><td>≈ 4.7 kΩ plus wire resistance</td><td>Normal</td></tr>\n<tr><td>OL (infinite)</td><td>Open: cut conductor, loose terminal, or missing EOL</td></tr>\n<tr><td>≈ 0 Ω</td><td>Short between conductors (on a conventional IDC the panel sees it as an alarm)</td></tr>\n<tr><td>≈ 2.35 kΩ</td><td>Two EOLs in parallel (old EOL left in place, or a T-tap)</td></tr>\n<tr><td>One conductor to ground ≈ 0 Ω</td><td>Ground fault on that conductor; locate it by half-splitting</td></tr>\n<tr><td>Low voltage at the last appliance (in alarm)</td><td>Excessive voltage drop: compare with the appliance's listed range</td></tr>\n</tbody>\n</table>\n\n<h3>Class A versus Class B (NFPA 72 §12.3)</h3>\n<table>\n<thead><tr><th>Condition</th><th>Class A (§12.3.1)</th><th>Class B (§12.3.2)</th></tr></thead>\n<tbody>\n<tr><td>Single open</td><td>Everything keeps operating; trouble is annunciated</td><td>Devices beyond the open stop operating; trouble is annunciated</td></tr>\n<tr><td>Single ground fault</td><td>Keeps operating; trouble is annunciated</td><td>Keeps operating (metallic conductors); trouble is annunciated</td></tr>\n<tr><td>Short on a conventional IDC</td><td>The panel reads it as an alarm</td><td>The panel reads it as an alarm</td></tr>\n<tr><td>Short on a NAC</td><td>Trouble (reverse-polarity supervision)</td><td>Trouble (reverse-polarity supervision)</td></tr>\n</tbody>\n</table>\n<p>A single open or ground must be annunciated within 200 s (§12.6.1). On Class B IDCs and NACs, the <strong>EOL goes at the end, after the last device</strong>; a T-tap leaves a branch unsupervised. On Class A, outgoing and return conductors are routed separately (§12.3.8), with limited exceptions (10 ft entering or leaving enclosures, single drops, a single room of 1000 ft² or less). On an SLC, isolator modules confine a short to the segment between two isolators.</p>\n\n<h3>Replacement rules</h3>\n<ul>\n<li><strong>Like for like, or listed as compatible.</strong> 2-wire detectors and anything powered from the IDC or SLC must be listed for use with that control unit (§10.3.3).</li>\n<li><strong>Addressable devices:</strong> same address and same programmed type; otherwise you get \"duplicate address\" or \"wrong type\". Changing the type is a software change (§14.4.2.4).</li>\n<li><strong>Visible appliances:</strong> same candela as the drawings and compatible with the NAC's synchronization (more than two in a field of view must be synchronized, Ch. 18). Observe polarity.</li>\n<li><strong>Heat detectors:</strong> same temperature rating and classification, at least 20°F above the maximum expected ceiling temperature (§17.6.2.3). Color code per Table 17.6.2.1: uncolored, ordinary (135–174°F); white, intermediate (175–249°F); blue, high (250–324°F).</li>\n<li><strong>Dust covers:</strong> remove them before placing the system in service. A detector exposed to construction dust is cleaned and its sensitivity verified, or it is replaced (§17.7.1).</li>\n<li><strong>Fuses:</strong> same rating and same type (for example, slow-blow). Table 14.4.3.2, item 2, calls for verifying rating and supervision. Find out why it blew first.</li>\n<li><strong>Batteries:</strong> same type, voltage, and Ah as the battery calculation, marked with month and year of manufacture (§10.6.10). A VRLA is replaced if a unit measures less than 13.26 V on float, if it is more than 18°F (10°C) above the cabinet's internal ambient, or at 3 years unless a load test shows it can stay (replace if capacity is ≤ 80%) (Table 14.4.3.2, item 9).</li>\n</ul>\n\n<h3>Reacceptance (NFPA 72 §14.4.2)</h3>\n<table>\n<thead><tr><th>Change made</th><th>Minimum test</th></tr></thead>\n<tbody>\n<tr><td>Replacement with a like device</td><td>Test the replaced device. The 10% of the others is not required (A.14.4.2)</td></tr>\n<tr><td>Device added</td><td>Functionally test it</td></tr>\n<tr><td>Device deleted</td><td>Operate another device on the same circuit</td></tr>\n<tr><td>FACU hardware repair</td><td>Table 14.4.3.2, item 2: functions, and lamps and LEDs (§14.4.2.3)</td></tr>\n<tr><td>Site-specific software change</td><td>100% of what is affected, plus 10% of the unaffected initiating devices (maximum 50), and a revised record of completion (§14.4.2.4)</td></tr>\n<tr><td>New or rewired circuit (initial or reacceptance test)</td><td>Open a connection at not less than 10% of the devices on each IDC, NAC, and SLC (Table 14.4.3.2, item 15)</td></tr>\n</tbody>\n</table>\n\n<h3>Impairments, deficiencies, and observations</h3>\n<table>\n<thead><tr><th>Situation</th><th>What NFPA 72-2022 requires</th></tr></thead>\n<tbody>\n<tr><td>Impairment (system or part of it out of service)</td><td>Notify the owner or designated representative. The service provider reports to the AHJ if it lasts more than 8 h. Apply mitigating measures if the AHJ requires them. Notify the owner and the AHJ when it ends. The record is kept 1 year (§10.21)</td></tr>\n<tr><td>Deficiency not corrected at the end of the visit</td><td>Inform the owner in writing within 24 h (§14.2.2)</td></tr>\n<tr><td>Observation (suggested improvement)</td><td>May be communicated; the owner is not required to act on it (§14.2.2)</td></tr>\n<tr><td>Testing</td><td>Before: notify those who receive signals and the occupants; after: notify that testing has concluded (§14.2.4)</td></tr>\n</tbody>\n</table>\n<div class=\"callout warn\">Trap: the <strong>4 hours in 24 h</strong> rule (notify the AHJ and provide a fire watch or evacuate) comes from NFPA 101 and the IFC. The NFPA 72-2022 rule is <strong>8 hours</strong>: the service provider reports to the AHJ (§10.21). If the question says \"per NFPA 72\", the answer is 8 h.</div>\n\n<h3>Detection principles (Bukowski)</h3>\n<table>\n<thead><tr><th>Type</th><th>Principle</th><th>Service notes</th></tr></thead>\n<tbody>\n<tr><td>Ionization</td><td>Smoke reduces the ion current in a chamber with a radioactive source</td><td>Best with small particles (fast flaming fires); affected by air currents</td></tr>\n<tr><td>Photoelectric (light scattering)</td><td>Smoke scatters light from an LED onto a photocell</td><td>Best with large particles (smoldering fires); affected by dust, insects, and steam</td></tr>\n<tr><td>Projected beam</td><td>Obscuration of light between a transmitter and a receiver or reflector</td><td>Structural movement misaligns it: must be mounted on stable surfaces (§17.7.3.7)</td></tr>\n<tr><td>Air sampling (ASD)</td><td>A fan draws air through a pipe network with holes to the detector</td><td>Low flow: holes or filter clogged. High flow: broken pipe or missing end cap. Transport time 120 s maximum (§17.7.3.6)</td></tr>\n<tr><td>Fixed-temperature heat</td><td>The element reaches its set temperature</td><td>Thermal lag: when it operates, the air is already hotter than the set point</td></tr>\n<tr><td>Rate-of-rise</td><td>Temperature rises faster than a preset rate</td><td>Can operate on rapid rises that are not fire</td></tr>\n<tr><td>Rate-compensated</td><td>Operates when the air reaches the set point, regardless of the rate of rise</td><td>Compensates for thermal lag</td></tr>\n</tbody>\n</table>\n\n<h3>Nuisance alarms: cause and correction</h3>\n<table>\n<thead><tr><th>Cause</th><th>Correction</th></tr></thead>\n<tbody>\n<tr><td>Construction dust</td><td>Covers, and points disabled with notification; afterward, clean or replace</td></tr>\n<tr><td>Steam (showers, kitchens)</td><td>Relocate, or use another detector type approved by the designer or the AHJ</td></tr>\n<tr><td>Insects</td><td>Clean and protect per the manufacturer</td></tr>\n<tr><td>HVAC air currents</td><td>Relocate out of the direct airflow (§17.7.4). Limits in §17.7.1.8: 32–100°F, RH ≤ 93%, air ≤ 300 ft/min</td></tr>\n<tr><td>Dirty detector or \"maintenance alert\"</td><td>Clean and verify sensitivity; if still out of range, replace (§14.4.4.3)</td></tr>\n</tbody>\n</table>\n\n<h3>Panel operations</h3>\n<ul>\n<li><strong>Acknowledge:</strong> confirms the event and silences the panel buzzer; it does not clear the condition.</li>\n<li><strong>Alarm silence:</strong> turns off the notification appliances; the system stays in alarm and a subsequent alarm reactivates them.</li>\n<li><strong>Reset:</strong> works only if the initiating devices have already restored (manual station reset, smoke cleared from the chamber). It does not re-enable disabled points.</li>\n<li><strong>Drill:</strong> manually activates the notification appliances. <strong>Walk test:</strong> one-person test; notify the supervising station and exit the mode when finished.</li>\n<li><strong>Disable/enable:</strong> every disabled point is an impairment; re-enable it and verify the normal state.</li>\n<li>A silenced trouble that has not been corrected must resound at intervals not exceeding 24 h (Ch. 10).</li>\n</ul>\n\n<div class=\"callout warn\">Common traps: (1) a short on a conventional IDC gives an <strong>alarm</strong>, not a trouble; (2) measuring ohms with the circuit connected; (3) confusing 4 h (NFPA 101/IFC) with 8 h (NFPA 72); (4) believing that a like replacement requires testing 10% of the other devices; (5) believing that a reset re-enables points; (6) raising the candela \"to be safe\".</div>\n\n<h3>How to find it fast in the printed code book</h3>\n<ul>\n<li><strong>Pathway classes and supervision:</strong> Ch. 12 (§12.3 classes, §12.3.8 Class A separation, §12.6.1 200-second limit). Tab the start of Chapter 12.</li>\n<li><strong>Compatibility, power, batteries, and impairments:</strong> Ch. 10 (§10.3.3, §10.6.5, §10.6.10, §10.21).</li>\n<li><strong>Reacceptance and test methods:</strong> Ch. 14 (§14.2.2, §14.2.4, §14.4.2, §14.4.4.3). Table 14.4.3.2 is long — tab it and flip by item number: 2 FACU, 9 VRLA, 15 conductors, 17 initiating devices.</li>\n<li><strong>Detectors:</strong> Ch. 17 (§17.6 heat, §17.7 smoke). <strong>Wiring:</strong> NEC Art. 760.</li>\n<li>In the index at the back of NFPA 72, look up \"Reacceptance testing\", \"Impairments\", \"Deficiency\", \"Sensitivity testing\", and \"Batteries\". A section marked with an asterisk (*) has explanatory material in Annex A (for example, A.14.4.2 on like-for-like replacement); it is not mandatory but explains the intent. Highlight 13.26 V and \"FIRE ALARM CIRCUIT\" so they jump off the page.</li>\n</ul>\n<div class=\"callout\">Tip: in every scenario, first decide whether it is an alarm, supervisory, or trouble condition; then Class A or B; and then which test or notification the code requires.</div>\n","tabs":[{"ref":"NFPA 72 §10.3.3","what":"Devices powered by the IDC/SLC must be listed for use with the control unit (2-wire compatibility)"},{"ref":"NFPA 72 §10.6.5","what":"Dedicated branch circuit: red marking, restricted access, 'FIRE ALARM CIRCUIT'"},{"ref":"NFPA 72 §10.6.10","what":"Secondary batteries: month/year of manufacture marking"},{"ref":"NFPA 72 §10.21","what":"Impairments: notify owner, report to AHJ if >8 h, keep record 1 year, notify when ended"},{"ref":"NFPA 72 §12.3.1 / §12.3.2","what":"Class A and Class B performance with an open and a ground fault"},{"ref":"NFPA 72 §12.3.8","what":"Class A: outgoing and return conductors routed separately (10 ft, 1000 ft² exceptions)"},{"ref":"NFPA 72 §12.6.1","what":"Monitoring for integrity: open or ground annunciated within 200 s"},{"ref":"NFPA 72 §14.2.2","what":"Impairments, deficiencies (in writing within 24 h), and observations"},{"ref":"NFPA 72 §14.2.4","what":"Notification before and after testing"},{"ref":"NFPA 72 §14.4.2 and A.14.4.2","what":"Reacceptance: added, deleted, FACU hardware, software (10%, max. 50)"},{"ref":"NFPA 72 Table 14.4.3.2 item 2","what":"Control unit: functions, fuses (rating and supervision), LEDs, primary power"},{"ref":"NFPA 72 Table 14.4.3.2 item 9","what":"VRLA: temperature (18°F), charger, 13.26 V per unit, ohmic, 3 years / load test"},{"ref":"NFPA 72 Table 14.4.3.2 item 15","what":"Conductors: stray voltage ≤ 1 V, ground, shorts, loop resistance, 10% circuit integrity"},{"ref":"NFPA 72 Table 14.4.3.2 item 17","what":"Initiating devices: nonrestorable heat at 15 years, valves 2 revolutions or 1/5, ASD, projected beam"},{"ref":"NFPA 72 §14.4.4.3","what":"Smoke detector sensitivity: 1 year, every alternate year, up to 5 years; out of range → clean or replace"},{"ref":"NFPA 72 §14.6","what":"Inspection, testing, and maintenance records (retention)"},{"ref":"NFPA 72 §17.6.2 / Table 17.6.2.1","what":"Heat detector temperature classification and color code (+20°F above ceiling)"},{"ref":"NFPA 72 §17.7.1.8","what":"Smoke detector ambient limits (32–100°F, 93% RH, 300 ft/min)"},{"ref":"NFPA 72 §17.7.3.6 / §17.7.3.7","what":"Air sampling detectors (120 s transport) and projected beam detectors (stable mounting)"},{"ref":"NEC 2020 760.30, 760.41(B), 760.154","what":"Circuit identification, FACU branch circuit, PLFA cable substitution"}],"glossary":[{"en":"Trouble signal","def":"Signal indicating a fault in a monitored circuit or component (open, ground, loss of ac power), not a fire."},{"en":"Supervisory signal","def":"Indicates an off-normal condition of a monitored system, such as a closed sprinkler valve or low air pressure."},{"en":"Open circuit","def":"Loss of continuity in a conductor; the ohmmeter reads OL (infinite)."},{"en":"Short circuit","def":"Contact between circuit conductors; read as an alarm on a conventional IDC and as a trouble on a NAC."},{"en":"Ground fault","def":"Contact between a circuit conductor and ground (box, conduit, structure); annunciated as a trouble."},{"en":"End-of-line (EOL) resistor","def":"Resistor installed at the end of the circuit that lets the panel supervise continuity."},{"en":"Initiating device circuit (IDC)","def":"Circuit for conventional detectors and manual stations; reports by zone."},{"en":"Notification appliance circuit (NAC)","def":"Circuit that powers horns, strobes, and speakers; supervised with reverse polarity."},{"en":"Signaling line circuit (SLC)","def":"Communication circuit for addressable devices; carries data from multiple points."},{"en":"Pathway class (A / B)","def":"Class A has a redundant path and keeps operating with an open; Class B does not, and loses everything beyond the open."},{"en":"T-tap","def":"A branch taken from the middle of a circuit; on Class B IDCs and NACs it leaves sections unsupervised."},{"en":"Half-splitting","def":"
