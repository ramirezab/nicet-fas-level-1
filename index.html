ng the lockout devices and relieving stored energy, but before starting work?"},"opts":[{"en":"Notify the AHJ that the equipment is locked out"},{"en":"Remove the tag so it does not get damaged during the work"},{"en":"Restore power briefly to confirm that the breaker operates"},{"en":"Verify isolation and de-energization (try the controls and test for absence of voltage)"}],"ans":[3],"ref":"29 CFR 1910.147(d)(6); 1910.333(b)(2)(iv)","exp":"The sequence is: prepare, shut down, isolate, apply locks and tags, relieve stored energy, and VERIFY isolation before starting work (1910.147(d)(1)–(6)). For electrical work, a qualified person uses test equipment to verify that there is no voltage (1910.333(b)(2)(iv)). Notifying the monitoring company or the owner that the fire alarm is out of service is an NFPA 72 matter, not a lockout step."},{"id":"safety-025","task":"1.1.3","type":"single","diff":3,"q":{"en":"A technician will replace the main board of a fire alarm control unit. The dedicated 120-V branch circuit breaker has been locked and tagged. What additional step is needed to reach a zero-energy state?"},"opts":[{"en":"None; once the breaker is locked, the panel is de-energized"},{"en":"Disconnect the standby batteries (secondary power source), then verify the absence of voltage"},{"en":"Silence the panel so the notification appliances do not activate"},{"en":"Put the panel in walk-test mode"}],"ans":[1],"ref":"29 CFR 1910.333(b)(2)(ii)(B)–(C); 1910.147(d)(5)","exp":"Equipment must be disconnected from ALL energy sources (1910.333(b)(2)(ii)(B)). A fire alarm panel has a secondary source (batteries) that keeps it powered even with the breaker locked out; disconnect them and then verify the absence of voltage. Also coordinate the out-of-service system with the owner and the monitoring company."},{"id":"safety-026","task":"1.1.3","type":"single","diff":2,"q":{"en":"Before touching the conductors of a locked-out 120-V circuit that feeds a power supply, how should a qualified technician verify that the circuit is de-energized?"},"opts":[{"en":"Use a properly rated tester: check it on a known live source, test the circuit, then recheck it on the known live source"},{"en":"Touch the conductors briefly with the back of the hand"},{"en":"Check that the breaker handle is in the OFF position"},{"en":"Wave a non-contact tester near the cable once, without checking the tester"}],"ans":[0],"ref":"29 CFR 1910.333(b)(2)(iv)(B); NFPA 70E Art. 120 (general awareness)","exp":"OSHA requires a qualified person to use test equipment to verify that circuit parts are de-energized, including from induced voltage or backfeed (1910.333(b)(2)(iv)(B)). The NFPA 70E practice is live-dead-live, checking the tester before and after; OSHA requires that check explicitly above 600 V, but it is good practice always. The handle position proves nothing."},{"id":"safety-027","task":"1.1.3","type":"single","diff":1,"q":{"en":"A technician must work near exposed energized parts inside an electrical room. Which items should be removed before starting?"},"opts":[{"en":"Safety glasses"},{"en":"Metal watch band, rings, and neck chains"},{"en":"Leather work boots"},{"en":"Cotton work shirt"}],"ans":[1],"ref":"29 CFR 1910.333(c)(8)","exp":"Conductive articles of jewelry and clothing (metal watch bands, rings, bracelets, neck chains, key chains) must not be worn if they could contact exposed energized parts, unless they are rendered nonconductive (1910.333(c)(8)). Cotton clothing and leather boots are not prohibited by this rule."},{"id":"safety-028","task":"1.1.3","type":"single","diff":1,"freq":true,"q":{"en":"On a construction site, OSHA requires 120-V, single-phase, 15- and 20-A receptacle outlets that are not part of the building's permanent wiring and are used by employees to be protected by:"},"opts":[{"en":"AFCI circuit breakers"},{"en":"Surge protective devices"},{"en":"GFCIs, or the employer must use an assured equipment grounding conductor program"},{"en":"Twist-lock plugs only"}],"ans":[2],"ref":"29 CFR 1926.404(b)(1)(i)–(ii)","exp":"The employer must provide GFCIs for all 120-V, single-phase, 15- and 20-A receptacle outlets that are not part of the permanent wiring, or use an assured equipment grounding conductor program (AEGCP) (1926.404(b)(1)). NEC 2020 Article 590 (temporary installations), which you will have in the printed NEC, also requires GFCI protection."},{"id":"safety-029","task":"1.1.3","type":"single","diff":3,"q":{"en":"Under an assured equipment grounding conductor program (AEGCP), cord sets and cord-and-plug-connected equipment must be tested before first use, after repairs, after suspected damage, and at intervals not exceeding:"},"opts":[{"en":"3 months"},{"en":"6 months for all equipment"},{"en":"1 month"},{"en":"12 months"}],"ans":[0],"ref":"29 CFR 1926.404(b)(1)(iii)(E)","exp":"The AEGCP requires a written program, a competent person, a daily visual inspection before use, and continuity and terminal-connection tests of the equipment grounding conductor at intervals not exceeding 3 months; only cord sets and receptacles that are fixed and not exposed to damage may go to 6 months (1926.404(b)(1)(iii)). Test results are recorded."},{"id":"safety-030","task":"1.1.3","type":"multi","select":2,"diff":2,"q":{"en":"Which TWO statements about extension cords and flexible cords on a construction site are correct per OSHA 1926.405? (Select TWO.)"},"opts":[{"en":"Two-wire cord sets are acceptable for any portable tool on the job site"},{"en":"Cords may be run through holes in walls or above a drop ceiling as a substitute for fixed wiring"},{"en":"Extension cord sets used with portable electric tools must be three-wire type and designed for hard or extra-hard usage"},{"en":"Flexible cords may be spliced with electrical tape if at least three layers are applied"},{"en":"Flexible cords must be protected from damage, and sharp corners and projections must be avoided"}],"ans":[2,4],"ref":"29 CFR 1926.405(a)(2)(ii)(I)–(J), (g)(1)(iii), (g)(2)(iii)","exp":"Extension cords used with portable tools must be three-wire type and designed for hard or extra-hard usage, and flexible cords must be protected from damage and sharp corners (1926.405(a)(2)(ii)). They are not a substitute for fixed wiring, are not run through holes in walls or ceilings, and are used in continuous lengths without splices (only hard-service cords No. 12 or larger may be repaired with a splice that keeps the cord's properties)."},{"id":"safety-031","task":"1.1.3","type":"single","diff":2,"q":{"en":"OSHA 1910.95 requires the employer to implement a hearing conservation program when employee noise exposure equals or exceeds an 8-hour time-weighted average of:"},"opts":[{"en":"80 dBA"},{"en":"85 dBA"},{"en":"90 dBA"},{"en":"95 dBA"}],"ans":[1],"ref":"29 CFR 1910.95(c)(1)","exp":"The action level is an 85 dBA 8-hour TWA: at or above it a hearing conservation program is required, with hearing protectors at no cost, a baseline audiogram within 6 months and then annually, and annual training (1910.95(c)–(k)). 90 dBA is the permissible exposure limit (PEL) of Table G-16; in construction, 1926.52 uses the same 90 dBA."},{"id":"safety-032","task":"1.1.3","type":"single","diff":3,"q":{"en":"Using OSHA's permissible noise exposure table (Table G-16), how long may a worker be exposed to 100 dBA per day without exceeding the permissible exposure?"},"opts":[{"en":"8 hours"},{"en":"4 hours"},{"en":"2 hours"},{"en":"1 hour"}],"ans":[2],"ref":"29 CFR 1910.95(b), Table G-16","exp":"Table G-16 halves the allowed time for every 5 dB: 90 dBA = 8 h, 95 = 4 h, 100 = 2 h, 105 = 1 h, 110 = ½ h, 115 = ¼ h or less. At 100 dBA (for example, a rotary hammer on concrete), the maximum is 2 hours without hearing protection."},{"id":"safety-033","task":"1.1.3","type":"single","diff":1,"freq":true,"q":{"en":"A technician is drilling overhead into a concrete deck to install anchors for cable supports. What eye protection is required?"},"opts":[{"en":"Safety glasses or goggles meeting ANSI Z87.1, with side protection"},{"en":"Regular prescription glasses"},{"en":"Sunglasses with UV protection"},{"en":"None, if wearing a hard hat with a full brim"}],"ans":[0],"ref":"29 CFR 1926.102(a)(1)–(3), (b)(1)","exp":"Flying particles require eye protection that meets ANSI Z87.1, with side protection (1926.102(a)(2) and (b)(1)). Workers who wear prescription lenses need protection that incorporates the prescription or fits over the glasses without disturbing them ((a)(3)). A hard hat does not protect the eyes."},{"id":"safety-034","task":"1.1.3","type":"single","diff":2,"q":{"en":"The employer requires a technician to wear a half-face elastomeric respirator while drilling in a dusty area. What is required BEFORE the technician uses it?"},"opts":[{"en":"Only reading the label on the manufacturer's box"},{"en":"A medical evaluation and a fit test (repeated at least annually), plus a user seal check each time it is put on"},{"en":"A fit test only once every 5 years"},{"en":"Nothing, as long as the technician keeps a full beard to improve the seal"}],"ans":[1],"ref":"29 CFR 1910.134(e)(1), (f)(2), (g)(1)","exp":"A medical evaluation is required before fit testing or use (1910.134(e)(1)); fit testing is done before first use and at least annually ((f)(2)); and a user seal check is done every time the respirator is put on ((g)(1)(iii)). Facial hair between the sealing surface and the face is prohibited with tight-fitting respirators ((g)(1)(i)(A))."},{"id":"safety-035","task":"1.1.3","type":"single","diff":2,"q":{"en":"A technician wants to know which gloves and respiratory protection are recommended for a firestop sealant. In the 16-section GHS-format Safety Data Sheet, which section should be checked?"},"opts":[{"en":"Section 2, Hazard(s) identification"},{"en":"Section 4, First-aid measures"},{"en":"Section 11, Toxicological information"},{"en":"Section 8, Exposure controls/personal protection"}],"ans":[3],"ref":"29 CFR 1910.1200(g)(2) and Appendix D","exp":"The SDS has 16 sections in a fixed order; Section 8 covers exposure controls and personal protection (1910.1200(g)(2)). Other useful ones: 2 hazards, 4 first aid, 5 firefighting, 7 handling and storage. SDSs must be accessible on every shift, and workers must be trained at initial assignment and whenever a new hazard is introduced."},{"id":"safety-036","task":"1.1.3","type":"multi","select":2,"diff":3,"q":{"en":"A technician will spend about 5 hours drilling anchor holes into a concrete ceiling with a rotary hammer. To follow OSHA silica Table 1 for handheld drills, which TWO controls apply? (Select TWO.)"},"opts":[{"en":"Use a drill with a commercially available shroud or cowling and a dust collection system with a filter of 99% or greater efficiency and a filter-cleaning mechanism"},{"en":"Wear a respirator with an APF of 10 because the task exceeds 4 hours"},{"en":"Use a HEPA-filtered vacuum when cleaning the holes"},{"en":"Clean the holes by blowing them out with compressed air"},{"en":"Dry sweep the concrete dust at the end of the shift"}],"ans":[0,2],"ref":"29 CFR 1926.1153(c)(1), Table 1; (f)","exp":"For handheld drills, Table 1 calls for a shroud or cowling with a dust collection system (filter of 99% or greater efficiency, with a filter-cleaning mechanism) and a HEPA-filtered vacuum to clean the holes; no respirator is required, even beyond 4 hours. Dry sweeping and compressed air are restricted (1926.1153(f)). PEL: 50 µg/m³; action level: 25 µg/m³."},{"id":"safety-037","task":"1.1.3","type":"single","diff":1,"q":{"en":"In a building constructed in 1972, a technician must route cable past pipes wrapped in old thermal insulation that is damaged and crumbling. What should the technician do?"},"opts":[{"en":"Carefully cut away the insulation while wearing a dust mask"},{"en":"Wet the insulation and continue working"},{"en":"Sweep up the debris so the area is clean before pulling cable"},{"en":"Stop, do not disturb the material, and report it to the supervisor so it can be identified before work continues"}],"ans":[3],"ref":"29 CFR 1926.1101(b) (PACM), (k)","exp":"Thermal system insulation and surfacing material in buildings constructed no later than 1980 are presumed asbestos-containing material (PACM) until proven otherwise (1926.1101(b)). Only trained personnel may disturb it; the technician must stop, not touch it, and report it. The building owner must communicate the location of known asbestos ((k)). PEL: 0.1 f/cc."},{"id":"safety-038","task":"1.1.3","type":"single","diff":2,"q":{"en":"A technician is acting as the attendant for a permit-required confined space entry (a vault containing fire alarm cabling). The entrant collapses inside. What should the attendant do?"},"opts":[{"en":"Enter immediately and pull the entrant out"},{"en":"Leave the area to look for the supervisor"},{"en":"Remain outside, summon rescue services, and use non-entry retrieval equipment if available"},{"en":"Ventilate the space with a fan for a minute, then enter without a respirator"}],"ans":[2],"ref":"29 CFR 1910.146(i)(4), (i)(7); 1926 Subparte AA","exp":"The attendant remains outside the space until relieved and summons rescue as soon as a problem is detected (1910.146(i)); the attendant may enter only if trained, equipped, and relieved by another attendant. Many confined space deaths are would-be rescuers. Hazardous atmosphere: O₂ below 19.5% or above 23.5%, or flammables above 10% of the LFL."},{"id":"safety-039","task":"1.1.3","type":"single","diff":2,"q":{"en":"Per OSHA 1926.652, employees in an excavation must be protected from cave-ins by an adequate protective system, except in stable rock or when the excavation is less than how deep and a competent person finds no indication of a potential cave-in?"},"opts":[{"en":"4 ft"},{"en":"5 ft"},{"en":"6 ft"},{"en":"8 ft"}],"ans":[1],"ref":"29 CFR 1926.652(a)(1); 1926.651(c)(2)","exp":"A protective system (sloping, shoring, or a shield/trench box) is required at 5 ft (1.52 m) or deeper, except in stable rock (1926.652(a)(1)). Another number: trenches 4 ft or deeper need a ladder, ramp, or other means of egress within 25 ft of lateral travel (1926.651(c)(2)), and spoil is kept at least 2 ft back from the edge."},{"id":"safety-040","task":"1.1.3","type":"single","diff":2,"q":{"en":"A technician is asked to use a powder-actuated tool to fasten cable supports to a structure. Which statement is consistent with OSHA 1926.302(e)?"},"opts":[{"en":"Any experienced electrician may operate it, even without training on that tool"},{"en":"It may drive fasteners into glazed tile or hollow tile if set to low power"},{"en":"Only employees trained on that particular tool may operate it, and it must be tested each day before loading"},{"en":"It may be loaded at the start of the shift so it is ready when needed"}],"ans":[2],"ref":"29 CFR 1926.302(e)(1)–(6)","exp":"Only employees trained in the operation of the particular tool may use it, and it is tested each day before loading (1926.302(e)(1)–(2)). It is loaded just before firing, never pointed at anyone, never left loaded unattended, and not fired into very hard or brittle materials (cast iron, glazed tile, glass block, hollow tile) or in explosive atmospheres."},{"id":"safety-041","task":"1.1.3","type":"single","diff":1,"q":{"en":"A small fire starts inside an energized fire alarm control unit. Which fire extinguisher class is rated for fires involving energized electrical equipment?"},"opts":[{"en":"Class A"},{"en":"Class D"},{"en":"Class K"},{"en":"Class C"}],"ans":[3],"ref":"NFPA 10 (fire classes); 29 CFR 1910.157","exp":"Classes: A ordinary combustibles, B flammable liquids and gases, C energized electrical equipment, D combustible metals, K cooking oils and fats. An ABC extinguisher works on the panel; if it is safe, shut off the power. Use the PASS technique (Pull, Aim, Squeeze, Sweep), and only if trained (1910.157(g))."},{"id":"safety-042","task":"1.1.3","type":"single","diff":3,"q":{"en":"During construction, one floor of a building has 12,000 sq ft of protected area. Under OSHA 1926.150, what is the minimum number of fire extinguishers rated at least 2A for that floor (assuming the 100-ft travel distance is also met)?"},"opts":[{"en":"1"},{"en":"2"},{"en":"4"},{"en":"6"}],"ans":[2],"ref":"29 CFR 1926.150(c)(1)(i)","exp":"One extinguisher rated at least 2A is required for each 3,000 ft² of protected area, with a maximum travel distance of 100 ft to the nearest one: 12,000 ÷ 3,000 = 4 (1926.150(c)(1)(i)). Multistory buildings need at least one next to the stairway on each floor, and a 10B unit within 50 ft wherever more than 5 gallons of flammable liquids are used."},{"id":"safety-043","task":"1.1.3","type":"single","diff":3,"q":{"en":"A technician reports an unguarded floor opening to OSHA after the supervisor ignored it, and is then disciplined for reporting. Under Section 11(c) of the OSH Act, how long does the technician have to file a retaliation complaint with OSHA?"},"opts":[{"en":"30 days"},{"en":"90 days"},{"en":"180 days"},{"en":"1 year"}],"ans":[0],"ref":"OSH Act Sec. 11(c); 29 CFR 1977","exp":"Section 11(c) protects workers who report hazards or injuries; a retaliation complaint must be filed within 30 days. The employer must provide a workplace free of recognized hazards (General Duty Clause, Sec. 5(a)(1)), and the employee must comply with applicable standards and rules (Sec. 5(b))."},{"id":"safety-044","task":"1.1.3","type":"single","diff":2,"q":{"en":"A technician gets a metal shaving in the eye while drilling a back box. At the clinic it is removed using only irrigation, and the technician returns to work the same day with no restrictions. For the OSHA 300 log, this case is:"},"opts":[{"en":"Recordable, because the technician went to a clinic"},{"en":"Recordable as a days-away-from-work case"},{"en":"Recordable, because every eye injury must be logged"},{"en":"Not recordable; removing a foreign body from the eye using only irrigation or a cotton swab is first aid"}],"ans":[3],"ref":"29 CFR 1904.7(b)(5)(ii); 1904.29(b)(3)","exp":"A case is recordable if it involves death, days away from work, restricted work, medical treatment beyond first aid, loss of consciousness, or a significant diagnosis (1904.7). Removing a foreign body from the eye using only irrigation or a cotton swab is first aid. Recordable cases are entered within 7 calendar days, and the 300A summary is posted from February 1 to April 30."},{"id":"safety-045","task":"1.1.3","type":"single","diff":2,"q":{"en":"An employer must report a work-related in-patient hospitalization of an employee, an amputation, or the loss of an eye to OSHA within:"},"opts":[{"en":"8 hours"},{"en":"24 hours"},{"en":"7 calendar days"},{"en":"30 days"}],"ans":[1],"ref":"29 CFR 1904.39(a)","exp":"A work-related fatality is reported to OSHA within 8 hours; an in-patient hospitalization, amputation, or loss of an eye within 24 hours (1904.39). Reports can be made by phone, in person, or online. The 7 calendar days is the deadline to record a case on the 300 log, not to report it."},{"id":"safety-046","task":"1.1.3","type":"single","diff":1,"q":{"en":"A coworker has fallen from a ladder and is lying in a corridor where a scissor lift is still moving. According to the Red Cross emergency action steps (Check–Call–Care), what should you do FIRST?"},"opts":[{"en":"Check the scene for safety (stop the lift), then check the person for responsiveness and breathing"},{"en":"Immediately roll the person over and sit him up"},{"en":"Go to the office and fill out the incident report"},{"en":"Give the person water to drink"}],"ans":[0],"ref":"American Red Cross First Aid/CPR/AED — Check, Call, Care","exp":"The Red Cross says CHECK first: make sure the scene is safe, then check the person (responsiveness and breathing for no more than 10 seconds); then CALL (911 and get an AED) and CARE. Do not move someone who has fallen, because of possible spinal injury, unless there is immediate danger, and do not give anything to drink."},{"id":"safety-047","task":"1.1.3","type":"single","diff":1,"freq":true,"q":{"en":"According to current Red Cross adult CPR guidance, chest compressions should be delivered at what rate?"},"opts":[{"en":"60–80 per minute"},{"en":"80–100 per minute"},{"en":"100–120 per minute"},{"en":"130–150 per minute"}],"ans":[2],"ref":"American Red Cross Adult CPR","exp":"Adult compressions are given at 100–120 per minute, at a depth of at least 2 in. (5 cm), letting the chest fully recoil, in cycles of 30 compressions and 2 breaths, with minimal interruptions."},{"id":"safety-048","task":"1.1.3","type":"multi","select":2,"diff":2,"q":{"en":"Which TWO statements describe high-quality adult CPR per current Red Cross guidance? (Select TWO.)"},"opts":[{"en":"Give cycles of 15 compressions and 2 breaths when you are the only rescuer"},{"en":"Compress the chest at least 2 in. and let it fully recoil between compressions"},{"en":"Pause compressions for about 30 seconds each cycle to check for a pulse"},{"en":"Compress only about 1 in. deep to avoid rib injuries"},{"en":"Give cycles of 30 compressions and 2 rescue breaths, minimizing interruptions"}],"ans":[1,4],"ref":"American Red Cross Adult CPR","exp":"High-quality adult CPR: at least 2 in. deep with full recoil, 100–120 per minute, 30:2 cycles, and minimal interruptions (less than 10 seconds). Each breath lasts about 1 second and should make the chest rise. The 15:2 cycle is for two-rescuer CPR on a child or infant, not an adult."},{"id":"safety-049","task":"1.1.3","type":"single","diff":2,"q":{"en":"An AED has just delivered a shock to a coworker in cardiac arrest. What should the rescuer do next, per Red Cross guidance?"},"opts":[{"en":"Immediately resume CPR, starting with compressions, and follow the AED prompts"},{"en":"Check for a pulse for a full minute before doing anything else"},{"en":"Remove the pads and turn off the AED"},{"en":"Wait without touching the person until the AED delivers a second shock"}],"ans":[0],"ref":"American Red Cross AED steps","exp":"AED steps: turn it on, expose and dry the chest, apply the pads (upper right chest and lower left side, below the armpit), make sure no one touches the person ('CLEAR'), let it analyze, and deliver a shock if advised. After the shock, resume CPR immediately (about 2 minutes) until the AED reanalyzes."},{"id":"safety-050","task":"1.1.3","type":"single","diff":1,"freq":true,"q":{"en":"After a shock in an electrical room, a coworker is still in contact with an energized conductor. What must you do before touching the victim?"},"opts":[{"en":"Quickly pull the victim away by the arm"},{"en":"Splash water on the victim to break the contact"},{"en":"Begin rescue breaths right away"},{"en":"Make sure the power is turned off (open the breaker or disconnect) and the scene is safe"}],"ans":[3],"ref":"American Red Cross First Aid — electrical injuries","exp":"Never touch a victim who is still in contact with the source: first shut off the power and make the scene safe; then call 911, check breathing, and give CPR/AED if needed. Look for entry and exit burns; every electric shock victim needs medical evaluation for possible internal injuries or abnormal heart rhythms."},{"id":"safety-051","task":"1.1.3","type":"multi","select":2,"diff":2,"q":{"en":"A technician's forearm is badly cut by falling sheet metal and the bleeding is life-threatening; firm direct pressure is not controlling it. Which TWO actions follow Red Cross tourniquet guidance? (Select TWO.)"},"opts":[{"en":"Place the tourniquet directly over the elbow joint"},{"en":"Place the tourniquet about 2–3 in. above the wound (between the wound and the heart), not on a joint"},{"en":"Loosen the tourniquet every 10 minutes to restore circulation"},{"en":"Note the time it was applied and leave it in place for EMS"},{"en":"Place the tourniquet directly on top of the wound"}],"ans":[1,3],"ref":"American Red Cross — How to apply a tourniquet","exp":"Use direct pressure first; if it does not control life-threatening bleeding from a limb, apply the tourniquet 2–3 in. above the wound, never on the wound or over a joint, and tighten it until the bleeding stops. Note the time, and do not loosen or remove it; medical personnel do that."},{"id":"safety-052","task":"1.1.3","type":"single","diff":1,"q":{"en":"A technician gets a minor thermal burn on the hand from a hot soldering iron. What is the correct first aid per Red Cross guidance?"},"opts":[{"en":"Hold ice directly on the burn for 20 minutes"},{"en":"Cover it with butter or a thick ointment right away"},{"en":"Cool it under cool running water for at least 10 minutes, then cover it loosely with a sterile dressing"},{"en":"Pop any blisters to relieve the pressure"}],"ans":[2],"ref":"American Red Cross First Aid — burns","exp":"Cool a thermal burn as soon as possible with cool running water for at least 10 minutes, then cover it loosely with a sterile dressing. Never use ice (it worsens the injury) or butter, and do not break blisters. Call 911 if the burn is large or deep, or seriously involves the face, hands, or genitals."},{"id":"safety-053","task":"1.1.3","type":"single","diff":3,"q":{"en":"On a summer afternoon, a technician working in an attic becomes confused and is slurring words; the skin is very hot and body temperature appears very high. What is the BEST action?"},"opts":[{"en":"Let the person rest in the attic and drink an energy drink"},{"en":"Call 911 and begin rapid cooling right away, ideally cold-water immersion up to the neck, or cold water, ice packs, and fanning"},{"en":"Give salt tablets and allow a return to work after 30 minutes"},{"en":"Treat it as heat exhaustion: have the person sip water and finish the shift in the shade"}],"ans":[1],"ref":"American Red Cross First Aid — heat-related illness","exp":"Confusion or any change in mental status with very hot skin indicates heat stroke, an emergency: call 911 and cool rapidly; the preferred method is cold-water immersion up to the neck. Heat exhaustion (heavy sweating, cool pale skin, dizziness, nausea) is treated by moving the person to a cool place, loosening clothing, cooling, and giving electrolyte drinks if the person is conscious."},{"id":"safety-054","task":"1.1.3","type":"single","diff":2,"q":{"en":"A coworker in the break room is choking and cannot cough, speak, or breathe. According to the American Red Cross, what should a trained responder do for this conscious adult?"},"opts":[{"en":"Give 5 back blows followed by 5 abdominal thrusts, repeating until the object comes out or the person becomes unresponsive"},{"en":"Do a blind finger sweep immediately"},{"en":"Give the person water to wash the object down"},{"en":"Begin chest compressions while the person is still standing"}],"ans":[0],"ref":"American Red Cross First Aid — choking (adult)","exp":"For a conscious adult who cannot cough, speak, or breathe, the Red Cross calls for cycles of 5 back blows (between the shoulder blades) and 5 abdominal thrusts (fist just above the navel, inward and upward). If the person becomes unresponsive, call 911 and start CPR, checking the mouth before giving breaths. If the person can still cough forcefully, let them keep coughing."},{"id":"safety-055","task":"1.1.3","type":"single","diff":2,"q":{"en":"While a crew is drilling overhead, a small metal sliver becomes embedded in a coworker's eye. What is the correct first aid?"},"opts":[{"en":"Remove the sliver with tweezers"},{"en":"Rinse with water and rub the eye gently"},{"en":"Do not remove the object; stabilize it, avoid pressure on the eye, and get immediate medical care"},{"en":"Apply a tight pressure bandage over the eye to push the object out"}],"ans":[2],"ref":"American Red Cross First Aid — eye injuries; 29 CFR 1926.50(g)","exp":"An object embedded in the eye is not removed: stabilize it without pressure and get immediate medical care (911). For a chemical splash, flush with water continuously until help arrives; OSHA requires eyewash facilities in the work area where corrosive materials are present (1926.50(g)). Prevention: ANSI Z87.1 eyewear when drilling."}]},{"topic":{"id":"docs","title":"Technical Documents, Drawings, and Submittals (NFPA 72-2022 Ch. 7)","short":"Documents","tasks":["1.3.1","1.2.1","1.1.1"],"refs":["NFPA 72-2022 Ch. 7","NFPA 72-2022 §14.6","NFPA 72-2022 §10.3","NEC 2020 Ch. 9, Table 8","Ugly's Electrical References 2020","CSI MasterFormat"],"guide":"\n<h3>What NICET expects from a Level I technician</h3>\n<p>Task <strong>1.3.1 Knowledge of technical documents</strong> belongs to domain 1.3 (Submittal Preparation and System Layout), which is worth 1 to 11 percent of the exam (roughly 1 to 9 of the 85 questions). Level I candidates are not asked to design: you are expected to <strong>recognize, read, and use</strong> the project documents (shop drawings, riser, wiring diagrams, data sheets, sequence of operation, completion and inspection records) and to know what <strong>Chapter 7 of NFPA 72-2022</strong> requires. These documents also show up inside installation (1.1.1) and testing (1.2.1) questions: where the candela is shown, where the EOL goes, which form is filled out, and how long records are kept.</p>\n\n<h3>Map of Chapter 7 (NFPA 72-2022)</h3>\n<table>\n<thead><tr><th>Section</th><th>Topic</th><th>Most frequently asked</th></tr></thead>\n<tbody>\n<tr><td>7.2.1</td><td>Minimum documentation (when the AHJ requires it)</td><td>17-item list: narrative, riser, floor plans, sequence, data sheets, calculations, candela, records, software, record drawings</td></tr>\n<tr><td>7.3</td><td>Design (layout) documents</td><td>7.3.3.6 and 7.3.3.7: indicate pathway class (12.3) and survivability level (12.4)</td></tr>\n<tr><td>7.4</td><td>Shop drawings</td><td>7.4.2 scale; 7.4.4 general information and NFPA 170 symbols; 7.4.5 floor plans; 7.4.6 riser; 7.4.7 control unit; 7.4.8 typical wiring; 7.4.9 sequence; 7.4.10 calculations</td></tr>\n<tr><td>7.5</td><td>Completion documentation</td><td>7.5.3 delivery; 7.5.5 record drawings; 7.5.6 record of completion; 7.5.7 site-specific software; 7.5.8 verification</td></tr>\n<tr><td>7.6</td><td>ITM documentation</td><td>7.6.1 test plan (14.2.10); 7.6.6 record of inspection and testing</td></tr>\n<tr><td>7.7</td><td>Records, retention, and access</td><td>7.7.1 records; 7.7.2 SYSTEM RECORD DOCUMENTS cabinet; 7.7.3 security</td></tr>\n<tr><td>7.8</td><td>Forms</td><td>Figures 7.8.2(a) through 7.8.2(m)</td></tr>\n</tbody>\n</table>\n\n<h3>Minimum documentation (7.2.1): learn it in groups</h3>\n<ul>\n<li><strong>Description:</strong> written narrative of the system's intent and description; sequence of operation in <em>input/output matrix or narrative form</em>.</li>\n<li><strong>Drawings:</strong> riser diagram; floor plans with all devices and control equipment, and on each sheet: point of compass, graphic representation of the scale, room use, and building features that affect device placement; pathway diagrams to shared communications equipment; record (as-built) drawings.</li>\n<li><strong>Equipment data:</strong> technical data sheets and manufacturers' published instructions, including operation and maintenance.</li>\n<li><strong>Calculations:</strong> battery capacity with safety margin (where batteries are provided) and NAC voltage drop.</li>\n<li><strong>Notification:</strong> mounting height of wall-mounted devices; minimum sound pressure levels; locations of notification appliances with the <strong>candela</strong> rating of visual appliances.</li>\n<li><strong>Records:</strong> record of completion (7.5.6); copy of the site-specific software with access instructions (password); records and retention (7.7); record of inspection and testing (7.6.6).</li>\n</ul>\n\n<h3>Shop drawings (7.4): what to look for in each document</h3>\n<table>\n<thead><tr><th>Document</th><th>Key content</th><th>Section</th></tr></thead>\n<tbody>\n<tr><td>All drawings</td><td>Indicated scale, uniform sheet size, a plan of each floor; name of the protected premises, owner, and occupant; installer; location; device legend and symbols per NFPA 170 (or others acceptable to the AHJ); date of issue and revision dates</td><td>7.4.2, 7.4.4</td></tr>\n<tr><td>Floor plan</td><td>Floor, north arrow, graphic scale, walls and doors, partitions extending to within the top 15 percent of the ceiling height, room use, devices, primary power disconnecting means, interfaces with other systems, risers, type and number of devices on each circuit, conductors and conduit, ceilings over 10 ft (3.0 m), beams, acoustics, pathway class (with EOL location) and survivability</td><td>7.4.5</td></tr>\n<tr><td>Riser</td><td>General arrangement in building cross-section, number of risers, circuits per riser, devices per circuit on each floor, <strong>number of conductors per circuit</strong>, pathway class and survivability</td><td>7.4.6</td></tr>\n<tr><td>Control unit diagram</td><td>Equipment and location; field wiring terminals and their identification; circuits connected; indicators and controls; connections to supervising station, releasing, and emergency control functions</td><td>7.4.7</td></tr>\n<tr><td>Typical wiring</td><td>Initiating devices, notification appliances, remote indicators, annunciators, remote test stations, EOL and power supervisory devices</td><td>7.4.8</td></tr>\n<tr><td>Sequence of operation</td><td>Narrative or input/output matrix (see Figure A.14.6.1.1)</td><td>7.4.9</td></tr>\n<tr><td>Calculations</td><td>Batteries, NAC voltage drop, others (line resistance)</td><td>7.4.10</td></tr>\n</tbody>\n</table>\n\n<h3>Completion, software, and the documentation cabinet</h3>\n<ul>\n<li><strong>Delivery to the owner (7.5.3.1):</strong> owner's manual and manufacturer's instructions, record drawings, record of completion, and, for software-based systems, a copy of the site-specific software. Delivered upon final acceptance (7.5.3.2).</li>\n<li><strong>Record drawings (7.5.5):</strong> shop drawings updated to reflect the actual installation, with the sequence of operation per the actual programming; a copy goes in the documentation cabinet. Field <em>redlines</em> are their basis.</li>\n<li><strong>Record of completion (7.5.6):</strong> completed by the installing contractor and submitted to the AHJ and the owner at the end of the job; with several contractors, each fills in its portion (7.5.6.2). Modifications go on a revised, dated version that supplements the original (7.5.6.6). An electronic file with AHJ approval must be readable with standard software and backed up (7.5.6.7).</li>\n<li><strong>Site-specific software (7.5.7):</strong> copy to the owner; user passcode and programming password (or instructions for obtaining it from the manufacturer); an on-site copy in nonvolatile, nonerasable, nonrewritable memory.</li>\n<li><strong>Cabinet (7.7.2):</strong> provided with every new system, at the control unit or another approved location (identified at the control unit); large enough; labeled <strong>SYSTEM RECORD DOCUMENTS</strong>; no documentation inside the FACU (7.7.2.3).</li>\n<li><strong>Security (7.7.3):</strong> if documents cannot be protected from public access, sensitive information may be removed as long as the owner keeps a complete set accessible to the AHJ.</li>\n</ul>\n\n<h3>Forms (7.8.2) and record retention</h3>\n<table>\n<thead><tr><th>Figure</th><th>Form</th></tr></thead>\n<tbody>\n<tr><td>7.8.2(a)</td><td>System Record of Completion</td></tr>\n<tr><td>7.8.2(b)–(f)</td><td>Completion supplements: ECS, power systems, NAC power extender panels, interconnected systems, code deviations</td></tr>\n<tr><td>7.8.2(g)</td><td>System Record of Inspection and Testing</td></tr>\n<tr><td>7.8.2(h)–(l)</td><td>ITM supplements: notification appliances, initiating devices, MNS, ECS, interface components</td></tr>\n<tr><td>7.8.2(m)</td><td>Single- and multiple-station alarms and household systems</td></tr>\n</tbody>\n</table>\n<table>\n<thead><tr><th>Record</th><th>Retention</th><th>Section</th></tr></thead>\n<tbody>\n<tr><td>Inspection, testing, and maintenance</td><td>Until the next test + 1 year</td><td>14.6.2.1</td></tr>\n<tr><td>Permanent (record drawings, O&amp;M manuals, sequence of operation)</td><td>Life of the system, kept by the owner</td><td>14.6.1.3</td></tr>\n<tr><td>Medium</td><td>Must last the whole retention period; paper or electronic</td><td>14.6.2.3</td></tr>\n</tbody>\n</table>\n\n<h3>Reading drawings</h3>\n<p>Formula: <code>actual distance = measurement on the drawing (in.) × feet per inch</code>.</p>\n<table>\n<thead><tr><th>Scale</th><th>1 in. on the drawing =</th><th>Example</th></tr></thead>\n<tbody>\n<tr><td>1/8 in. = 1 ft-0 in.</td><td>8 ft</td><td>3-3/4 in. → 30 ft</td></tr>\n<tr><td>3/16 in. = 1 ft-0 in.</td><td>5.33 ft</td><td>3 in. → 16 ft</td></tr>\n<tr><td>1/4 in. = 1 ft-0 in.</td><td>4 ft</td><td>7-1/2 in. → 30 ft</td></tr>\n<tr><td>1/2 in. = 1 ft-0 in.</td><td>2 ft</td><td>2-1/2 in. → 5 ft</td></tr>\n<tr><td>1 in. = 20 ft (engineering)</td><td>20 ft</td><td>1-1/2 in. → 30 ft</td></tr>\n</tbody>\n</table>\n<ul>\n<li><strong>Graphic scale:</strong> if a drawing is printed reduced (half size), the written scale no longer applies; the graphic bar shrinks with the drawing and stays correct.</li>\n<li><strong>Legend and symbols:</strong> NFPA 170 defines the symbols; generally a basic shape is used with letters or subscripts showing the type, plus notes next to the symbol (candela, address, circuit). Conventions vary: <em>always</em> confirm in the legend.</li>\n<li><strong>Common annotations:</strong> AFF (above finished floor), cd (candela), EOL, SLC/IDC/NAC, TYP (typical), NIC (not in contract), address tags such as L2-045 (loop 2, address 45).</li>\n<li><strong>Reflected ceiling plan (RCP):</strong> shows the ceiling as if reflected onto the floor: lights, diffusers, heights, and beams. Useful for coordinating detectors.</li>\n<li><strong>Data sheets (cut sheets):</strong> standby and alarm current, voltage range, candela vs. current table, listing, compatibility, and installation instructions. Devices powered by an IDC or SLC must be listed for use with that control unit (10.3.3).</li>\n</ul>\n\n<h3>Construction documents</h3>\n<ul>\n<li><strong>Specifications:</strong> CSI MasterFormat, Division 28 Electronic Safety and Security; in recent editions the section is 28 46 00 Fire Detection and Alarm (formerly 28 31 00). Div. 21 = fire suppression; Div. 26 = electrical.</li>\n<li><strong>Submittal:</strong> data sheets, shop drawings, and calculations sent for engineer review and AHJ plan review/permit before installation.</li>\n<li><strong>RFI:</strong> a formal question to the designer about conflicts or omissions. <strong>Change order:</strong> authorizes changes in scope, cost, or schedule. <strong>Punch list:</strong> items to correct before acceptance.</li>\n</ul>\n\n<h3>Ugly's / NEC Ch. 9, Table 8 (uncoated copper)</h3>\n<table>\n<thead><tr><th>AWG</th><th>cmil</th><th>Ω/kft solid</th><th>Ω/kft stranded</th></tr></thead>\n<tbody>\n<tr><td>18</td><td>1620</td><td>7.77</td><td>7.95</td></tr>\n<tr><td>16</td><td>2580</td><td>4.89</td><td>4.99</td></tr>\n<tr><td>14</td><td>4110</td><td>3.07</td><td>3.14</td></tr>\n<tr><td>12</td><td>6530</td><td>1.93</td><td>1.98</td></tr>\n</tbody>\n</table>\n<p><code>R = (total conductor length ÷ 1000) × Ω/kft</code>; in a 2-wire circuit the conductor length is twice the run length. <code>VD = I × R</code>.</p>\n\n<div class=\"callout warn\"><strong>Common traps:</strong>\n<ul>\n<li>The sequence of operation may be a <em>matrix or a narrative</em>; both comply.</li>\n<li>Shop drawings ≠ record drawings: record drawings reflect what was actually installed.</li>\n<li>Documentation is not stored inside the FACU; it goes in the cabinet labeled SYSTEM RECORD DOCUMENTS.</li>\n<li>7.8.2(a)–(f) = completion; 7.8.2(g)–(l) = inspection and testing; 7.8.2(m) = household/single-station.</li>\n<li>ITM records: next test + 1 year; permanent records: life of the system.</li>\n<li>NFPA 72 does not set a drawing scale; it requires an indicated scale and a graphic scale.</li>\n<li>When there is a field conflict (diffuser, beam, duct, new partition), a Level I technician does not redesign: report it and request an RFI.</li>\n</ul></div>\n\n<div class=\"callout\"><strong>Finding it fast in the printed code book:</strong> Chapter 7 is short, so one permanent tab at its first page plus tabs at 7.2.1 (minimum documentation list), 7.4 (shop drawings), 7.5.6 (record of completion), and the 7.8.2 forms will cover most questions. Every 7.x section is in Chapter 7; the 14.6 record-retention rules are at the end of Chapter 14. In the index at the back of NFPA 72, look up \"Documentation\", \"Shop drawings\", \"Record drawings\", \"Record of completion\", \"Site-specific software\", \"Records\", and \"Forms\". Highlight \"SYSTEM RECORD DOCUMENTS\", \"1 year thereafter\" (14.6.2.1), and \"life of the system\" (14.6.1.3). The typical input/output matrix is Figure A.14.6.1.1 in Annex A (an asterisk next to a section number means annex material exists). For NEC Chapter 9, Table 8 (Conductor Properties), tab the page near the back of the NEC or use the conductor table in Ugly's table of contents.</div>\n","tabs":[{"ref":"NFPA 72 §7.2.1","what":"Minimum required documentation (17 items)"},{"ref":"NFPA 72 §7.3.3","what":"Design documents: pathway class and survivability"},{"ref":"NFPA 72 §7.4.2–7.4.4","what":"Scale, basis for record drawings, general information, and NFPA 170 symbols"},{"ref":"NFPA 72 §7.4.5","what":"Floor plan drawing contents"},{"ref":"NFPA 72 §7.4.6","what":"Riser diagram contents"},{"ref":"NFPA 72 §7.4.7","what":"Control unit diagrams"},{"ref":"NFPA 72 §7.4.8–7.4.10","what":"Typical wiring, sequence of operation, and calculations"},{"ref":"NFPA 72 §7.5.3","what":"Documents delivered to the owner"},{"ref":"NFPA 72 §7.5.5","what":"Record (as-built) drawings"},{"ref":"NFPA 72 §7.5.6","what":"Record of completion: who completes it, revisions, electronic format"},{"ref":"NFPA 72 §7.5.7","what":"Site-specific software and passwords"},{"ref":"NFPA 72 §7.6.6","what":"Record of inspection and testing"},{"ref":"NFPA 72 §7.7","what":"Records, SYSTEM RECORD DOCUMENTS cabinet, and security"},{"ref":"NFPA 72 §7.8.2","what":"Forms, Figures 7.8.2(a) through 7.8.2(m)"},{"ref":"NFPA 72 §14.6","what":"Permanent records and ITM record retention"},{"ref":"NFPA 72 Figure A.14.6.1.1","what":"Typical input/output matrix"},{"ref":"NFPA 72 §10.3.3","what":"Devices listed for use with the control unit (compatibility)"},{"ref":"NEC 2020 Ch. 9, Table 8","what":"Conductor properties: cmil and resistance"}],"glossary":[{"en":"Shop drawings","def":"The contractor's installation drawings with device locations, riser, diagrams, and calculations; the basis for the record drawings (NFPA 72 §7.4)."},{"en":"Record (as-built) drawings","def":"Shop drawings updated to reflect the actual installation of the system (§7.5.5)."},{"en":"Redlines","def":"A working copy of the drawings on which field changes are marked in red; used to prepare the record drawings."},{"en":"Riser diagram","def":"A building cross-section showing circuits, devices per floor, and number of conductors (§7.4.6)."},{"en":"Reflected ceiling plan (RCP)","def":"A ceiling plan drawn as if reflected onto the floor; shows lights, diffusers, ceiling heights, and beams."},{"en":"Input/output matrix","def":"A table showing which outputs each input produces; an accepted form of the sequence of operation (Figure A.14.6.1.1)."},{"en":"Sequence of operation","def":"A description, in matrix or narrative form, of what the system does for each signal (§7.2.1(4), §7.4.9)."},{"en":"Written narrative","def":"Text describing the intent and general operation of the system (§7.2.1(1))."},{"en":"Record of completion","def":"The form documenting the installed system; completed by the installing contractor (§7.5.6, Figure 7.8.2(a))."},{"en":"Record of inspection and testing","def":"The ITM form, Figure 7.8.2(g) through (l), or an alternative record with the same information (§7.6.6)."},{"en":"Site-specific software","def":"The programming unique to the installation; a copy goes to the owner and an on-site copy is kept in nonrewritable memory (§7.5.7)."},{"en":"Documentation cabinet","def":"A cabinet labeled SYSTEM RECORD DOCUMENTS where the record documentation is stored (§7.7.2)."},{"en":"Technical data sheet (cut sheet)","def":"The manufacturer's document listing current draw, voltages, candela, listing, and compatibility of the equipment."},{"en":"Manufacturer's published instructions","def":"The installation, operation, and maintenance instructions that come with listed equipment."},{"en":"Submittal","def":"A package of data sheets, shop drawings, and calculations sent for review before installation."},{"en":"Request for information (RFI)","def":"A formal written question to the designer to clarify conflicts or omissions in the documents."},{"en":"Change order","def":"A document that authorizes a change in the contract's scope, cost, or schedule."},{"en":"Punch list","def":"A list of items to correct or finish before final acceptance."},{"en":"Legend","def":"The table on a drawing that defines each symbol and abbreviation (symbols per NFPA 170)."},{"en":"Graphic (bar) scale","def":"A bar drawn on the sheet that stays valid even when the drawing is printed reduced."},{"en":"Above finished floor (AFF)","def":"The reference for mounting heights, measured from the finished floor."},{"en":"Test plan","def":"A written document that clearly establishes the scope of testing (§7.6.1, §14.2.10)."},{"en":"Pathway class designation","def":"The circuit class (A, B, X, etc.) per 12.3; shown on the drawings with the EOL location."},{"en":"Authority having jurisdiction (AHJ)","def":"The organization or official that reviews plans, issues permits, and approves the installation."}]},"questions":[{"id":"docs-001","task":"1.3.1","type":"single","diff":1,"freq":true,"q":{"en":"According to NFPA 72-2022, where the AHJ requires documentation, in what form must the sequence of operation be provided?"},"opts":[{"en":"As a ladder-logic diagram stamped by an engineer"},{"en":"In either an input/output matrix or narrative form"},{"en":"Only as a printout of the control unit's programming file"},{"en":"Only as a single-line electrical diagram"}],"ans":[1],"ref":"NFPA 72-2022 §7.2.1(4); §7.4.9","exp":"Item 7.2.1(4) requires the sequence of operation in either an input/output matrix or narrative form; either one complies. The same rule is repeated in 7.4.9 (shop drawings) and 7.5.5 (record drawings, reflecting the actual programming)."},{"id":"docs-002","task":"1.3.1","type":"multi","select":2,"diff":2,"q":{"en":"Which TWO items appear in NFPA 72-2022's list of minimum required documentation for a new system when the AHJ requires documentation? (Select TWO.)"},"opts":[{"en":"NICET certificates of the installing technicians"},{"en":"Riser diagram"},{"en":"The HVAC test-and-balance report"},{"en":"Battery capacity and safety margin calculations (where batteries are provided)"},{"en":"The electrical utility's service agreement"}],"ans":[1,3],"ref":"NFPA 72-2022 §7.2.1","exp":"The 7.2.1 list includes, among others: written narrative, riser diagram, floor plans, sequence of operation, data sheets, manufacturers' instructions, battery calculations with safety margin, NAC voltage drop, mounting heights, sound levels, candela, record of completion, software, and record drawings. NICET certificates, HVAC test-and-balance reports, and the utility contract are not on that list."},{"id":"docs-003","task":"1.3.1","type":"single","diff":2,"q":{"en":"Per NFPA 72-2022's minimum documentation list, each floor plan sheet must show which of the following?"},"opts":[{"en":"The serial number of every detector"},{"en":"The construction cost of the building"},{"en":"A point of compass (north arrow) and a graphic representation of the scale used"},{"en":"The electrical utility's account number"}],"ans":[2],"ref":"NFPA 72-2022 §7.2.1(3)","exp":"Item 7.2.1(3) requires floor plans showing the location of all devices and control equipment. Each sheet must show: (a) a point of compass (north arrow), (b) a graphic representation of the scale used, (c) room use, and (d) building features that affect the placement of initiating devices and notification appliances."},{"id":"docs-004","task":"1.3.1","type":"single","diff":1,"freq":true,"q":{"en":"According to NFPA 72-2022, the device legend and symbols on fire alarm shop drawings must be in accordance with which standard, or other symbols acceptable to the AHJ?"},"opts":[{"en":"NFPA 13"},{"en":"NFPA 101"},{"en":"NFPA 70"},{"en":"NFPA 170"}],"ans":[3],"ref":"NFPA 72-2022 §7.4.4(4)","exp":"Item 7.4.4(4) requires a device legend and symbols per NFPA 170 (Standard for Fire Safety and Emergency Symbols) or other symbols acceptable to the AHJ. NFPA 70 is the NEC, NFPA 101 the Life Safety Code, and NFPA 13 the sprinkler standard."},{"id":"docs-005","task":"1.3.1","type":"single","diff":2,"q":{"en":"According to NFPA 72-2022, how must shop drawings be drawn?"},"opts":[{"en":"To an indicated scale, on sheets of uniform size, with a plan of each floor"},{"en":"At exactly 1/4 in. = 1 ft on 24 × 36 in. sheets"},{"en":"Freehand, as long as all dimensions are written"},{"en":"At any scale, provided all floors appear on a single sheet"}],"ans":[0],"ref":"NFPA 72-2022 §7.4.2","exp":"Section 7.4.2 requires shop drawings to be drawn to an indicated scale, on sheets of uniform size, with a plan of each floor. NFPA 72 does not set a specific scale (1/8 or 1/4 in. = 1 ft are common), although some local AHJs set minimums."},{"id":"docs-006","task":"1.3.1","type":"multi","select":2,"diff":2,"q":{"en":"According to NFPA 72-2022, which TWO items must be included on fire alarm floor plan drawings, where applicable for the particular system? (Select TWO.)"},"opts":[{"en":"The model numbers of the HVAC rooftop units"},{"en":"Identification of any ceiling over 10 ft (3.0 m) in height where automatic fire detection is proposed"},{"en":"Locations of all lighting fixtures and switches"},{"en":"The fire sprinkler hydraulic calculations"},{"en":"Locations of the system's primary power disconnecting means"}],"ans":[1,4],"ref":"NFPA 72-2022 §7.4.5(2)","exp":"The 7.4.5(2) list includes: floor identification, north arrow, graphic scale, walls and doors, partitions extending to within the top 15 percent of the ceiling height, devices, primary power disconnecting means, interfaces, risers, conductors, ceilings over 10 ft (3.0 m) where detection is proposed, beams and joists, acoustic properties, and pathway class and survivability. Lighting fixtures appear on the reflected ceiling plan (RCP), not on this list."},{"id":"docs-007","task":"1.3.1","type":"single","diff":2,"q":{"en":"According to NFPA 72-2022, a system riser diagram must be coordinated with the floor plans and must include which of the following?"},"opts":[{"en":"The exact length of every cable run"},{"en":"The sensitivity reading of every smoke detector"},{"en":"The number of conductors for each circuit"},{"en":"The candela setting of every strobe"}],"ans":[2],"ref":"NFPA 72-2022 §7.4.6","exp":"Per 7.4.6, the riser shows: the general arrangement in building cross-section, the number of risers, the type and number of circuits in each riser, the devices per circuit on each floor, the number of conductors per circuit, and the pathway class and survivability level. Candela goes with the appliance locations on the floor plan (7.2.1(11))."},{"id":"docs-008","task":"1.3.1","type":"single","diff":2,"q":{"en":"A technician needs to know which field wiring terminals on the FACU a notification appliance circuit lands on and how those terminals are identified. Per NFPA 72-2022, which shop drawing should show this?"},"opts":[{"en":"Reflected ceiling plan"},{"en":"Site plan"},{"en":"Architectural door schedule"},{"en":"Control unit diagram"}],"ans":[3],"ref":"NFPA 72-2022 §7.4.7","exp":"Section 7.4.7 requires control unit diagrams (FACU, power supplies, chargers, and annunciators). They must show the equipment and its location, all field wiring terminals and their identification, the circuits connected, indicators and manual controls, and the connections to supervising station, releasing, or emergency control functions."},{"id":"docs-009","task":"1.3.1","type":"single","diff":1,"q":{"en":"Per NFPA 72-2022, typical wiring diagrams must be provided for which of the following?"},"opts":[{"en":"Only the main fire alarm control unit"},{"en":"Initiating devices, notification appliances, remote indicators, annunciators, remote test stations, and end-of-line and power supervisory devices"},{"en":"Only devices installed above 10 ft"},{"en":"Only the building's lighting circuits"}],"ans":[1],"ref":"NFPA 72-2022 §7.4.8","exp":"Section 7.4.8 requires typical wiring diagrams for initiating devices, notification appliances, remote indicators, annunciators, remote test stations, and end-of-line and power supervisory devices. They are the technician's reference for connecting each type of device."},{"id":"docs-010","task":"1.3.1","type":"single","diff":2,"q":{"en":"According to NFPA 72-2022, which system calculations must be included with the shop drawings?"},"opts":[{"en":"Battery calculations, notification appliance circuit voltage drop calculations, and other required calculations such as line resistance"},{"en":"Only HVAC airflow calculations"},{"en":"Structural load calculations for each back box"},{"en":"Only the project cost estimate"}],"ans":[0],"ref":"NFPA 72-2022 §7.4.10","exp":"Section 7.4.10 requires: (1) battery calculations, (2) NAC voltage drop calculations, and (3) other required calculations, such as line resistance. If installation conditions change, 7.5.5 requires revised calculations to be provided with the record drawings."},{"id":"docs-011","task":"1.3.1","type":"single","diff":1,"freq":true,"q":{"en":"According to NFPA 72-2022, record (as-built) drawings consist of which of the following?"},"opts":[{"en":"The architect's original bid drawings, unchanged"},{"en":"Photographs of the FACU taken at final acceptance"},{"en":"Current updated shop drawings reflecting the actual installation of all system equipment, components, and wiring"},{"en":"The manufacturer's product catalog"}],"ans":[2],"ref":"NFPA 72-2022 §7.5.5","exp":"Per 7.5.5, record drawings are the shop drawings updated to reflect the actual installation, accompanied by the sequence of operation per the actual programming. They are delivered to the owner, and a copy is kept in the documentation cabinet (Section 7.7). Field redlines are their basis."},{"id":"docs-012","task":"1.3.1","type":"single","diff":2,"q":{"en":"According to NFPA 72-2022, which documentation must be delivered to the owner or the owner's representative upon final acceptance of a new system?"},"opts":[{"en":"Only the invoice and the warranty card"},{"en":"Only the AHJ's plan review comments"},{"en":"Only the battery calculations"},{"en":"Owner's manual and manufacturer's published instructions, record drawings, the completed record of completion, and (for software-based systems) a copy of the site-specific software"}],"ans":[3],"ref":"NFPA 72-2022 §7.5.3.1","exp":"Section 7.5.3.1 lists the completion documentation: owner's manual and manufacturer's instructions, record drawings (7.5.5), record of completion (7.5.6), and a copy of the site-specific software (7.5.7). Per 7.5.3.2, it is delivered upon final acceptance of the system."},{"id":"docs-013","task":"1.3.1","type":"single","diff":1,"freq":true,"q":{"en":"In NFPA 72-2022, which figure is the System Record of Completion form?"},"opts":[{"en":"Figure 7.8.2(a)"},{"en":"Figure 7.8.2(g)"},{"en":"Figure 7.8.2(m)"},{"en":"Figure A.14.6.1.1"}],"ans":[0],"ref":"NFPA 72-2022 §7.8.2, Figure 7.8.2(a)","exp":"Figure 7.8.2(a) is the System Record of Completion; (b) through (f) are its supplements. Figure 7.8.2(g) is the System Record of Inspection and Testing, 7.8.2(m) covers single- and multiple-station alarms and household systems, and A.14.6.1.1 is the typical input/output matrix."},{"id":"docs-014","task":"1.3.1","type":"single","diff":2,"q":{"en":"According to NFPA 72-2022, who completes the record of completion documentation, and to whom is it submitted?"},"opts":[{"en":"The AHJ completes it and sends it to the manufacturer"},{"en":"The installing contractor completes it and submits it to the AHJ and the owner at the conclusion of the job"},{"en":"The building owner completes it before work begins"},{"en":"The insurance carrier completes it after the first annual test"}],"ans":[1],"ref":"NFPA 72-2022 §7.5.6.2","exp":"Section 7.5.6.2 states that the installing contractor completes the record of completion and submits it to the AHJ and the owner at the conclusion of the job. Where more than one contractor is involved, each completes the portion for which it was responsible."},{"id":"docs-015","task":"1.3.1","type":"single","diff":3,"q":{"en":"Two years after acceptance, a contractor adds 12 addressable devices to an existing system. According to NFPA 72-2022, how must the record of completion be handled?"},"opts":[{"en":"Discard the original record and issue a new one with no reference to it"},{"en":"No update is needed when fewer than 25 devices are added"},{"en":"Record the modifications on a revised version of the original completion documents, which supplements the original unaltered documents and includes a revision date"},{"en":"Write the changes by hand on the original form and store it inside the FACU"}],"ans":[2],"ref":"NFPA 72-2022 §7.5.6.6","exp":"Per 7.5.6.6 (Revisions), any modification after the initial installation is recorded on a revised version of the original completion documents that supplements the unaltered originals and includes a revision date. If the original record cannot be found, a new one is prepared reflecting the system as found. Also, nothing is stored inside the FACU (7.7.2.3)."},{"id":"docs-016","task":"1.3.1","type":"single","diff":2,"freq":true,"q":{"en":"According to NFPA 72-2022, for a software-based system, the site-specific software documentation provided to the owner must include which of the following?"},"opts":[{"en":"Only the manufacturer's sales brochure"},{"en":"The installer's personal login, which must be changed every 30 days"},{"en":"No passwords; passwords may never be given to the owner"},{"en":"The user passcode and either the system programming password or specific instructions on how to obtain it from the manufacturer"}],"ans":[3],"ref":"NFPA 72-2022 §7.5.7.1","exp":"Section 7.5.7.1 requires a copy of the site-specific software to be provided to the owner. It must include the user passcode and either the system programming password or specific instructions on how to obtain it from the manufacturer. That way other qualified personnel can modify the system, and the owner is not tied to a single vendor."},{"id":"docs-017","task":"1.3.1","type":"single","diff":2,"q":{"en":"Per NFPA 72-2022, a copy of the site-specific software must be stored on-site in what type of memory?"},"opts":[{"en":"Nonvolatile, nonerasable, nonrewritable memory"},{"en":"Volatile RAM inside the control unit"},{"en":"A rewritable USB drive kept in the technician's truck"},{"en":"Only in the supervising station's cloud account"}],"ans":[0],"ref":"NFPA 72-2022 §7.5.7.2","exp":"Section 7.5.7.2 requires an on-site copy of the site-specific software stored in nonvolatile, nonerasable, nonrewritable memory (for example, write-once media). It is normally kept in the documentation cabinet."},{"id":"docs-018","task":"1.3.1","type":"single","diff":1,"freq":true,"q":{"en":"According to NFPA 72-2022, the documentation cabinet installed with a new system must be prominently labeled with which wording?"},"opts":[{"en":"FIRE ALARM MANUALS"},{"en":"SYSTEM RECORD DOCUMENTS"},{"en":"AUTHORIZED PERSONNEL ONLY"},{"en":"AS-BUILT DRAWINGS"}],"ans":[1],"ref":"NFPA 72-2022 §7.7.2","exp":"Section 7.7.2 requires every new system to have a documentation cabinet at the control unit or another approved location, large enough for the documents and prominently labeled SYSTEM RECORD DOCUMENTS. Some AHJs use local labels, but that is the NFPA 72 wording."},{"id":"docs-019","task":"1.3.1","type":"single","diff":2,"q":{"en":"During final cleanup, an installer folds the as-built drawings and the owner's manual and places them inside the FACU enclosure. Per NFPA 72-2022, what is wrong?"},"opts":[{"en":"Nothing; the FACU enclosure is the preferred storage location"},{"en":"Record documents must be mailed to the AHJ and never kept on-site"},{"en":"Record documentation must be stored in the documentation cabinet, not inside the control unit"},{"en":"Only the battery calculations may be kept inside the FACU"}],"ans":[2],"ref":"NFPA 72-2022 §7.7.2.3","exp":"Section 7.7.2.3 requires all record documentation to be stored in the documentation cabinet and prohibits storing it inside the control unit. The cabinet is located at the control unit or another approved location and is labeled SYSTEM RECORD DOCUMENTS."},{"id":"docs-020","task":"1.3.1","type":"single","diff":1,"q":{"en":"A technician has two sets of shop drawings for the same floor and needs to confirm which set is current. Per NFPA 72-2022, which information must every shop drawing include that helps answer this?"},"opts":[{"en":"The installing technician's NICET certification number"},{"en":"The AHJ inspector's name and badge number"},{"en":"The control unit's firmware version"},{"en":"The date of issue and any revision dates"}],"ans":[3],"ref":"NFPA 72-2022 §7.4.4(5)","exp":"Section 7.4.4 requires every shop drawing to include general information: the name of the protected premises, owner, and occupant (where applicable); the installer or contractor; the location of the premises; the device legend and symbols (NFPA 170); and the date of issue and any revision dates (item 5). Comparing issue and revision dates is how you confirm which set is current; NICET numbers, inspector names, and firmware versions are not required on the drawings."},{"id":"docs-021","task":"1.3.1","type":"single","diff":1,"q":{"en":"A floor plan is drawn at 1/8 in. = 1 ft-0 in. Two smoke detectors measure 3-3/4 in. apart on the drawing. What is the actual distance between them?"},"opts":[{"en":"60 ft"},{"en":"15 ft"},{"en":"30 ft"},{"en":"7.5 ft"}],"ans":[2],"ref":"Plan reading (scale); NFPA 72-2022 §7.4.2","exp":"At 1/8 in. = 1 ft, each inch on the drawing equals 8 ft: 3.75 in. × 8 ft/in. = 30 ft (about 9.1 m). At 1/4 in. = 1 ft each inch would be 4 ft (15 ft), a typical mistake. NFPA 72 (7.4.2) requires drawings to indicate their scale."},{"id":"docs-022","task":"1.3.1","type":"single","diff":3,"q":{"en":"Shop drawings originally plotted on 24 × 36 in. sheets at 1/4 in. = 1 ft-0 in. are printed half-size on 12 × 18 in. paper. How should a technician take measurements from the half-size print?"},"opts":[{"en":"Use the noted 1/4 in. = 1 ft scale; the print size does not matter"},{"en":"Treat the print as 1/2 in. = 1 ft"},{"en":"Measure with a 1/4 in. scale and then divide the result by 2"},{"en":"Use the graphic (bar) scale on the sheet, or treat the print as 1/8 in. = 1 ft"}],"ans":[3],"ref":"NFPA 72-2022 §7.2.1(3)(b), §7.4.5(2)(c)","exp":"When a drawing is reduced to half size, 1/4 in. = 1 ft effectively becomes 1/8 in. = 1 ft. A measurement taken with a 1/4-in. scale would have to be multiplied by 2, not divided. The graphic scale shrinks with the drawing and stays correct, which is why NFPA 72 requires it (7.2.1(3)(b) and 7.4.5(2)(c))."},{"id":"docs-023","task":"1.3.1","type":"single","diff":1,"q":{"en":"On a construction project, what is a request for information (RFI)?"},"opts":[{"en":"A form used to order replacement batteries from a distributor"},{"en":"A formal written question to the designer or engineer to clarify a conflict, omission, or unclear item in the contract documents"},{"en":"The AHJ's final acceptance certificate"},{"en":"The contractor's monthly progress invoice"}],"ans":[1],"ref":"Construction documents (general practice)","exp":"An RFI (request for information) is the formal way for the contractor to ask the designer about conflicts, omissions, or unclear items in the drawings or specifications. The answer is documented and, if the installation changes, it is reflected on the redlines and the record drawings (NFPA 72 §7.5.5)."},{"id":"docs-024","task":"1.3.1","type":"multi","select":2,"diff":2,"q":{"en":"Which TWO items are typically part of a fire alarm submittal package sent for engineer and AHJ review before installation? (Select TWO.)"},"opts":[{"en":"Product data (technical data) sheets for the proposed equipment"},{"en":"The final punch list"},{"en":"Shop drawings with device locations, riser diagram, and calculations"},{"en":"The record of inspection and testing from the first annual test"},{"en":"The building's certificate of occupancy"}],"ans":[0,2],"ref":"NFPA 72-2022 §7.2.1, §7.4","exp":"A typical submittal includes the data sheets, the shop drawings, and the battery and voltage-drop calculations, which are 7.2.1 and 7.4 documents. The punch list, the first annual test record, and the certificate of occupancy come at the end of the job or later."},{"id":"docs-025","task":"1.3.1","type":"single","diff":2,"q":{"en":"During construction, the owner asks the contractor to add four manual pull stations that are not shown in the contract documents. Which document normally authorizes this added scope and any change in cost or schedule?"},"opts":[{"en":"Change order"},{"en":"Punch list"},{"en":"Record of inspection and testing"},{"en":"Equipment data sheet"}],"ans":[0],"ref":"Construction documents (general practice)","exp":"A change order authorizes changes in scope, cost, or schedule. A punch list lists items to correct before acceptance. After the change, the drawings, the 7.4.10 calculations, and the record drawings are updated, and the AHJ may require revised drawings."},{"id":"docs-026","task":"1.3.1","type":"single","diff":1,"q":{"en":"In a project manual organized by CSI MasterFormat, the fire detection and alarm specification section is located in which division?"},"opts":[{"en":"Division 21 – Fire Suppression"},{"en":"Division 26 – Electrical"},{"en":"Division 28 – Electronic Safety and Security"},{"en":"Division 08 – Openings"}],"ans":[2],"ref":"CSI MasterFormat, Division 28","exp":"In MasterFormat, fire detection and alarm is in Division 28, Electronic Safety and Security. In recent editions the section is 28 46 00 Fire Detection and Alarm (formerly 28 31 00). Division 21 covers sprinklers and fire suppression, and Division 26 general electrical work."},{"id":"docs-027","task":"1.3.1","type":"single","diff":3,"q":{"en":"Per NEC Chapter 9, Table 8, a 14 AWG solid uncoated copper conductor has a dc resistance of 3.07 Ω per 1000 ft. A two-wire NAC runs 250 ft from the panel to the last appliance. What is the total resistance of the circuit conductors?"},"opts":[{"en":"0.77 Ω"},{"en":"1.54 Ω"},{"en":"3.07 Ω"},{"en":"15.35 Ω"}],"ans":[1],"ref":"NEC 2020 Ch. 9, Table 8; NFPA 72-2022 §7.4.10","exp":"R = (conductor length ÷ 1000) × Ω/kft. With 2 wires of 250 ft there are 500 ft of conductor: 0.5 × 3.07 = 1.54 Ω. 0.77 Ω results from counting only one conductor. Table 8 also gives the area: 14 AWG = 4110 cmil. This value feeds the voltage drop calculation required by 7.4.10."},{"id":"docs-028","task":"1.3.1","type":"single","diff":3,"q":{"en":"A NAC has a total conductor resistance (both conductors) of 1.54 Ω and an alarm load of 1.5 A. Assuming the entire load is at the end of the circuit, what is the approximate voltage drop on the circuit conductors?"},"opts":[{"en":"2.31 V"},{"en":"1.03 V"},{"en":"3.08 V"},{"en":"4.62 V"}],"ans":[0],"ref":"Ohm's law (Ugly's); NFPA 72-2022 §7.4.10","exp":"VD = I × R = 1.5 A × 1.54 Ω ≈ 2.31 V. Lumping the entire load at the end of the circuit is the conservative method. The remaining voltage is compared with the appliance's minimum operating voltage from its data sheet. Dividing (1.03 V) or doubling the resistance (4.62 V) are typical mistakes."},{"id":"docs-029","task":"1.3.1","type":"single","diff":2,"q":{"en":"A technician helping prepare battery and voltage-drop calculations needs the standby and alarm current of a specific addressable module. Which document is the primary source for this value?"},"opts":[{"en":"NEC Chapter 9, Table 8"},{"en":"The manufacturer's technical data sheet (cut sheet) for that module"},{"en":"The architectural floor plan"},{"en":"Last year's record of inspection and testing"}],"ans":[1],"ref":"NFPA 72-2022 §7.2.1(5), §7.4.10","exp":"Equipment data sheets, required by 7.2.1(5), give the standby and alarm current, voltage range, listing, and compatibility. Those values are used in the 7.4.10 calculations. NEC Table 8 gives conductor resistance, not device current."},{"id":"docs-030","task":"1.3.1","type":"single","diff":2,"q":{"en":"A reflected ceiling plan (RCP) is especially useful to a fire alarm installer because it shows which of the following?"},"opts":[{"en":"The building's foundations and footings"},{"en":"The electrical panelboard schedules"},{"en":"The roof drainage slopes"},{"en":"The ceiling layout as if reflected onto the floor, including lights, diffusers, ceiling heights, soffits, and beams that affect detector placement"}],"ans":[3],"ref":"Plan reading; NFPA 72-2022 §7.4.5(2)","exp":"The RCP shows the ceiling as if reflected in a mirror on the floor, with the same orientation as the floor plan: lights, diffusers, grilles, ceiling heights, and ceiling types. It helps coordinate detectors with diffusers and beams. NFPA 72 also requires floor plans to identify ceilings over 10 ft and their geometry (7.4.5(2)(m) and (n))."},{"id":"docs-031","task":"1.1.1","type":"single","diff":1,"q":{"en":"A technician is installing a detector model they have not used before and is unsure which back box and mounting method it requires. Per NFPA 72-2022's minimum documentation list, which document should provide this?"},"opts":[{"en":"The battery capacity calculations"},{"en":"The riser diagram"},{"en":"The manufacturer's published installation instructions for that device"},{"en":"The record of inspection and testing"}],"ans":[2],"ref":"NFPA 72-2022 §7.2.1(6)","exp":"Item 7.2.1(6) includes the manufacturers' published instructions, including operation and maintenance instructions, in the minimum documentation. Equipment is installed in accordance with those instructions, which specify the back box, base, mounting method, and wiring. The riser diagram, battery calculations, and test records do not show mounting details."},{"id":"docs-032","task":"1.1.1","type":"single","diff":1,"q":{"en":"A wall-mounted horn/strobe on the shop drawings is annotated \"80 in. AFF.\" What does AFF mean?"},"opts":[{"en":"Above finished floor"},{"en":"Approved fire fitting"},{"en":"Average floor-to-floor"},{"en":"Alarm field feed"}],"ans":[0],"ref":"NFPA 72-2022 §7.2.1(9); Ch. 18","exp":"AFF means above finished floor. Item 7.2.1(9) requires documentation of the mounting height elevation of wall-mounted devices and appliances. For wall-mounted visual appliances, Chapter 18 requires the entire lens to be between 80 and 96 in. (2.03 to 2.44 m) above the finished floor."},{"id":"docs-033","task":"1.1.1","type":"single","diff":2,"q":{"en":"While installing from approved shop drawings, a technician finds a new partition, not shown on the floor plan, that extends to within 6 in. of a 10-ft ceiling and divides a room served by a single smoke detector. What is the BEST action?"},"opts":[{"en":"Install as drawn; only partitions that reach the ceiling affect smoke detector spacing"},{"en":"Report it so the designer can revise the layout; a partition within the top 15 percent of the ceiling height counts as a wall for spacing"},{"en":"Report it only if the partition is fire-rated; nonrated partitions are ignored for spacing"},{"en":"Mount the existing detector on top of the partition so it can serve both sides"}],"ans":[1],"ref":"NFPA 72-2022 §7.4.5(2); §17.7.4.2.3.1","exp":"Detector spacing is measured to walls and to partitions that extend upward to within the top 15 percent of the ceiling height (§17.7.4.2.3.1), and floor plans must show such partitions (7.4.5(2)). On a 10-ft (120-in.) ceiling, 15 percent is 18 in., so a partition 6 in. from the ceiling acts as a wall and may leave part of the room without coverage. A Level I technician does not redesign: report it, let the designer resolve it (RFI), and record the approved change on the redlines."},{"id":"docs-034","task":"1.1.1","type":"single","diff":2,"q":{"en":"On an addressable system's shop drawing, a smoke detector symbol is tagged \"L2-045.\" In common practice, what does this tag most likely indicate to the installer?"},"opts":[{"en":"Second floor, room 45"},{"en":"Mount 2 ft from the wall at a 45° angle"},{"en":"Signaling line circuit (loop) 2, device address 045"},{"en":"Sensitivity level 2, 4.5 %/ft obscuration"}],"ans":[2],"ref":"Common practice; NFPA 72-2022 §7.4.5(2)","exp":"Tags such as L2-045 usually mean loop (SLC) 2, address 045; the exact convention is confirmed in the legend or the drawing notes. The technician sets the device address per the drawing and records any change on the redlines. NFPA 72 requires showing device locations and the type and number of devices on each circuit (7.4.5(2)(g) and (k))."},{"id":"docs-035","task":"1.1.1","type":"single","diff":3,"q":{"en":"A technician is terminating a Class B initiating device circuit and needs to know where the end-of-line (EOL) device is to be installed. According to NFPA 72-2022, which shop drawing information should show this?"},"opts":[{"en":"The pathway class designations on the floor plans and riser, including the location of any end-of-line supervisory devices required by the pathway class"},{"en":"The service directory in the owner's manual"},{"en":"The SYSTEM RECORD DOCUMENTS cabinet label"},{"en":"The table of contents of the specifications"}],"ans":[0],"ref":"NFPA 72-2022 §7.4.5(2)(p), §7.4.6(2)(f)","exp":"In the 2022 edition, 7.4.5(2)(p) (floor plans) and 7.4.6(2)(f) (riser) require the pathway class designation per 12.3, including the location of any end-of-line supervisory or power supervisory devices that the class requires. The typical wiring diagrams (7.4.8) show how to connect it. The EOL must go where the drawing shows so that supervision works."},{"id":"docs-036","task":"1.2.1","type":"single","diff":2,"q":{"en":"According to NFPA 72-2022, the record of all inspections, testing, and maintenance must be documented using which forms, or an alternative record that includes all the applicable information?"},"opts":[{"en":"Figure 7.8.2(a) through Figure 7.8.2(f)"},{"en":"Figure 7.8.2(m) only"},{"en":"Figure 7.8.2(g) through Figure 7.8.2(l)"},{"en":"Table 14.4.3.2"}],"ans":[2],"ref":"NFPA 72-2022 §7.6.6; §14.6.2.4","exp":"Per 7.6.6 and 14.6.2.4, ITM is documented on Figure 7.8.2(g) (System Record of Inspection and Testing) and its supplements (h) through (l): notification appliances, initiating devices, MNS, ECS, and interface components. An alternative record with the same information is also acceptable. Figures (a) through (f) are for completion, and Table 14.4.3.2 covers test methods."},{"id":"docs-037","task":"1.2.1","type":"single","diff":3,"q":{"en":"A system's annual test was performed and documented in March 2024. The next annual test is performed in March 2025. Per NFPA 72-2022, at a minimum, until when must the March 2024 test record be retained?"},"opts":[{"en":"March 2025"},{"en":"March 2026"},{"en":"March 2027"},{"en":"Until the system is removed from service"}],"ans":[1],"ref":"NFPA 72-2022 §14.6.2.1","exp":"Per 14.6.2.1, ITM records are retained until the next test and for 1 year thereafter. The next test is in March 2025, so the record is kept until March 2026. The life of the system applies to permanent records, such as record drawings (14.6.1.3)."},{"id":"docs-038","task":"1.2.1","type":"multi","select":2,"diff":2,"q":{"en":"Which TWO statements about fire alarm records are consistent with NFPA 72-2022? (Select TWO.)"},"opts":[{"en":"ITM records may be discarded as soon as the AHJ signs the report"},{"en":"ITM records must be retained until the next test and for 1 year thereafter"},{"en":"Only paper records are permitted; electronic records are not allowed"},{"en":"Permanent records such as as-built drawings, O&M manuals, and the written sequence of operation are maintained by the owner for the life of the system"},{"en":"Permanent records only need to be kept for 3 years after acceptance"}],"ans":[1,3],"ref":"NFPA 72-2022 §14.6.1.3, §14.6.2.1","exp":"Per 14.6.2.1, ITM records are kept until the next test and for 1 year thereafter. Per 14.6.1.3, the owner keeps the permanent records (record drawings, manuals, and the sequence of operation of 14.6.1.1) for the life of the system. Paper or electronic media are permitted (14.6.1.3 and 14.6.2.3)."},{"id":"docs-039","task":"1.2.1","type":"single","diff":3,"q":{"en":"During an annual test, a technician activates a duct smoke detector serving AHU-3. The panel shows a supervisory signal, but the technician is unsure whether AHU-3 should also shut down and whether occupant notification should occur. What should the technician consult to verify the intended results?"},"opts":[{"en":"NEC Chapter 9, Table 8"},{"en":"The battery calculation sheet"},{"en":"The architect's door hardware schedule"},{"en":"The sequence of operation (input/output matrix or narrative) included with the record documentation"}],"ans":[3],"ref":"NFPA 72-2022 §7.2.1(4), §7.5.5; Figure A.14.6.1.1","exp":"The sequence of operation, delivered with the record drawings and reflecting the actual programming (7.5.5), defines the expected outputs for each input: alarm, supervisory, fan shutdown, elevator recall, and so on. Figure A.14.6.1.1 shows a typical matrix. If the actual result does not match, report it as a deficiency."},{"id":"docs-040","task":"1.2.1","type":"single","diff":2,"q":{"en":"NFPA 72-2022 Chapter 7 requires test plan documentation to be provided in accordance with Chapter 14. What is the main purpose of the written test plan?"},"opts":[{"en":"To clearly establish the scope of the testing for the system"},{"en":"To replace the record of completion"},{"en":"To list the purchase price of each device"},{"en":"To certify the technician's NICET level"}],"ans":[0],"ref":"NFPA 72-2022 §7.6.1; §14.2.10","exp":"Section 7.6.1 points to 14.2.10, which requires a written test plan that clearly establishes the scope of testing: which devices, functions, and interfaces will be tested and which will not be activated, such as releasing functions or shutdowns. It does not replace the record of completion or the record of inspection and testing."}]},{"topic":{"id":"visual","title":"Image Questions (Click on the Figure)","short":"Image items","tasks":["1.1.1","1.1.2","1.1.3","1.2.2"],"refs":["NFPA 72-2022","OSHA 1926","Ugly’s 2020"],"guide":"<p>The computer-based NICET exam includes some questions with figures (exhibits) and a few where you must <strong>click on the image</strong> instead of choosing a letter. They are usually mounting drawings (heights, distances to doors, walls, and ceilings), wiring diagrams, or control panels.</p><h3>How to answer them</h3><ul><li>Read the scale and the notes on the figure first: heights above finished floor (AFF), inches below the ceiling, feet from a door.</li><li>Convert units before you look anything up: 42–48 in. = 3.5–4 ft; 80–96 in. = 6 ft 8 in. to 8 ft.</li><li>Click in the center of the zone or device you choose; you can change
