<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
</head>
<body>
<title>NICET FAS I Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="NICET Fire Alarm Systems Level I prep: practice exams in the real format, question banks by chapter and study guides.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky control-panel header + one reading column (max 1120px).
   The exam runner swaps in a test-delivery frame: dark top bar, LCD timer, bottom nav. */
:root{
  --bg:#EDF0F3;          /* painted-steel grey with a blue bias */
  --surface:#FFFFFF;
  --surface-2:#E2E7EC;
  --ink:#15202B;
  --ink-2:#4B5967;
  --line:#C9D2DA;
  --red:#C1102C;         /* fire-alarm signal red */
  --red-soft:#F7DDE1;
  --on-red:#FFFFFF;
  --amber:#9A6412;       /* supervisory / trouble */
  --amber-soft:#F6E7C9;
  --green:#21734A;       /* normal / correct */
  --green-soft:#D6EEDF;
  --blue:#245B9E;        /* focus + links */
  --bar-bg:#1F2D3A; --bar-fg:#EEF2F6; --bar-line:#33475A;
  --lcd-bg:#16231B; --lcd-fg:#9FE3A2;
  --shadow:0 1px 2px rgba(21,32,43,.08),0 4px 14px rgba(21,32,43,.06);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161C; --surface:#18212A; --surface-2:#212C37; --ink:#E5EBF1; --ink-2:#9BAAB8; --line:#2E3B48;
    --red:#F2566C; --red-soft:#3D1C23; --on-red:#1A0B0F; --amber:#E2A845; --amber-soft:#3A2D14; --green:#55C487; --green-soft:#16352A;
    --blue:#7DB0F0; --bar-bg:#0B1117; --bar-fg:#E5EBF1; --bar-line:#273442; --lcd-bg:#0E1A12; --lcd-fg:#9FE3A2;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161C; --surface:#18212A; --surface-2:#212C37; --ink:#E5EBF1; --ink-2:#9BAAB8; --line:#2E3B48;
  --red:#F2566C; --red-soft:#3D1C23; --on-red:#1A0B0F; --amber:#E2A845; --amber-soft:#3A2D14; --green:#55C487; --green-soft:#16352A;
  --blue:#7DB0F0; --bar-bg:#0B1117; --bar-fg:#E5EBF1; --bar-line:#273442; --lcd-bg:#0E1A12; --lcd-fg:#9FE3A2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--blue)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,4.6vw,3rem);letter-spacing:.005em}
h2{font-size:1.75rem}
h3{font-size:1.35rem}
h4{font-size:1.1rem}
p{margin:0}
code,.mono{font-family:var(--f-mono);font-size:.88em}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:0 0 auto}
.brand svg{width:26px;height:34px;flex:0 0 auto}
.brand b{font-family:var(--f-display);font-size:1.3rem;font-weight:700;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-size:.7rem;color:var(--ink-2);letter-spacing:.08em;text-transform:uppercase;line-height:1.2}
.nav{display:flex;gap:2px;overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;padding:8px 12px;border-radius:var(--r);cursor:pointer;white-space:nowrap;color:var(--ink-2);font-weight:700;font-size:.95rem}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--red);border-radius:var(--r) var(--r) 0 0}
.lang{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex:0 0 auto}
.lang button{border:0;background:none;padding:5px 9px;font-size:.8rem;font-weight:700;letter-spacing:.04em;cursor:pointer;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
@media (max-width:1080px){.brand small{display:none}.nav button{padding:8px 9px}}
@media (max-width:720px){
  .topbar-in{flex-wrap:wrap;gap:8px 12px}
  .nav{order:3;flex-basis:100%}
  .brand small{display:none}
  .lang{margin-left:auto}
}

/* ---------- page ---------- */
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:28px}
.stack-sm{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.grid2>*,.grid3>*{min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.lede{font-size:1.1rem;color:var(--ink-2);max-width:62ch}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h3{margin-bottom:8px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  padding:9px 16px;border-radius:var(--r);cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink);line-height:1.2}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:.875rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:0}
.led{width:9px;height:9px;border-radius:50%;display:inline-block;background:currentColor;box-shadow:0 0 0 2px color-mix(in srgb,currentColor 25%,transparent)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero h1 span{color:var(--red)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;border:1px solid var(--line);border-radius:var(--r);background:var(--line);overflow:hidden}
.facts.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:720px){.facts.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.facts div{padding:14px 16px;background:var(--surface);min-width:0}
.facts b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.facts span{font-size:.85rem;color:var(--ink-2)}
.resume{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--amber-soft);border:1px solid var(--amber);color:var(--ink);border-radius:var(--r);padding:12px 16px}
.resume .led{color:var(--amber)}

.bp{display:flex;flex-direction:column;gap:18px}
.bp-row{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) 70px;gap:14px;align-items:center}
@media (max-width:620px){.bp-row{grid-template-columns:1fr 64px}.bp-row .bp-track{grid-column:1/-1;grid-row:2}}
.bp-label b{display:block}
.bp-label span{font-size:.85rem;color:var(--ink-2)}
.bp-track{position:relative;height:26px;background:var(--surface-2);border-radius:4px}
.bp-range{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--red) 22%,transparent);border-left:2px solid var(--red);border-right:2px solid var(--red)}
.bp-mark{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
.bp-axis{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) 70px;gap:14px}
.bp-axis .ticks{position:relative;height:18px;font-family:var(--f-mono);font-size:.7rem;color:var(--ink-2)}
.bp-axis .ticks span{position:absolute;transform:translateX(-50%)}
@media (max-width:620px){.bp-axis{display:none}}
.bp-val{font-family:var(--f-mono);font-size:.85rem;text-align:right;font-variant-numeric:tabular-nums}
.tasklist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.tasklist>div{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.tasklist .mono{color:var(--red);font-weight:600}

/* ---------- cards / lists ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:1.3rem}
.card .meta{display:flex;flex-wrap:wrap;gap:6px}
.card .foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;padding-top:6px}
.card.feature{border-color:var(--ink);box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center}
.list-row:last-child{border-bottom:0}
.list-row h4{font-size:1.15rem}
.list-row .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:620px){.list-row{grid-template-columns:1fr}.list-row .actions{justify-content:flex-start}}
.meter{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;width:100%;max-width:220px}
.meter i{display:block;height:100%;background:var(--green)}
.meter i.low{background:var(--red)}
.meter i.mid{background:var(--amber)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--red)}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.filters label{display:inline-flex;gap:6px;align-items:center;font-size:.92rem;cursor:pointer}
.field{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--ink-2)}
.field select,.field input[type=number],.field input[type=search],input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;color:var(--ink);min-width:0}
input[type=checkbox],input[type=radio]{accent-color:var(--red);width:17px;height:17px}

/* ---------- question card (bank / review) ---------- */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.qcard .qhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qtext{font-size:1.05rem}
.tr{color:var(--ink-2);font-size:.95em;margin-top:4px;padding-left:10px;border-left:3px solid var(--line)}
.opt-static{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:6px 8px;border-radius:4px}
.opt-static.ok{background:var(--green-soft)}
.opt-static.bad{background:var(--red-soft)}
.opt-static .l{font-family:var(--f-mono);font-weight:600}
.exp{background:var(--surface-2);border-radius:var(--r);padding:12px 14px;font-size:.95rem}
.exp .ref{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2);margin-top:6px;display:block}

/* ---------- guides ---------- */
.guide-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.guide-layout{grid-template-columns:1fr}}
.guide-nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:860px){.guide-nav{position:static;max-height:none;flex-direction:row;flex-wrap:wrap;gap:6px}}
.guide-nav .grp{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding:12px 10px 4px}
@media (max-width:860px){.guide-nav .grp{flex-basis:100%;padding:8px 0 0}}
.guide-nav button{text-align:left;background:none;border:0;padding:7px 10px;border-radius:var(--r);cursor:pointer;color:var(--ink-2);font-weight:700;font-size:.92rem}
@media (max-width:860px){.guide-nav button{border:1px solid var(--line);background:var(--surface)}}
.guide-nav button:hover{background:var(--surface-2);color:var(--ink)}
.guide-nav button[aria-current="true"]{background:var(--ink);color:var(--surface)}
.prose{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,36px);min-width:0}
.prose>*+*{margin-top:14px}
.prose h3{font-size:1.5rem;margin-top:30px;padding-top:6px}
.prose h4{font-size:1.15rem;margin-top:22px}
.prose p,.prose li{max-width:72ch}
.prose ul,.prose ol{padding-left:1.3em}
.prose li+li{margin-top:5px}
.prose table{border-collapse:collapse;width:100%;font-size:.92rem}
.prose .tbl{overflow-x:auto}
.prose th,.prose td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.prose th{background:var(--surface-2);font-weight:700}
.prose td{font-variant-numeric:tabular-nums}
.callout{border-left:4px solid var(--green);background:var(--green-soft);padding:12px 14px;border-radius:0 var(--r) var(--r) 0}
.callout.warn{border-left-color:var(--red);background:var(--red-soft)}
.callout>*+*{margin-top:8px}
.tabs-table td:first-child{font-family:var(--f-mono);font-size:.82rem;white-space:nowrap}
.gloss-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.93rem}
@media (max-width:620px){.gloss-row{grid-template-columns:1fr}}
.gloss-row b{font-weight:700}

/* ---------- progress ---------- */
.stat-bars{display:flex;flex-direction:column;gap:10px}
.stat-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;align-items:baseline;font-size:.93rem}
.stat-bar .meter{grid-column:1/-1;grid-row:2;max-width:none;height:10px}
.stat-bar .v{font-family:var(--f-mono);text-align:right;font-size:.85rem;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.data{border-collapse:collapse;width:100%;font-size:.92rem}
table.data th,table.data td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2)}
table.data td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.data tr:last-child td{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--r)}

/* ---------- exam frame ---------- */
#exam{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
#exam[hidden]{display:none!important}
.xbar{background:var(--bar-bg);color:var(--bar-fg);display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.xbar .xtitle{font-family:var(--f-display);font-size:1.15rem;font-weight:600;letter-spacing:.02em;flex:1 1 200px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xbar .xcount{font-family:var(--f-mono);font-size:.9rem;white-space:nowrap}
.lcd{font-family:var(--f-mono);font-weight:600;font-size:1.05rem;background:var(--lcd-bg);color:var(--lcd-fg);padding:4px 10px;border-radius:4px;
  border:1px solid var(--bar-line);letter-spacing:.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
.lcd.warn{color:#FFD27A}
.lcd.crit{color:#FF8A8A;animation:blink 1s steps(2,start) infinite}
@media (prefers-reduced-motion:reduce){.lcd.crit{animation:none}}
@keyframes blink{to{visibility:hidden}}
.xbtn{background:transparent;color:var(--bar-fg);border:1px solid var(--bar-line);border-radius:4px;padding:6px 11px;cursor:pointer;font-weight:700;font-size:.85rem;white-space:nowrap}
.xbtn:hover{background:var(--bar-line)}
.xbtn[aria-pressed="true"]{background:#E2A845;color:#1F2D3A;border-color:#E2A845}
.xbody{flex:1 1 auto;overflow:auto}
.xbody-in{max-width:880px;margin:0 auto;padding-block:26px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.xq-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.xq-text{font-size:1.15rem;line-height:1.6}
.xq-text .tr{font-size:1rem}
.xsel{font-family:var(--f-mono);font-size:.8rem;font-weight:600;letter-spacing:.06em;color:var(--amber);text-transform:uppercase}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:30px 22px minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.opt:hover{border-color:var(--ink-2)}
.opt .l{font-family:var(--f-mono);font-weight:600;color:var(--ink-2);padding-top:1px}
.opt .box{width:18px;height:18px;border:2px solid var(--ink-2);border-radius:50%;margin-top:3px;background:var(--surface)}
.opt .box.sq{border-radius:3px}
.opt.sel .box{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.ok{background:var(--green-soft);border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.opt.bad{background:var(--red-soft);border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.opt[aria-disabled="true"]{cursor:default}
.xfoot{background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.xfoot .sp{flex:1 1 auto}
.hs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;overflow-x:auto}

<script>window.NICET_DATA=[{"topic":{"id":"fund","title":"Fundamentals and Definitions (NFPA 72-2022 Ch. 1, 3, and 10)","short":"Fundamentals","tasks":["1.1.2","1.2.2","1.1.1","1.2.1","1.3.1"],"refs":["NFPA 72-2022 Ch. 1","NFPA 72-2022 Ch. 3","NFPA 72-2022 Ch. 10","NFPA 72-2022 §12.6","NFPA 70-2020 Art. 760"],"guide":"\n<h3>What NICET expects at Level I</h3>\n<p>Chapters 1, 3, and 10 of NFPA 72-2022 are the foundation of the code: Chapter 3 gives the vocabulary and Chapter 10 gives the general rules that apply to every system. On the exam they appear as <strong>quick look-ups</strong> (definitions, times, power-supply rules) and as <strong>field scenarios</strong>: What kind of signal is this? Whom do I notify before I shut off power? How often does a silenced trouble signal come back? A Level I technician works under supervision, but must recognize signals, respect the power-supply rules, and handle an impairment correctly.</p>\n\n<h3>Chapter 1: retroactivity and units</h3>\n<ul>\n<li><strong>Retroactivity (§1.4.1):</strong> unless otherwise noted, the code does not apply to facilities, equipment, or installations that existed or were approved before its effective date. The AHJ may apply portions of the code retroactively where the existing situation presents an unacceptable degree of risk (§1.4).</li>\n<li><strong>Units (§1.6):</strong> the code uses U.S. customary (inch-pound) units with SI values in parentheses. Use one system consistently; do not switch back and forth.</li>\n</ul>\n\n<h3>Chapter 3: key definitions</h3>\n<p>Section 3.2 contains the official NFPA definitions (Approved, Authority Having Jurisdiction, Labeled, Listed, Shall, Should). Section 3.3 contains the general definitions in alphabetical order. Many terms are grouped under a \"parent\" term: for example, <em>Supervisory Condition</em> and <em>Trouble Condition</em> are found under <em>Condition</em>, and the signal types are found under <em>Signal</em>.</p>\n<table>\n<thead><tr><th>Term</th><th>Meaning</th><th>Typical trap</th></tr></thead>\n<tbody>\n<tr><td>Approved</td><td>Acceptable to the AHJ</td><td>Not the same as \"listed\"</td></tr>\n<tr><td>Listed / Labeled</td><td>Included in the list, or bearing the label, of an evaluation organization acceptable to the AHJ (e.g., UL) that periodically inspects production</td><td>Listed does not mean approved</td></tr>\n<tr><td>Shall / Should</td><td>Mandatory / recommended</td><td>The annex uses \"should\": it is informational, not enforceable</td></tr>\n<tr><td>Supervisory signal</td><td>Abnormal condition in the supervision of other systems, processes, or equipment (closed valve, low air pressure, low temperature)</td><td>A closed valve is supervisory, not trouble</td></tr>\n<tr><td>Trouble signal</td><td>Abnormal condition of the system itself due to a fault (open, ground, loss of ac power)</td><td>A ground fault produces a trouble signal</td></tr>\n<tr><td>IDC</td><td>Initiating device circuit; the signal does not identify the individual device</td><td>Typical of conventional panels</td></tr>\n<tr><td>SLC</td><td>Pathway that carries multiple input and output signals between addressable devices, modules, and control units</td><td>Identifies each device</td></tr>\n<tr><td>NAC</td><td>Circuit directly connected to notification appliances</td><td>Horns and strobes, not detectors</td></tr>\n<tr><td>Unwanted alarm</td><td>Alarm that does not result from a potentially hazardous condition: malicious, nuisance, unintentional, or unknown</td><td>\"False alarm\" is not a defined term</td></tr>\n<tr><td>Impairment</td><td>Abnormal condition, planned or emergency, in which a system, component, or function is out of order</td><td>Includes out-of-service events</td></tr>\n</tbody>\n</table>\n\n<h3>Chapter 10: fundamentals</h3>\n<h4>Equipment and compatibility (§10.3)</h4>\n<ul>\n<li>All equipment must be <strong>listed for the purpose</strong> for which it is used (§10.3.1) and installed per the manufacturer's published instructions.</li>\n<li>Devices that receive power from an IDC or SLC must be listed as <strong>compatible</strong> with that control unit.</li>\n<li>Equipment must operate at 85% and 110% of nameplate voltage, between 32°F and 120°F (0–49°C), and at 85% relative humidity at 86°F (30°C) (§10.3.5).</li>\n</ul>\n<h4>FACU location and mounting (§10.4)</h4>\n<ul>\n<li><strong>§10.4.4:</strong> the highest switch, lamp, or textual display must be no more than 6 ft (1.8 m) above the finished floor, and the lowest no less than 15 in. (375 mm), unless the AHJ permits otherwise.</li>\n<li><strong>§10.4.5:</strong> in areas that are not continuously occupied, automatic smoke detection is required at each FACU, each NAC power extender, and the supervising station transmitter. Heat detection is permitted where ambient conditions do not allow a smoke detector.</li>\n</ul>\n<h4>Personnel qualifications (§10.5)</h4>\n<p>Covers designers (§10.5.1), installers (§10.5.2), and ITM personnel (§10.5.3). Installers must be qualified <strong>or supervised</strong> by qualified persons (§10.5.2.1). Qualification is shown by a state or local license, a certification acceptable to the AHJ (A.10.5.3.4(2) mentions NICET), or manufacturer certification. The AHJ may ask for the evidence.</p>\n<h4>Primary power supply (§10.6.5)</h4>\n<ul>\n<li>It must come from a <strong>dedicated branch circuit</strong> (§10.6.5.1).</li>\n<li>The location of the disconnecting means is permanently identified <strong>at the FACU</strong>. The disconnect has a <strong>red marking</strong> (without damaging the breaker or covering its markings) and must be accessible only to <strong>authorized personnel</strong> (§10.6.5.2 and §10.6.5.2.5).</li>\n<li>If the disconnect is a circuit breaker, it gets an <strong>approved breaker locking device</strong> (§10.6.5.4).</li>\n<li>NEC 2020 760.41(B) (NPLFA) and 760.121(B) (PLFA): red identification, access by qualified personnel only, and the legend <code>FIRE ALARM CIRCUIT</code>.</li>\n</ul>\n<h4>Secondary power and batteries (§10.6.7, §10.6.9, §10.6.10)</h4>\n<table>\n<thead><tr><th>System</th><th>Quiescent (standby)</th><th>Alarm</th><th>Ref.</th></tr></thead>\n<tbody>\n<tr><td>Protected premises (non-voice)</td><td>24 h</td><td>5 min with all evacuation notification appliances operating</td><td>§10.6.7.2</td></tr>\n<tr><td>In-building emergency voice/alarm (EVACS)</td><td>24 h</td><td>15 min at maximum connected load</td><td>§10.6.7.2</td></tr>\n</tbody>\n</table>\n<ul>\n<li>Where an automatic-starting engine-driven generator serving the dedicated branch circuit is part of the secondary supply, storage batteries dedicated to the system with <strong>4 hours</strong> of capacity are also required (§10.6.7).</li>\n<li>Transfer to the secondary supply must be automatic and without loss of required signals.</li>\n<li>The primary and secondary supplies are monitored, and failure of either produces a trouble signal (§10.6.9).</li>\n<li>Batteries are marked with the <strong>month and year of manufacture</strong> in month/year format (§10.6.10.1). Since January 1, 2024, rechargeable secondary-supply batteries must be listed or component-recognized (§10.6.10.1.3). Table 14.3.1 requires the marking to be checked semiannually.</li>\n</ul>\n<p><strong>Quick calculation:</strong> Ah = (standby current × 24 h) + (alarm current × 5/60 h). For EVACS use 15/60 h. Then add the margin required by the manufacturer or the specification.</p>\n<h4>Signals (§10.7 to §10.15 and §12.6)</h4>\n<ul>\n<li><strong>Priority (§10.7):</strong> fire alarm first, then supervisory, then trouble (mass notification may take precedence where the code permits).</li>\n<li><strong>Distinctive signals (§10.10):</strong> the evacuation signal must be distinctive, comply with §18.4.2 (temporal-3), and be used for nothing else; supervisory, trouble, and pre-alarm signals are also distinguishable. The FACU buzzer may use one sound if the display or LEDs make the distinction (§10.10.4).</li>\n<li><strong>Actuation (§10.11.1):</strong> notification, control functions, and annunciation within 10 seconds.</li>\n<li><strong>Alarm silencing (§10.12):</strong> audible and visible appliances are silenced together (§10.12.2); a new activation on another circuit or device reactivates them.</li>\n<li><strong>Supervisory (§10.14):</strong> a subsequent supervisory activation from another zone reactivates silenced supervisory indication.</li>\n<li><strong>Trouble (§10.15):</strong> once silenced, it resounds every 24 hours or less until corrected (§10.15.9); every 4 hours for the primary battery of wireless devices. A new trouble also reactivates it.</li>\n<li><strong>Integrity (§12.6.1):</strong> an open or ground fault is indicated within 200 seconds.</li>\n</ul>\n<h4>Impairments (§10.21)</h4>\n<ol>\n<li>Notify the owner or designated representative when the system, or part of it, is impaired, including out-of-service events (§10.21.1).</li>\n<li>Keep a record of the impairment for 1 year from the date it is corrected (§10.21.2).</li>\n<li>The supervising station reports to the AHJ any termination of required monitoring (§10.21.3).</li>\n<li>The service provider reports to the AHJ any system out of service for more than 8 hours (§10.21.4).</li>\n<li>Apply mitigating measures where the AHJ requires them (§10.21.5).</li>\n<li>Notify the owner and the AHJ when the impairment ends (§10.21.6).</li>\n</ol>\n<h4>Unwanted alarms (§10.22) and related features</h4>\n<p>After an unwanted alarm, investigate the cause and correct it. <strong>Alarm verification</strong> is not enabled by default unless nuisance alarms are expected, is password protected, and does not delay more than 1 minute (§23.8.5.4.1). <strong>PAS</strong> requires acknowledgment within 15 s and allows up to 180 s to investigate (§23.8.1.2.1.1).</p>\n\n<h3>Numbers to have at hand</h3>\n<table>\n<thead><tr><th>Requirement</th><th>Value</th><th>Ref.</th></tr></thead>\n<tbody>\n<tr><td>Secondary supply (non-voice)</td><td>24 h + 5 min</td><td>§10.6.7.2</td></tr>\n<tr><td>Secondary supply (EVACS)</td><td>24 h + 15 min</td><td>§10.6.7.2</td></tr>\n<tr><td>Batteries with an engine-driven generator</td><td>4 h of capacity</td><td>§10.6.7</td></tr>\n<tr><td>Alarm actuation</td><td>10 s or less</td><td>§10.11.1</td></tr>\n<tr><td>Open or ground indication</td><td>200 s or less</td><td>§12.6.1</td></tr>\n<tr><td>Silenced trouble resound</td><td>every 24 h or less</td><td>§10.15.9</td></tr>\n<tr><td>Wireless primary battery</td><td>every 4 h or less</td><td>§10.15.9.2</td></tr>\n<tr><td>FACU control heights</td><td>6 ft max. / 15 in. min.</td><td>§10.4.4</td></tr>\n<tr><td>Operating voltage</td><td>85% and 110% of nameplate</td><td>§10.3.5</td></tr>\n<tr><td>Out-of-service report to the AHJ</td><td>more than 8 h</td><td>§10.21.4</td></tr>\n<tr><td>Impairment record</td><td>1 year after correction</td><td>§10.21.2</td></tr>\n<tr><td>PAS</td><td>15 s + 180 s</td><td>§23.8.1.2.1.1</td></tr>\n<tr><td>Alarm verification</td><td>1 min max. delay</td><td>§23.8.5.4.1</td></tr>\n</tbody>\n</table>\n\n<div class=\"callout warn\"><strong>Common traps:</strong>\n<ul>\n<li><strong>8 h vs. 4 h vs. 10 h:</strong> 8 h is the NFPA 72 report to the AHJ (§10.21.4). The 4-hour fire watch trigger comes from other codes (NFPA 101/IFC), and 10 h comes from NFPA 25 (sprinklers).</li>\n<li>In the 2022 edition, the owner notification in §10.21.1 has no stated time limit; do not mix it up with the 8-hour AHJ report. Newer editions changed some impairment wording, so answer with the 2022 text.</li>\n<li><strong>200 s vs. 10 s:</strong> 200 s is for indicating integrity faults; 10 s is for alarm actuation.</li>\n<li><strong>5 min vs. 15 min:</strong> 15 min applies only to EVACS (voice).</li>\n<li>The \"FIRE ALARM CIRCUIT\" legend and \"qualified personnel\" come from the NEC. NFPA 72 says \"authorized personnel.\"</li>\n<li>Closed valve, low air pressure, or low temperature = <strong>supervisory</strong>. Loss of ac power, open, or ground = <strong>trouble</strong>.</li>\n<li>Section numbers changed between editions; always use the 2022 numbering.</li>\n</ul></div>\n\n<div class=\"callout\"><strong>How to find it fast in the printed code:</strong>\n<ul>\n<li>Use the index at the back of NFPA 72: look up \"Power supplies\" (primary, secondary, batteries), \"Impairments,\" \"Trouble signals,\" \"Unwanted alarms,\" and \"Positive alarm sequence.\"</li>\n<li>Every section number starts with its chapter: 10.x is Chapter 10, 12.x is Chapter 12, 23.x is Chapter 23. Flip to the chapter tab, then follow the numbers.</li>\n<li>Chapter 10 map: 10.3 equipment, 10.4 installation, 10.5 personnel, 10.6 power supplies, 10.7 priority, 10.10 distinctive signals, 10.11 alarm, 10.12 silencing, 10.14 supervisory, 10.15 trouble, 10.21 impairments, 10.22 unwanted alarms.</li>\n<li>Place permanent tabs on Chapter 3, §10.6 (power supplies), and §10.21 (impairments), and highlight 24 h, 5 min, 15 min, 200 s, and 8 h.</li>\n<li>Definitions in Chapter 3 are alphabetical; if a term is not listed by itself, look under its parent term (Condition, Signal, Alarm).</li>\n<li>An asterisk (*) after a section number means there is explanatory material in Annex A: it helps you understand the intent, but it is not a requirement.</li>\n</ul></div>\n","tabs":[{"ref":"NFPA 72 §1.4.1","what":"Retroactivity: the code does not apply to existing installations unless stated or required by the AHJ"},{"ref":"NFPA 72 §1.6","what":"Units: inch-pound with SI in parentheses; use one system"},{"ref":"NFPA 72 §3.2","what":"Official definitions: Approved, AHJ, Labeled, Listed, Shall, Should"},{"ref":"NFPA 72 §3.3","what":"General definitions: signals, conditions, IDC/SLC/NAC, unwanted alarms, impairment"},{"ref":"NFPA 72 §10.3","what":"Equipment listed for the purpose, compatibility, 85–110% voltage (§10.3.5)"},{"ref":"NFPA 72 §10.4.4","what":"FACU display and control heights: 6 ft max. / 15 in. min."},{"ref":"NFPA 72 §10.4.5","what":"Smoke detection at FACUs, NAC extenders, and transmitters in areas not continuously occupied"},{"ref":"NFPA 72 §10.5","what":"Qualifications of designers, installers, and ITM personnel (NICET in A.10.5.3.4(2))"},{"ref":"NFPA 72 §10.6.5","what":"Primary supply: dedicated circuit, red marking, authorized access, breaker lock"},{"ref":"NFPA 72 §10.6.7","what":"Secondary supply: 24 h + 5 min (15 min for EVACS); 4 h batteries with an engine-driven generator"},{"ref":"NFPA 72 §10.6.10","what":"Batteries: month/year marking, listed or recognized batteries"},{"ref":"NFPA 72 §10.7","what":"Signal priority: alarm > supervisory > trouble"},{"ref":"NFPA 72 §10.10","what":"Distinctive signals (temporal-3 evacuation, supervisory, trouble, pre-alarm)"},{"ref":"NFPA 72 §10.11.1","what":"Notification and control functions actuate within 10 s"},{"ref":"NFPA 72 §10.12","what":"Silencing of alarm notification and reactivation"},{"ref":"NFPA 72 §10.15","what":"Trouble signals: resound every 24 h or less (§10.15.9)"},{"ref":"NFPA 72 §10.21","what":"Impairments: notifications, 1-year record, report to the AHJ after 8 h"},{"ref":"NFPA 72 §12.6.1","what":"Monitoring for integrity: open or ground indicated within 200 s"},{"ref":"NFPA 72 §23.8","what":"PAS (§23.8.1.2.1.1) and alarm verification (§23.8.5.4.1)"},{"ref":"NFPA 70 760.41(B) / 760.121(B)","what":"Branch-circuit identification: red, plus the 'FIRE ALARM CIRCUIT' legend"}],"glossary":[{"en":"Authority Having Jurisdiction (AHJ)","def":"Organization, office, or individual responsible for enforcing the code or approving equipment, materials, installations, or procedures."},{"en":"Approved","def":"Acceptable to the AHJ."},{"en":"Listed","def":"Included in a list published by an organization acceptable to the AHJ that evaluates products and periodically inspects production."},{"en":"Labeled","def":"Bearing the label, symbol, or mark of an evaluation organization acceptable to the AHJ."},{"en":"Shall / Should","def":"'Shall' indicates a mandatory requirement; 'should' indicates a recommendation that is not required."},{"en":"Fire alarm control unit (FACU)","def":"Component with primary and secondary power that receives signals from initiating devices or other control units and processes them to operate the required outputs."},{"en":"Initiating device","def":"Component that originates transmission of a change-of-state condition, such as a smoke detector, manual fire alarm box, or supervisory switch."},{"en":"Initiating device circuit (IDC)","def":"Circuit of initiating devices whose signal does not identify the individual device that operated."},{"en":"Signaling line circuit (SLC)","def":"Pathway between addressable devices, interfaces, control units, or transmitters that carries multiple input and/or output signals."},{"en":"Notification appliance circuit (NAC)","def":"Circuit directly connected to notification appliances such as horns, strobes, or speakers."},{"en":"Addressable device","def":"Component with its own identification whose status can be individually identified or that individually controls functions."},{"en":"Zone","def":"Defined area of the protected premises from which a signal is received, to which a signal is sent, or in which a form of control is exercised."},{"en":"Alarm signal","def":"Signal that results from the manual or automatic detection of an alarm condition."},{"en":"Supervisory signal","def":"Signal for an abnormal condition in the supervision of other systems, processes, or equipment (for example, a closed valve)."},{"en":"Trouble signal","def":"Signal for an abnormal condition of the system due to a fault (open, ground, loss of power)."},{"en":"Pre-alarm signal","def":"Signal that results from detecting a pre-alarm condition; it must be distinctive from other signals (§10.10.8)."},{"en":"Unwanted alarm","def":"Alarm that does not result from a potentially hazardous condition. Subtypes: malicious, nuisance, unintentional, and unknown."},{"en":"Nuisance alarm","def":"Unwanted activation caused by a non-hazardous stimulus or condition (steam, dust, cooking smoke)."},{"en":"Positive alarm sequence (PAS)","def":"Automatic sequence that results in an alarm even though it is delayed for investigation, unless the system is reset (15 s + 180 s)."},{"en":"Alarm verification feature","def":"Feature that requires smoke detectors to confirm the condition for a period, or after a reset, to reduce unwanted alarms."},{"en":"Impairment","def":"Abnormal condition, planned or emergency, in which a system, component, or function is out of order."},{"en":"Record drawings","def":"Drawings that document device and appliance locations, wiring sequences and methods, and system connections as installed (as-builts)."},{"en":"Qualified","def":"A competent and capable person or company that meets the requirements and training for a given field, acceptable to the AHJ."},{"en":"Fire warden","def":"Building staff member or tenant trained to perform assigned duties during a fire emergency."},{"en":"Dedicated branch circuit","def":"Branch circuit that supplies only the fire alarm system; required for the primary power supply (§10.6.5.1)."}]},"questions":[{"id":"fund-001","task":"1.1.2","type":"single","diff":1,"q":{"en":"According to NFPA 72, how must the primary (main) power supply of a fire alarm control unit be connected to the building's light and power service?"},"opts":[{"en":"Through any convenience receptacle within 6 ft of the control unit"},{"en":"On a dedicated branch circuit"},{"en":"On the same branch circuit as the area's emergency lighting"},{"en":"Through a GFCI-protected receptacle on a general-purpose circuit"}],"ans":[1],"ref":"NFPA 72-2022 §10.6.5.1","exp":"The primary power supply must come from a dedicated branch circuit (§10.6.5.1) that is not shared with other loads, so nobody can de-energize the fire alarm system by accident when switching off some other load."},{"id":"fund-002","task":"1.1.2","type":"single","diff":1,"freq":true,"q":{"en":"Per NFPA 72, what color marking is required on the circuit disconnecting means that supplies primary power to a fire alarm system?"},"opts":[{"en":"Yellow"},{"en":"Orange"},{"en":"Red"},{"en":"Blue"}],"ans":[2],"ref":"NFPA 72-2022 §10.6.5.2","exp":"The circuit disconnecting means must have a red marking that does not damage the overcurrent device or obscure the manufacturer's markings, and it must be accessible only to authorized personnel (§10.6.5.2 and §10.6.5.2.5). NEC 760.41(B)/760.121(B) additionally require the legend 'FIRE ALARM CIRCUIT'."},{"id":"fund-003","task":"1.1.2","type":"single","diff":2,"q":{"en":"Where does NFPA 72 require the location of the fire alarm system's branch-circuit disconnecting means to be permanently identified?"},"opts":[{"en":"At the fire alarm control unit"},{"en":"At the main service entrance panel only"},{"en":"On the fire department connection sign"},{"en":"Only on the record drawings kept in the owner's office"}],"ans":[0],"ref":"NFPA 72-2022 §10.6.5.2","exp":"The location of the branch-circuit disconnecting means must be permanently identified at the FACU itself (§10.6.5.2), so a technician or firefighter can quickly find the breaker. Record drawings help, but they do not replace this label."},{"id":"fund-004","task":"1.1.2","type":"single","diff":2,"q":{"en":"The disconnecting means for a fire alarm system's dedicated branch circuit is a circuit breaker in a panelboard. What does NFPA 72 additionally require for that breaker?"},"opts":[{"en":"It must be a GFCI-type breaker"},{"en":"It must be rated 15 A maximum"},{"en":"It must be an AFCI-type breaker"},{"en":"An approved breaker locking device must be installed"}],"ans":[3],"ref":"NFPA 72-2022 §10.6.5.4","exp":"Where the disconnecting means is a circuit breaker, an approved breaker locking device must be installed so it cannot be switched off by mistake (§10.6.5.4). NFPA 72 does not require GFCI or AFCI protection or a specific ampere rating for this circuit."},{"id":"fund-005","task":"1.1.2","type":"single","diff":2,"q":{"en":"A building's automatic-starting, engine-driven generator serves the fire alarm system's dedicated branch circuit. If this generator is used as part of the secondary power supply, what does NFPA 72 also require?"},"opts":[{"en":"Nothing more; the generator replaces the batteries"},{"en":"Storage batteries dedicated to the fire alarm system with 4 hours of capacity"},{"en":"Storage batteries dedicated to the fire alarm system with 30 minutes of capacity"},{"en":"A second generator with a separate fuel supply"}],"ans":[1],"ref":"NFPA 72-2022 §10.6.7 (secondary power supply)","exp":"When an automatic-starting, engine-driven generator serving the dedicated branch circuit is used as part of the secondary supply, NFPA 72 (§10.6.7) also requires storage batteries dedicated to the system with 4 hours of capacity, which carry the system while the generator starts or if it fails. Without a generator, the batteries alone must provide 24 hours of standby plus the required alarm time (§10.6.7.2)."},{"id":"fund-006","task":"1.1.2","type":"multi","select":2,"diff":2,"q":{"en":"Which TWO are NFPA 72 requirements for the circuit disconnecting means of a fire alarm system's primary power supply? (Select TWO.)"},"opts":[{"en":"It must be located within sight of the fire alarm control unit"},{"en":"It must have a red marking"},{"en":"It must be protected by a GFCI device"},{"en":"It must be accessible only to authorized personnel"},{"en":"It must be a fused switch rather than a circuit breaker"}],"ans":[1,3],"ref":"NFPA 72-2022 §10.6.5.2 and §10.6.5.2.5","exp":"§10.6.5.2 requires the red marking, and §10.6.5.2.5 requires the disconnect to be accessible only to authorized personnel. In addition, its location is identified at the FACU and, if it is a breaker, it gets an approved locking device (§10.6.5.4). Being within sight of the panel or being a fused switch is not required."},{"id":"fund-007","task":"1.1.2","type":"single","diff":1,"freq":true,"q":{"en":"In NFPA 72 terminology, a circuit to which automatic or manual initiating devices are connected, where the signal received does NOT identify the individual device that operated, is a(n):"},"opts":[{"en":"Notification appliance circuit (NAC)"},{"en":"Signaling line circuit (SLC)"},{"en":"Initiating device circuit (IDC)"},{"en":"Emergency control function circuit"}],"ans":[2],"ref":"NFPA 72-2022 §3.3 (Initiating Device Circuit)","exp":"An IDC (initiating device circuit) is typical of conventional panels: the panel knows which circuit or zone operated, but not which detector (Ch. 3). An SLC, by contrast, carries multiple signals and identifies each addressable device."},{"id":"fund-008","task":"1.1.2","type":"single","diff":1,"q":{"en":"A technician is wiring addressable smoke detectors and addressable monitor and control modules on one two-wire loop that carries multiple input and output signals between the devices and the control unit. NFPA 72 calls this circuit a(n):"},"opts":[{"en":"Initiating device circuit (IDC)"},{"en":"Notification appliance circuit (NAC)"},{"en":"Auxiliary power circuit"},{"en":"Signaling line circuit (SLC)"}],"ans":[3],"ref":"NFPA 72-2022 §3.3 (Signaling Line Circuit; Addressable Device)","exp":"An SLC (signaling line circuit) is the pathway between addressable devices, interfaces, control units, or transmitters over which multiple input and/or output signals travel (Ch. 3). Each addressable device has its own identification, so the panel knows exactly which one operated."},{"id":"fund-009","task":"1.1.2","type":"single","diff":2,"freq":true,"q":{"en":"NFPA 72 requires that the occurrence of a single open or a single ground-fault condition on monitored installation conductors, and its restoration to normal, be automatically indicated within:"},"opts":[{"en":"200 seconds"},{"en":"10 seconds"},{"en":"90 seconds"},{"en":"4 minutes"}],"ans":[0],"ref":"NFPA 72-2022 §12.6.1","exp":"A single open or a single ground fault on monitored conductors, and its restoration, must be indicated automatically within 200 seconds (§12.6.1). Do not confuse this with the 10-second alarm actuation time (§10.11.1)."},{"id":"fund-010","task":"1.1.2","type":"single","diff":2,"q":{"en":"During installation, a stripped SLC conductor touches a grounded metal back box and the FACU reports a ground fault. How does NFPA 72 classify the resulting signal?"},"opts":[{"en":"Supervisory signal, because it involves supervision of the wiring"},{"en":"Trouble signal, because it results from an abnormal condition due to a fault"},{"en":"Pre-alarm signal, because it may lead to an alarm"},{"en":"Alarm signal, because it could disable a device"}],"ans":[1],"ref":"NFPA 72-2022 §3.3 (Trouble Condition / Trouble Signal); §12.6.1","exp":"A ground fault is a trouble condition, meaning an abnormal condition of the system due to a fault, and it produces a trouble signal (Ch. 3; §12.6.1). Supervisory signals are for conditions in other supervised systems, such as valves, air pressure, or temperature."},{"id":"fund-011","task":"1.1.1","type":"single","diff":1,"q":{"en":"According to NFPA 72, equipment constructed and installed in conformity with the Code must be:"},"opts":[{"en":"Approved by the building owner's insurance carrier"},{"en":"Manufactured by the same company as the control unit"},{"en":"Labeled by the installing contractor with the installation date"},{"en":"Listed for the purpose for which it is used"}],"ans":[3],"ref":"NFPA 72-2022 §10.3.1","exp":"Per §10.3.1, equipment must be listed for the purpose for which it is used. 'Listed' means it appears in a list published by an organization acceptable to the AHJ that evaluates the product, such as UL (Ch. 3). It must also be installed per the manufacturer's published instructions (§10.3)."},{"id":"fund-012","task":"1.1.1","type":"single","diff":2,"q":{"en":"A technician plans to connect a two-wire conventional smoke detector made by one manufacturer to the initiating device circuit of a control unit made by another manufacturer. What must be confirmed before installation?"},"opts":[{"en":"That the detector is listed as compatible with that control unit"},{"en":"Only that the detector's rated voltage matches the IDC's nominal voltage"},{"en":"That the AHJ will give verbal approval at the final inspection"},{"en":"That the IDC has an end-of-line resistor of any value"}],"ans":[0],"ref":"NFPA 72-2022 §10.3 (listed and compatible equipment)","exp":"Devices that receive power from an IDC or SLC must be listed for use with that control unit (compatibility, §10.3). Matching voltage is not enough: two-wire detectors have standby and alarm currents that the panel must support according to its listing, and the EOL resistor must be the value the manufacturer specifies."},{"id":"fund-013","task":"1.1.1","type":"single","diff":2,"q":{"en":"Unless otherwise permitted by the AHJ, NFPA 72-2022 requires FACU displays, visible indicators, and controls to be mounted so that the highest switch, lamp, or textual display is not more than ___ above the finished floor and the lowest is not less than ___ above the finished floor."},"opts":[{"en":"5 ft 6 in. (1.68 m); 18 in. (450 mm)"},{"en":"6 ft 8 in. (2.03 m); 12 in. (300 mm)"},{"en":"6 ft (1.8 m); 15 in. (375 mm)"},{"en":"7 ft (2.13 m); 24 in. (600 mm)"}],"ans":[2],"ref":"NFPA 72-2022 §10.4.4","exp":"Per §10.4.4, the highest switch, lamp, or textual display must be no more than 6 ft (1.8 m) above the finished floor and the lowest no less than 15 in. (375 mm), unless the AHJ permits otherwise. The measurement is to the controls and display, not to the cabinet."},{"id":"fund-014","task":"1.1.1","type":"single","diff":2,"freq":true,"q":{"en":"A new FACU, a NAC power extender, and the supervising station transmitter will be installed in a storage room that is not continuously occupied. Unless an exception applies, what does NFPA 72 require at each of these equipment locations?"},"opts":[{"en":"A manual fire alarm box within 5 ft"},{"en":"Automatic smoke detection (or heat detection where ambient conditions prohibit smoke detection)"},{"en":"A visible notification appliance"},{"en":"A sprinkler head directly above the equipment"}],"ans":[1],"ref":"NFPA 72-2022 §10.4.5","exp":"In areas that are not continuously occupied, automatic smoke detection is required at each FACU, NAC power extender, and supervising station transmitter location to warn of a fire there (§10.4.5). Where ambient conditions prohibit smoke detection, heat detection is permitted. Limited exceptions are listed in §10.4.5."},{"id":"fund-015","task":"1.1.1","type":"single","diff":1,"q":{"en":"A Level I trainee with six months of experience is mounting and terminating initiating devices. According to NFPA 72, installation personnel must be:"},"opts":[{"en":"Licensed professional engineers"},{"en":"NICET Level III certified in all cases"},{"en":"Qualified, or supervised by persons who are qualified in the installation, inspection, and testing of the systems"},{"en":"Factory-certified on every brand of equipment in the building"}],"ans":[2],"ref":"NFPA 72-2022 §10.5.2.1; §10.5.2.3","exp":"Per §10.5.2.1, installation personnel must be qualified or work under the supervision of persons qualified in installation, inspection, and testing, which is why a Level I technician usually works under supervision. Qualification is documented by a state or local license, a certification acceptable to the AHJ (such as NICET), or manufacturer certification (§10.5.2.3)."},{"id":"fund-016","task":"1.1.1","type":"single","diff":3,"q":{"en":"A FACU has a nameplate primary input of 120 VAC. Based on the NFPA 72 equipment performance requirements for input voltage, between which voltages must the unit perform its intended functions?"},"opts":[{"en":"96 V and 144 V"},{"en":"108 V and 132 V"},{"en":"102 V and 138 V"},{"en":"102 V and 132 V"}],"ans":[3],"ref":"NFPA 72-2022 §10.3.5","exp":"§10.3.5 requires equipment to operate at 85% and 110% of nameplate voltage, and also at 32°F and 120°F (0°C and 49°C) and at 85% relative humidity at 86°F (30°C). 120 V × 0.85 = 102 V and 120 V × 1.10 = 132 V."},{"id":"fund-017","task":"1.2.1","type":"single","diff":1,"freq":true,"q":{"en":"For a protected premises fire alarm system without voice communications, NFPA 72 requires the secondary power supply to operate the system under quiescent load for at least ___ and then operate all alarm notification appliances for ___."},"opts":[{"en":"24 hours; 5 minutes"},{"en":"24 hours; 15 minutes"},{"en":"4 hours; 5 minutes"},{"en":"60 hours; 5 minutes"}],"ans":[0],"ref":"NFPA 72-2022 §10.6.7.2","exp":"Per §10.6.7.2, the secondary supply must provide 24 hours of quiescent (non-alarm) operation followed by 5 minutes of operating all alarm notification appliances used for evacuation. If the system has in-building fire emergency voice/alarm communications (EVACS), the alarm period becomes 15 minutes at maximum connected load."},{"id":"fund-018","task":"1.2.1","type":"single","diff":3,"freq":true,"q":{"en":"A non-voice FACU draws 0.35 A in standby and 2.4 A in alarm with all notification appliances operating. What is the minimum battery capacity required by NFPA 72, before applying any safety margin or derating?"},"opts":[{"en":"8.4 Ah"},{"en":"9.0 Ah"},{"en":"8.6 Ah"},{"en":"57.6 Ah"}],"ans":[2],"ref":"NFPA 72-2022 §10.6.7.2","exp":"Standby: 0.35 A × 24 h = 8.4 Ah. Alarm: 2.4 A × 5 min (5/60 h) = 0.2 Ah. Total: 8.6 Ah (§10.6.7.2). The 9.0 Ah answer comes from using 15 minutes of alarm, which applies only to EVACS. In practice, add the safety margin required by the manufacturer or the specification."},{"id":"fund-019","task":"1.2.1","type":"single","diff":2,"q":{"en":"During acceptance testing, a technician activates a manual fire alarm box. Per NFPA 72, the alarm notification appliances, emergency control function interface devices, and annunciation at the protected premises must actuate within:"},"opts":[{"en":"5 seconds"},{"en":"10 seconds"},{"en":"60 seconds"},{"en":"200 seconds"}],"ans":[1],"ref":"NFPA 72-2022 §10.11.1","exp":"Per §10.11.1, alarm notification, emergency control function interface devices, and annunciation at the protected premises must actuate within 10 seconds after the initiating device activates. The 200 seconds applies to indicating integrity faults (§12.6.1)."},{"id":"fund-020","task":"1.2.1","type":"single","diff":2,"q":{"en":"During a semiannual inspection of a FACU's valve-regulated lead-acid (VRLA) batteries, which marking does NFPA 72 require the technician to verify on each battery?"},"opts":[{"en":"The month and year of manufacture, in month/year format"},{"en":"The ampere-hour rating written by the installer"},{"en":"The date of the last discharge test"},{"en":"An expiration date assigned by the AHJ"}],"ans":[0],"ref":"NFPA 72-2022 §10.6.10.1; Table 14.3.1 (Batteries)","exp":"Batteries must be marked with the month and year of manufacture in month/year format (§10.6.10.1). Table 14.3.1 requires that marking to be verified at the semiannual inspection, along with connections, corrosion, case deformation, and leakage. Since January 1, 2024, rechargeable secondary-supply batteries must also be listed or component-recognized (§10.6.10.1.3)."},{"id":"fund-021","task":"1.2.1","type":"single","diff":2,"q":{"en":"A system uses positive alarm sequence. The smoke detector signal is acknowledged at the FACU within 15 seconds. How long do the personnel then have to investigate and reset the system before notification signals activate automatically?"},"opts":[{"en":"Up to 60 seconds"},{"en":"Up to 120 seconds"},{"en":"Up to 180 seconds"},{"en":"Up to 300 seconds"}],"ans":[2],"ref":"NFPA 72-2022 §23.8.1.2.1.1","exp":"With positive alarm sequence (PAS) the signal must be acknowledged within 15 seconds, followed by an investigation phase of up to 180 seconds (§23.8.1.2.1.1). Notification activates immediately if the signal is not acknowledged, if the system is not reset in time, if a second PAS detector operates, or if any other initiating device operates."},{"id":"fund-022","task":"1.2.1","type":"multi","select":2,"diff":3,"q":{"en":"Which TWO are recognized by NFPA 72 as ways for inspection, testing, and service personnel to be qualified? (Select TWO.)"},"opts":[{"en":"Holding an OSHA 10-hour construction safety card"},{"en":"Certification by a nationally recognized fire alarm certification organization acceptable to the AHJ (for example, NICET)"},{"en":"Being designated by the building owner as the maintenance person"},{"en":"Six months of experience as an electrician's helper"},{"en":"Factory training and certification for the specific type and brand of system being serviced"}],"ans":[1,4],"ref":"NFPA 72-2022 §10.5.3.4; A.10.5.3.4(2)","exp":"§10.5.3.4 lists, among other options: personnel factory trained and certified for the specific type and brand of system; certified by a nationally recognized fire alarm certification organization acceptable to the AHJ (the annex mentions NICET and ESA); licensed or certified by a state or local authority; or employed by an organization listed to service the systems. An OSHA 10 card or simply being designated by the owner does not qualify anyone."},{"id":"fund-023","task":"1.2.2","type":"single","diff":2,"freq":true,"q":{"en":"A technician silences a trouble signal caused by a failed battery charger that cannot be repaired until parts arrive. Per NFPA 72, if the fault is not corrected, how often must the silenced trouble signal automatically resound?"},"opts":[{"en":"Every 4 hours or less"},{"en":"Every 8 hours or less"},{"en":"Every 24 hours or less"},{"en":"Every 48 hours or less"}],"ans":[2],"ref":"NFPA 72-2022 §10.15.9","exp":"A silenced trouble signal must resound automatically every 24 hours or less until the fault is corrected (§10.15.9). The 4-hour interval applies only to failure or depletion of the primary battery of wireless devices (§10.15.9.2)."},{"id":"fund-024","task":"1.2.2","type":"single","diff":2,"q":{"en":"During an alarm, the fire department uses the alarm silence (deactivation) control to turn off the notification appliances. Before the system is reset, an addressable smoke detector in a different area activates. What does NFPA 72 require?"},"opts":[{"en":"The notification appliances must reactivate"},{"en":"Nothing happens until the panel is reset"},{"en":"Only the FACU's local buzzer sounds"},{"en":"Only the visible appliances reactivate"}],"ans":[0],"ref":"NFPA 72-2022 §10.12","exp":"Per §10.12, subsequent activation of initiating devices on other IDCs, or of other addressable devices on the SLC, must reactivate silenced notification appliances. Silencing turns off audible and visible appliances together (§10.12.2), and the silence control must be protected against unauthorized use."},{"id":"fund-025","task":"1.2.2","type":"single","diff":1,"freq":true,"q":{"en":"A sprinkler control valve is partially closed and its valve supervisory (tamper) switch operates. Which type of signal should the FACU display?"},"opts":[{"en":"Alarm signal"},{"en":"Trouble signal"},{"en":"Pre-alarm signal"},{"en":"Supervisory signal"}],"ans":[3],"ref":"NFPA 72-2022 §3.3 (Supervisory Condition / Supervisory Signal); §10.14","exp":"A closed valve is a supervisory condition, an abnormal condition in the supervision of other systems, processes, or equipment (Ch. 3), and it produces a supervisory signal (§10.14). A trouble signal indicates a problem with the fire alarm system itself, such as an open, a ground, or loss of ac power."},{"id":"fund-026","task":"1.2.2","type":"single","diff":2,"q":{"en":"Which of the following conditions should produce a TROUBLE signal rather than a supervisory signal?"},"opts":[{"en":"Low air pressure on a dry-pipe sprinkler system"},{"en":"Loss of primary (AC) power at the FACU"},{"en":"Operation of a valve tamper switch"},{"en":"Low temperature in a dry-pipe valve room"}],"ans":[1],"ref":"NFPA 72-2022 §10.6.9; §10.15; §3.3","exp":"Loss of primary power is a fault of the fire alarm system itself. §10.6.9 requires the power supplies to be monitored, and their failure produces a trouble signal (§10.15). Low air pressure, an off-normal valve, and low temperature in the valve room are supervisory conditions of the sprinkler system."},{"id":"fund-027","task":"1.2.2","type":"single","diff":1,"freq":true,"q":{"en":"According to NFPA 72 signal priority, which order is correct from highest to lowest priority?"},"opts":[{"en":"Supervisory, fire alarm, trouble"},{"en":"Fire alarm, trouble, supervisory"},{"en":"Fire alarm, supervisory, trouble"},{"en":"Trouble, supervisory, fire alarm"}],"ans":[2],"ref":"NFPA 72-2022 §10.7","exp":"Per §10.7, fire alarm signals take precedence over all other signals (except the mass notification cases the code permits), supervisory signals take precedence over trouble signals, and trouble has the lowest priority. Memory aid: Alarm > Supervisory > Trouble."},{"id":"fund-028","task":"1.2.2","type":"single","diff":2,"q":{"en":"A technician must turn off the primary power and disconnect the batteries to replace them on a FACU that is monitored by a central station. What should be done FIRST?"},"opts":[{"en":"Turn off and lock the breaker, then notify everyone after the work is complete"},{"en":"Silence the expected trouble signals and proceed, since the work will take less than 8 hours"},{"en":"Disconnect the batteries with AC power on so the panel never loses power, without notifying anyone"},{"en":"Notify the owner or designated representative and the supervising station (and others who receive signals) before taking the system out of service"}],"ans":[3],"ref":"NFPA 72-2022 §10.21.1; Ch. 14 (notification before testing and service)","exp":"Removing power impairs the system. §10.21.1 requires notifying the owner or designated representative when a system, or part of it, is impaired, and Chapter 14 requires notifying those who receive signals (supervising station, occupants) before the work to avoid an unnecessary response. Afterward, restore and test the system and give notice that the impairment has ended (§10.21.6)."},{"id":"fund-029","task":"1.2.2","type":"single","diff":3,"q":{"en":"A fire alarm system is taken out of service at 7:00 a.m. for a control unit replacement, and the work is expected to be completed at 5:30 p.m. the same day. Under NFPA 72-2022, what additional notification does this outage require?"},"opts":[{"en":"None, because planned outages are exempt"},{"en":"The service provider must report it to the AHJ, because the system will be out of service for more than 8 hours"},{"en":"The equipment manufacturer must be notified, because the outage exceeds 4 hours"},{"en":"Notification is required only if the outage exceeds 24 hours"}],"ans":[1],"ref":"NFPA 72-2022 §10.21.4","exp":"From 7:00 a.m. to 5:30 p.m. is 10.5 hours. Per §10.21.4, the service provider must report to the AHJ any system out of service for more than 8 hours, in addition to notifying the owner (§10.21.1). Other adopted codes, such as NFPA 101, may require a fire watch when a system is out of service more than 4 hours in 24; NFPA 72 leaves mitigation to the AHJ (§10.21.5)."},{"id":"fund-030","task":"1.2.2","type":"single","diff":1,"q":{"en":"How long does NFPA 72-2022 require the system owner or the owner's designated representative to keep a record of a system impairment?"},"opts":[{"en":"1 year from the date the impairment is corrected"},{"en":"90 days from the start of the impairment"},{"en":"3 years from the date of the impairment"},{"en":"For the life of the system"}],"ans":[0],"ref":"NFPA 72-2022 §10.21.2","exp":"Per §10.21.2, the owner or designated representative must keep a record of an impairment for 1 year from the date the impairment is corrected."},{"id":"fund-031","task":"1.2.2","type":"multi","select":2,"diff":3,"q":{"en":"Which TWO notifications are required by NFPA 72-2022 Section 10.21 regarding system impairments? (Select TWO.)"},"opts":[{"en":"The equipment manufacturer must be notified of any impairment lasting more than 4 hours"},{"en":"The system owner or designated representative must be notified when a system or part of it is impaired"},{"en":"The building must be evacuated whenever any part of the system is impaired"},{"en":"The fire department must be notified within 1 hour of any trouble signal"},{"en":"The system owner or designated representative and the AHJ must be notified when the impairment period ends"}],"ans":[1,4],"ref":"NFPA 72-2022 §10.21.1 and §10.21.6","exp":"§10.21.1 requires notifying the owner or designated representative when the system, or part of it, is impaired, including out-of-service events. §10.21.6 requires notifying the owner and the AHJ when the impairment period ends. NFPA 72 does not itself order an evacuation; mitigating measures are whatever the AHJ requires (§10.21.5)."},{"id":"fund-032","task":"1.2.2","type":"single","diff":2,"q":{"en":"While a fire alarm system is impaired, who determines under NFPA 72-2022 whether mitigating measures, such as a fire watch, must be implemented?"},"opts":[{"en":"The technician performing the repair"},{"en":"The equipment manufacturer"},{"en":"The authority having jurisdiction (AHJ)"},{"en":"The central station operator"}],"ans":[2],"ref":"NFPA 72-2022 §10.21.5","exp":"Per §10.21.5, mitigating measures (fire watch, patrols, etc.) are implemented during the impairment where required by the AHJ. The annex explains that they are evaluated case by case based on building type, occupancy, duration, and hazards."},{"id":"fund-033","task":"1.2.2","type":"single","diff":2,"q":{"en":"A smoke detector outside a locker-room shower activates because of steam; no fire or other hazardous condition exists. Using NFPA 72-2022 terminology, this event is best classified as a(n):"},"opts":[{"en":"Malicious alarm"},{"en":"Nuisance alarm (a type of unwanted alarm)"},{"en":"Unknown alarm"},{"en":"Supervisory signal"}],"ans":[1],"ref":"NFPA 72-2022 §3.3 (Unwanted Alarm; Nuisance Alarm); §10.22","exp":"An unwanted alarm is any alarm that does not result from a potentially hazardous condition; its subcategories are malicious, nuisance, unintentional, and unknown (Ch. 3). Steam is a non-hazardous stimulus, so this is a nuisance alarm. The cause must be investigated and corrected (§10.22), for example by relocating the detector or changing its type per Chapter 17."},{"id":"fund-034","task":"1.2.2","type":"single","diff":3,"q":{"en":"Which of the following terms is NOT one of the subcategories of 'unwanted alarm' defined in NFPA 72-2022?"},"opts":[{"en":"Malicious alarm"},{"en":"Unintentional alarm"},{"en":"Unknown alarm"},{"en":"False alarm"}],"ans":[3],"ref":"NFPA 72-2022 §3.3 (Unwanted Alarm)","exp":"The four subcategories of unwanted alarm are malicious (a person acting with malice), nuisance (a non-hazardous stimulus), unintentional (a person acting without malice), and unknown (cause not identified). 'False alarm' is a colloquial term that NFPA 72 no longer defines."},{"id":"fund-035","task":"1.3.1","type":"single","diff":1,"q":{"en":"In NFPA 72, the word 'should' indicates:"},"opts":[{"en":"A recommendation or that which is advised but not required"},{"en":"A mandatory requirement"},{"en":"A requirement that applies only to existing systems"},{"en":"A requirement that only the AHJ can enforce"}],"ans":[0],"ref":"NFPA 72-2022 §3.2.6 and §3.2.7","exp":"'Shall' indicates a mandatory requirement (§3.2.6) and 'should' indicates a recommendation, something advised but not required (§3.2.7). When a question asks what the code 'requires', look for a 'shall' in the body of the code, not in the annex."},{"id":"fund-036","task":"1.3.1","type":"single","diff":2,"q":{"en":"While looking up a section of NFPA 72, a technician notices an asterisk (*) after the section number. What does this indicate?"},"opts":[{"en":"The section changed from the previous edition"},{"en":"The section is a retroactive requirement"},{"en":"Explanatory material for that section is in Annex A, which is informational and not part of the requirements"},{"en":"The text was extracted from another NFPA document"}],"ans":[2],"ref":"NFPA 72-2022 (document format); Annex A","exp":"The asterisk (*) points to explanatory material in Annex A, which is informational and not part of the mandatory requirements. Text extracted from other NFPA documents is identified by a bracketed reference, such as [101]. Use the annex to understand intent, but do not cite it as a requirement."},{"id":"fund-037","task":"1.3.1","type":"multi","select":2,"diff":2,"freq":true,"q":{"en":"Which TWO statements correctly reflect the official NFPA definitions in NFPA 72 Chapter 3? (Select TWO.)"},"opts":[{"en":"'Labeled' means the AHJ has accepted the equipment"},{"en":"'Approved' means acceptable to the authority having jurisdiction"},{"en":"'Listed' means the manufacturer self-certifies that the product meets the standard"},{"en":"'Approved' means the equipment has been tested by a nationally recognized testing laboratory"},{"en":"'Listed' means included in a list published by an organization acceptable to the AHJ that evaluates products and maintains periodic inspection of production"}],"ans":[1,4],"ref":"NFPA 72-2022 §3.2 (Approved, Labeled, Listed)","exp":"Approved means acceptable to the AHJ (§3.2.1). Listed means included in a list published by an organization acceptable to the AHJ that evaluates products and periodically inspects production (§3.2.5). Labeled means bearing the label or symbol of that organization (§3.2.4). A listed product is not automatically approved: the AHJ does the approving."},{"id":"fund-038","task":"1.3.1","type":"single","diff":1,"q":{"en":"Drawings that document the location of all devices and appliances, wiring sequences, wiring methods, and connections of the system components as installed are called:"},"opts":[{"en":"Shop drawings"},{"en":"Riser diagrams"},{"en":"Preliminary design drawings"},{"en":"Record drawings (as-builts)"}],"ans":[3],"ref":"NFPA 72-2022 §3.3 (Record Drawings); Ch. 7","exp":"Record drawings ('as-builts') document how the system was actually installed: device and appliance locations, wiring sequences and methods, and connections (Ch. 3). Chapter 7 includes them in the documentation delivered to the owner; a Level I technician often marks up the field changes that feed those drawings."},{"id":"fund-039","task":"1.3.1","type":"single","diff":3,"q":{"en":"An in-building fire emergency voice/alarm communications system (EVACS) draws 0.5 A in standby and 4.0 A at maximum connected load in alarm. What minimum secondary power capacity does NFPA 72 require, before any safety margin?"},"opts":[{"en":"13.0 Ah"},{"en":"12.33 Ah"},{"en":"14.0 Ah"},{"en":"16.0 Ah"}],"ans":[0],"ref":"NFPA 72-2022 §10.6.7.2","exp":"EVACS requires 24 hours of standby plus 15 minutes at maximum connected load (§10.6.7.2). Standby: 0.5 A × 24 h = 12 Ah. Alarm: 4.0 A × 0.25 h = 1.0 Ah. Total: 13.0 Ah. The 12.33 Ah answer comes from mistakenly using 5 minutes. Battery calculations are part of the system documentation (Ch. 7)."},{"id":"fund-040","task":"1.3.1","type":"single","diff":2,"q":{"en":"An existing fire alarm system was installed and approved under an older edition of NFPA 72, and a new edition is then adopted. According to NFPA 72 Chapter 1, unless otherwise noted:"},"opts":[{"en":"The existing system must be upgraded to the new edition within 1 year"},{"en":"The system must be replaced at its next annual inspection"},{"en":"Only the building owner can decide whether the new edition applies"},{"en":"The new edition is not required to be applied to installations that existed or were approved before its effective date"}],"ans":[3],"ref":"NFPA 72-2022 §1.4.1","exp":"Per §1.4.1, unless otherwise noted, the code does not apply to installations that existed or were approved before its effective date. The AHJ may still apply portions retroactively where the existing situation is an unacceptable risk (§1.4). The inspection, testing, and maintenance requirements of Chapter 14 do apply to existing systems."}]},{"topic":{"id":"init","title":"Initiating Devices (NFPA 72-2022 Ch. 17)","short":"Initiating","tasks":["1.1.1","1.2.1","1.2.2","1.3.1"],"refs":["NFPA 72-2022 Ch. 17","NFPA 72-2022 Ch. 14 (§14.4)","NFPA 72-2022 Ch. 7 and Ch. 12","Manufacturer's published instructions"],"guide":"\n<h3>What NICET expects at Level I</h3>\n<p>Under task 1.1.1 (mount and terminate peripherals), a Level I technician must know <strong>where and how</strong> each initiating device is installed according to Chapter 17 of NFPA 72-2022 and the manufacturer's published instructions: distances from walls and ceilings, spacing, ceiling-height reductions, environmental limits, duct detectors, waterflow, valve supervision, and manual fire alarm boxes. Under maintenance (1.2.1 and 1.2.2) the exam asks how these devices are tested and when they are cleaned or replaced (Chapter 14). Engineering design is not expected, but simple calculations are: 0.7S, the Table 17.6.3.5.1 multipliers, 50 percent on solid joists, and travel distance to manual boxes.</p>\n<div class=\"callout\"><strong>Watch the 2022 numbering.</strong> If you studied from 2016/2019 material, several sections moved: smoke detector location and spacing went from 17.7.3 to <strong>17.7.4</strong>; HVAC to <strong>17.7.5</strong>; duct detectors and smoke control to <strong>17.7.6</strong>; special considerations to <strong>17.7.7</strong>; protection during construction is now <strong>17.7.2</strong>. CO detectors are in <strong>17.12</strong>, waterflow in <strong>17.13</strong>, manual boxes in <strong>17.15</strong>, and supervisory devices in <strong>17.17</strong> (in 2016 waterflow, manual boxes, and supervisory were 17.12, 17.14, and 17.16).</div>\n\n<h3>General requirements (§17.4)</h3>\n<ul>\n<li>Protect the device where it is subject to mechanical damage; a guard on a smoke, heat, or flame detector must be <strong>listed for use with that detector</strong>.</li>\n<li>Support it <strong>independently of the circuit conductors</strong> (a box or solid base; never hanging by its wires).</li>\n<li>Install it so it stays <strong>accessible</strong> for inspection, testing, and maintenance.</li>\n<li>Use the separate in and out terminals: cut the conductor and land each end separately; never loop a continuous wire under the screw (integrity monitoring, §12.6).</li>\n<li>Always follow the manufacturer's published instructions: box type, base, address, orientation, and dust cover.</li>\n</ul>\n\n<h3>Heat detectors (§17.6)</h3>\n<table>\n<thead><tr><th>Classification</th><th>Temperature rating</th><th>Color code</th></tr></thead>\n<tbody>\n<tr><td>Low (controlled environments only)</td><td>100–134°F</td><td>Uncolored</td></tr>\n<tr><td>Ordinary</td><td>135–174°F</td><td>Uncolored</td></tr>\n<tr><td>Intermediate</td><td>175–249°F</td><td>White</td></tr>\n<tr><td>High</td><td>250–324°F</td><td>Blue</td></tr>\n<tr><td>Extra high</td><td>325–399°F</td><td>Red</td></tr>\n<tr><td>Very extra high</td><td>400–499°F</td><td>Green</td></tr>\n<tr><td>Ultra high</td><td>500–575°F</td><td>Orange</td></tr>\n</tbody>\n</table>\n<p>Source: §17.6.2 and Table 17.6.2.1. Key rule: the detector's rating must be <strong>at least 20°F (11°C) above</strong> the maximum expected ceiling temperature. Example: attic at 150°F → intermediate detector (for example, 194°F, white).</p>\n<ul>\n<li><strong>Spot-type location (§17.6.3.1.3):</strong> on the ceiling not less than 4 in. (100 mm) from the sidewall, or on the sidewall between 4 in. and 12 in. (100–300 mm) below the ceiling.</li>\n<li><strong>Smooth ceiling (§17.6.3.1.1):</strong> do not exceed the listed spacing (S) and keep detectors within S/2 of the walls, or make sure every point on the ceiling is within 0.7S of a detector.</li>\n<li><strong>Solid joists (§17.6.3.2):</strong> measured at right angles to the joists, maximum 50 percent of S.</li>\n<li><strong>Sloped ceilings (§17.6.3.4):</strong> first row within 36 in. of the peak, measured horizontally; on shed ceilings, within 36 in. of the high side.</li>\n<li><strong>Types:</strong> fixed-temperature; rate-of-rise (about 15°F/min per the manufacturer); rate-compensation; line-type (heat-sensitive cable). Nonrestorable (fusible) detectors are never heat-tested.</li>\n</ul>\n<h4>Ceiling height reduction (Table 17.6.3.5.1)</h4>\n<table>\n<thead><tr><th>Ceiling height (above – up to)</th><th>Multiply S by</th></tr></thead>\n<tbody>\n<tr><td>0–10 ft</td><td>1.00</td></tr>\n<tr><td>10–12 ft</td><td>0.91</td></tr>\n<tr><td>12–14 ft</td><td>0.84</td></tr>\n<tr><td>14–16 ft</td><td>0.77</td></tr>\n<tr><td>16–18 ft</td><td>0.71</td></tr>\n<tr><td>18–20 ft</td><td>0.64</td></tr>\n<tr><td>20–22 ft</td><td>0.58</td></tr>\n<tr><td>22–24 ft</td><td>0.52</td></tr>\n<tr><td>24–26 ft</td><td>0.46</td></tr>\n<tr><td>26–28 ft</td><td>0.40</td></tr>\n<tr><td>28–30 ft</td><td>0.34</td></tr>\n</tbody>\n</table>\n<p>Example: S = 50 ft on a 15-ft ceiling → 50 × 0.77 = 38.5 ft.</p>\n\n<h3>Smoke detectors (§17.7)</h3>\n<table>\n<thead><tr><th>Requirement</th><th>Value</th><th>Where</th></tr></thead>\n<tbody>\n<tr><td>Environmental limits (unless listed for the conditions)</td><td>32–100°F; RH not over 93 percent; air velocity not over 300 ft/min</td><td>§17.7.1</td></tr>\n<tr><td>Spot-type location</td><td>On the ceiling, or on the sidewall with the top of the detector not more than 12 in. below the ceiling</td><td>§17.7.4.2.1</td></tr>\n<tr><td>Smooth ceiling spacing</td><td>30 ft nominal and not more than 15 ft to walls, or every point within 0.7S = 21 ft</td><td>§17.7.4.2.3.1</td></tr>\n<tr><td>Beams shallower than 0.1H</td><td>Smooth ceiling spacing permitted</td><td>§17.7.4.2.4</td></tr>\n<tr><td>Beams 0.1H or deeper, spaced 0.4H or more apart</td><td>A detector in each beam pocket</td><td>§17.7.4.2.4</td></tr>\n<tr><td>Peaked / shed ceiling</td><td>Within 36 in. of the peak / of the high side</td><td>§17.7.4</td></tr>\n<tr><td>Air sampling (ASD)</td><td>Each port = one spot-type detector; maximum transport time 120 s</td><td>§17.7.4.6</td></tr>\n<tr><td>HVAC airflow</td><td>Not where airflow prevents operation (annex: 36 in. from supply diffusers and returns)</td><td>§17.7.5</td></tr>\n<tr><td>High air movement</td><td>60 changes/h = 125 ft²; 30 = 250 ft²; 15 = 500 ft²</td><td>Table 17.7.7.3.3.2</td></tr>\n</tbody>\n</table>\n<ul>\n<li><strong>Construction (§17.7.2):</strong> if detection is not required during construction, detectors are installed after all other trades complete cleanup. If they were installed earlier, they are cleaned and verified within their listed sensitivity, or replaced, before the final acceptance test. Removing the dust cover is not enough.</li>\n<li><strong>Detector base (§17.7.7.1.2):</strong> holes in the back are covered with a gasket or sealant so airflow from the box or conduit does not keep smoke out.</li>\n<li><strong>Principles:</strong> ionization (radioactive source; best for flaming fires with small particles); photoelectric light-scattering (best for smoldering fires with large particles); projected beam (light obscuration; stable surfaces and a clear path).</li>\n</ul>\n\n<h3>Duct, flame, multi-sensor, and CO detectors</h3>\n<ul>\n<li><strong>Duct (§17.7.6):</strong> listed for the duct's velocity, temperature, and humidity; on the supply side, downstream of the fan and filters; mounted per the manufacturer and accessible for cleaning; remote indicator if concealed more than 10 ft above the floor or not visible; never a substitute for open-area detection.</li>\n<li><strong>Flame (§17.8):</strong> need line of sight; if a fire can occur off the optical axis, reduce the distance or add detectors.</li>\n<li><strong>Combination and multi-sensor (§17.9):</strong> listed for each sensor; the listing determines location and spacing.</li>\n<li><stro
