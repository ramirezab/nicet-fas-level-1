\" d=\"M155 100 H175 l5 -14 l10 28 l10 -28 l10 28 l10 -28 l10 28 l5 -14 H255\"/><path class=\"hs-line\" d=\"M280 100 H310 M340 100 H380\"/><path class=\"hs-line\" style=\"stroke-width:3\" d=\"M310 76 V124 M330 76 V124\"/><path class=\"hs-line\" style=\"stroke-width:3\" d=\"M320 88 V112 M340 88 V112\"/><text class=\"hs-label\" x=\"300\" y=\"82\" text-anchor=\"middle\">+</text><path class=\"hs-line\" d=\"M455 62 V100 M425 100 H485 M435 112 H475 M445 124 H465\"/><path class=\"hs-line\" d=\"M530 100 H562 M594 82 V118 M594 100 H630\"/><path class=\"hs-dev\" d=\"M562 82 L562 118 L594 100 Z\"/><path class=\"hs-line\" d=\"M655 100 H668 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0 H736\"/><text class=\"hs-text\" x=\"20\" y=\"186\">Six common schematic symbols (as found in electrical reference books such as Ugly’s)</text></svg>","regions":[{"x":270,"y":40,"w":120,"h":120,"ok":true}],"ref":"Ugly’s Electrical References (2020) — electrical symbols","exp":"A battery is drawn as alternating long and short plates (box 3); the long plate is the positive terminal. The two equal plates of box 1 are a capacitor, and the three shrinking lines of box 4 are ground."}]}];
window.NICET_GUIDES=[{"id":"exam","group":"exam","eyebrow":"Official facts · checked October 2026","title":"About the NICET FAS Level I exam","html":"\n<p>Fire Alarm Systems (FAS) <strong>Level I</strong> certifies trainee and entry-level technicians who work under supervision: they install devices and cabling, follow job-site safety rules, perform periodic testing and replace deficient equipment. Since <strong>March 25, 2024</strong> NICET uses a new outline with 3 domains and 6 tasks; the old element-based exams were retired that day.</p>\n<div class=\"callout warn\"><p><strong>Watch out for old material.</strong> Many study guides online still use NFPA 72-2013/2016 or the weights of the old outline. Today’s exam is based on NFPA 72 <strong>2022</strong>, NFPA 70 <strong>2020</strong> and Ugly’s <strong>2020</strong>. NICET has announced an update to NFPA 72-2025 around mid-2027 (date to be confirmed).</p></div>\n\n<h3>Format</h3>\n<table><tbody>\n<tr><th>Questions</th><td>85</td></tr>\n<tr><th>Time</th><td>110 minutes (plus a 10-minute tutorial that is not counted)</td></tr>\n<tr><th>Where</th><td>Pearson VUE test centers, or online with a remote proctor (OnVUE, US residents only)</td></tr>\n<tr><th>Question types</th><td>Multiple choice and multiple response (the question says how many to select). Some open an exhibit, and a few are answered by clicking on part of a picture.</td></tr>\n<tr><th>Navigation</th><td>One question at a time; you can move forward and back, flag questions for review and leave comments.</td></tr>\n<tr><th>References</th><td>Your own printed NFPA 72, NFPA 70 and Ugly’s, tabbed and highlighted (rules below).</td></tr>\n<tr><th>Calculator</th><td>Built into the exam screen. Personal calculators are not allowed. NICET has a <a href=\"https://www.nicet.org/certification-programs/electrical-and-mechanical-systems/cbt-calculator-preview\" target=\"_blank\" rel=\"noopener\">calculator preview</a>.</td></tr>\n<tr><th>Breaks</th><td>No scheduled break at Level I. You may take an unscheduled break, but the clock keeps running.</td></tr>\n<tr><th>Non-disclosure agreement</th><td>You must accept it to begin. Declining it counts as a failed exam and the fee is forfeited.</td></tr>\n</tbody></table>\n\n<h3>Content outline (March 2024)</h3>\n<table><thead><tr><th>Domain / task</th><th>Share of exam</th><th>References</th></tr></thead><tbody>\n<tr><td><strong>1.1 Installation</strong></td><td><strong>44–54%</strong></td><td></td></tr>\n<tr><td>1.1.1 Mount and terminate peripherals (e.g., initiating and notification devices)</td><td></td><td>NFPA 72 · Ugly’s</td></tr>\n<tr><td>1.1.2 Install cabling and associated infrastructure</td><td></td><td>NFPA 72 · NFPA 70 · Ugly’s</td></tr>\n<tr><td>1.1.3 Comply with job site safety requirements</td><td></td><td>OSHA 1910 · OSHA 1926 · First Aid/CPR/AED</td></tr>\n<tr><td><strong>1.2 Maintenance</strong></td><td><strong>40–50%</strong></td><td></td></tr>\n<tr><td>1.2.1 Perform periodic testing of systems and devices</td><td></td><td>NFPA 72</td></tr>\n<tr><td>1.2.2 Repair/replace impaired/deficient devices</td><td></td><td>NFPA 72 · Bukowski</td></tr>\n<tr><td><strong>1.3 Submittal Preparation and System Layout</strong></td><td><strong>1–11%</strong></td><td></td></tr>\n<tr><td>1.3.1 Knowledge of technical documents</td><td></td><td>NFPA 72 · NFPA 70 · Ugly’s</td></tr>\n</tbody></table>\n<p class=\"small\">Source: <a href=\"https://www.nicet.org/nicetorg/assets/File/public/FAS_I_Content_Outline.pdf\" target=\"_blank\" rel=\"noopener\">FAS Level I Content Outline</a>. NICET does not split the percentages by task; this site’s exams use 16 / 16 / 10 / 21 / 17 / 5 questions.</p>\n\n<h3>Which books you can use</h3>\n<table><thead><tr><th>Publication</th><th>Edition</th><th>Allowed in the test center?</th></tr></thead><tbody>\n<tr><td>NFPA 72, National Fire Alarm and Signaling Code</td><td>2022</td><td>Yes (printed)</td></tr>\n<tr><td>NFPA 70, National Electrical Code</td><td>2020</td><td>Yes (printed)</td></tr>\n<tr><td>Ugly’s Electrical References (Jones &amp; Bartlett)</td><td>2020</td><td>Yes (printed)</td></tr>\n<tr><td>OSHA 29 CFR 1910 and 29 CFR 1926</td><td>current</td><td><strong>No</strong> — study only, memorize</td></tr>\n<tr><td>American Red Cross First Aid/CPR/AED Participant’s Manual</td><td>current</td><td><strong>No</strong> — study only, memorize</td></tr>\n<tr><td>Bukowski, Fire Alarm Signaling Systems (NFPA)</td><td>4th ed.</td><td><strong>No</strong> — study only</td></tr>\n</tbody></table>\n<ul>\n<li>Books must be bound or in a three-ring binder with a title page (<a href=\"https://www.nicet.org/nicetorg/assets/File/public/Title_Page_Example.docx\" target=\"_blank\" rel=\"noopener\">NICET template</a>).</li>\n<li>Highlighting and self-adhesive tabs are allowed, but tabs must be <strong>permanently attached</strong>. Handwritten notes, loose pages, sticky notes and repositionable tabs are not allowed.</li>\n<li>An NFPA Handbook is not accepted in place of the code.</li>\n<li>You may bring a different edition “at your own risk”: questions are based on the editions listed above.</li>\n<li>Testing at home with OnVUE has its own rules for what may be on the desk; confirm them with NICET (<code>test@nicet.org</code>) before exam day.</li>\n</ul>\n\n<h3>Scoring</h3>\n<ul>\n<li>Scaled score from <strong>0 to 700; 500 is the lowest passing score</strong>. NICET does not publish the percent-correct equivalent.</li>\n<li><strong>No penalty for wrong answers.</strong> Never leave a question blank.</li>\n<li>You see an unofficial pass/fail result at the end of the session. The official report appears in your portal within about 14 days. A failing report shows your scaled score and percent correct by domain.</li>\n<li>Retakes: after 30 days, up to 3 attempts in 12 months.</li>\n</ul>\n<div class=\"callout\"><p><strong>Practical target on this site:</strong> 80% or more on the fixed practice exams before you schedule. The 70% shown on results pages is only a practice benchmark, not the official cut score.</p></div>\n\n<h3>Certification requirements</h3>\n<ol>\n<li><strong>Pass the Level I exam.</strong> Passing alone does not make you certified.</li>\n<li><strong>Work history</strong> showing at least <strong>6 months full-time equivalent</strong> in fire detection and signaling (NICET counts 40 hours a week; one year at 50% equals 6 months).</li>\n<li><strong>Supervisor verification</strong> of the 5 Level I performance measures: job-site safety awareness, identifying common fire alarm equipment, safe use of tools (or drafting software), correct installation of components and infrastructure, and reading drawings and specifications. The verifier must be a technical supervisor who supervised you within the past 5 years — not a peer or a subordinate.</li>\n</ol>\n<p>No personal recommendations are needed (they start at Level III). Exam eligibility lasts 6 months from purchase, and after you pass you get one year of protection from program changes while you complete the rest.</p>\n\n<h3>Fees (effective August 1, 2026)</h3>\n<table><tbody>\n<tr><td>Level I application and exam</td><td>$235</td></tr>\n<tr><td>Reschedule more than 24 h ahead, same window</td><td>Free</td></tr>\n<tr><td>Reschedule within 24 h or into a new window</td><td>Half the fee (≈ $117.50)</td></tr>\n<tr><td>No-show</td><td>Fee forfeited</td></tr>\n<tr><td>Recertification (every 3 years)</td><td>$220 base</td></tr>\n</tbody></table>\n\n<h3>Recertification</h3>\n<p>Every 3 years you need <strong>90 continuing professional development (CPD) points</strong> from at least two categories, earned in the 36 months before expiration. Active practice in the field can count for up to 24 points a year.</p>\n\n<h3>After Level I</h3>\n<p>Level II requires passing the Level II exam (110 questions in 155 minutes, test centers only), at least 2 years of experience and verification of the Level I and Level II performance measures.</p>\n\n<h3>Official links</h3>\n<ul>\n<li><a href=\"https://nicet.org/fas\" target=\"_blank\" rel=\"noopener\">NICET Fire Alarm Systems program</a></li>\n<li><a href=\"https://nicet.org/certification-programs/electrical-and-mechanical-systems/fire-alarm-systems/certification-requirements/\" target=\"_blank\" rel=\"noopener\">Certification requirements</a></li>\n<li><a href=\"https://www.nicet.org/nicetorg/assets/File/public/FAS_I_General_References.pdf\" target=\"_blank\" rel=\"noopener\">Allowed references (General References)</a></li>\n<li><a href=\"https://www.nicet.org/exams/remote/\" target=\"_blank\" rel=\"noopener\">Online testing rules (OnVUE)</a></li>\n<li><a href=\"https://www.pearsonvue.com/us/en/nicet.html\" target=\"_blank\" rel=\"noopener\">NICET at Pearson VUE</a></li>\n<li><a href=\"https://www.osha.gov/laws-regs/regulations/standardnumber/1926\" target=\"_blank\" rel=\"noopener\">OSHA 29 CFR 1926</a> · <a href=\"https://www.osha.gov/laws-regs/regulations/standardnumber/1910\" target=\"_blank\" rel=\"noopener\">OSHA 29 CFR 1910</a></li>\n</ul>\n<p class=\"small\">NICET sells official practice tests in its online store. Real exam questions are confidential; the questions on this site are original.</p>\n"},{"id":"plan","group":"exam","eyebrow":"Study plan","title":"8-week study plan","html":"\n<p>A plan for someone working full time: about <strong>6 to 8 hours a week</strong>. With field experience you can compress it to 4–5 weeks, but do not skip NFPA 72 Chapter 14 or the safety material: together they are close to half the exam.</p>\n<div class=\"callout\"><p><strong>The rule of the plan:</strong> read the chapter in your printed code, practice its bank in study mode until you are above 80%, and every two weeks take a fixed practice exam on the clock to measure progress on the same questions.</p></div>\n<table>\n<thead><tr><th>Week</th><th>What to study</th><th>Practice on this site</th></tr></thead>\n<tbody>\n<tr><td>0</td><td>Read “About the exam”. Buy the printed NFPA 72 (2022), NFPA 70 (2020) and Ugly’s (2020) now, so you study and tab the same books you will take to the test center.</td><td><strong>Practice Exam 1</strong> before studying: your baseline.</td></tr>\n<tr><td>1</td><td>Fundamentals and definitions (NFPA 72 Ch. 1, 3 and 10). Basic electricity: Ohm’s law, series/parallel, voltage drop, batteries (Ugly’s).</td><td><em>Fundamentals</em> and <em>Electricity</em> banks.</td></tr>\n<tr><td>2</td><td>Initiating devices (NFPA 72 Ch. 17): smoke and heat detectors, manual fire alarm boxes, waterflow and supervisory devices.</td><td><em>Initiating</em> bank and the picture questions.</td></tr>\n<tr><td>3</td><td>Notification appliances (NFPA 72 Ch. 18): audibility, mounting heights, candela tables, corridors.</td><td><em>Notification</em> bank. <strong>Practice Exam 2</strong>.</td></tr>\n<tr><td>4</td><td>NEC Article 760 and wiring methods; NFPA 72 Ch. 12 (pathway classes), 21, 23 and 26.</td><td><em>NEC 760</em> and <em>Circuits/Systems</em> banks.</td></tr>\n<tr><td>5</td><td><strong>NFPA 72 Chapter 14</strong> in full: Table 14.3.1 (visual inspection) and Table 14.4.3.2 (test methods and frequencies). It is the heaviest topic of the Maintenance domain.</td><td><em>ITM Ch. 14</em> bank, twice.</td></tr>\n<tr><td>6</td><td>Troubleshooting and repair (circuit faults, ground faults, device replacement, impairments) and technical documents (NFPA 72 Ch. 7, drawings, data sheets).</td><td><em>Repair</em> and <em>Documents</em> banks. <strong>Practice Exam 3</strong>.</td></tr>\n<tr><td>7</td><td>Safety: OSHA 1926 (ladders, scaffolds, fall protection, electrical), OSHA 1910 (lockout/tagout, hazard communication) and First Aid/CPR/AED. <strong>These books are not allowed in the test center: memorize.</strong></td><td><em>Safety</em> bank. <strong>Practice Exam 4</strong>.</td></tr>\n<tr><td>8</td><td>Review your misses, finish permanently attaching your tabs, and practice finding answers in the printed books against the clock.</td><td>Daily smart review and <strong>Practice Exam 5</strong> on the clock. If you are above 80%, schedule.</td></tr>\n</tbody></table>\n<h3>How to use the practice exams</h3>\n<ul>\n<li><strong>Fixed Practice Exams 1–5</strong> do not repeat each other. Take them in plan order to compare progress.</li>\n<li><strong>Random full exam:</strong> use it after the five fixed ones. With “prioritize questions I have not seen” you work through the whole bank.</li>\n<li><strong>After every exam:</strong> review all the misses, read the explanation and find the cited section in your printed code. That is the moment to add a tab or a highlight.</li>\n<li><strong>Practice with the books open.</strong> Sit the practice exams with your printed references on the desk, exactly as on exam day, so you learn which lookups are worth the time.</li>\n</ul>\n<div class=\"callout warn\"><p><strong>Do not memorize letters.</strong> Options are shuffled on every attempt. What counts is knowing where the answer is in the code and why.</p></div>\n"},{"id":"strategy","group":"exam","eyebrow":"Exam day","title":"Strategy with printed code books","html":"\n<p>You have <strong>110 minutes for 85 questions: 1 minute 18 seconds per question</strong>. An open-book exam is usually failed on time, not on knowledge. With printed books the winning skill is knowing which page to open: chapter, table, section.</p>\n<h3>Two passes</h3>\n<ol>\n<li><strong>First pass (≈ 60 min):</strong> answer everything you know right away. If a question needs a lookup you cannot do in about 45 seconds, pick your best answer, <em>flag it</em> and move on.</li>\n<li><strong>Second pass (≈ 40 min):</strong> return to the flagged questions from the review screen and look them up with your tabs.</li>\n<li><strong>Last 10 min:</strong> make sure nothing is left blank. There is no penalty for wrong answers.</li>\n</ol>\n<table><thead><tr><th>Time check</th><th>You should be at</th></tr></thead>\n<tbody><tr><td>Minute 25</td><td>Question 20</td></tr><tr><td>Minute 50</td><td>Question 40</td></tr><tr><td>Minute 75</td><td>Question 60</td></tr><tr><td>Minute 100</td><td>Question 85 and reviewing flags</td></tr></tbody></table>\n\n<h3>Know the map of NFPA 72 (2022)</h3>\n<p>The first number of every section is its chapter (17.15 is in Chapter 17). If you know which chapter covers a topic, you can open the book within a few seconds.</p>\n<table><thead><tr><th>Chapter</th><th>Covers</th><th>Typical Level I questions</th></tr></thead><tbody>\n<tr><td>3</td><td>Definitions</td><td>Alarm vs. supervisory vs. trouble signal, listed vs. approved, IDC/SLC/NAC</td></tr>\n<tr><td>7</td><td>Documentation</td><td>Record of completion, record drawings, documentation cabinet</td></tr>\n<tr><td>10</td><td>Fundamentals</td><td>Power supplies, batteries, signal annunciation, impairments</td></tr>\n<tr><td>12</td><td>Circuits and Pathways</td><td>Class A/B/X, survivability levels, monitoring for integrity</td></tr>\n<tr><td>14</td><td>Inspection, Testing, and Maintenance</td><td>Table 14.3.1, Table 14.4.3.2, sensitivity, records</td></tr>\n<tr><td>17</td><td>Initiating Devices</td><td>Detector location and spacing, pull stations, waterflow, supervisory</td></tr>\n<tr><td>18</td><td>Notification Appliances</td><td>dBA rules, mounting heights, candela tables, corridors</td></tr>\n<tr><td>21</td><td>Emergency Control Function Interfaces</td><td>Relays within 3 ft, elevator recall and shutdown</td></tr>\n<tr><td>23</td><td>Protected Premises Alarm and Signaling Systems</td><td>Positive alarm sequence, alarm verification</td></tr>\n<tr><td>24</td><td>Emergency Communications Systems</td><td>Voice evacuation basics</td></tr>\n<tr><td>26</td><td>Supervising Station Alarm Systems</td><td>Central station, DACT, retransmission</td></tr>\n<tr><td>29</td><td>Single- and Multiple-Station Alarms and Household Systems</td><td>Smoke alarms</td></tr>\n<tr><td>Annex A</td><td>Explanatory material (not mandatory)</td><td>Background for sections marked with an asterisk (*)</td></tr>\n</tbody></table>\n<p>In NFPA 70, Article 760 sits in Chapter 7 (Special Conditions); wiring methods (Article 300) are in Chapter 3; conductor properties (Chapter 9, Table 8) and conduit fill (Chapter 9, Table 1 and Annex C) are at the back of the book.</p>\n\n<h3>Using the index of a printed code</h3>\n<ul>\n<li>Every NFPA code has an alphabetical index at the back. It is often faster than flipping through chapters for a topic you have not tabbed.</li>\n<li>Look up the <strong>code’s own term</strong>, not field slang: <em>manual fire alarm box</em> (pull station), <em>visible notification appliance</em> (strobe), <em>audible notification appliance</em> (horn), <em>supervisory signal initiating device</em> (tamper switch), <em>sprinkler waterflow alarm-initiating device</em> (flow switch).</li>\n<li>When the index gives several sections, go to the one in the chapter that matches the task (Chapter 14 for testing, 17 for installing an initiating device, 18 for an appliance).</li>\n<li>An asterisk (*) next to a section number means there is explanatory text in Annex A with the same number. The annex helps you understand, but the requirement is the numbered section.</li>\n</ul>\n\n<h3>Reading questions like NICET</h3>\n<ul>\n<li><strong>Shall</strong> = mandatory; <strong>should</strong> = recommendation (usually in Annex A, not a requirement).</li>\n<li>Watch for <strong>NOT</strong>, <strong>EXCEPT</strong>, <strong>minimum</strong>, <strong>maximum</strong>, <strong>at least</strong>, <strong>not more than</strong>.</li>\n<li>Multiple-response questions say how many to pick (“Select TWO”); you need all of them right to earn the point.</li>\n<li>Check units: inches vs. feet, dB vs. dBA, Ah vs. mAh.</li>\n<li>If two options look right, the one the code states (not your company’s practice) is the answer.</li>\n</ul>\n\n<h3>Logistics</h3>\n<ul>\n<li>Arrive 30 minutes early (or check in early for OnVUE). Bring valid government ID; at a test center bring two IDs as NICET requires.</li>\n<li>Your books must follow NICET’s rules: bound or in a three-ring binder with a title page, tabs permanently attached, no handwritten notes.</li>\n<li>No scheduled break at Level I. You can take an unscheduled one, but the clock keeps running.</li>\n<li>The calculator is the on-screen one; personal calculators are not allowed. Practice with this site’s calculator.</li>\n</ul>\n"},{"id":"numbers","group":"ref","eyebrow":"Quick reference","title":"Key numbers","html":"\n<p>The values asked most often, with their section in the exam editions (NFPA 72-2022, NEC 2020, current OSHA). Where the exact subsection could not be confirmed, the general section is cited. The 2022 edition renumbered parts of Chapters 17 and 18, so if your book is a different edition the numbers may not match.</p>\n\n<h3>Power and signals (NFPA 72 Ch. 10 and 12)</h3>\n<table><thead><tr><th>Topic</th><th>Value</th><th>Section</th></tr></thead><tbody>\n<tr><td>Secondary power (batteries)</td><td>24 h standby + 5 min alarm; voice systems (EVACS): 24 h + 15 min</td><td>§10.6.7.2</td></tr>\n<tr><td>Battery capacity margin</td><td>A safety margin is required in the calculation; industry sources report 25% in the 2022 edition (previously 20%)</td><td>§10.6.7 / §7.2.1</td></tr>\n<tr><td>Battery marking</td><td>Month and year of manufacture</td><td>§10.6.10.1</td></tr>\n<tr><td>Control unit branch circuit</td><td>Dedicated, red-marked disconnect, accessible only to authorized personnel, location identified at the control unit</td><td>§10.6.5</td></tr>\n<tr><td>Control unit display height</td><td>Highest control ≤ 6 ft; lowest ≥ 15 in. above the floor</td><td>§10.4.4</td></tr>\n<tr><td>Smoke detection at the control unit</td><td>Where the area is not continuously occupied</td><td>§10.4.5</td></tr>\n<tr><td>Notification start</td><td>≤ 10 s after an initiating device activates</td><td>§10.11.1</td></tr>\n<tr><td>Trouble annunciation</td><td>≤ 200 s after the fault</td><td>§12.6.1</td></tr>\n<tr><td>Silenced trouble</td><td>Resounds every ≤ 24 h until corrected</td><td>§10.15</td></tr>\n<tr><td>Impairment</td><td>Notify the owner; if the system is out of service more than <strong>8 h</strong>, the service provider notifies the AHJ. (The “4 hours” with a fire watch comes from NFPA 101/IFC.)</td><td>§10.21</td></tr>\n<tr><td>Uncorrected deficiency</td><td>Reported to the owner in writing within 24 h</td><td>§14.2.2</td></tr>\n</tbody></table>\n\n<h3>NEC 2020 (Article 760 and Chapter 9)</h3>\n<table><thead><tr><th>Topic</th><th>Value</th><th>Section</th></tr></thead><tbody>\n<tr><td>Branch circuit (NPLFA and PLFA)</td><td>No GFCI or AFCI; red-identified disconnect marked “FIRE ALARM CIRCUIT”; accessible only to qualified personnel; location shown at the control unit</td><td>760.41(B) · 760.121(B)</td></tr>\n<tr><td>NPLFA overcurrent protection</td><td>18 AWG: 7 A · 16 AWG: 10 A</td><td>760.43</td></tr>\n<tr><td>PLFA separation from light and power</td><td>2 in. (50 mm) where neither is in a raceway</td><td>760.136(G)</td></tr>\n<tr><td>PLFA cables</td><td>FPLP plenum · FPLR riser · FPL general; a higher rating may substitute for a lower one</td><td>760.154 · Table 760.154(A)</td></tr>\n<tr><td>CI cable on steel</td><td>Supported every 24 in.</td><td>760.24(B)</td></tr>\n<tr><td>Abandoned cables</td><td>Remove the accessible portion (unless tagged for future use)</td><td>760.25</td></tr>\n<tr><td>Support</td><td>From the building structure; not from ceiling grid or its support wires</td><td>760.24(A) · 300.11</td></tr>\n<tr><td>Conduit fill</td><td>1 conductor 53% · 2 conductors 31% · over 2: 40%</td><td>Ch. 9, Table 1</td></tr>\n</tbody></table>\n\n<h3>Initiating devices (NFPA 72 Ch. 17)</h3>\n<table><thead><tr><th>Topic</th><th>Value</th><th>Section</th></tr></thead><tbody>\n<tr><td>Smoke detector on a sidewall</td><td>Between the ceiling and 12 in. below it (to the top of the detector)</td><td>§17.7.4.2</td></tr>\n<tr><td>Smoke spacing, smooth ceiling</td><td>30 ft nominal; every point within 0.7 × S (21 ft) of a detector</td><td>§17.7.4.2.3.1</td></tr>\n<tr><td>Smoke detector environment</td><td>32–100 °F, humidity below 93%, air velocity below 300 ft/min (unless listed otherwise)</td><td>§17.7.1</td></tr>\n<tr><td>Detectors during construction</td><td>Not installed until cleanup is complete unless the AHJ requires it; if installed, protected</td><td>§17.7.2</td></tr>\n<tr><td>Spot heat detector</td><td>On the ceiling ≥ 4 in. from the wall, or on the wall 4–12 in. below the ceiling</td><td>§17.6.3.1.3</td></tr>\n<tr><td>Heat detector rating</td><td>At least 20 °F above the maximum expected ceiling temperature</td><td>§17.6.2</td></tr>\n<tr><td>Nonrestorable heat detectors</td><td>At 15 years: replace, or lab-test 2 of every 100</td><td>Table 14.4.3.2</td></tr>\n<tr><td>Manual fire alarm box</td><td>Operable part 42–48 in. above the floor; ≤ 5 ft from each exit; travel ≤ 200 ft</td><td>§17.15</td></tr>\n<tr><td>Waterflow</td><td>Alarm ≤ 90 s after flow equal to one sprinkler</td><td>§17.13.2</td></tr>\n<tr><td>Valve supervisory switch</td><td>Signal within 2 revolutions of the handwheel or 1/5 of the travel</td><td>§17.17.1</td></tr>\n</tbody></table>\n\n<h3>Notification (NFPA 72 Ch. 18)</h3>\n<table><thead><tr><th>Topic</th><th>Value</th><th>Section</th></tr></thead><tbody>\n<tr><td>Public mode</td><td>15 dB above average ambient or 5 dB above the maximum lasting ≥ 60 s (whichever is greater), 5 ft above the floor</td><td>§18.4.4.1</td></tr>\n<tr><td>Private mode</td><td>10 dB above average ambient or 5 dB above the 60 s maximum</td><td>§18.4.5.1</td></tr>\n<tr><td>Sleeping areas</td><td>Greatest of 15 dB / 5 dB / 75 dBA at the pillow; 520 Hz low-frequency signal</td><td>§18.4.6</td></tr>\n<tr><td>Maximum</td><td>110 dBA at the minimum hearing distance; average ambient above 105 dBA requires visible appliances</td><td>§18.4.1</td></tr>\n<tr><td>Wall-mounted audible</td><td>Top ≥ 90 in. above the floor and ≥ 6 in. below the ceiling</td><td>§18.4.9.1</td></tr>\n<tr><td>Wall-mounted visible</td><td>Entire lens between 80 and 96 in. above the floor</td><td>§18.5.5.1</td></tr>\n<tr><td>Flash rate</td><td>1–2 Hz; clear or nominal white; ≤ 1000 cd</td><td>§18.5.3</td></tr>\n<tr><td>Candela table, wall-mounted</td><td>20×20 → 15 cd · 28×28 → 30 · 30×30 → 34 · 40×40 → 60 · 45×45 → 75 · 50×50 → 94</td><td>Table 18.5.5.7.1(a)</td></tr>\n<tr><td>Corridors (≤ 20 ft wide)</td><td>≥ 15 cd; ≤ 15 ft from each end; ≤ 100 ft apart</td><td>§18.5.5.8</td></tr>\n<tr><td>Sleeping rooms</td><td>177 cd if the lens is less than 24 in. from the ceiling, otherwise 110 cd; within 16 ft of the pillow</td><td>§18.5.5.10</td></tr>\n</tbody></table>\n\n<h3>Circuits, control functions and supervision (Ch. 12, 21, 23, 26)</h3>\n<table><thead><tr><th>Topic</th><th>Value</th><th>Section</th></tr></thead><tbody>\n<tr><td>Class A / X outgoing and return</td><td>Routed separately; allowed together for ≤ 10 ft where entering a device, for a single drop, or in areas ≤ 1000 ft². (1 ft vertical / 4 ft horizontal is only an annex recommendation.)</td><td>§12.3.8.1</td></tr>\n<tr><td>Pathway survivability</td><td>Levels 0 to 4</td><td>§12.4</td></tr>\n<tr><td>Emergency control relay</td><td>Within 3 ft of the controlled component</td><td>§21.2.4</td></tr>\n<tr><td>Elevator power shutdown</td><td>Heat detector within 2 ft of each sprinkler, rated lower than the sprinkler</td><td>§21.4</td></tr>\n<tr><td>Positive alarm sequence</td><td>Acknowledge within 15 s; investigate up to 180 s</td><td>§23.8.1.2.1.1</td></tr>\n<tr><td>Alarm verification</td><td>Maximum delay 60 s</td><td>§23.8.5.4</td></tr>\n<tr><td>DACT</td><td>Two means of transmission; each channel tested at least every 6 h; call attempt ≤ 90 s</td><td>§26.6.4</td></tr>\n<tr><td>Central station</td><td>Retransmit alarms immediately; runner within 2 h</td><td>§26.2 · §26.3</td></tr>\n</tbody></table>\n\n<h3>Inspection, testing and records (Ch. 14 and 7)</h3>\n<table><thead><tr><th>Topic</th><th>Value</th><th>Section</th></tr></thead><tbody>\n<tr><td>Smoke detector sensitivity</td><td>Within 1 year of installation, then every other year; may be extended up to 5 years if stable</td><td>§14.4.4.3</td></tr>\n<tr><td>Software change</td><td>100% of affected functions + 10% of unaffected initiating devices (max. 50)</td><td>§14.4.2.4</td></tr>\n<tr><td>ITM records</td><td>Until the next test and for 1 year after</td><td>§14.6.2.1</td></tr>\n<tr><td>Permanent records</td><td>For the life of the system</td><td>§14.6.1.3</td></tr>\n<tr><td>Stray voltage on conductors</td><td>≤ 1 V</td><td>Table 14.4.3.2</td></tr>\n<tr><td>System documents</td><td>In a documentation cabinet (not inside the control unit)</td><td>§7.7.2</td></tr>\n<tr><td>Forms</td><td>Record of completion: Figure 7.8.2(a) · Inspection and testing: Figure 7.8.2(g)</td><td>§7.8.2</td></tr>\n</tbody></table>\n<div class=\"callout warn\"><p><strong>There is no Table 14.4.5 in the 2022 edition.</strong> Test frequencies are in the <em>Periodic Frequency</em> column of Table 14.4.3.2. A lot of older study material still cites a separate “Table 14.4.5, Testing Frequencies”.</p></div>\n<table><thead><tr><th>Component</th><th>Visual inspection (Table 14.3.1)</th><th>Test (Table 14.4.3.2)</th></tr></thead><tbody>\n<tr><td>Monitored control unit (fuses, LEDs, primary power)</td><td>Annual (trouble signals: semiannual)</td><td>Annual</td></tr>\n<tr><td>Unmonitored control unit</td><td>Weekly</td><td>Annual</td></tr>\n<tr><td>Manual boxes, smoke, heat and duct detectors</td><td>Semiannual</td><td>Annual</td></tr>\n<tr><td>Flame detectors</td><td>Quarterly</td><td>Semiannual</td></tr>\n<tr><td>Waterflow devices</td><td>Semiannual (was quarterly)</td><td>Semiannual</td></tr>\n<tr><td>Control valve supervisory (tamper) switch</td><td>Semiannual</td><td>Semiannual</td></tr>\n<tr><td>Other supervisory: air pressure, temperature, water level</td><td>Semiannual</td><td>Annual</td></tr>\n<tr><td>Notification appliances</td><td>Semiannual</td><td>Annual</td></tr>\n<tr><td>VRLA batteries</td><td>Semiannual (includes the date of manufacture)</td><td>Semiannual (temperature, charger, voltage, ohmic test); replace or load-test every 3 years</td></tr>\n<tr><td>Secondary power</td><td>—</td><td>Annual (5 min in alarm; 15 min for voice systems)</td></tr>\n<tr><td>Supervising station transmitters</td><td>Annual</td><td>Annual</td></tr>\n<tr><td>Household smoke alarms</td><td>—</td><td>Replace at 10 years</td></tr>\n</tbody></table>\n<p class=\"small\">Frequencies as defined in Chapter 3: annual = 9 to 15 months; semiannual = 4 to 8 months; quarterly = 2 to 4 months.</p>\n\n<h3>Safety (OSHA and first aid — these books are not allowed in the test center)</h3>\n<table><thead><tr><th>Topic</th><th>Value</th><th>Section</th></tr></thead><tbody>\n<tr><td>Ladder to an upper landing</td><td>Side rails ≥ 3 ft above the landing</td><td>1926.1053(b)(1)</td></tr>\n<tr><td>Ladder angle</td><td>Base 1/4 of the working length from the wall (4:1)</td><td>1926.1053(b)(5)(i)</td></tr>\n<tr><td>Stepladder</td><td>Do not use the top or top step as a step</td><td>1926.1053(b)(13)</td></tr>\n<tr><td>Near energized equipment</td><td>Ladders with nonconductive side rails</td><td>1926.1053(b)(12)</td></tr>\n<tr><td>Fall protection</td><td>Construction 6 ft · general industry 4 ft · scaffolds 10 ft</td><td>1926.501 · 1910.28 · 1926.451(g)</td></tr>\n<tr><td>Guardrail</td><td>Top rail 42 in. ± 3 in.; withstands 200 lb</td><td>1926.502(b)</td></tr>\n<tr><td>Personal fall arrest</td><td>Free fall ≤ 6 ft; anchorage 5,000 lb per person</td><td>1926.502(d)</td></tr>\n<tr><td>Scaffolds</td><td>Support 4 times the intended load</td><td>1926.451(a)(1)</td></tr>\n<tr><td>Noise</td><td>Hearing conservation program from 85 dBA (8-h TWA); limit 90 dBA</td><td>1910.95</td></tr>\n<tr><td>Trenches</td><td>Protective system from 5 ft deep</td><td>1926.652</td></tr>\n<tr><td>Construction sites</td><td>GFCI on temporary receptacles (or an assured equipment grounding conductor program)</td><td>1926.404(b)(1)</td></tr>\n<tr><td>Safety data sheets (SDS)</td><td>16 sections</td><td>1910.1200(g)</td></tr>\n<tr><td>Adult CPR</td><td>100–120 compressions/min; at least 2 in. deep; 30 compressions : 2 breaths</td><td>Red Cross</td></tr>\n</tbody></table>\n"},{"id":"formulas","group":"ref","eyebrow":"Quick reference","title":"Formulas and conversions","html":"\n<p>The formulas that show up at Level I. They are in Ugly’s, but knowing them by heart saves minutes.</p>\n<h3>Ohm’s law and power</h3>\n<table><thead><tr><th>Find</th><th>Formula</th></tr></thead><tbody>\n<tr><td>Voltage</td><td><code>E = I × R</code></td></tr>\n<tr><td>Current</td><td><code>I = E ÷ R</code> · <code>I = P ÷ E</code></td></tr>\n<tr><td>Resistance</td><td><code>R = E ÷ I</code></td></tr>\n<tr><td>Power</td><td><code>P = E × I</code> · <code>P = I² × R</code> · <code>P = E² ÷ R</code></td></tr>\n</tbody></table>\n<h3>Circuits</h3>\n<table><thead><tr><th></th><th>Series</th><th>Parallel</th></tr></thead><tbody>\n<tr><td>Total resistance</td><td><code>R<sub>T</sub> = R1 + R2 + …</code></td><td><code>1/R<sub>T</sub> = 1/R1 + 1/R2 + …</code>; two resistors: <code>(R1 × R2) ÷ (R1 + R2)</code></td></tr>\n<tr><td>Current</td><td>The same everywhere in the circuit</td><td><code>I<sub>T</sub> = I1 + I2 + …</code> (that is why NAC current is the sum of its appliances)</td></tr>\n<tr><td>Voltage</td><td>Divides: <code>E<sub>T</sub> = E1 + E2 + …</code></td><td>The same across each branch</td></tr>\n</tbody></table>\n<h3>Voltage drop (2-wire DC or single-phase circuit)</h3>\n<ul>\n<li>Ugly’s method: <code>VD = (2 × K × I × L) ÷ CM</code>, with K = 12.9 (copper) or 21.2 (aluminum), L = one-way length (ft) and CM = conductor circular mils.</li>\n<li>Resistance method (NEC Chapter 9, Table 8): <code>VD = I × (Ω/kft × 2 × L ÷ 1000)</code>.</li>\n<li>Voltage at the last appliance = source voltage − VD. Compare it with the appliance’s listed operating range (for example 16–33 VDC for regulated 24 V appliances).</li>\n<li>Three-phase: <code>VD = (1.732 × K × I × L) ÷ CM</code>.</li>\n</ul>\n<table><thead><tr><th>AWG (uncoated copper)</th><th>Circular mils</th><th>Ω/kft solid</th><th>Ω/kft stranded</th></tr></thead><tbody>\n<tr><td>18</td><td>1,620</td><td>7.77</td><td>7.95</td></tr>\n<tr><td>16</td><td>2,580</td><td>4.89</td><td>4.99</td></tr>\n<tr><td>14</td><td>4,110</td><td>3.07</td><td>3.14</td></tr>\n<tr><td>12</td><td>6,530</td><td>1.93</td><td>1.98</td></tr>\n<tr><td>10</td><td>10,380</td><td>1.21</td><td>1.24</td></tr>\n</tbody></table>\n<p class=\"small\">Values from NEC Chapter 9, Table 8 (uncoated copper conductors at 75 °C).</p>\n<h3>Batteries (secondary power)</h3>\n<p><code>Ah = (I<sub>standby</sub> × 24 h) + (I<sub>alarm</sub> × 5 min ÷ 60)</code>, then multiply by the safety margin the design or the code requires (see the Electricity guide). Convert mA to A before multiplying.</p>\n<h3>Useful conversions</h3>\n<table><tbody>\n<tr><td>Inches ↔ feet</td><td>1 ft = 12 in. · 42 in. = 3 ft 6 in. · 80 in. = 6 ft 8 in. · 96 in. = 8 ft</td></tr>\n<tr><td>Metric</td><td>1 in. = 25.4 mm · 1 ft = 0.3048 m · 1 m = 3.281 ft</td></tr>\n<tr><td>Temperature</td><td>°F = °C × 9/5 + 32 · °C = (°F − 32) × 5/9</td></tr>\n<tr><td>Current</td><td>1 A = 1,000 mA · 150 mA = 0.150 A</td></tr>\n<tr><td>4:1 ladder</td><td>Distance from the base to the wall = working length ÷ 4</td></tr>\n<tr><td>Drawing scales</td><td>1/8 in. = 1 ft → 1 in. on the drawing = 8 ft · 1/4 in. = 1 ft → 1 in. = 4 ft</td></tr>\n</tbody></table>\n"}];</script>
<script>(function () {
'use strict';

/* =========================================================
   Data
   ========================================================= */
const RAW = window.NICET_DATA || [];
const GUIDES = window.NICET_GUIDES || [];

const TASKS = {
  '1.1.1': { dom: '1.1', short: 'Mount & terminate peripherals', title: 'Mount and terminate peripherals (e.g., initiating and notification devices)', refs: 'NFPA 72 · Ugly’s' },
  '1.1.2': { dom: '1.1', short: 'Cabling & infrastructure', title: 'Install cabling and associated infrastructure', refs: 'NFPA 72 · NFPA 70 · Ugly’s' },
  '1.1.3': { dom: '1.1', short: 'Job site safety', title: 'Comply with job site safety requirements', refs: 'OSHA 1910 · OSHA 1926 · First Aid/CPR/AED' },
  '1.2.1': { dom: '1.2', short: 'Periodic testing', title: 'Perform periodic testing of systems and devices', refs: 'NFPA 72' },
  '1.2.2': { dom: '1.2', short: 'Repair & replace', title: 'Repair/replace impaired/deficient devices', refs: 'NFPA 72 · Bukowski' },
  '1.3.1': { dom: '1.3', short: 'Technical documents', title: 'Knowledge of technical documents', refs: 'NFPA 72 · NFPA 70 · Ugly’s' }
};
const DOMAINS = {
  '1.1': { title: 'Installation', range: [44, 54] },
  '1.2': { title: 'Maintenance', range: [40, 50] },
  '1.3': { title: 'Submittal Preparation and System Layout', range: [1, 11] }
};
// 85 questions: 42 / 38 / 5 (49 % / 45 % / 6 %), inside the official domain ranges
const BP_FULL = { '1.1.1': 16, '1.1.2': 16, '1.1.3': 10, '1.2.1': 21, '1.2.2': 17, '1.3.1': 5 };
// 30 questions: 15 / 13 / 2
const BP_MINI = { '1.1.1': 6, '1.1.2': 5, '1.1.3': 4, '1.2.1': 7, '1.2.2': 6, '1.3.1': 2 };
const FULL_MIN = 110, FULL_N = 85, FIXED_COUNT = 5, PASS = 70;
const TOPIC_ORDER = ['fund', 'init', 'notif', 'sys', 'nec', 'elec', 'itm', 'repair', 'safety', 'docs', 'visual', 'comm'];

const topics = {};
const Q = [];
const QMAP = {};
RAW.forEach(function (pack) {
  if (!pack || !pack.topic || !pack.topic.id) return;
  const t = pack.topic;
  if (!topics[t.id]) topics[t.id] = t;
  (pack.questions || []).forEach(function (q) {
    if (!validQ(q)) { console.warn('Skipped malformed question:', q && q.id); return; }
    if (QMAP[q.id]) { console.warn('Skipped duplicate id:', q.id); return; }
    q.topic = t.id;
    Q.push(q); QMAP[q.id] = q;
  });
});
const TOPICS = Object.keys(topics).sort(function (a, b) {
  const ia = TOPIC_ORDER.indexOf(a), ib = TOPIC_ORDER.indexOf(b);
  return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
});

function validQ(q) {
  if (!q || !q.id || !q.q || !TASKS[q.task]) return false;
  if (q.type === 'hotspot') return !!(q.svg && Array.isArray(q.regions) && q.regions.some(function (r) { return r.ok; }));
  if (!Array.isArray(q.opts) || q.opts.length < 2 || !Array.isArray(q.ans) || !q.ans.length) return false;
  if (q.ans.some(function (i) { return typeof i !== 'number' || i < 0 || i >= q.opts.length; })) return false;
  if (q.type === 'multi') { if (!q.select) q.select = q.ans.length; } else { q.type = 'single'; }
  return true;
}

/* =========================================================
   Utilities
   ========================================================= */
const $ = function (s, r) { return (r || document).querySelector(s); };
const $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(a, rnd) { rnd = rnd || Math.random; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pct(c, n) { return n ? Math.round((c / n) * 100) : 0; }
function fmtClock(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
function fmtDur(sec) { const m = Math.round(sec / 60); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min'; }
function fmtDate(ts) {
  try { return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' · ' + new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
  catch (e) { return new Date(ts).toISOString().slice(0, 16).replace('T', ' '); }
}
const LETTERS = 'ABCDEFGH';
let toastTimer = null;
function toast(msg) {
  let el = $('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 2600);
}
function meterCls(p) { return p >= PASS ? '' : p >= 50 ? 'mid' : 'low'; }
function txt(o) { if (!o) return ''; return esc(typeof o === 'string' ? o : (o.en || '')); }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

/* =========================================================
   Storage: per-user account store (db) with a browser fallback
   ========================================================= */
const LS_KEY = 'nicet-fas1-progress-v1';
const Store = {
  data: null, ref: null, timer: null, busy: false, again: false, mode: 'local', syncErr: false,
  blank: function () { return { v: 1, ts: 0, settings: { unseenFirst: true }, stats: {}, attempts: [], current: null, flags: {} }; },
  load: function () {
    let d = null;
    try { const s = localStorage.getItem(LS_KEY); if (s) d = JSON.parse(s); } catch (e) { d = null; }
    const b = this.blank();
    this.data = Object.assign(b, d || {});
    this.data.settings = Object.assign(this.blank().settings, (d && d.settings) || {});
  },
  connect: async function () {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const res = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const db = res[0], user = res[1];
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const ref = db.doc('data/users/' + uid + '/progress');
      const snap = await ref.get();
      if (snap.exists) this.data = mergeData(this.data, snap.data() || {});
      this.ref = ref; this.mode = 'cloud';
      this.persistLocal();
      await this.flush();
      onStoreConnected();
    } catch (e) { console.warn('Account storage unavailable; using this browser.', e); }
  },
  save: function () {
    this.data.ts = Date.now();
    this.persistLocal();
    if (this.ref) { clearTimeout(this.timer); const self = this; this.timer = setTimeout(function () { self.flush(); }, 1500); }
  },
  persistLocal: function () { try { localStorage.setItem(LS_KEY, JSON.stringify(this.data)); } catch (e) { /* storage blocked */ } },
  flush: async function () {
    if (!this.ref) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    try { await this.ref.set(JSON.parse(JSON.stringify(this.data))); this.syncErr = false; }
    catch (e) {
      this.syncErr = true;
      if (e && (e.code === 'revoked' || e.code === 'not_granted' || e.code === 'invalid_argument' || e.code === 'capability_disabled')) { this.ref = null; this.mode = 'local'; }
      if (e && e.code === 'unavailable') { const self = this; setTimeout(function () { self.flush(); }, 2000 + Math.random() * 2000); }
    }
    this.busy = false;
    if (this.again) { this.again = false; this.flush(); }
    updateSyncBadge();
  }
};
function mergeData(local, remote) {
  const out = Store.blank();
  const newer = (remote.ts || 0) >= (local.ts || 0) ? remote : local;
  out.settings = Object.assign(out.settings, local.settings || {}, remote.settings || {});
  out.stats = Object.assign({}, local.stats || {});
  Object.keys(remote.stats || {}).forEach(function (k) {
    const r = remote.stats[k], l = out.stats[k];
    if (!l || (r && (r[3] || 0) >= (l[3] || 0))) out.stats[k] = r;
  });
  const seen = {}; out.attempts = [];
  (remote.attempts || []).concat(local.attempts || []).forEach(function (a) { if (a && a.id && !seen[a.id]) { seen[a.id] = 1; out.attempts.push(a); } });
  out.attempts.sort(function (a, b) { return b.date - a.date; });
  out.attempts = pruneAttempts(out.attempts);
  out.flags = Object.assign({}, local.flags || {}, remote.flags || {});
  out.current = newer.current || null;
  if (out.current && seen[out.current.id]) out.current = null;
  out.ts = Math.max(local.ts || 0, remote.ts || 0);
  return out;
}
function pruneAttempts(list) {
  list = list.slice(0, 60);
  list.forEach(function (a, i) { if (i >= 15 && a.given) { delete a.given; delete a.qids; delete a.perm; } });
  return list;
}
function updateSyncBadge() { $$('[data-sync]').forEach(function (el) { el.innerHTML = syncBadge(); }); }
function syncBadge() {
  if (Store.mode === 'cloud') return '<span class="sync" style="color:var(--green)"><span class="led"></span><span style="color:var(--ink-2)">' + (Store.syncErr ? 'Sync pending' : 'Progress saved to your account') + '</span></span>';
  return '<span class="sync" style="color:var(--amber)"><span class="led"></span><span style="color:var(--ink-2)">Progress saved in this browser</span></span>';
}
function onStoreConnected() { if (!examOpen()) render(); updateSyncBadge(); }

/* =========================================================
   Per-question stats: [seen, correct, last (1/0), timestamp]
   ========================================================= */
function st(id) { return Store.data.stats[id] || null; }
function seenN(q) { const s = st(q.id); return s ? s[0] : 0; }
function lastWrong(q) { const s = st(q.id); return !!(s && s[2] === 0); }
function record(q, ok) {
  const s = Store.data.stats[q.id] || [0, 0, 0, 0];
  s[0]++; if (ok) s[1]++; s[2] = ok ? 1 : 0; s[3] = Date.now();
  Store.data.stats[q.id] = s;
}
function groupStats(qs) {
  let seen = 0, lastOk = 0;
  qs.forEach(function (q) { const s = st(q.id); if (s) { seen++; if (s[2] === 1) lastOk++; } });
  return { total: qs.length, seen: seen, ok: lastOk, acc: pct(lastOk, seen), cov: pct(seen, qs.length) };
}
function isCorrect(q, a) {
  if (a == null) return false;
  if (q.type === 'hotspot') return q.regions.some(function (r) { return r.ok && a.x >= r.x && a.x <= r.x + r.w && a.y >= r.y && a.y <= r.y + r.h; });
  if (!Array.isArray(a) || !a.length) return false;
  return a.slice().sort().join(',') === q.ans.slice().sort().join(',');
}
function answered(q, a) { return q.type === 'hotspot' ? !!a : !!(a && a.length && (q.type !== 'multi' || a.length === q.select)); }

/* =========================================================
   Question selection
   ========================================================= */
function qsByTask(t) { return Q.filter(function (q) { return q.task === t; }); }
function pickBlueprint(bp, unseenFirst, pool) {
  pool = pool || Q;
  const out = [], used = {};
  Object.keys(bp).forEach(function (t) {
    let p = shuffle(pool.filter(function (q) { return q.task === t; }));
    if (unseenFirst) p.sort(function (a, b) { return seenN(a) - seenN(b); });
    p.slice(0, bp[t]).forEach(function (q) { out.push(q); used[q.id] = 1; });
  });
  const target = Object.keys(bp).reduce(function (s, k) { return s + bp[k]; }, 0);
  if (out.length < target) {
    shuffle(pool.filter(function (q) { return !used[q.id]; })).slice(0, target - out.length).forEach(function (q) { out.push(q); });
  }
  return shuffle(out);
}
function fixedExamQs(k) {
  const out = [], used = {};
  Object.keys(BP_FULL).forEach(function (t) {
    const p = qsByTask(t).sort(function (a, b) { return a.id < b.id ? -1 : 1; });
    shuffle(p, rng(hashStr('fixed:' + t)));
    const n = Math.min(BP_FULL[t], p.length);
    for (let i = 0; i < n; i++) { const q = p[(k * n + i) % p.length]; if (!used[q.id]) { used[q.id] = 1; out.push(q); } }
  });
  return shuffle(out, rng(hashStr('order:' + k)));
}

/* =========================================================
   Exam engine
   ========================================================= */
let tick = null;
function newExam(o) {
  const qs = o.qs.filter(Boolean);
  const perm = {};
  qs.forEach(function (q) { if (q.opts) perm[q.id] = shuffle(q.opts.map(function (_, i) { return i; })); });
  const limit = o.limitMin ? Math.round(o.limitMin * 60) : null;
  return {
    id: 'a' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
    kind: o.kind, title: o.title, mode: o.mode || 'exam', fixedN: o.fixedN == null ? null : o.fixedN,
    qids: qs.map(function (q) { return q.id; }), perm: perm, ans: {}, flags: {}, checked: {},
    cur: 0, screen: 'q', started: Date.now(), limit: limit, deadline: limit ? Date.now() + limit * 1000 : null
  };
}
function startExam(ex) {
  if (!ex.qids.length) { toast('No questions match those filters.'); return; }
  if (Store.data.current) {
    confirmModal('You have an exam in progress', '<p>Starting a new one will discard the exam in progress (<b>' + esc(Store.data.current.title) + '</b>) without scoring it.</p>', 'Discard and start', function () {
      Store.data.current = null; startExam(ex);
    });
    return;
  }
  Store.data.current = ex; Store.save(); openExam();
}
function examOpen() { return !$('#exam').hidden; }
function openExam() {
  const ex = Store.data.current; if (!ex) return;
  ex.qids = ex.qids.filter(function (id) { return QMAP[id]; });
  if (!ex.qids.length) { Store.data.current = null; Store.save(); render(); return; }
  if (ex.cur >= ex.qids.length) ex.cur = ex.qids.length - 1;
  if (ex.deadline && Date.now() >= ex.deadline) { finishExam(true); return; }
  $('#exam').hidden = false; document.body.style.overflow = 'hidden';
  renderExam();
  clearInterval(tick); tick = setInterval(updateTimer, 1000); updateTimer();
}
function closeExamFrame() {
  clearInterval(tick); tick = null; closeCalc();
  $('#exam').hidden = true; $('#exam').innerHTML = ''; document.body.style.overflow = '';
}
function curQ(ex) { return QMAP[ex.qids[ex.cur]]; }
function updateTimer() {
  const ex = Store.data.current, el = $('#xtimer');
  if (!ex || !el) return;

    const left = (ex.deadline - Date.now()) / 1000;
    el.textContent = fmtClock(left);

    if (left <= 0) { toast('Time is up. Your exam has been scored.'); finishExam(true); }

}
function renderExam() {

function examQuestion(ex, q) {

  h += '<div class="xq-text">' + txt(q.q) + '</div>';
  if (q.svg && q.type !== 'hotspot') h += '<div class="hs exhibit">' + q.svg + '</div>';
  if (q.type === 'multi') h += '<div class="xsel">' + selectLabel(q.select) + '</div>';

    h += '<div class="xsel">Click on the image</div>';
    h += '<div class="hs" id="hs">' + q.svg + '</div>';

  } else {

    perm.forEach(function (oi, pos) {
      const sel = !!(a && a.indexOf(oi) >= 0);
      let cls = 'opt' + (sel ? ' sel' : '');
      if (revealed) { if (q.ans.indexOf(oi) >= 0) cls += ' ok'; else if (sel) cls += ' bad'; }
      h += '<button type="button" class="' + cls + '" data-opt="' + oi + '" role="' + (q.type === 'multi' ? 'checkbox' : 'radio') + '" aria-checked="' + sel + '"' + (revealed ? ' aria-disabled="true"' : '') + '>' +
        '<span class="l">' + LETTERS[pos] + '.</span><span class="box' + (q.type === 'multi' ? ' sq' : '') + '" aria-hidden="true"></span><span>' + txt(q.opts[oi]) + '</span></button>';

function selectLabel(n) { return 'Select ' + ({ 2: 'TWO', 3: 'THREE' }[n] || String(n)); }
function feedbackBlock(q, a) {

    (q.type === 'hotspot' ? (ok ? '' : ' — the correct area is outlined in green') : (ok ? '' : ' — correct answer: ' + correctLetters(q))) +
    '<p style="margin-top:6px">' + esc(q.exp || '') + '</p>' + (q.ref ? '<span class="ref">' + esc(q.ref) + '</span>' : '') + '</div>';
}
function correctLetters(q) {
  const ex = Store.data.current; const perm = (ex && ex.perm[q.id]) || q.opts.map(function (_, i) { return i; });
  return q.ans.map(function (oi) { return LETTERS[perm.indexOf(oi)]; }).sort().join(', ');
}
function bindHotspot(ex, q) {
  const svg = $('#hs svg'); if (!svg) return;
  if (ex.ans[q.id]) drawMark(svg, ex.ans[q.id]);
  if (ex.mode === 'study' && ex.checked[q.id]) { drawRegions(svg, q); return; }
  svg.addEventListener('click', function (e) {
    const ctm = svg.getScreenCTM(); if (!ctm) return;
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(ctm.inverse());
    ex.ans[q.id] = { x: Math.round(p.x), y: Math.round(p.y) };
    drawMark(svg, ex.ans[q.id]);
    const note = $('#hs-note'); if (note) note.textContent = 'Answer marked. Click another spot to change it.';
    const chk = $('[data-x="check"]'); if (chk) chk.disabled = false;
    Store.save();
  });
}
function drawMark(svg, a) {
  const old = svg.querySelector('.hs-mark'); if (old) old.remove();
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'hs-mark');
  g.innerHTML = '<circle cx="' + a.x + '" cy="' + a.y + '" r="11"></circle><path d="M' + (a.x - 17) + ' ' + a.y + 'H' + (a.x - 6) + 'M' + (a.x + 6) + ' ' + a.y + 'H' + (a.x + 17) + 'M' + a.x + ' ' + (a.y - 17) + 'V' + (a.y - 6) + 'M' + a.x + ' ' + (a.y + 6) + 'V' + (a.y + 17) + '"></path>';
  svg.appendChild(g);
}
function drawRegions(svg, q) {
  if (q.type !== 'hotspot' || !q.regions) return;
  q.regions.filter(function (r) { return r.ok; }).forEach(function (r) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    el.setAttribute('x', r.x); el.setAttribute('y', r.y); el.setAttribute('width', r.w); el.setAttribute('height', r.h);
    el.setAttribute('class', 'hs-ok'); el.setAttribute('rx', '4');

}
function reviewScreen(ex) {

  const cells = ex.qids.map(function (id, i) {
    const q = QMAP[id], a = ex.ans[id], ans = answered(q, a), f = !!ex.flags[id];

    '<div class="row"><button class="btn sm" type="button" data-x="first-un"' + (un ? '' : ' disabled') + '>Go to first unanswered</button><button class="btn sm" type="button" data-x="first-fl"' + (fl ? '' : ' disabled') + '>Go to first flagged</button></div>' +
    '<div class="reviewgrid">' + cells + '</div>' +

function examAction(act) {
  const ex = Store.data.current; if (!ex) return;
  const q = curQ(ex);
  switch (act) {
    case 'prev': if (ex.cur > 0) { ex.cur--; Store.save(); renderExam(); } break;
    case 'next': if (ex.cur < ex.qids.length - 1) { ex.cur++; Store.save(); renderExam(); } break;
    case 'review': ex.screen = 'review'; Store.save(); renderExam(); break;
    case 'back': ex.screen = 'q'; renderExam(); break;
    case 'first-un': { const i = ex.qids.findIndex(function (id) { return !answered(QMAP[id], ex.ans[id]); }); if (i >= 0) { ex.cur = i; ex.screen = 'q'; renderExam(); } break; }
    case 'first-fl': { const i = ex.qids.findIndex(function (id) { return ex.flags[id]; }); if (i >= 0) { ex.cur = i; ex.screen = 'q'; renderExam(); } break; }
    case 'flag': ex.flags[q.id] = !ex.flags[q.id]; if (!ex.flags[q.id]) delete ex.flags[q.id]; Store.save(); renderExam(); break;
    case 'check':
      if (!answered(q, ex.ans[q.id])) return;
      ex.checked[q.id] = true; record(q, isCorrect(q, ex.ans[q.id])); Store.save(); renderExam(); break;

function chooseOpt(oi) {

  const q = curQ(ex); if (!q.opts) return;
  if (ex.mode === 'study' && ex.checked[q.id]) return;

    const i = a.indexOf(oi);
    if (i >= 0) a.splice(i, 1);

}
function endPrompt() {

function finishExam(auto) {

  let c = 0, un = 0;
  ex.qids.forEach(function (id) {
    const q = QMAP[id]; if (!q) return;
    const a = ex.ans[id], ok = isCorrect(q, a);
    if (!answered(q, a)) un++;

/* =========================================================
   On-screen calculator
   ========================================================= */
const Calc = { expr: '', last: '', ans: 0 };
function calcEval(src) {
  const s = src.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/Ans/g, '(' + Calc.ans + ')');
  let i = 0;
  function peek() { while (s[i] === ' ') i++; return s[i]; }
  function num() { const st0 = i; while (/[0-9.]/.test(s[i] || '')) i++; if (st0 === i) throw new Error('num'); const v = parseFloat(s.slice(st0, i)); if (isNaN(v)) throw new Error('num'); return v; }
  function factor() {
    const c = peek();
    if (c === '-') { i++; return -factor(); }
    if (c === '+') { i++; return factor(); }
    if (c === '√') { i++; return Math.sqrt(factor()); }
    if (c === '(') { i++; const v = expr(); if (peek() !== ')') throw new Error('paren'); i++; return post(v); }
    return post(num());
  }
  function post(v) { if (peek() === '%') { i++; return v / 100; } return v; }
  function power() { const b = factor(); if (peek() === '^') { i++; return Math.pow(b, power()); } return b; }
  function term() { let v = power(); for (;;) { const c = peek(); if (c === '*') { i++; v *= power(); } else if (c === '/') { i++; v /= power(); } else return v; } }
  function expr() { let v = term(); for (;;) { const c = peek(); if (c === '+') { i++; v += term(); } else if (c === '-') { i++; v -= term(); } else return v; } }
  const v = expr();
  if (peek() !== undefined) throw new Error('trailing');
  return v;
}
function calcFmt(v) { if (!isFinite(v)) return 'Error'; return String(parseFloat(v.toPrecision(12))); }
function calcPress(k) {
  if (k === 'C') { Calc.expr = ''; Calc.last = ''; }
  else if (k === '⌫') Calc.expr = Calc.expr.slice(0, -1);
  else if (k === '=') {
    if (!Calc.expr) return;
    try { const v = calcEval(Calc.expr); Calc.last = Calc.expr + ' ='; Calc.ans = isFinite(v) ? v : 0; Calc.expr = calcFmt(v); }
    catch (e) { Calc.last = 'Incomplete expression'; }
  }
  else if (k === 'x²') Calc.expr += '^2';
  else if (k === '√') Calc.expr += '√(';
  else Calc.expr += k;
  const d = $('#calc-d'), l = $('#calc-l');
  if (d) d.textContent = Calc.expr || '0';
  if (l) l.textContent = Calc.last;
}
function toggleCalc() { if ($('#calc')) closeCalc(); else openCalc(); }
function closeCalc() { const c = $('#calc'); if (c) c.remove(); }
function openCalc() {
  const keys = ['C', '⌫', '(', ')', '√', 'x²', '^', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '0', '.', 'Ans', '='];
  const el = document.createElement('div');
  el.id = 'calc'; el.className = 'modal calc-m'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Calculator');
  el.style.cssText = 'position:fixed;z-index:55;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));';
  el.innerHTML = '<header><h3>Calculator</h3><button class="btn ghost sm" type="button" data-calc-close aria-label="Close calculator">✕</button></header>' +
    '<div class="mbody"><div class="calc-disp"><small id="calc-l">' + esc(Calc.last) + '</small><b id="calc-d">' + esc(Calc.expr || '0') + '</b></div>' +
    '<div class="calc-keys">' + keys.map(function (k) { return '<button type="button" data-k="' + esc(k) + '" class="' + (k === '=' ? 'eq' : /[÷×−+^]/.test(k) ? 'op' : '') + '">' + esc(k) + '</button>'; }).join('') + '</div>' +
    '<p class="small muted" style="margin-top:8px">Keyboard: digits, + − * / ( ) ^ · Enter = · Backspace deletes</p></div>';
  document.body.appendChild(el);

/* =========================================================
   Modals
   ========================================================= */
let modalClose = null;
function modal(o) {
  closeModal();
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal' + (o.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="m-title"><header><h3 id="m-title">' + esc(o.title) + '</h3><button class="btn ghost sm" type="button" data-mclose aria-label="Close">✕</button></header><div class="mbody">' + o.body + '</div>' +
    (o.actions && o.actions.length ? '<div class="mfoot">' + o.actions.map(function (a, i) { return '<button type="button" class="btn ' + (a.cls || '') + '" data-mact="' + i + '">' + esc(a.label) + '</button>'; }).join('') + '</div>' : '') + '</div>';
  document.getElementById('modal-root').appendChild(bg);
  const prev = document.activeElement;
  bg.addEventListener('click', function (e) {
    if (e.target === bg || e.target.closest('[data-mclose]')) { closeModal(); return; }
    const b = e.target.closest('[data-mact]');
    if (b) { const a = o.actions[+b.dataset.mact]; closeModal(); if (a && a.fn) a.fn(); }
  });
  modalClose = function () { bg.remove(); modalClose = null; if (prev && prev.focus) try { prev.focus(); } catch (e) {} };
  const f = bg.querySelector('.mfoot .btn.primary') || bg.querySelector('[data-mclose]');
  if (f) f.focus();
}
function closeModal() { if (modalClose) modalClose(); }
function confirmModal(title, body, okLabel, fn) {
  modal({ title: title, body: body, actions: [{ label: 'Cancel', cls: 'ghost' }, { label: okLabel, cls: 'primary', fn: fn }] });
}
function openReference() {

/* =========================================================
   Router and views
   ========================================================= */
const view = document.getElementById('view');
const VIEWS = { home: renderHome, exams: renderSims, bank: renderBank, guides: renderGuides, progress: renderProgress, result: renderResult };
let route = { view: 'home', param: null };
const ui = { bankTab: 'topic', bankFilters: { diff: 'all', freq: false, unseen: false, wrong: false, type: 'all' }, bankCount: '20', explore: { q: '', topic: 'all', limit: 25, open: {} }, resultFilter: 'wrong', glossQ: '' };

function go(v, param, keepScroll) {
  if (!VIEWS[v]) v = 'home';
  route = { view: v, param: param || null };
  try { const h = param ? v + '-' + param : v; if (location.hash.slice(1) !== h) history.replaceState(null, '', '#' + h); } catch (e) { /* no history */ }
  render();
  if (!keepScroll) { try { window.scrollTo(0, 0); } catch (e) {} }
}
function parseHash() {
  const h = (location.hash || '').replace(/^#/, '');
  if (!h) return;
  const i = h.indexOf('-');
  const v = i < 0 ? h : h.slice(0, i), p = i < 0 ? null : h.slice(i + 1);
  if (VIEWS[v]) route = { view: v, param: p };
}
function render() {
  const navKey = route.view === 'result' ? 'progress' : route.view;
  $$('.nav button').forEach(function (b) { if (b.dataset.go === navKey) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  VIEWS[route.view]();
}

function topicChip(id) { const t = topics[id]; return t ? '<span class="chip">' + esc(t.short || t.title) + '</span>' : ''; }
function diffChip(d) { return d ? '<span class="chip" title="Difficulty">' + ['', 'Basic', 'Medium', 'Hard'][d] + '</span>' : ''; }
function resumeBanner() {
  const ex = Store.data.current; if (!ex) return '';
  const done = ex.qids.filter(function (id) { return answered(QMAP[id] || {}, ex.ans[id]); }).length;
  const left = ex.deadline ? Math.max(0, (ex.deadline - Date.now()) / 1000) : null;
  return '<div class="resume"><span class="led"></span><div style="flex:1 1 240px;min-width:0"><b>Exam in progress: ' + esc(ex.title) + '</b><div class="small">' + done + ' of ' + ex.qids.length + ' answered' + (left != null ? ' · ' + fmtClock(left) + ' left (the clock keeps running)' : '') + '</div></div><button class="btn dark sm" type="button" data-act="resume">Resume</button><button class="btn ghost sm" type="button" data-act="discard">Discard</button></div>';
}

  if (f.unseen && seenN(q) > 0) return false;
  if (f.wrong && !lastWrong(q)) return false;

  if (f.type === 'hotspot' && q.type !== 'hotspot') return false;
  return true;
}

/* Static question card (review / browse) */
function staticQ(q, given, o) {
  o = o || {};

  const ok = given !== undefined && given !== null ? isCorrect(q, given) : null;
  let h = '<article class="qcard" data-qid="' + esc(q.id) + '"><div class="qhead">' + (o.num ? '<span class="chip mono">' + o.num + '</span>' : '') +
    (ok === true ? '<span class="chip green">✓ Correct</span>' : ok === false ? '<span class="chip red">' + (given && (given.length || given.x != null) ? '✗ Incorrect' : '○ Unanswered') + '</span>' : '') +
    topicChip(q.topic) + '<span class="chip mono">' + q.task + '</span>' + diffChip(q.diff) + (q.freq ? '<span class="chip amber">Frequently tested</span>' : '') + (o.flag ? '<span class="chip amber">⚑ Flagged</span>' : '') + '<span class="chip mono" style="margin-left:auto">' + esc(q.id) + '</span></div>' +
    '<div class="qtext">' + txt(q.q) + '</div>';
  if (q.svg && q.type !== 'hotspot') h += '<div class="hs exhibit">' + q.svg + '</div>';

    }).join('') + '</div>';
  }
  if (reveal) h += '<div class="exp">' + esc(q.exp || '') + (q.ref ? '<span class="ref">' + esc(q.ref) + '</span>' : '') + '</div>';
  if (o.toggle) h += '<div><button class="btn ghost sm" type="button" data-act="ex-toggle" data-qid="' + esc(q.id) + '">' + (reveal ? 'Hide answer' : 'Show answer and explanation') + '</button></div>';
