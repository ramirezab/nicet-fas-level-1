/* ---------- Result ---------- */
function renderResult() {
  const att = Store.data.attempts.find(function (a) { return a.id === route.param; });
  if (!att) { go('progress'); return; }
  const pass = att.p >= PASS;
  const dom = {};
  Object.keys(att.byTask || {}).forEach(function (t) { const d = TASKS[t] ? TASKS[t].dom : '?'; dom[d] = dom[d] || [0, 0]; dom[d][0] += att.byTask[t][0]; dom[d][1] += att.byTask[t][1]; });
  const r = 62, C = 2 * Math.PI * r, off = C * (1 - att.p / 100);
  const dial = '<svg class="dial" viewBox="0 0 150 150" role="img" aria-label="Score ' + att.p + ' percent"><circle class="bgc" cx="75" cy="75" r="' + r + '" fill="none" stroke-width="12"></circle><circle class="fgc ' + (pass ? 'pass' : 'fail') + '" cx="75" cy="75" r="' + r + '" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 75 75)"></circle><text x="75" y="84" text-anchor="middle" font-size="34">' + att.p + '%</text></svg>';
  let domBars = '', taskBars = '';
  Object.keys(DOMAINS).forEach(function (d) { if (dom[d]) { const p = pct(dom[d][0], dom[d][1]); domBars += statBar(d + ' ' + DOMAINS[d].title, p, dom[d][0] + '/' + dom[d][1] + ' · ' + p + '%'); } });
  Object.keys(TASKS).forEach(function (t) { const b = att.byTask[t]; if (b) { const p = pct(b[0], b[1]); taskBars += statBar(t + ' ' + TASKS[t].short, p, b[0] + '/' + b[1] + ' · ' + p + '%'); } });
  let review = '';
  if (att.qids && att.given) {
    const flags = {}; (att.flags || []).forEach(function (id) { flags[id] = 1; });
    const items = att.qids.map(function (id, i) { return { q: QMAP[id], i: i }; }).filter(function (x) { return x.q; });
    const filt = ui.resultFilter === 'wrong' && !att.wrong.length ? 'all' : ui.resultFilter;
    const shown = items.filter(function (x) { const ok = isCorrect(x.q, att.given[x.q.id]); return filt === 'all' || (filt === 'wrong' && !ok) || (filt === 'flag' && flags[x.q.id]); });
    review = '<section class="stack-sm"><div class="section-head"><h2>Review your answers</h2></div>' +
      '<div class="tabs" role="tablist">' + [['wrong', 'Incorrect (' + att.wrong.length + ')'], ['flag', 'Flagged (' + (att.flags || []).length + ')'], ['all', 'All (' + att.n + ')']].map(function (t) { return '<button type="button" role="tab" aria-selected="' + (filt === t[0]) + '" data-res-filter="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>' +
      (shown.length ? shown.map(function (x) { return staticQ(x.q, att.given[x.q.id] || null, { num: 'Q' + (x.i + 1), perm: att.perm && att.perm[x.q.id], flag: flags[x.q.id] }); }).join('') : '<div class="empty">Nothing to show for this filter.</div>') + '</section>';
  } else review = '<div class="empty">Details for this attempt are no longer stored (only the 15 most recent are kept).</div>';
  view.innerHTML = '<div class="stack">' +
    '<div class="stack-sm"><p class="eyebrow">Result · ' + esc(fmtDate(att.date)) + '</p><h1>' + esc(att.title) + '</h1></div>' +
    '<section class="panel score">' + dial + '<div class="stack-sm">' +
      '<div class="row"><span class="chip ' + (pass ? 'green' : 'red') + '" style="font-size:.85rem;padding:4px 10px">' + (pass ? 'Above the 70% practice benchmark' : 'Below the 70% practice benchmark') + '</span>' + (att.mode === 'study' ? '<span class="chip">Study mode</span>' : '') + (att.auto ? '<span class="chip amber">Ended by the clock</span>' : '') + '</div>' +
      '<p><b>' + att.c + '</b> correct out of <b>' + att.n + '</b> · ' + att.un + ' unanswered · time used ' + fmtDur(att.dur) + (att.limit ? ' of ' + fmtDur(att.limit) : '') + '</p>' +
      '<p class="small muted">NICET reports a scaled score from 0 to 700 (500 passes) and does not publish the percent-correct equivalent. The 70% here is only a practice benchmark; aim for 80% or more on the practice exams before you schedule.</p>' +
      '<div class="row">' + (att.wrong.length ? '<button class="btn primary sm" type="button" data-act="retry-wrong" data-id="' + esc(att.id) + '">Practice the ' + att.wrong.length + ' missed</button>' : '') + '<button class="btn sm" type="button" data-go="exams">Another exam</button><button class="btn ghost sm" type="button" data-go="progress">My progress</button></div>' +
    '</div></section>' +
    '<section class="grid2"><div class="panel"><h3>By domain</h3><div class="stat-bars" style="margin-top:10px">' + domBars + '</div><p class="small muted" style="margin-top:12px">The NICET score report for a failing attempt also shows percent correct by domain. Use this breakdown to decide what to study next.</p></div>' +
      '<div class="panel"><h3>By task</h3><div class="stat-bars" style="margin-top:10px">' + taskBars + '</div></div></section>' +
    review + '</div>';
  $$('.qcard .hs svg').forEach(function (svg) {
    const id = svg.closest('[data-qid]').dataset.qid, q = QMAP[id];
    if (!q) return;
    if (q.type !== 'hotspot') return;
    drawRegions(svg, q);
    if (att.given && att.given[id]) drawMark(svg, att.given[id]);
  });
}

/* ---------- Progress ---------- */
function renderProgress() {
  const tot = groupStats(Q), atts = Store.data.attempts;
  const fulls = atts.filter(function (a) { return a.kind === 'full' || a.kind === 'fixed'; });
  const best = fulls.length ? Math.max.apply(null, fulls.map(function (a) { return a.p; })) : null;
  let dBars = '', tBars = '', cBars = '';
  Object.keys(DOMAINS).forEach(function (d) { const s = groupStats(Q.filter(function (q) { return TASKS[q.task].dom === d; })); dBars += statBar(d + ' ' + DOMAINS[d].title, s.acc, s.seen ? s.acc + '% · ' + s.seen + ' seen' : 'no data'); });
  Object.keys(TASKS).forEach(function (t) { const s = groupStats(qsByTask(t)); tBars += statBar(t + ' ' + TASKS[t].short, s.acc, s.seen ? s.acc + '% · ' + s.seen : 'no data'); });
  const tlist = TOPICS.map(function (id) { return { id: id, s: groupStats(Q.filter(function (q) { return q.topic === id; })) }; });
  tlist.forEach(function (x) { cBars += statBar(esc(topics[x.id].title), x.s.acc, x.s.seen ? x.s.acc + '% · ' + x.s.seen + '/' + x.s.total : '0/' + x.s.total); });
  const weak = tlist.filter(function (x) { return x.s.seen >= 5; }).sort(function (a, b) { return a.s.acc - b.s.acc; }).slice(0, 3);
  const nWrong = Q.filter(lastWrong).length;
  const rows = atts.map(function (a) {
    return '<tr><td>' + esc(fmtDate(a.date)) + '</td><td>' + esc(a.title) + '</td><td class="num">' + a.c + '/' + a.n + '</td><td class="num">' + a.p + '%</td><td class="num">' + fmtDur(a.dur) + '</td><td><span class="chip ' + (a.p >= PASS ? 'green' : 'red') + '">' + (a.p >= PASS ? '≥ 70%' : '< 70%') + '</span></td><td><button class="btn ghost sm" type="button" data-go="result" data-param="' + esc(a.id) + '">View</button></td></tr>';
  }).join('');
  view.innerHTML = '<div class="stack">' +
    '<div class="section-head"><div class="stack-sm"><p class="eyebrow">My progress</p><h1>How you are doing</h1></div><span data-sync>' + syncBadge() + '</span></div>' +
    '<div class="facts four">' +
      '<div><b>' + tot.seen + '</b><span>of ' + tot.total + ' questions seen</span></div>' +
      '<div><b>' + (tot.seen ? tot.acc + '%' : '—') + '</b><span>correct on last attempt</span></div>' +
      '<div><b>' + atts.length + '</b><span>exams and practice sets finished</span></div>' +
      '<div><b>' + (best != null ? best + '%' : '—') + '</b><span>best full 85-question exam</span></div>' +
    '</div>' +
    '<div class="row"><button class="btn primary" type="button" data-act="smart">Smart review (20)</button><button class="btn" type="button" data-act="wrong-all"' + (nWrong ? '' : ' disabled') + '>Review my misses (' + nWrong + ')</button>' +
      weak.map(function (x) { return '<button class="btn ghost" type="button" data-act="bank-study" data-key="t:' + x.id + '">Strengthen ' + esc(topics[x.id].short || x.id) + ' (' + x.s.acc + '%)</button>'; }).join('') + '</div>' +
    '<section class="grid2"><div class="panel"><h3>By domain</h3><div class="stat-bars" style="margin-top:10px">' + dBars + '</div></div><div class="panel"><h3>By task</h3><div class="stat-bars" style="margin-top:10px">' + tBars + '</div></div></section>' +
    '<section class="panel"><h3>By chapter</h3><div class="stat-bars" style="margin-top:10px">' + cBars + '</div></section>' +
    '<section class="stack-sm"><h2>History</h2>' + (rows ? '<div class="tbl-wrap"><table class="data"><thead><tr><th>Date</th><th>Exam</th><th>Correct</th><th>%</th><th>Time</th><th>Benchmark</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<div class="empty">You have not finished an exam yet. Start with <button class="btn sm" type="button" data-act="start-fixed" data-k="0">Practice Exam 1</button> to measure your starting point.</div>') + '</section>' +
    '<section class="panel stack-sm"><h3>Reset</h3><p class="small muted">Deletes your statistics, history and any exam in progress. This cannot be undone.</p><div><button class="btn sm" type="button" data-act="reset">Delete my progress</button></div></section>' +
    '</div>';
}

/* ---------- Guides ---------- */
function renderGuides() {
  const general = GUIDES.filter(function (g) { return g.group !== 'ref'; });
  const ref = GUIDES.filter(function (g) { return g.group === 'ref'; });
  const id = route.param || (general[0] ? general[0].id : (TOPICS[0] ? 't-' + TOPICS[0] : ''));
  let nav = '<div class="grp">The exam</div>' + general.map(function (g) { return navBtn(g.id, g.title, id); }).join('');
  nav += '<div class="grp">By chapter</div>' + TOPICS.map(function (t) { return navBtn('t-' + t, topics[t].short || topics[t].title, id); }).join('');
  nav += '<div class="grp">Quick reference</div>' + ref.map(function (g) { return navBtn(g.id, g.title, id); }).join('') + navBtn('tabs', 'Tabbing guide', id) + navBtn('glossary', 'Glossary', id);
  let content = '';
  if (id.indexOf('t-') === 0 && topics[id.slice(2)]) content = topicGuide(topics[id.slice(2)]);
  else if (id === 'tabs') content = tabsGuide();
  else if (id === 'glossary') content = glossaryGuide();
  else {
    const g = GUIDES.find(function (x) { return x.id === id; });
    content = g ? '<p class="eyebrow">' + esc(g.eyebrow || 'Guide') + '</p><h2>' + esc(g.title) + '</h2>' + g.html : '<p>Guide not found.</p>';
  }
  view.innerHTML = '<div class="guide-layout"><nav class="guide-nav" aria-label="Guides">' + nav + '</nav><article class="prose" id="guide-body">' + content + '</article></div>';
  if (id === 'glossary') bindGlossary();
  $$('#guide-body table').forEach(function (t) { if (!t.parentElement.classList.contains('tbl')) { const w = document.createElement('div'); w.className = 'tbl'; t.parentNode.insertBefore(w, t); w.appendChild(t); } });
}
function navBtn(id, label, cur) { return '<button type="button" data-go="guides" data-param="' + esc(id) + '"' + (id === cur ? ' aria-current="true"' : '') + '>' + esc(label) + '</button>'; }
function topicGuide(t) {
  const qs = Q.filter(function (q) { return q.topic === t.id; });
  const refs = t.refs || [];
  let h = '<p class="eyebrow">Chapter guide · ' + esc(refs.slice(0, 3).join(' · ')) + (refs.length > 3 ? ' …' : '') + '</p><h2>' + esc(t.title) + '</h2>' +
    '<div class="row"><span class="chip">Tasks: ' + esc((t.tasks || []).join(', ')) + '</span><span class="chip mono">' + qs.length + ' questions</span><button class="btn dark sm" type="button" data-act="bank-study" data-key="t:' + t.id + '">Practice this chapter</button></div>' +
    (t.guide || '');
  if (t.tabs && t.tabs.length) h += '<h3>What to tab in your books</h3><table class="tabs-table"><thead><tr><th>Section</th><th>Why</th></tr></thead><tbody>' + t.tabs.map(function (x) { return '<tr><td>' + esc(x.ref) + '</td><td>' + esc(x.what) + '</td></tr>'; }).join('') + '</tbody></table>';
  if (t.glossary && t.glossary.length) h += '<h3>Chapter vocabulary</h3><div>' + t.glossary.map(glossRow).join('') + '</div>';
  return h;
}
function glossRow(g) { return '<div class="gloss-row"><b>' + esc(g.en) + '</b><span class="muted">' + esc(g.def || '') + '</span></div>'; }
function tabsGuide() {
  const groups = { 'NFPA 72 (2022)': [], 'NFPA 70 / NEC (2020)': [], 'Ugly’s Electrical References (2020)': [], 'Study-only references (not allowed in the test center)': [] };
  TOPICS.forEach(function (id) {
    (topics[id].tabs || []).forEach(function (x) {
      const r = x.ref || '';
      const k = /72/.test(r) && /NFPA/i.test(r) ? 'NFPA 72 (2022)' : /NEC|NFPA 70|^\d{3}\.|Art/.test(r) ? 'NFPA 70 / NEC (2020)' : /Ugly/i.test(r) ? 'Ugly’s Electrical References (2020)' : 'Study-only references (not allowed in the test center)';
      groups[k].push({ ref: r, what: x.what, t: topics[id].short || id });
    });
  });
  let h = '<p class="eyebrow">Quick reference</p><h2>Tabbing guide for your printed books</h2>' +
    '<p>Your three printed references are your only lookup tools on exam day, so how you tab them decides how fast you answer. NICET allows the books bound or in a three-ring binder with a title page, with highlighting and self-adhesive tabs that are <strong>permanently attached</strong>. Handwritten notes, loose pages, sticky notes and repositionable tabs are not allowed.</p>' +
    '<div class="callout"><p><strong>How to tab:</strong> one color per book, one tab per chapter on the side edge, and a second row of tabs on the top edge for the tables you use most (Table 14.3.1, Table 14.4.3.2, the candela tables). Label tabs with the section number <em>and</em> a keyword, e.g. “17.15 Pull stations”. Practice with the same books you will take to the test center.</p></div>';
  Object.keys(groups).forEach(function (k) {
    if (!groups[k].length) return;
    h += '<h3>' + esc(k) + '</h3><table class="tabs-table"><thead><tr><th>Section</th><th>Why</th><th>Site chapter</th></tr></thead><tbody>' +
      groups[k].map(function (x) { return '<tr><td>' + esc(x.ref) + '</td><td>' + esc(x.what) + '</td><td>' + esc(x.t) + '</td></tr>'; }).join('') + '</tbody></table>';
  });
  return h;
}
function glossaryGuide() {
  return '<p class="eyebrow">Quick reference</p><h2>Glossary</h2><p>Terms from the content outline and the questions, with short definitions. Many have a formal definition in NFPA 72 Chapter 3 — knowing the exact term helps you find it in the index of your printed code.</p>' +
    '<input type="search" id="gl-q" placeholder="Search terms" value="' + esc(ui.glossQ) + '" style="width:100%" aria-label="Search the glossary"><div id="gl-list"></div>';
}
function allGlossary() {
  const seen = {}, out = [];
  TOPICS.forEach(function (id) { (topics[id].glossary || []).forEach(function (g) { const k = (g.en || '').toLowerCase().trim(); if (k && !seen[k]) { seen[k] = 1; out.push(g); } }); });
  return out.sort(function (a, b) { return a.en.localeCompare(b.en); });
}
function bindGlossary() {
  const all = allGlossary(), inp = $('#gl-q');
  function draw() {
    const t = ui.glossQ.trim().toLowerCase();
    const l = all.filter(function (g) { return !t || (g.en + ' ' + (g.def || '')).toLowerCase().indexOf(t) >= 0; });
    $('#gl-list').innerHTML = '<p class="small muted" style="margin:10px 0">' + plural(l.length, 'term', 'terms') + '</p>' + l.map(glossRow).join('');
  }
  inp.addEventListener('input', function () { ui.glossQ = inp.value; draw(); });
  draw();
}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click', function (e) {
  const t = e.target;
  const k = t.closest('#calc [data-k]'); if (k) { calcPress(k.dataset.k); return; }
  if (t.closest('[data-calc-close]')) { closeCalc(); return; }
  const x = t.closest('#exam [data-x]'); if (x) { if (!x.disabled) examAction(x.dataset.x); return; }
  const o = t.closest('#exam [data-opt]'); if (o) { chooseOpt(+o.dataset.opt); return; }
  const gt = t.closest('#exam [data-goto]'); if (gt) { const ex = Store.data.current; ex.cur = +gt.dataset.goto; ex.screen = 'q'; Store.save(); renderExam(); return; }
  const g = t.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go, g.dataset.param || null); return; }
  const bt = t.closest('[data-bank-tab]'); if (bt) { ui.bankTab = bt.dataset.bankTab; renderBank(); return; }
  const rf = t.closest('[data-res-filter]'); if (rf) { ui.resultFilter = rf.dataset.resFilter; render(); return; }
  const a = t.closest('[data-act]'); if (!a || a.disabled) return;
  const act = a.dataset.act;
  if (act === 'start-full') {
    const cb = $('#opt-unseen'); if (cb) { Store.data.settings.unseenFirst = cb.checked; Store.save(); }
    startExam(newExam({ kind: 'full', title: 'Full Practice Exam · NICET FAS I', qs: pickBlueprint(BP_FULL, Store.data.settings.unseenFirst), limitMin: FULL_MIN }));
  }
  else if (act === 'start-mini') startExam(newExam({ kind: 'mini', title: 'Mini Exam (30)', qs: pickBlueprint(BP_MINI, Store.data.settings.unseenFirst), limitMin: 39 }));
  else if (act === 'start-fixed') { const kk = +a.dataset.k; startExam(newExam({ kind: 'fixed', fixedN: kk, title: 'Practice Exam ' + (kk + 1) + ' · NICET FAS I', qs: fixedExamQs(kk), limitMin: FULL_MIN })); }
  else if (act === 'start-custom') startCustom();
  else if (act === 'resume') openExam();
  else if (act === 'discard') confirmModal('Discard exam', '<p>The exam in progress will be deleted without a score.</p>', 'Discard', function () { Store.data.current = null; Store.save(); render(); });
  else if (act === 'bank-study') bankStart(a.dataset.key, 'study');
  else if (act === 'bank-exam') bankStart(a.dataset.key, 'exam');
  else if (act === 'smart') startExam(newExam({ kind: 'practice', title: 'Smart review', qs: smartSet(20), mode: 'study' }));
  else if (act === 'wrong-all') startExam(newExam({ kind: 'practice', title: 'Review of missed questions', qs: shuffle(Q.filter(lastWrong)).slice(0, 40), mode: 'study' }));
  else if (act === 'retry-wrong') { const at = Store.data.attempts.find(function (z) { return z.id === a.dataset.id; }); if (at) startExam(newExam({ kind: 'practice', title: 'Missed in: ' + at.title, qs: at.wrong.map(function (id) { return QMAP[id]; }), mode: 'study' })); }
  else if (act === 'ex-toggle') { const id = a.dataset.qid; ui.explore.open[id] = !ui.explore.open[id]; drawExplore(); }
  else if (act === 'ex-more') { ui.explore.limit += 25; drawExplore(); }
  else if (act === 'reset') confirmModal('Delete all my progress', '<p>Your statistics, history and any exam in progress will be deleted.</p>', 'Delete', function () { Store.data = Store.blank(); Store.save(); render(); toast('Progress deleted.'); });
});
document.addEventListener('change', function (e) {
  const f = e.target.closest('[data-filter]'); if (!f) return;
  const key = f.dataset.filter;
  if (key === 'count') ui.bankCount = f.value;
  else if (f.type === 'checkbox') ui.bankFilters[key] = f.checked;
  else ui.bankFilters[key] = f.value;
  renderBank();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { if (modalClose) { closeModal(); return; } if ($('#calc')) { closeCalc(); return; } }
  const calc = $('#calc');
  if (calc && !modalClose) {
    const map = { '*': '×', '/': '÷', '-': '−', 'Enter': '=', '=': '=', 'Backspace': '⌫', 'Delete': 'C' };
    if (/^[0-9.+()^%]$/.test(e.key) || map[e.key]) { e.preventDefault(); calcPress(map[e.key] || e.key); return; }
  }
  if (!examOpen() || modalClose) return;
  if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const ex = Store.data.current; if (!ex || ex.screen !== 'q') return;
  const q = curQ(ex);
  if (q.opts && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const i = 'abcdefgh'.indexOf(e.key.toLowerCase());
    const perm = ex.perm[q.id] || [];
    if (i >= 0 && i < perm.length) { e.preventDefault(); chooseOpt(perm[i]); return; }
  }
  if (e.key === 'ArrowRight') { e.preventDefault(); examAction('next'); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); examAction('prev'); }
});
window.addEventListener('hashchange', function () { parseHash(); if (!examOpen()) render(); });

/* =========================================================
   Boot
   ========================================================= */
Store.load();
parseHash();
render();
if (Store.data.current && Store.data.current.deadline && Date.now() >= Store.data.current.deadline) { finishExam(true); }
Store.connect();
})();
</script>
