Tables","what":"Note 4 (nipples ≤ 24 in.: 60%), Note 7 (round up at ≥ 0.8), Note 9 (multiconductor cable = 1 conductor)"},{"ref":"NEC 2020 Ch. 9, Table 4","what":"Conduit and tubing dimensions and areas by type (EMT, PVC, RMC...) at 40/53/31/60%"},{"ref":"NEC 2020 Ch. 9, Table 5","what":"Dimensions and areas of insulated conductors (THHN, TFFN...)"},{"ref":"NEC 2020 Ch. 9, Table 9","what":"AC resistance and reactance (do not confuse with Table 8, dc)"},{"ref":"NEC 2020 Annex C","what":"Maximum number of same-size conductors per raceway (C.1 = EMT)"},{"ref":"Ugly's 2020 – Ohm's Law / Power Formulas","what":"E, I, R, P formula wheel"},{"ref":"Ugly's 2020 – Series and Parallel Circuits","what":"Resistance, current, and voltage in series and in parallel"},{"ref":"Ugly's 2020 – Voltage Drop Calculations","what":"VD = 2 × K × I × L ÷ CM (1φ) and 1.732 × K × I × L ÷ CM (3φ); K = 12.9 Cu, 21.2 Al"},{"ref":"Ugly's 2020 – distribution systems","what":"120/240 V single-phase, 208Y/120 V, and 480Y/277 V"},{"ref":"NFPA 72-2022 §10.6.7.2.1","what":"Secondary capacity: 24 h standby + 5 min alarm (15 min for EVACS)"},{"ref":"NFPA 72-2022 §7.2.1","what":"Minimum documentation: battery and NAC voltage drop calculations"},{"ref":"NFPA 72-2022 Table 14.4.3.2","what":"Conductor tests (1 V stray voltage, ground, short, loop resistance) and battery tests"},{"ref":"NFPA 72-2022 §10.3","what":"Equipment listed, installed per the manufacturer, and compatible"},{"ref":"NFPA 72-2022 Ch. 12","what":"Circuits and pathways: Class A/B, monitoring for integrity, ground faults"}],"glossary":[{"en":"Voltage (E)","def":"Electrical potential difference, measured in volts (V) with the voltmeter in parallel."},{"en":"Current (I)","def":"Flow of electric charge, measured in amperes (A) with the ammeter in series."},{"en":"Resistance (R)","def":"Opposition to current flow, measured in ohms (Ω) with the circuit de-energized."},{"en":"Ohm's law","def":"The relationship E = I × R between voltage, current, and resistance."},{"en":"Power (P)","def":"Energy per unit of time, in watts: P = E × I = I² × R = E² ÷ R."},{"en":"Series circuit","def":"A single current path; resistances add and the current is the same throughout the loop."},{"en":"Parallel circuit","def":"Several branches with the same voltage; branch currents add (like the appliances on a NAC)."},{"en":"Voltage drop (VD)","def":"Voltage lost in conductor resistance: VD = I × R of the complete loop."},{"en":"Circular mil (cmil)","def":"Unit of conductor area used in NEC Table 8 (14 AWG = 4110 cmil)."},{"en":"Stranded conductor","def":"Conductor made of several strands; for the same AWG it has slightly more resistance than solid wire."},{"en":"End-of-line (EOL) resistor","def":"Resistor installed at the end of a Class B circuit so the panel can supervise the wiring."},{"en":"Supervisory current","def":"Small current that flows through the EOL in standby; if it moves outside its window, the panel indicates trouble."},{"en":"Open circuit","def":"A break in the current path; the ohmmeter reads OL (infinite)."},{"en":"Short circuit","def":"Low-resistance connection between conductors that bypasses the load or the EOL."},{"en":"Ground fault","def":"Unintended connection of a circuit conductor to ground (conduit, box, structure)."},{"en":"Stray voltage","def":"Unwanted voltage on installation conductors; NFPA 72 limits it to 1 V ac/dc in acceptance testing."},{"en":"Megohmmeter (insulation tester)","def":"Instrument that applies a high dc voltage to measure insulation resistance in MΩ."},{"en":"Multimeter (DMM)","def":"Instrument that measures voltage, current, and resistance depending on the function and inputs selected."},{"en":"Ampere-hour (Ah)","def":"Battery capacity: the current multiplied by the time the battery can deliver it."},{"en":"Secondary power supply","def":"Batteries (or another approved source) that keep the system operating when primary power fails."},{"en":"Quiescent load","def":"Current the system draws in its normal condition, without alarm."},{"en":"Lumped load","def":"Calculation method that assumes all NAC current is drawn at the last appliance; gives a conservative result."},{"en":"Conduit fill","def":"Percentage of a raceway's interior area occupied by conductors or cables (NEC Ch. 9, Table 1)."},{"en":"Alternating current (ac)","def":"Current that periodically reverses direction; 60 Hz in the U.S."},{"en":"Nipple","def":"Short length of conduit (24 in. or less) between boxes or enclosures; may be filled to 60%."}]},"questions":[{"id":"elec-001","task":"1.1.2","type":"single","diff":1,"q":{"en":"A 24 VDC circuit carries a current of 1.2 A. Using Ohm's law, what is the total resistance of the circuit?"},"opts":[{"en":"28.8 Ω"},{"en":"20 Ω"},{"en":"0.05 Ω"},{"en":"25.2 Ω"}],"ans":[1],"ref":"Ugly's 2020 – Ohm's Law / Power Formulas","exp":"Ohm's law: R = E ÷ I = 24 V ÷ 1.2 A = 20 Ω. 28.8 is E × I (that gives watts, not ohms), and 0.05 is I ÷ E (the formula upside down). The E-I-R-P formula wheel is in Ugly's."},{"id":"elec-002","task":"1.1.2","type":"single","diff":1,"q":{"en":"A strobe's data sheet lists an alarm current of 85 mA. What is this value in amperes?"},"opts":[{"en":"0.85 A"},{"en":"8.5 A"},{"en":"0.085 A"},{"en":"0.0085 A"}],"ans":[2],"ref":"Ugly's 2020 – metric prefixes and conversions","exp":"Milli = 1/1000, so 85 mA = 85 ÷ 1000 = 0.085 A. Always convert mA to A before applying Ohm's law, voltage drop, or battery calculations; this is one of the most common mistakes on the exam."},{"id":"elec-003","task":"1.1.2","type":"single","diff":1,"q":{"en":"A 24 VDC horn/strobe draws 0.15 A in alarm. How much power does it consume?"},"opts":[{"en":"36 W"},{"en":"160 W"},{"en":"0.006 W"},{"en":"3.6 W"}],"ans":[3],"ref":"Ugly's 2020 – Ohm's Law / Power Formulas","exp":"Power formula (Watt's law): P = E × I = 24 V × 0.15 A = 3.6 W. 160 comes from dividing 24 ÷ 0.15, which actually gives ohms (160 Ω), and 36 W is a decimal-point error."},{"id":"elec-004","task":"1.1.2","type":"single","diff":2,"freq":true,"q":{"en":"A Class B NAC serves 8 horn/strobes rated 115 mA each and 4 strobes rated 72 mA each, all connected in parallel. What total alarm current must the NAC supply?"},"opts":[{"en":"1.21 A"},{"en":"0.92 A"},{"en":"0.19 A"},{"en":"12.1 A"}],"ans":[0],"ref":"Ugly's 2020 – parallel circuits (Kirchhoff's current law)","exp":"In parallel, branch currents add: 8 × 0.115 A = 0.920 A and 4 × 0.072 A = 0.288 A; total ≈ 1.21 A. 0.92 A forgets the strobes, and 12.1 A is a mA-to-A conversion error. Use the current from the manufacturer's data sheet and compare it with the NAC rating."},{"id":"elec-005","task":"1.1.2","type":"single","diff":2,"freq":true,"q":{"en":"Using VD = (2 × K × I × L) ÷ CM with K = 12.9, what is the voltage drop on a 2-wire NAC of 14 AWG copper (4110 cmil) carrying 2.0 A to a point 250 ft from the panel (one-way length)?"},"opts":[{"en":"1.57 V"},{"en":"6.28 V"},{"en":"3.14 V"},{"en":"0.31 V"}],"ans":[2],"ref":"Ugly's 2020 – Voltage Drop Calculations; NEC 2020 Ch. 9, Table 8","exp":"VD = 2 × 12.9 × 2.0 A × 250 ft ÷ 4110 cmil = 12,900 ÷ 4110 ≈ 3.14 V. The 2 covers the out-and-back path (L is the one-way distance); 1.57 V is the error of omitting the 2, and 6.28 V of applying it twice. K = 12.9 for copper is the Ugly's value; the cmil come from NEC Table 8."},{"id":"elec-006","task":"1.1.2","type":"single","diff":2,"q":{"en":"A NAC uses 16 AWG stranded, uncoated copper (4.99 Ω/kft per NEC Chapter 9, Table 8). The last appliance is 300 ft from the panel (one-way) and the circuit draws 1.5 A. Using the resistance method, what is the voltage drop?"},"opts":[{"en":"2.25 V"},{"en":"4.40 V"},{"en":"2.99 V"},{"en":"4.49 V"}],"ans":[3],"ref":"NEC 2020 Ch. 9, Table 8","exp":"Loop = 2 × 300 ft = 600 ft = 0.6 kft; R = 4.99 × 0.6 ≈ 2.99 Ω; VD = I × R = 1.5 A × 2.99 Ω ≈ 4.49 V. 4.40 V comes from using the solid-wire value (4.89 Ω/kft), 2.25 V from using only 300 ft, and 2.99 is the resistance, not the drop."},{"id":"elec-007","task":"1.1.2","type":"single","diff":2,"q":{"en":"A NAC calculation starts at 20.4 VDC (the worst-case end-of-discharge voltage specified by the panel manufacturer). The calculated voltage drop to the last appliance is 3.2 V, and the appliances are listed for 16–33 VDC. What is the voltage at the last appliance, and is it acceptable?"},"opts":[{"en":"23.6 V; acceptable"},{"en":"17.2 V; not acceptable, because it is below 20.4 V"},{"en":"17.2 V; acceptable, because it is within the appliance's listed operating range"},{"en":"14.0 V; not acceptable, because it is below 16 V"}],"ans":[2],"ref":"Appliance data sheet/listing; Ugly's 2020 (Kirchhoff's voltage law)","exp":"Voltage at the last appliance = starting voltage − drop = 20.4 − 3.2 = 17.2 V. The criterion is the appliance's listed operating range from the manufacturer (here 16–33 VDC), not an NFPA 72 number; 17.2 V is at least 16 V, so it complies. The 20.4 V (85% of 24 V) is only the conservative starting point."},{"id":"elec-008","task":"1.1.2","type":"single","diff":3,"freq":true,"q":{"en":"A NAC carries 2.0 A. The starting voltage is 20.4 VDC and the appliances require at least 16 VDC. The circuit uses 14 AWG stranded copper (3.14 Ω/kft per NEC Chapter 9, Table 8). With all load lumped at the end, what is the maximum one-way distance from the panel to the last appliance?"},"opts":[{"en":"175 ft"},{"en":"350 ft"},{"en":"700 ft"},{"en":"1400 ft"}],"ans":[1],"ref":"NEC 2020 Ch. 9, Table 8; Ugly's 2020 – Ohm's Law","exp":"Allowable drop = 20.4 − 16 = 4.4 V. Maximum loop resistance = 4.4 V ÷ 2.0 A = 2.2 Ω. Loop length = 2.2 Ω ÷ 3.14 Ω/kft ≈ 0.70 kft = 700 ft out and back, or ≈ 350 ft one way. 700 ft is the error of not dividing by 2."},{"id":"elec-009","task":"1.1.2","type":"single","diff":1,"q":{"en":"According to NEC Chapter 9, Table 8, what is the area of a 14 AWG conductor in circular mils?"},"opts":[{"en":"4110 cmil"},{"en":"2580 cmil"},{"en":"6530 cmil"},{"en":"1620 cmil"}],"ans":[0],"ref":"NEC 2020 Ch. 9, Table 8","exp":"Table 8: 18 AWG = 1620, 16 AWG = 2580, 14 AWG = 4110, 12 AWG = 6530, and 10 AWG = 10,380 cmil. The area is the same for solid and stranded conductors; only the resistance changes slightly."},{"id":"elec-010","task":"1.1.2","type":"single","diff":1,"q":{"en":"According to NEC Chapter 9, Table 8, what is the dc resistance of 18 AWG stranded, uncoated copper?"},"opts":[{"en":"7.77 Ω/kft"},{"en":"7.95 Ω/kft"},{"en":"8.45 Ω/kft"},{"en":"4.99 Ω/kft"}],"ans":[1],"ref":"NEC 2020 Ch. 9, Table 8","exp":"Table 8 (at 75°C): 18 AWG stranded uncoated = 7.95 Ω per 1000 ft. 7.77 is 18 AWG solid, 8.45 is stranded coated, and 4.99 is 16 AWG stranded. Read the row (solid or stranded) and the column (uncoated or coated) carefully."},{"id":"elec-011","task":"1.1.2","type":"multi","select":2,"diff":2,"q":{"en":"A NAC calculation shows that the last appliance will receive less than its minimum listed voltage. Which TWO changes will reduce the voltage drop on this circuit? (Select TWO.)"},"opts":[{"en":"Replace the 16 AWG conductors with 14 AWG conductors"},{"en":"Change the end-of-line resistor to a higher value"},{"en":"Split the appliances between two NACs so each circuit carries less current"},{"en":"Use 18 AWG conductors to lower the circuit capacitance"},{"en":"Extend the circuit to add more appliances at the far end"}],"ans":[0,2],"ref":"Ugly's 2020 – Voltage Drop Calculations; NEC 2020 Ch. 9, Table 8","exp":"VD = I × R, so reduce it by lowering the current (split the load between two NACs or use a NAC power supply/booster) or lowering the resistance (larger conductor, smaller AWG number). The EOL has no meaningful effect on alarm current, and a thinner conductor (18 AWG) or more length and load increase the drop."},{"id":"elec-012","task":"1.1.2","type":"single","diff":1,"freq":true,"q":{"en":"According to NEC Chapter 9, Table 1, what is the maximum percent fill of a conduit that contains more than two conductors?"},"opts":[{"en":"53%"},{"en":"31%"},{"en":"40%"},{"en":"60%"}],"ans":[2],"ref":"NEC 2020 Ch. 9, Table 1","exp":"NEC Chapter 9, Table 1: 1 conductor = 53%, 2 conductors = 31%, more than 2 conductors = 40%. The 60% applies only to nipples of 24 in. or less (Note 4 to the tables)."},{"id":"elec-013","task":"1.1.2","type":"single","diff":3,"q":{"en":"A single multiconductor fire alarm cable will be the only cable installed in a conduit. According to NEC Chapter 9, Table 1 and its notes, what maximum fill applies?"},"opts":[{"en":"31%"},{"en":"40%"},{"en":"60%"},{"en":"53%"}],"ans":[3],"ref":"NEC 2020 Ch. 9, Table 1 and Note 9 to the tables","exp":"Note 9 to the Chapter 9 tables says a multiconductor cable is treated as a single conductor for fill calculations, so the 1-conductor column applies: 53%. For an elliptical cable, use its major diameter. The trap is counting the internal conductors and using 40%."},{"id":"elec-014","task":"1.1.2","type":"single","diff":2,"q":{"en":"A 12 in. conduit nipple connects a fire alarm control unit cabinet to an adjacent junction box. According to the notes to the NEC Chapter 9 tables, what maximum fill is permitted?"},"opts":[{"en":"40%"},{"en":"60%"},{"en":"53%"},{"en":"80%"}],"ans":[1],"ref":"NEC 2020 Ch. 9, Note 4 to the tables","exp":"Note 4 to the Chapter 9 tables: conduit nipples not exceeding 24 in. (600 mm) installed between boxes, cabinets, or similar enclosures may be filled to 60% of their total area. For longer runs, Table 1 applies (53/31/40%)."},{"id":"elec-015","task":"1.1.2","type":"single","diff":3,"q":{"en":"Using NEC Chapter 9, Table 4 (1/2 in. EMT, 40% area = 0.122 in²) and Table 5 (14 AWG THHN = 0.0097 in²), what is the maximum number of 14 AWG THHN conductors permitted in 1/2 in. EMT?"},"opts":[{"en":"13"},{"en":"16"},{"en":"12"},{"en":"9"}],"ans":[2],"ref":"NEC 2020 Ch. 9, Tables 4 and 5, Note 7; Annex C, Table C.1","exp":"0.122 ÷ 0.0097 = 12.58. Note 7 to the tables permits rounding up only when the decimal is 0.8 or larger; 0.58 is not, so the maximum is 12 (matching Annex C, Table C.1). 16 comes from mistakenly using the 53% column."},{"id":"elec-016","task":"1.1.2","type":"single","diff":3,"q":{"en":"A 1/2 in. EMT (40% fill area = 0.122 in²) will contain six 14 AWG THHN conductors (0.0097 in² each) and four 12 AWG THHN conductors (0.0133 in² each). What is the total conductor area, and is the fill acceptable?"},"opts":[{"en":"0.1114 in²; acceptable, because it does not exceed 0.122 in²"},{"en":"0.1114 in²; not acceptable, because mixed sizes are limited to 31%"},{"en":"0.0230 in²; acceptable"},{"en":"0.1330 in²; not acceptable"}],"ans":[0],"ref":"NEC 2020 Ch. 9, Tables 1, 4 and 5 (Note 6)","exp":"With different sizes, add the actual areas from Table 5: 6 × 0.0097 = 0.0582 in² and 4 × 0.0133 = 0.0532 in²; total 0.1114 in², which is less than 0.122 in² (40% of 1/2 in. EMT in Table 4). The 31% applies only when there are exactly 2 conductors."},{"id":"elec-017","task":"1.1.2","type":"single","diff":2,"q":{"en":"A conventional circuit is supervised with 24 VDC across a 4.7 kΩ EOL resistor. Neglecting wire resistance, approximately how much supervisory current flows?"},"opts":[{"en":"5.1 mA"},{"en":"0.51 mA"},{"en":"51 mA"},{"en":"196 mA"}],"ans":[0],"ref":"Ugly's 2020 – Ohm's Law","exp":"I = E ÷ R = 24 V ÷ 4700 Ω ≈ 0.0051 A = 5.1 mA. The panel watches this small current: if the circuit opens it drops to zero and a trouble signal results; if it shorts, it rises sharply. 196 comes from dividing R ÷ E."},{"id":"elec-018","task":"1.1.2","type":"single","diff":2,"q":{"en":"During acceptance testing of new installation conductors, what is the maximum stray voltage allowed between conductors, or between conductors and ground, unless the equipment manufacturer specifies a different threshold?"},"opts":[{"en":"5 V ac/dc"},{"en":"0.1 V ac/dc"},{"en":"10 V ac/dc"},{"en":"1 V ac/dc"}],"ans":[3],"ref":"NFPA 72-2022 Table 14.4.3.2 (metallic conductors)","exp":"NFPA 72-2022, Table 14.4.3.2: all installation conductors are checked with a volt/ohmmeter to confirm there are no stray voltages between them or to ground; the maximum is 1 V ac/dc unless the manufacturer specifies a different value. The same row requires ground-fault, short-circuit, and loop resistance tests."},{"id":"elec-019","task":"1.1.2","type":"single","diff":2,"q":{"en":"To perform a loop resistance test on a new initiating or notification circuit pair, the technician should:"},"opts":[{"en":"measure from each conductor to ground with the circuit energized"},{"en":"short the conductor pair at the far end, measure the resistance at the panel end, and compare it with the manufacturer's limit"},{"en":"measure the voltage across the EOL resistor during alarm"},{"en":"connect the meter in series with the EOL resistor while the panel is powered"}],"ans":[1],"ref":"NFPA 72-2022 Table 14.4.3.2 (metallic conductors)","exp":"Per Table 14.4.3.2, with each conductor pair shorted at the far end, the loop resistance is measured and recorded, and it must not exceed the limit specified by the equipment manufacturer. The measurement is made with the circuit disconnected from the panel."},{"id":"elec-020","task":"1.1.2","type":"single","diff":2,"q":{"en":"A technician tests a new NAC pair for ground faults by measuring from each conductor to the grounded conduit, with the circuit disconnected from the panel. Which reading indicates acceptable isolation from ground?"},"opts":[{"en":"Less than 1 Ω"},{"en":"About 4.7 kΩ"},{"en":"24 VDC"},{"en":"A very high resistance (megohms or OL)"}],"ans":[3],"ref":"NFPA 72-2022 Table 14.4.3.2 (ground faults)","exp":"A well-insulated conductor shows a very high resistance (MΩ or OL) to the conduit or equipment ground. A low reading indicates a ground fault, which the panel reports as trouble. Table 14.4.3.2 requires this isolation to be verified per the manufacturer's instructions."},{"id":"elec-021","task":"1.1.2","type":"single","diff":2,"q":{"en":"A fire alarm control unit is rated 120 VAC, 60 Hz and is fed from a 120/240 V, single-phase, 3-wire panelboard. Which connection provides the correct supply?"},"opts":[{"en":"One ungrounded (hot) conductor and the grounded (neutral) conductor, for 120 V"},{"en":"Both ungrounded conductors, for 120 V"},{"en":"One ungrounded conductor, using the equipment grounding conductor as the return path"},{"en":"The grounded (neutral) conductor and the equipment grounding conductor"}],"ans":[0],"ref":"Ugly's 2020 – 120/240 V single-phase systems; NEC 2020 Art. 250","exp":"In a 120/240 V single-phase, 3-wire system there is 120 V from a hot conductor to neutral and 240 V between the two hots (not 120 V). The equipment grounding conductor must not be used as the return path for normal current (NEC Art. 250). The supply is 60-Hz ac, and the panel converts it to 24 VDC for its circuits."},{"id":"elec-022","task":"1.1.2","type":"single","diff":2,"q":{"en":"In a 208Y/120 V, 3-phase, 4-wire system, what is the voltage between any phase conductor and the neutral?"},"opts":[{"en":"104 V"},{"en":"120 V"},{"en":"208 V"},{"en":"240 V"}],"ans":[1],"ref":"Ugly's 2020 – three-phase wye systems","exp":"In a wye system, line-to-neutral voltage = line-to-line voltage ÷ √3 = 208 ÷ 1.732 ≈ 120 V. Likewise, a 480Y/277 V system gives 277 V to neutral. 104 V is the error of dividing by 2."},{"id":"elec-023","task":"1.1.2","type":"single","diff":3,"q":{"en":"A NAC will carry 2.5 A to appliances 300 ft (one-way) from the panel, and the maximum allowable voltage drop is 4.0 V. Using VD = (2 × K × I × L) ÷ CM with K = 12.9, what is the smallest copper conductor size that meets the limit?"},"opts":[{"en":"18 AWG (1620 cmil)"},{"en":"16 AWG (2580 cmil)"},{"en":"14 AWG (4110 cmil)"},{"en":"12 AWG (6530 cmil)"}],"ans":[3],"ref":"Ugly's 2020 – Voltage Drop Calculations; NEC 2020 Ch. 9, Table 8","exp":"Solve for CM = (2 × K × I × L) ÷ VD = (2 × 12.9 × 2.5 × 300) ÷ 4.0 = 19,350 ÷ 4.0 ≈ 4838 cmil. 14 AWG (4110 cmil) is not enough: it would give ≈ 4.71 V. The next size, 12 AWG (6530 cmil), gives ≈ 2.96 V and complies. The cmil values are in Table 8."},{"id":"elec-024","task":"1.1.2","type":"single","diff":1,"q":{"en":"If the length of a NAC run is doubled while the current stays the same, the voltage drop on the conductors will:"},"opts":[{"en":"stay the same"},{"en":"be cut in half"},{"en":"double"},{"en":"increase four times"}],"ans":[2],"ref":"Ugly's 2020 – Voltage Drop Calculations; NEC 2020 Ch. 9, Table 8","exp":"VD = I × R, and conductor resistance is proportional to length (Table 8 gives it in Ω per 1000 ft). Doubling the length doubles R and therefore doubles the drop; doubling the current does the same."},{"id":"elec-025","task":"1.1.2","type":"single","diff":3,"q":{"en":"When calculating NAC voltage drop, a technician assumes that all of the appliance current is drawn at the last appliance (the 'lumped load' method). Compared with a point-to-point calculation, this method gives:"},"opts":[{"en":"a lower voltage drop, so it is not conservative"},{"en":"a higher, conservative voltage drop"},{"en":"exactly the same voltage drop in every case"},{"en":"a result that is valid only for ac circuits"}],"ans":[1],"ref":"Ugly's 2020 – Voltage Drop Calculations (NAC calculation practice)","exp":"With a lumped load, all the current flows through the entire cable, which overestimates the actual drop; that is why the method is conservative. A point-to-point calculation (section by section, using the current that actually flows in each section) is more accurate and allows longer circuits. If the lumped method passes, the circuit passes."},{"id":"elec-026","task":"1.1.2","type":"single","diff":2,"q":{"en":"Before performing an insulation resistance (megohmmeter) test on newly pulled fire alarm conductors, what should the technician do first?"},"opts":[{"en":"Disconnect the conductors from the control unit and from all devices and appliances"},{"en":"Connect all detectors and modules so they are included in the test"},{"en":"Energize the circuit from the panel so the reading is taken under load"},{"en":"Install the EOL resistor so the meter reads 4.7 kΩ"}],"ans":[0],"ref":"Equipment manufacturer's instructions; NFPA 72-2022 Table 14.4.3.2","exp":"A megohmmeter applies a high dc test voltage (hundreds of volts) to measure insulation in MΩ. That voltage can damage panels, modules, and electronic detectors, so the conductors are isolated at both ends and measured conductor-to-conductor and conductor-to-ground. Follow the equipment manufacturer's instructions."},{"id":"elec-027","task":"1.1.1","type":"single","diff":2,"q":{"en":"When terminating polarized horn/strobes on a conventional Class B NAC, why must the technician observe the + and − markings on each appliance?"},"opts":[{"en":"Polarity only matters for ac-powered appliances"},{"en":"Reversed appliances flash brighter, which overloads the NAC"},{"en":"The NAC is supervised in standby with reversed polarity; correctly polarized appliances block that current and operate when the panel applies alarm polarity"},{"en":"The polarity marking only identifies which terminal receives the EOL resistor"}],"ans":[2],"ref":"Panel and appliance manufacturer's instructions; NFPA 72-2022 Ch. 12 (monitoring for integrity)","exp":"Conventional NACs supervise the wiring in standby with reversed polarity: each appliance's internal diode blocks that current, so only the EOL current flows. An appliance connected backward conducts in standby (the panel may show trouble) and will not operate in alarm. Follow the manufacturer's wiring diagrams."},{"id":"elec-028","task":"1.1.1","type":"multi","select":2,"diff":2,"q":{"en":"A technician is terminating solid conductors on the screw terminals of conventional horn/strobes on a Class B NAC. Which TWO practices are correct? (Select TWO.)"},"opts":[{"en":"Wrap each conductor clockwise around the terminal screw, so tightening the screw draws the wire under the head"},{"en":"Loop one continuous, unbroken conductor under each terminal screw to save time"},{"en":"Place two conductors under a terminal that is not identified for more than one conductor"},{"en":"Break the wire run at each appliance, so that a loose or removed connection opens the circuit and produces a trouble signal"},{"en":"Leave about 1/2 in. of bare conductor exposed beyond the terminal as a test point"}],"ans":[0,3],"ref":"Appliance manufacturer's instructions; NEC 2020 §110.14(A); NFPA 72-2022 Ch. 12 (monitoring for integrity)","exp":"Wrapping the wire clockwise keeps it under the screw head as the screw tightens. Breaking the wire run (cutting the conductor so the incoming and outgoing ends are separate) means a loose or removed connection opens the circuit and the panel shows trouble; an unbroken wire looped under the screw stays continuous even if the appliance is removed, so that connection is not supervised. NEC 110.14(A) requires terminals used for more than one conductor to be identified for that use, and bare conductor should not extend beyond the terminal."},{"id":"elec-029","task":"1.1.1","type":"single","diff":2,"q":{"en":"During installation, the plans are revised so that several multi-candela strobes on a NAC will be set to 110 cd instead of 15 cd. What electrical effect must be considered?"},"opts":[{"en":"The strobe current increases, so the NAC load, voltage drop, and battery calculations must be rechecked"},{"en":"The strobe current decreases, because brighter settings are more efficient"},{"en":"Only the EOL resistor value must be changed"},{"en":"There is no effect, because candela settings do not change current draw"}],"ans":[0],"ref":"Appliance data sheet; NFPA 72-2022 §7.2.1 (battery and voltage drop calculations)","exp":"On multi-candela strobes, current increases with the candela setting; per the data sheet, 110 cd draws several times more than 15 cd. Changing the setting changes the NAC load, the voltage drop, and the required battery capacity, so those calculations (NFPA 72 §7.2.1 documentation) must be updated."},{"id":"elec-030","task":"1.1.1","type":"single","diff":1,"q":{"en":"Before mounting a notification appliance on a 24 VDC NAC, a technician notices that the appliance is listed for 8–17.5 VDC (12 V nominal). What should the technician do?"},"opts":[{"en":"Install it; the NAC will automatically lower the voltage"},{"en":"Do not install it; use an appliance listed for the NAC's 24 VDC operating range"},{"en":"Install it with a resistor in series to drop the voltage"},{"en":"Install it only if the circuit uses 14 AWG wire"}],"ans":[1],"ref":"NFPA 72-2022 §10.3 (equipment listed and installed per the manufacturer)","exp":"NFPA 72 requires equipment that is listed for the intended use and installed per the manufacturer's instructions (§10.3). A 12-V appliance on a 24-V NAC is outside its listed range and can be damaged; do not improvise with resistors. Use an appliance listed for the circuit voltage and compatible with the panel."},{"id":"elec-031","task":"1.1.1","type":"single","diff":3,"q":{"en":"Why does a control unit manufacturer limit the number of two-wire smoke detectors that may be connected to one conventional initiating device circuit?"},"opts":[{"en":"Each detector adds a 4.7 kΩ resistance in series, which opens the circuit"},{"en":"Two-wire detectors are powered from the NAC, not from the IDC"},{"en":"NFPA 72 limits every IDC to five detectors regardless of the manufacturer"},{"en":"Each detector draws standby current from the IDC; too many can push the total toward the panel's alarm or trouble threshold or beyond the circuit's capacity"}],"ans":[3],"ref":"NFPA 72-2022 §10.3 (equipment compatibility); panel manufacturer's instructions","exp":"Two-wire detectors are powered from the same IDC pair and their standby currents add (they are in parallel). If the allowed number is exceeded, the total current can approach the threshold the panel interprets as alarm or trouble. That is why they must be listed as compatible with the panel (NFPA 72 §10.3) and the manufacturer's maximum quantity respected."},{"id":"elec-032","task":"1.2.2","type":"single","diff":2,"q":{"en":"A technician disconnects a Class B initiating device circuit from the panel and measures across the pair with all devices in normal condition. The EOL resistor is 4.7 kΩ and the loop wire resistance is about 20 Ω. What should the ohmmeter read?"},"opts":[{"en":"About 20 Ω"},{"en":"About 2.35 kΩ"},{"en":"About 4.72 kΩ"},{"en":"Infinite (OL)"}],"ans":[2],"ref":"Ugly's 2020 – series circuits","exp":"In normal condition, the EOL and the wire are in series: total R = 4700 + 20 = 4720 Ω ≈ 4.72 kΩ. A few ohms would indicate a short or a closed contact; OL would indicate an open circuit."},{"id":"elec-033","task":"1.2.2","type":"single","diff":2,"q":{"en":"While troubleshooting, a technician finds that two 4.7 kΩ EOL resistors were installed on the same Class B circuit, connected in parallel. What equivalent resistance does the panel see?"},"opts":[{"en":"9.4 kΩ"},{"en":"4.7 kΩ"},{"en":"1.18 kΩ"},{"en":"2.35 kΩ"}],"ans":[3],"ref":"Ugly's 2020 – parallel circuits","exp":"Two equal resistors in parallel: R = R ÷ n = 4.7 kΩ ÷ 2 = 2.35 kΩ (or 1/RT = 1/4.7 + 1/4.7). In series they would add to 9.4 kΩ. A value different from the one specified can cause a trouble signal or prevent faults from being detected: leave a single EOL, at the end of the circuit."},{"id":"elec-034","task":"1.2.2","type":"single","diff":1,"q":{"en":"A Class B IDC with a 4.7 kΩ EOL resistor is disconnected from the panel and measured across the pair. The ohmmeter reads OL (infinite). What is the most likely condition?"},"opts":[{"en":"An open conductor, a loose terminal, or a missing EOL resistor"},{"en":"A short circuit between the conductors"},{"en":"A ground fault"},{"en":"Normal condition"}],"ans":[0],"ref":"NFPA 72-2022 Ch. 12 (monitoring for integrity); Ugly's 2020 – Ohm's Law","exp":"OL means there is no path for current: an open conductor, a loose terminal, or a missing EOL. A normal reading would be ≈ 4.7 kΩ plus the wire, and a short would read nearly 0 Ω. The panel reports the open as a trouble signal."},{"id":"elec-035","task":"1.2.2","type":"single","diff":2,"q":{"en":"A Class B IDC with a 4.7 kΩ EOL resistor and contact-type initiating devices is disconnected from the panel and reads 12 Ω across the pair. What is the most likely cause?"},"opts":[{"en":"An open in the circuit"},{"en":"A ground fault on one conductor"},{"en":"A short between the conductors, or an initiating device contact that is closed (in alarm)"},{"en":"An EOL resistor of slightly the wrong value"}],"ans":[2],"ref":"Ugly's 2020 – parallel circuits; NFPA 72-2022 Ch. 12","exp":"A few ohms is just the wire resistance: something is bypassing the EOL, either a short between conductors or a closed contact (an activated manual station, an operated heat detector). Split the circuit to locate it. A ground fault is measured between a conductor and ground, not between the two conductors."},{"id":"elec-036","task":"1.2.2","type":"single","diff":2,"q":{"en":"A control unit shows a ground fault trouble on one circuit. Which method is most effective for locating the fault on a long run?"},"opts":[{"en":"Replace every device on the circuit until the trouble clears"},{"en":"Disconnect the circuit at the panel, confirm the fault by measuring each conductor to ground, then split the circuit at a midpoint and test each half until the faulted section is found"},{"en":"Increase the EOL resistor value until the trouble clears"},{"en":"Bond the negative conductor of the circuit to the conduit"}],"ans":[1],"ref":"NFPA 72-2022 Ch. 12 (ground-fault monitoring); troubleshooting practice","exp":"First confirm which circuit has the fault by disconnecting circuits one at a time; then measure each conductor to ground and use the half-split method: open the circuit at a midpoint and test each half. The fault shows as low resistance between a conductor and the conduit or box. Never intentionally connect a circuit conductor to ground."},{"id":"elec-037","task":"1.2.2","type":"multi","select":2,"diff":1,"q":{"en":"Which TWO statements about connecting a digital multimeter are correct? (Select TWO.)"},"opts":[{"en":"Voltage is measured with the meter connected in parallel with (across) the component"},{"en":"Current is measured with the meter connected directly across the power supply terminals"},{"en":"Resistance should be measured with the circuit energized for accuracy"},{"en":"Current is measured by opening the circuit and inserting the meter in series"},{"en":"Voltage is measured by opening the circuit and inserting the meter in series"}],"ans":[0,3],"ref":"Ugly's 2020 – Ohm's Law (measurement); meter manufacturer's instructions","exp":"Voltmeter: in parallel, across the component. Ammeter: in series, opening the circuit and using the correct current input (A or mA); connecting it across the supply creates a short circuit and can blow the meter's fuse. Ohmmeter: only on de-energized circuits."},{"id":"elec-038","task":"1.2.2","type":"single","diff":1,"q":{"en":"A technician is replacing the standby batteries in a fire alarm control unit. Which practice is correct?"},"opts":[{"en":"Install batteries of the type and amp-hour capacity specified by the panel manufacturer and the battery calculations, replacing them as a set"},{"en":"Install the largest batteries that fit in the cabinet, regardless of the charger rating"},{"en":"Install automotive starting batteries because they deliver higher current"},{"en":"Replace only one battery of the series pair and keep the other"}],"ans":[0],"ref":"NFPA 72-2022 Ch. 10 (§10.6, batteries) and Table 14.4.3.2; panel manufacturer's instructions","exp":"Replacement batteries must be the type and capacity specified by the panel manufacturer and the battery calculations: the charger can recharge only up to a certain capacity, and the capacity must cover 24 h + 5 min. They are replaced as a set (do not mix new and old) and then tested per Table 14.4.3.2."},{"id":"elec-039","task":"1.2.2","type":"single","diff":1,"freq":true,"q":{"en":"A 24 VDC control unit uses two 12 V, 7 Ah batteries connected in series. What are the resulting battery voltage and capacity?"},"opts":[{"en":"12 V, 14 Ah"},{"en":"24 V, 14 Ah"},{"en":"24 V, 7 Ah"},{"en":"12 V, 7 Ah"}],"ans":[2],"ref":"Ugly's 2020 – series/parallel circuits","exp":"In series (positive of one to negative of the other), voltages add and the Ah capacity stays the same: 24 V, 7 Ah. In parallel, the voltage stays the same and the Ah add (12 V, 14 Ah). Observe polarity when reconnecting."},{"id":"elec-040","task":"1.2.2","type":"single","diff":3,"q":{"en":"A circuit designed for a 4.7 kΩ EOL resistor is repaired with a 47 kΩ resistor by mistake. With 24 VDC across the EOL, how does the supervisory current change?"},"opts":[{"en":"It increases about ten times, causing an alarm"},{"en":"It drops to about one-tenth (≈0.51 mA instead of ≈5.1 mA), which the panel may report as an open (trouble)"},{"en":"It stays the same, because the EOL value does not affect the current"},{"en":"It doubles"}],"ans":[1],"ref":"Ugly's 2020 – Ohm's Law; panel manufacturer's instructions","exp":"I = E ÷ R: 24 V ÷ 4700 Ω ≈ 5.1 mA, but 24 V ÷ 47,000 Ω ≈ 0.51 mA, ten times less. The panel expects a current within a window; with much less current it may indicate an open circuit. Always use the EOL value specified by the panel manufacturer and check its marking before installing it."},{"id":"elec-041","task":"1.2.2","type":"single","diff":2,"q":{"en":"After six horn/strobes were added to an existing NAC, a technician measures 14.6 VDC at the last appliance during alarm. The appliances are listed for 16–33 VDC. What is the correct conclusion?"},"opts":[{"en":"Acceptable, because the panel output is 24 VDC"},{"en":"Acceptable as long as the strobes still flash"},{"en":"Replace the EOL resistor with a lower value to raise the voltage"},{"en":"Deficient; reduce the load (split the circuit or add a NAC power extender) or increase the conductor size, then retest"}],"ans":[3],"ref":"Appliance data sheet/listing; NFPA 72-2022 §10.3 (installation per the manufacturer)","exp":"Every appliance must receive a voltage within its listed range; 14.6 V is below 16 V and is a deficiency even if the appliance seems to work. Correct it by lowering the current (split the circuit, add a NAC power supply or booster) or the resistance (larger conductor), and re-measure in alarm at the last appliance. The EOL does not fix voltage drop."},{"id":"elec-042","task":"1.2.2","type":"single","diff":1,"q":{"en":"Before measuring the resistance of a circuit with an ohmmeter, what must the technician do?"},"opts":[{"en":"Set the meter to its highest ac voltage range"},{"en":"Connect the meter in series with the power supply"},{"en":"De-energize the circuit and disconnect it from the control unit"},{"en":"Leave the circuit energized so the reading includes the load"}],"ans":[2],"ref":"Ugly's 2020 – Ohm's Law (measurement); meter manufacturer's instructions","exp":"An ohmmeter uses its own battery to measure; on an energized circuit the reading is false and the instrument can be damaged. Disconnect the circuit from the panel (or remove power) before measuring resistance or continuity; a connected panel would also add its own resistance in parallel."},{"id":"elec-043","task":"1.3.1","type":"multi","select":2,"diff":2,"q":{"en":"According to NFPA 72, which TWO calculations are part of the minimum documentation for a new fire alarm system? (Select TWO.)"},"opts":[{"en":"Short-circuit fault-current calculations for the building service"},{"en":"Building heating load calculations"},{"en":"Battery calculations (where batteries are provided)"},{"en":"Lightning protection risk assessment"},{"en":"Voltage drop calculations for notification appliance circuits"}],"ans":[2,4],"ref":"NFPA 72-2022 §7.2.1","exp":"NFPA 72-2022 §7.2.1 lists the minimum documentation, including battery calculations (where batteries are provided) and voltage drop calculations for NACs, plus drawings, riser diagrams, data sheets, and the sequence of operations. A Level I technician must be able to read them and verify that the installation matches."},{"id":"elec-044","task":"1.3.1","type":"single","diff":3,"freq":true,"q":{"en":"A system's total standby (quiescent) current is 0.250 A and its total alarm current is 3.0 A. Using 24 hours of standby, 5 minutes of alarm, and a 25% capacity margin (× 1.25), what is the minimum required battery capacity?"},"opts":[{"en":"6.25 Ah"},{"en":"7.50 Ah"},{"en":"7.81 Ah"},{"en":"21.0 Ah"}],"ans":[2],"ref":"NFPA 72-2022 §10.6.7.2.1 (24 h + 5 min) and the 2022 capacity margin (Ch. 10)","exp":"Standby: 0.250 A × 24 h = 6.00 Ah. Alarm: 3.0 A × (5 ÷ 60) h = 0.25 Ah. Sum 6.25 Ah × 1.25 ≈ 7.81 Ah; then choose a commercial battery of equal or greater capacity that the charger can handle. 7.50 Ah uses the 20% margin of earlier editions, 6.25 Ah omits the margin, and 21.0 Ah is the error of not converting the 5 minutes to hours."},{"id":"elec-045","task":"1.3.1","type":"single","diff":1,"freq":true,"q":{"en":"In a battery calculation for a non-voice fire alarm system, the total alarm current is multiplied by which time value to obtain the alarm ampere-hours?"},"opts":[{"en":"5 hours"},{"en":"0.0833 hour (5 minutes ÷ 60)"},{"en":"0.25 hour (15 minutes)"},{"en":"0.5 hour (30 minutes)"}],"ans":[1],"ref":"NFPA 72-2022 §10.6.7.2.1","exp":"A non-voice system needs 5 minutes of alarm operation after 24 hours of standby (§10.6.7.2.1). Ampere-hours need the time in hours: 5 ÷ 60 = 0.0833 h, so alarm Ah = alarm current × 0.0833. 0.25 h (15 minutes) is used only for EVACS, and entering 5 hours is a common error that grossly oversizes the battery."},{"id":"elec-046","task":"1.3.1","type":"single","diff":2,"q":{"en":"For an in-building fire emergency voice/alarm communications system (EVACS), after 24 hours of quiescent operation, the secondary power supply must be able to operate the system at maximum connected load for at least:"},"opts":[{"en":"5 minutes"},{"en":"15 minutes"},{"en":"30 minutes"},{"en":"2 hours"}],"ans":[1],"ref":"NFPA 72-2022 §10.6.7.2 (secondary capacity, EVACS)","exp":"For EVACS the requirement is 24 h of standby plus 15 min of alarm at maximum connected load, not the 5 min of a non-voice system (§10.6.7.2). In the battery calculation use 15 ÷ 60 = 0.25 h: alarm Ah = alarm current × 0.25."},{"id":"elec-047","task":"1.3.1","type":"single","diff":1,"freq":true,"q":{"en":"Which NEC Chapter 9 table provides the circular-mil area and dc resistance (Ω/kft) of conductors used in a dc voltage drop calculation?"},"opts":[{"en":"Table 1"},{"en":"Table 4"},{"en":"Table 5"},{"en":"Table 8"}],"ans":[3],"ref":"NEC 2020 Ch. 9, Table 8","exp":"Table 8 (Conductor Properties) gives the area in cmil, the stranding, the diameter, and the dc resistance at 75°C. Table 1 gives percent fill, Table 4 conduit dimensions, Table 5 insulated conductor dimensions, and Table 9 ac resistance and reactance."},{"id":"elec-048","task":"1.3.1","type":"single","diff":1,"q":{"en":"Where in the NEC can a technician quickly look up the maximum number of conductors of the same size and insulation type permitted in a given trade size of conduit?"},"opts":[{"en":"Chapter 9, Table 8"},{"en":"Informative Annex C"},{"en":"Article 760"},{"en":"Chapter 9, Table 9"}],"ans":[1],"ref":"NEC 2020 Annex C; Ch. 9, Note 1 to the tables","exp":"Informative Annex C (tables by raceway type, C.1 = EMT) gives the maximum number of same-size conductors directly, as Note 1 to the Chapter 9 tables indicates. With conductors of different sizes, calculate with Tables 4 and 5."},{"id":"elec-049","task":"1.3.1","type":"single","diff":2,"q":{"en":"In Ugly's Electrical References, how does the three-phase voltage drop formula differ from the single-phase (2-wire) formula VD = (2 × K × I × L) ÷ CM?"},"opts":[{"en":"The 2 is replaced by 1.732 (√3)"},{"en":"The 2 is replaced by 3"},{"en":"K is doubled"},{"en":"L is replaced by L²"}],"ans":[0],"ref":"Ugly's 2020 – Voltage Drop Calculations","exp":"Single-phase: VD = 2 × K × I × L ÷ CM; three-phase: VD = 1.732 × K × I × L ÷ CM, with K ≈ 12.9 for copper and 21.2 for aluminum (Ugly's values). Two-wire dc fire alarm circuits use the formula with the 2."},{"id":"elec-050","task":"1.3.1","type":"multi","select":2,"diff":2,"q":{"en":"Which TWO statements about NEC Chapter 9, Table 8 are correct? (Select TWO.)"},"opts":[{"en":"Resistance is listed in ohms per mile"},{"en":"Its dc resistance values are based on a conductor temperature of 75°C (167°F)"},{"en":"It lists ac resistance and reactance for conductors in steel conduit"},{"en":"Coated copper has lower resistance than uncoated copper of the same size"},{"en":"For the same AWG size, stranded uncoated copper has slightly higher resistance than solid"}],"ans":[1,4],"ref":"NEC 2020 Ch. 9, Table 8","exp":"Table 8 gives dc resistance at 75°C, in Ω/km and Ω/kft (per 1000 ft). Example, 14 AWG uncoated: solid 3.07 and stranded 3.14 Ω/kft; coated copper has somewhat higher resistance (3.19 and 3.26). AC resistance and reactance are in Table 9."}]},{"topic":{"id":"itm","title":"Inspection, Testing and Maintenance (NFPA 72-2022 Ch. 14)","short":"ITM Ch. 14","tasks":["1.2.1","1.2.2","1.3.1"],"refs":["NFPA 72-2022 Ch. 14","NFPA 72-2022 Ch. 7 (documentation)","NFPA 72-2022 Ch. 10 (personnel, impairments)","NFPA 72-2022 Annex A.14"],"guide":"\n<h3>What NICET expects at Level I</h3>\n<p>The Maintenance domain (1.2) is worth 40–50% of the exam, and almost all of it comes from Chapter 14 of NFPA 72-2022. A Level I technician must know <strong>how often</strong> each component is inspected and tested, <strong>how</strong> it is tested (the Method column of the table), what to do when something fails (repair or replace, and notify), and which records must be kept. The exam is open book with the printed code: the candidate who can open to the right table row in under a minute wins. Learn the structure of the chapter, not the wording.</p>\n\n<h3>Map of Chapter 14 (2022 edition)</h3>\n<table>\n<thead><tr><th>Section</th><th>Key content</th></tr></thead>\n<tbody>\n<tr><td>14.2.2</td><td>Impairments, deficiencies (written notice within 24 h), and observations (new in 2022)</td></tr>\n<tr><td>14.2.3</td><td>Responsibility of the owner or the owner's designated representative</td></tr>\n<tr><td>14.2.4</td><td>Notification before testing and when testing is concluded</td></tr>\n<tr><td>14.2.6</td><td>Releasing systems: secure the suppression system, no discharge</td></tr>\n<tr><td>14.2.10</td><td>Written test plan</td></tr>\n<tr><td>14.3 and Table 14.3.1</td><td>Visual inspection: frequency and method</td></tr>\n<tr><td>14.4.2</td><td>Reacceptance testing (hardware and software)</td></tr>\n<tr><td>Table 14.4.3.2</td><td>Testing: method <em>and</em> periodic frequency</td></tr>\n<tr><td>14.4.4</td><td>Testing frequency; 14.4.4.3 smoke detector sensitivity</td></tr>\n<tr><td>14.5</td><td>Maintenance</td></tr>\n<tr><td>14.6</td><td>Records</td></tr>\n</tbody>\n</table>\n<div class=\"callout warn\"><strong>Edition trap:</strong> older editions had a separate <strong>Table 14.4.5 (Testing Frequencies)</strong>; it no longer exists. In 2022 the testing frequencies are in the <em>Periodic Frequency</em> column of Table 14.4.3.2 (Testing). A lot of older study material still cites Table 14.4.5.</div>\n\n<h3>Visual inspection: Table 14.3.1</h3>\n<table>\n<thead><tr><th>Component</th><th>Frequency</th></tr></thead>\n<tbody>\n<tr><td>All equipment (building changes, obstructions, damage, cleanliness)</td><td>Annual</td></tr>\n<tr><td>Monitored control unit: fuses, interfaced equipment, lamps/LEDs, primary power supply</td><td>Annual</td></tr>\n<tr><td>Monitored control unit: trouble signals</td><td>Semiannual</td></tr>\n<tr><td>Control unit NOT monitored (all of the above)</td><td>Weekly</td></tr>\n<tr><td>Manual boxes, heat and smoke detectors, duct detectors (general)</td><td>Semiannual</td></tr>\n<tr><td>Radiant energy (flame) and video image detectors</td><td>Quarterly</td></tr>\n<tr><td>Waterflow devices and supervisory signal devices (tamper)</td><td>Semiannual (quarterly before 2022)</td></tr>\n<tr><td>Audible and visible notification appliances</td><td>Semiannual</td></tr>\n<tr><td>VRLA batteries: month/year of manufacture marking</td><td>Semiannual</td></tr>\n<tr><td>Supervising station transmitters (DACT, DART, RAT)</td><td>Annual</td></tr>\n<tr><td>NAC extenders and remote power supplies</td><td>Annual</td></tr>\n</tbody>\n</table>\n\n<h3>Testing: Table 14.4.3.2 (most-asked frequencies)</h3>\n<table>\n<thead><tr><th>Component (item)</th><th>Frequency</th></tr></thead>\n<tbody>\n<tr><td>Control unit: functions, fuses, lamps, primary power supply (2)</td><td>Annual</td></tr>\n<tr><td>Ground fault and transmission to the off-premises station (3)</td><td>Annual</td></tr>\n<tr><td>Secondary power: 5 min in alarm for general alarm, 15 min for voice (8)</td><td>Annual</td></tr>\n<tr><td>VRLA batteries: temperature, charger, unit voltage, ohmic (9)</td><td>Semiannual</td></tr>\n<tr><td>VRLA batteries: replacement or load test (9)</td><td>Every 3 years</td></tr>\n<tr><td>Manual boxes, smoke functional, heat, duct, projected beam, CO (17)</td><td>Annual</td></tr>\n<tr><td>Flame detectors (17)</td><td>Semiannual</td></tr>\n<tr><td>Control valve switch (17)</td><td>Semiannual</td></tr>\n<tr><td>Air pressure, room temperature, water level, and water temperature switches (17)</td><td>Annual</td></tr>\n<tr><td>Waterflow devices (17)</td><td>Semiannual</td></tr>\n<tr><td>Notification appliances (22) and emergency control functions (24)</td><td>Annual</td></tr>\n<tr><td>Dedicated engine-driven generator, by the owner per NFPA 110 (6)</td><td>Monthly</td></tr>\n</tbody>\n</table>\n\n<h3>Methods you must know</h3>\n<ul>\n<li><strong>Smoke functional test:</strong> smoke or a listed aerosol acceptable to the manufacturer; magnets are NOT acceptable for the smoke entry test.</li>\n<li><strong>Sensitivity (14.4.4.3):</strong> within 1 year of installation, then every alternate year. After the second calibration test in range, the interval may be extended to a maximum of 5 years, with nuisance alarm records kept. Acceptable methods: calibrated test method, manufacturer's calibrated instrument, listed control equipment arranged for the purpose, a detector/control unit arrangement that signals out-of-range sensitivity, or another calibrated method acceptable to the AHJ. Out of range: clean and recalibrate, or replace.</li>\n<li><strong>Heat:</strong> restorable types with a listed heat source or per the manufacturer, without damaging the nonrestorable fixed-temperature element. Nonrestorable spot type: at 15 years replace all or send 2 per 100 to a laboratory (repeat every 5 years).</li>\n<li><strong>Supervisory:</strong> valve signal within the first 2 revolutions of the handwheel or 1/5 of the travel; air pressure change of 10 psi maximum; temperature 40°F (4.4°C); water level 3 in. (pressure tank) or 12 in. (nonpressure tank).</li>\n<li><strong>Waterflow:</strong> through the inspector's test connection, at the flow of one sprinkler of the smallest orifice size installed.</li>\n<li><strong>Notification:</strong> measure SPL only at acceptance and reacceptance (Type 2 meter, FAST); at the periodic test, verify operation. Strobes: verify that each one flashes.</li>\n</ul>\n\n<h3>VRLA batteries (Table 14.4.3.2, item 9)</h3>\n<table>\n<thead><tr><th>Test</th><th>Replacement criterion</th></tr></thead>\n<tbody>\n<tr><td>Temperature (negative terminal, infrared thermometer)</td><td>More than 18°F (10°C) above the enclosure's internal ambient temperature</td></tr>\n<tr><td>Cell/unit voltage (fully charged, on the charger)</td><td>Less than 13.26 V</td></tr>\n<tr><td>Ohmic (against baseline)</td><td>Deviation of 30% or more (conductance) or 40% or more (resistance/impedance)</td></tr>\n<tr><td>Load test (every 3 years)</td><td>80% or less: replace; less than 85%: replace at the next scheduled test</td></tr>\n</tbody>\n</table>\n<p>Before testing batteries, make sure any software held in volatile memory is protected. A bulging, cracked, or leaking battery is replaced, not tested. Vented lead-acid and nickel-cadmium batteries no longer have their own rows: they follow the manufacturer's instructions or IEEE 450 / IEEE 1106.</p>\n\n<h3>Reacceptance (14.4.2)</h3>\n<ul>\n<li><strong>Site-specific software:</strong> 100% of what is affected, plus 10% of the initiating devices NOT affected (maximum 50). The record of completion is also revised.</li>\n<li><strong>Executive software:</strong> 10% functional test of the system, with at least one device on each input and output circuit.</li>\n<li><strong>Remote changes (new in 2022):</strong> a qualified person must be on site.</li>\n<li><strong>Like-for-like replacement:</strong> test the replaced device; the 10% is not required (A.14.4.2).</li>\n</ul>\n<p><strong>Example:</strong> 600 initiating devices, 30 affected. Test the 30, plus 10% of 570, which is 57; with the cap of 50, the total is 80 devices.</p>\n\n<h3>Notifications, deficiencies, and impairments</h3>\n<ul>\n<li>Before testing, notify whoever receives the signals (supervising station, and fire department if applicable) and the occupants. When finished, notify them that testing has concluded.</li>\n<li>A deficiency not corrected at the end of the visit is reported in writing to the owner within 24 h. Equipment that is part of a recall program is also reported in writing.</li>\n<li>An observation is a suggestion that is neither a deficiency nor an impairment; the owner is not required to act on it.</li>\n<li>For an impairment, notify the owner and apply mitigating measures acceptable to the AHJ (Section 10.21). Under NFPA 101 or the adopted IFC, if the system is out of service more than 4 h in 24 h: notify the AHJ and provide a fire watch or evacuate.</li>\n<li>Releasing systems: secure the suppression system against actuation, notify occupants, no discharge, and restore everything at the end.</li>\n</ul>\n\n<h3>Records (14.6 and Ch. 7)</h3>\n<ul>\n<li>ITM records: kept until the next test and for 1 year thereafter. The supervising station keeps its records at least 1 year.</li>\n<li>As-built drawings, operation and maintenance manuals, and the sequence of operation: given to the owner and kept for the life of the system (paper or electronic).</li>\n<li>Form: System Record of Inspection and Testing, Figure 7.8.2(g) and its supplements, or an alternative record with the same information (7.6.6).</li>\n<li>Copy of the site-specific software: on site, in nonvolatile, nonerasable, nonrewritable memory (7.5.7).</li>\n</ul>\n\n<div class=\"callout warn\"><strong>Common traps:</strong> (1) Confusing visual inspection (Table 14.3.1) with testing (Table 14.4.3.2). (2) In 2022, waterflow and supervisory devices have a semiannual visual inspection, not quarterly. (3) Sensitivity is never measured with an unmeasured aerosol. (4) The 10% / maximum 50 rule is for initiating devices NOT affected; affected devices are tested 100%. (5) NFPA 72 requires testing the emergency control function interface device, not the whole controlled function (for example, the elevator). (6) Control valve switch: semiannual; the other supervisory switches: annual.</div>\n\n<h3>How to find it fast in the printed code book</h3>\n<ol>\n<li>Does the question say look at or inspect? Turn to Table 14.3.1. Does it say test? Turn to Table 14.4.3.2. Its items are numbered: 2 control unit, 3 trouble signals and ground fault, 4 transmission equipment, 8 secondary power, 9 VRLA, 15 conductors, 17 initiating devices, 22 notification appliances, and 24 emergency control functions.</li>\n<li>Table 14.4.3.2 runs for many pages. Place permanent tabs at its first page, at item 9 (batteries), at item 17 (initiating devices), and at item 22 (notification appliances), plus one tab on Table 14.3.1.</li>\n<li>Other tabs worth placing: 14.4.2 (reacceptance), 14.4.4.3 (sensitivity), 14.6 and 7.6.6 (records), 10.5.3 (personnel), 10.21 (impairments), and the Ch. 3 Frequency definitions.</li>\n<li>Use the index at the back of the book: look up \"Sensitivity testing\", \"Reacceptance testing\", \"Impairments\", \"Batteries\", \"Records\". Every section number starts with its chapter (14.x is Chapter 14). An asterisk (*) next to a section means Annex A has explanatory material (A.14.x) — not mandatory, but it explains intent, such as A.14.4.2 (like-for-like replacement) and A.14.4.3.2 (battery formulas).</li>\n<li>Highlight the key numbers in the Method column before exam day: \"two revolutions\", \"18°F\", \"13.26 V\", \"50 devices\", \"1 year thereafter\".</li>\n<li>Annual, semiannual, and quarterly are defined in Ch. 3 (Frequency): annual 9 to 15 months, semiannual 4 to 8, quarterly 2 to 4.</li>\n</ol>\n","tabs":[{"ref":"NFPA 72 §14.2.2","what":"Impairments, deficiencies (written notice within 24 h), recalls, and observations"},{"ref":"NFPA 72 §14.2.3","what":"Owner responsibility and delegation"},{"ref":"NFPA 72 §14.2.4","what":"Notification before and after testing"},{"ref":"NFPA 72 §14.2.6","what":"Testing of releasing systems"},{"ref":"NFPA 72 §14.2.10","what":"Written test plan"},{"ref":"NFPA 72 Table 14.3.1","what":"Visual inspection: frequencies and methods"},{"ref":"NFPA 72 §14.4.2","what":"Reacceptance: 100% affected + 10% (max. 50); executive software; remote changes"},{"ref":"NFPA 72 Table 14.4.3.2 items 2–4","what":"Control unit, trouble signals, ground fault, transmission (DACT 90 s / 4 min)"},{"ref":"NFPA 72 Table 14.4.3.2 items 8–9","what":"Secondary power (5/15 min) and VRLA batteries"},{"ref":"NFPA 72 Table 14.4.3.2 item 17","what":"Initiating devices: methods and frequencies"},{"ref":"NFPA 72 Table 14.4.3.2 items 22–24","what":"Notification appliances and emergency control functions"},{"ref":"NFPA 72 §14.4.4.3","what":"Smoke detector sensitivity (1 year, every alternate year, up to 5)"},{"ref":"NFPA 72 A.14.4.3.2","what":"Annex: ohmic test and battery capacity calculation"},{"ref":"NFPA 72 §14.6","what":"Records: retention and owner documents"},{"ref":"NFPA 72 §7.6.6 / Fig. 7.8.2(g)","what":"System Record of Inspection and Testing"},{"ref":"NFPA 72 §10.5.3","what":"Qualifications of inspection, testing, and service personnel"},{"ref":"NFPA 72 Section 10.21","what":"System impairments"},{"ref":"NFPA 72 Ch. 3 (Frequency)","what":"Definitions of weekly, monthly, quarterly, semiannual, and annual"}],"glossary":[{"en":"Inspection","def":"Visual examination of equipment to verify its location and condition and that nothing has changed or been damaged (Table 14.3.1)."},{"en":"Testing","def":"Operating a device or system to prove that it works, using the method in Table 14.4.3.2."},{"en":"Maintenance","def":"Work done to keep equipment operable per the manufacturer's instructions (Section 14.5)."},{"en":"Impairment","def":"A condition in which the system or part of it is out of order or cannot perform its function; requires notification and mitigating measures."},{"en":"Deficiency","def":"A condition that affects system performance; it must be corrected and, if not corrected at the end of the visit, reported in writing within 24 h."},{"en":"Observation","def":"A suggested improvement that is neither an impairment nor a deficiency; the owner is not required to act on it (new in 2022)."},{"en":"Reacceptance testing","def":"Testing after components, wiring, or software are added, deleted, repaired, or modified (14.4.2)."},{"en":"Site-specific software","def":"Programming unique to the installation (input/output mapping, labels, control matrix)."},{"en":"Executive software","def":"The control unit manufacturer's firmware or operating system; a change requires a 10% functional test."},{"en":"Sensitivity testing","def":"Verification with a calibrated method that a smoke detector is within its listed and marked range."},{"en":"Valve-regulated lead-acid (VRLA) battery","def":"Sealed battery typical of fire alarm panels; tested semiannually and replaced or load tested every 3 years."},{"en":"Ohmic test","def":"Measurement of a battery's internal conductance, resistance, or impedance, compared with a baseline value."},{"en":"Inspector's test connection","def":"Sprinkler system outlet that simulates the flow of one sprinkler to test the waterflow switch."},{"en":"Control valve supervisory switch (tamper)","def":"Sends a supervisory signal when the valve is closed; must operate within 2 revolutions or 1/5 of the travel."},{"en":"Emergency control function interface device","def":"Relay or module through which the fire alarm acts on elevators, HVAC, or doors; NFPA 72 requires this device to be tested."},{"en":"Record of completion","def":"Document for the completed installation (Fig. 7.8.2(a)); revised after software changes."},{"en":"Record of inspection and testing","def":"Form in Fig. 7.8.2(g) and its supplements, or an equivalent alternative record, used to document periodic ITM."},{"en":"Test plan","def":"Written document that clearly establishes the scope of the testing (14.2.10)."},{"en":"Designated representative","def":"Person or company to whom the owner assigns ITM responsibility by contract or lease."},{"en":"Fire watch","def":"Approved mitigating measure: personnel who patrol the building while the system is out of service."},{"en":"Nonrestorable heat detector","def":"Detector whose sensing element is destroyed when it operates; it is not heat tested in the field."},{"en":"Supervising station","def":"Facility that receives alarm, supervisory, and trouble signals; it must be notified before and after testing."},{"en":"Annual (frequency)","def":"Once per year, with a minimum of 9 and a maximum of 15 months between events (Ch. 3 definitions)."}]},"questions":[{"id":"itm-001","task":"1.2.1","type":"single","diff":1,"q":{"en":"According to NFPA 72-2022, who is responsible for the inspection, testing, and maintenance of a fire alarm system?"},"opts":[{"en":"The fire alarm installing contractor, for the life of the system"},{"en":"The authority having jurisdiction (AHJ)"},{"en":"The property, building, or system owner, or the owner's designated representative"},{"en":"The equipment manufacturer"}],"ans":[2],"ref":"NFPA 72-2022 §14.2.3","exp":"Section 14.2.3 makes the property or building owner, or the owner's designated representative, responsible for inspection, testing, and maintenance of the system and for alterations or additions. The owner may delegate it through a lease or management contract and hire qualified personnel, but the responsibility starts with the owner. The AHJ verifies compliance; it does not perform the ITM."},{"id":"itm-002","task":"1.2.1","type":"multi","select":2,"diff":1,"q":{"en":"Before starting a periodic test of a monitored fire alarm system in an occupied office building, which TWO must be notified to prevent an unnecessary response? (Select TWO.)"},"opts":[{"en":"The supervising station that receives the system's signals"},{"en":"The local electric utility"},{"en":"The building occupants"},{"en":"The fire alarm equipment manufacturer"},{"en":"The state NICET office"}],"ans":[0,2],"ref":"NFPA 72-2022 §14.2.4","exp":"Section 14.2.4 requires that, before any testing, all persons and facilities that receive alarm, supervisory, or trouble signals (the supervising station and, where applicable, the fire department) and all building occupants be notified. This prevents an unnecessary dispatch or evacuation. The utility, the manufacturer, and NICET do not receive signals."},{"id":"itm-003","task":"1.2.1","type":"single","diff":1,"q":{"en":"A technician has finished the annual test and restored the system to normal. Per NFPA 72-2022, what must be done regarding notification?"},"opts":[{"en":"Nothing; notification is required only before testing"},{"en":"Notify those previously notified (and others as necessary) that testing has been concluded"},{"en":"Notify only the AHJ, in writing, within 5 business days"},{"en":"Notify the occupants only if an alarm sounded during the test"}],"ans":[1],"ref":"NFPA 72-2022 §14.2.4","exp":"Section 14.2.4 also requires that, at the conclusion of testing, those previously notified (and others as necessary) be told that testing has ended. If the supervising station does not know the test is over, it could disregard a real alarm. This step is a mandatory part of closing out any test."},{"id":"itm-004","task":"1.2.1","type":"single","diff":2,"q":{"en":"A fire alarm control unit releases a clean-agent suppression system. During the annual fire alarm test, which statement is correct per NFPA 72-2022?"},"opts":[{"en":"The agent must be discharged once a year to prove the releasing circuit works"},{"en":"The releasing circuit is exempt from testing because it belongs to the suppression system"},{"en":"The suppression system may be left disabled until the next annual test"},{"en":"Discharge testing is not required by NFPA 72; the suppression system is secured against inadvertent actuation during the test"}],"ans":[3],"ref":"NFPA 72-2022 §14.2.6","exp":"Per 14.2.6, NFPA 72 does not require a discharge test of the suppression system. The suppression system is secured against inadvertent actuation (disconnecting releasing solenoids or electric actuators, or closing valves), the releasing circuits are verified to be monitored for integrity and to operate as intended on alarm, and everything is returned to its functional operating condition when testing is complete."},{"id":"itm-005","task":"1.2.1","type":"multi","select":2,"diff":2,"q":{"en":"Which TWO actions does NFPA 72-2022 require when testing a fire alarm system configured for releasing service? (Select TWO.)"},"opts":[{"en":"Notify the occupants that a releasing-service system is being serviced or tested"},{"en":"Disconnect only the horns so that occupants are not disturbed"},{"en":"Secure the suppression system against inadvertent actuation (for example, disconnect releasing solenoids or electric actuators, or close valves)"},{"en":"Discharge a small test quantity of agent"},{"en":"Leave the releasing components disconnected after the test so they can be inspected later"}],"ans":[0,2],"ref":"NFPA 72-2022 §14.2.6","exp":"Section 14.2.6 requires testing personnel qualified in the specific releasing arrangement, notification of occupants whenever a releasing-service system is serviced or tested, and securing the suppression system against inadvertent actuation for the duration of the test. No discharge is required, and the releasing components must be returned to their functional condition at the end."},{"id":"itm-006","task":"1.2.1","type":"multi","select":2,"diff":2,"q":{"en":"Which TWO are recognized by NFPA 72-2022 (10.5.3) as means by which a person can be qualified to inspect and test fire alarm systems? (Select TWO.)"},"opts":[{"en":"Being factory trained and certified for the specific type and brand of system"},{"en":"Holding a general contractor business license"},{"en":"Having worked as the building's maintenance custodian for five years"},{"en":"Being certified by a nationally recognized fire alarm certification organization acceptable to the AHJ (e.g., NICET)"},{"en":"Being the security guard who looks at the control unit every day"}],"ans":[0,3],"ref":"NFPA 72-2022 §10.5.3","exp":"Section 10.5.3 accepts, among others: personnel factory trained and certified for the specific system, personnel certified by a nationally recognized fire alarm certification organization acceptable to the AHJ (such as NICET), personnel licensed or registered by a state or local authority, and personnel employed and qualified by an organization listed by a nationally recognized testing laboratory. Section 14.2.3 refers back to these requirements."},{"id":"itm-007","task":"1.2.1","type":"single","diff":3,"q":{"en":"During periodic testing, the automatic smoke detection in one wing must be taken out of service, and no manual means or other compensatory measure is available. How does NFPA 72-2022 treat this condition?"},"opts":[{"en":"That portion of the system is impaired and must comply with the impairment requirements of Section 10.21 until the automatic function is restored"},{"en":"It is a normal part of testing and needs no special handling"},{"en":"It is an observation that the owner may ignore"},{"en":"It is a deficiency that must be reported to the AHJ within 5 business days"}],"ans":[0],"ref":"NFPA 72-2022 §14.2.2.2; Section 10.21","exp":"Per 14.2.2.2 (2022), when an automatic function is taken out of service for testing and no manual or other compensatory means is available, the system or that portion of it is impaired. It must then comply with Section 10.21 (notify the owner and apply mitigating measures acceptable to the AHJ) until the automatic function is restored. This wording avoids declaring an impairment for minor, compensated outages."},{"id":"itm-008","task":"1.2.1","type":"single","diff":2,"q":{"en":"A control unit replacement will leave a required fire alarm system out of service for about 6 hours. Which response best meets NFPA 72-2022 impairment requirements and typical adopted codes such as NFPA 101?"},"opts":[{"en":"No action is required because the outage is shorter than 8 hours"},{"en":"Ensure the owner is notified of the impairment, notify the AHJ, and provide an approved fire watch (or evacuate) until the system is restored"},{"en":"Tape a note on the control unit and proceed with the work"},{"en":"Ask the supervising station to ignore all signals and do not inform the occupants"}],"ans":[1],"ref":"NFPA 72-2022 Section 10.21; NFPA 101 Ch. 9","exp":"Section 10.21 requires the owner to be notified when the system is impaired (out-of-service events included) and mitigating measures acceptable to the AHJ to be applied. NFPA 101 (and the IFC) add that when a required fire alarm system is out of service for more than 4 hours in a 24-hour period, the AHJ must be notified and the building evacuated or an approved fire watch provided. A 6-hour outage triggers that rule."},{"id":"itm-009","task":"1.2.2","type":"single","diff":2,"freq":true,"q":{"en":"At the end of an annual test, a failed horn/strobe could not be replaced because the part is on order. Per NFPA 72-2022, what must happen?"},"opts":[{"en":"The owner or the owner's designated representative must be informed of the deficiency in writing within 24 hours"},{"en":"The technician must notify the AHJ within 30 days"},{"en":"Nothing is required until the next scheduled test"},{"en":"The deficiency is recorded only in the technician's personal notes"}],"ans":[0],"ref":"NFPA 72-2022 §14.2.2.3","exp":"Per 14.2.2.3, deficiencies must be corrected. If a deficiency is not corrected at the conclusion of the inspection, testing, or maintenance, the system owner or the owner's designated representative must be informed in writing within 24 hours. Key facts: 24 hours, in writing, to the owner."},{"id":"itm-010","task":"1.2.2","type":"single","diff":2,"q":{"en":"During an inspection, a technician notices that several installed smoke detectors are models included in a manufacturer's recall program. Per NFPA 72-2022, what is required?"},"opts":[{"en":"Replace them immediately without informing anyone"},{"en":"Nothing; recalls are handled only by the manufacturer"},{"en":"The system owner or the owner's designated representative must be notified in writing"},{"en":"Disable the detectors until replacements arrive"}],"ans":[2],"ref":"NFPA 72-2022 §14.2.2.3","exp":"Section 14.2.2.3 requires that, where equipment is observed to be part of a recall program, the system owner or the owner's designated representative be notified in writing. Disabling the detectors would create an impairment, and replacing them without telling anyone leaves the owner with no record of the condition."},{"id":"itm-011","task":"1.2.2","type":"single","diff":2,"q":{"en":"During testing, a technician notes that a properly operating control unit runs an older executive software version for which the manufacturer suggests an update. The system performs its intended functions. NFPA 72-2022 classifies this as:"},"opts":[{"en":"An impairment"},{"en":"An observation, which may be communicated to the owner, who is not required to address it unless it becomes an impairment or deficiency"},{"en":"A deficiency that must be corrected within 24 hours"},{"en":"An automatic trigger for full reacceptance testing"}],"ans":[1],"ref":"NFPA 72-2022 §14.2.2.4; Ch. 3 (Observation)","exp":"The 2022 edition added the term observation: a suggested correction, improvement, or enhancement that is neither an impairment nor a deficiency. The annex gives executive software updates and manufacturer-suggested replacements as examples. Per 14.2.2.4, an observation may be communicated to the owner, who is not required to act on it."},{"id":"itm-012","task":"1.2.1","type":"single","diff":1,"q":{"en":"During the annual visual inspection of 'all equipment' (Table 14.3.1, item 1), what is the technician primarily looking for?"},"opts":[{"en":"The sensitivity value of each smoke detector"},{"en":"The loop resistance of each initiating device circuit"},{"en":"The sound pressure level in every room"},{"en":"Changes that affect equipment performance, such as building modifications, occupancy changes, obstructions, physical damage, and degree of cleanliness"}],"ans":[3],"ref":"NFPA 72-2022 Table 14.3.1, item 1","exp":"Table 14.3.1, item 1, requires an annual visual inspection of all equipment to ensure there are no changes that affect equipment performance: building modifications, occupancy or environmental changes, location, obstructions, orientation, physical damage, and degree of cleanliness. Sensitivity, loop resistance, and SPL are tests, not visual inspections."},{"id":"itm-013","task":"1.2.1","type":"single","diff":1,"freq":true,"q":{"en":"According to NFPA 72-2022 Table 14.3.1, how often must manual fire alarm boxes be visually inspected after initial acceptance?"},"opts":[{"en":"Monthly"},{"en":"Quarterly"},{"en":"Semiannually"},{"en":"Annually"}],"ans":[2],"ref":"NFPA 72-2022 Table 14.3.1, item 17(5)","exp":"Table 14.3.1 requires a semiannual visual inspection of manual fire alarm boxes, the same as heat and smoke detectors. The functional test of manual boxes is annual (Table 14.4.3.2). Do not confuse the inspection frequency with the testing frequency."},{"id":"itm-014","task":"1.2.1","type":"single","diff":2,"freq":true,"q":{"en":"In the 2022 edition of NFPA 72, what is the required visual inspection frequency for waterflow devices and supervisory signal devices (such as valve tamper switches)?"},"opts":[{"en":"Semiannually"},{"en":"Weekly"},{"en":"Monthly"},{"en":"Quarterly"}],"ans":[0],"ref":"NFPA 72-2022 Table 14.3.1, items 17(11) and 17(12)","exp":"In 2022, Table 14.3.1 changed the visual inspection of supervisory signal devices and waterflow devices from quarterly to semiannual, like most other equipment. Watch out: study material based on earlier editions still says quarterly. NFPA 25 separately governs inspections of the sprinkler system itself."},{"id":"itm-015","task":"1.2.1","type":"multi","select":2,"diff":3,"freq":true,"q":{"en":"Under NFPA 72-2022 Table 14.3.1, which TWO initiating devices still require QUARTERLY visual inspection? (Select TWO.)"},"opts":[{"en":"Radiant energy (flame) fire detectors"},{"en":"Waterflow devices"},{"en":"Video image smoke and fire detectors"},{"en":"Duct smoke detectors"},{"en":"Supervisory signal devices"}],"ans":[0,2],"ref":"NFPA 72-2022 Table 14.3.1, items 17(7) and 17(8)","exp":"Radiant energy (flame) detectors and video image smoke and fire detectors are still inspected quarterly under Table 14.3.1: verify that no point requiring detection is obstructed or outside the detector's field of view. In 2022, waterflow and supervisory devices moved to semiannual, and duct smoke detectors (in general) are semiannual."},{"id":"itm-016","task":"1.2.1","type":"single","diff":2,"freq":true,"q":{"en":"For a fire alarm system monitored for alarm, supervisory, and trouble signals, how often must the control unit fuses, lamps/LEDs, and primary (main) power supply be visually inspected?"},"opts":[{"en":"Weekly"},{"en":"Annually"},{"en":"Monthly"},{"en":"Semiannually"}],"ans":[1],"ref":"NFPA 72-2022 Table 14.3.1, item 2(1)","exp":"For a system monitored for alarm, supervisory, and trouble signals, Table 14.3.1 sets an annual visual inspection for fuses, interfaced equipment, lamps/LEDs, and the primary power supply; trouble signals are inspected semiannually. If the system is not monitored, all of these become weekly, because no one else would see a trouble."},{"id":"itm-017","task":"1.2.1","type":"single","diff":2,"freq":true,"q":{"en":"An existing fire alarm system is NOT monitored for alarm, supervisory, or trouble signals by any off-site location. Per NFPA 72-2022, how often must its control unit fuses, interfaced equipment, lamps/LEDs, primary power supply, and trouble signals be visually inspected?"},"opts":[{"en":"Daily"},{"en":"Monthly"},{"en":"Quarterly"},{"en":"Weekly"}],"ans":[3],"ref":"NFPA 72-2022 Table 14.3.1, item 2(2)","exp":"Table 14.3.1, item 2(2), requires a weekly visual inspection of the control unit on systems not monitored for alarm, supervisory, and trouble signals. Without off-site monitoring, a trouble could go unnoticed for a long time, which is why the frequency is much higher than the annual inspection of a monitored system."},{"id":"itm-018","task":"1.2.1","type":"single","diff":3,"q":{"en":"Per NFPA 72-2022 Table 14.3.1, what must be verified SEMIANNUALLY on each valve-regulated lead-acid (VRLA) battery cell/unit?"},"opts":[{"en":"The specific gravity of the electrolyte"},{"en":"The marking of the month/year of manufacture, replacing any unit whose alarm equipment manufacturer's replacement date has been exceeded"},{"en":"That the battery is less than 2 years old"},{"en":"The electrolyte level in each cell"}],"ans":[1],"ref":"NFPA 72-2022 Table 14.3.1, item 9(1)(b)","exp":"Table 14.3.1 requires a semiannual check that each VRLA cell/unit is marked with the month and year of manufacture, and replacement of any unit past the alarm equipment manufacturer's replacement date. VRLA batteries are sealed: electrolyte level and specific gravity apply to vented batteries, which now follow the manufacturer's instructions or IEEE 450."},{"id":"itm-019","task":"1.2.1","type":"single","diff":1,"freq":true,"q":{"en":"According to NFPA 72-2022 Table 14.4.3.2, how often must manual fire alarm boxes be functionally tested?"},"opts":[{"en":"Annually"},{"en":"Semiannually"},{"en":"Every 2 years"},{"en":"Every 5 years"}],"ans":[0],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(5)","exp":"Table 14.4.3.2 requires manual fire alarm boxes to be tested annually, operated per the manufacturer's published instructions. Both key-operated presignal boxes and general alarm boxes must be tested. The visual inspection is semiannual (Table 14.3.1)."},{"id":"itm-020","task":"1.2.1","type":"single","diff":1,"freq":true,"q":{"en":"How often must system smoke detectors (other than in one- and two-family dwellings) receive a functional test per NFPA 72-2022?"},"opts":[{"en":"Quarterly"},{"en":"Semiannually"},{"en":"Every alternate year"},{"en":"Annually"}],"ans":[3],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(7)(a)","exp":"The functional test (smoke entry and alarm response) is annual per Table 14.4.3.2. Do not confuse it with sensitivity testing (14.4.4.3), which is done within 1 year after installation and then every alternate year, with a possible extension to 5 years."},{"id":"itm-021","task":"1.2.1","type":"single","diff":1,"freq":true,"q":{"en":"How often does NFPA 72-2022 require mechanical, electrosonic, or pressure-type waterflow alarm devices to be tested?"},"opts":[{"en":"Monthly"},{"en":"Quarterly"},{"en":"Semiannually"},{"en":"Annually"}],"ans":[2],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(11)","exp":"Table 14.4.3.2 sets a semiannual test for waterflow devices, flowing water through the inspector's test connection (or using the bypass connection on dry-pipe, preaction, or deluge systems per NFPA 25). NFPA 25 governs the sprinkler side and may require other frequencies for its own equipment."},{"id":"itm-022","task":"1.2.1","type":"single","diff":3,"freq":true,"q":{"en":"Which supervisory initiating device must be tested SEMIANNUALLY under NFPA 72-2022 Table 14.4.3.2? (The other devices listed are tested annually.)"},"opts":[{"en":"High- or low-air pressure switch"},{"en":"Control valve switch"},{"en":"Room temperature switch"},{"en":"Water level switch"}],"ans":[1],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(10)","exp":"In Table 14.4.3.2, item 17(10), the control valve switch is tested semiannually. High- or low-air pressure, steam pressure, room temperature, water level, and water temperature switches are tested annually. A common trap: not all supervisory devices have the same frequency."},{"id":"itm-023","task":"1.2.1","type":"single","diff":1,"freq":true,"q":{"en":"A technician tests an OS&Y valve tamper switch. The supervisory signal is not received until the handwheel has been turned five full revolutions. What is the correct conclusion?"},"opts":[{"en":"Not acceptable; the signal must be received within the first two revolutions of the handwheel or within one-fifth of the travel distance (or per the manufacturer's published instructions)"},{"en":"Acceptable, as long as the signal is received before the valve is fully closed"},{"en":"Acceptable, because the limit is five revolutions"},{"en":"Not acceptable; the signal must be received within the first one-quarter revolution"}],"ans":[0],"ref":"NFPA 72-2022 Table 14.4.3.2, item 17(10)(a)","exp":"Table 14.4.3.2 requires the signal to be received within the first
