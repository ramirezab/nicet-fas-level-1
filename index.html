ng>CO (§17.12):</strong> listed (for example, UL 2075); on the ceiling of the room with permanently installed fuel-burning appliances and in the other locations the code requires, always per the manufacturer.</li>\n</ul>\n\n<h3>Waterflow and supervisory devices (§17.13 and §17.17)</h3>\n<table>\n<thead><tr><th>Device</th><th>Requirement</th></tr></thead>\n<tbody>\n<tr><td>Waterflow (alarm signal)</td><td>Activate within 90 s of the flow from one sprinkler of the smallest orifice; surges must not cause an alarm</td></tr>\n<tr><td>Control valve (tamper)</td><td>Signal within the first 2 revolutions of the handwheel or 1/5 of the travel; restores only at the normal position</td></tr>\n<tr><td>Pressure (dry pipe, pressure tank)</td><td>Signal when pressure rises or falls 10 psi (70 kPa)</td></tr>\n<tr><td>Water level</td><td>Pressure tank: rise or fall of 3 in.; other tanks: fall of 12 in.</td></tr>\n<tr><td>Water or room temperature</td><td>Signal when it drops to 40°F (4.4°C) and restoral above 40°F</td></tr>\n</tbody>\n</table>\n<p>Vane-type (paddle) switches are for wet-pipe systems; dry-pipe, preaction, and deluge systems use a pressure switch. The retard must never push activation past 90 s.</p>\n\n<h3>Manual fire alarm boxes (§17.15)</h3>\n<ul>\n<li>Operable part between <strong>42 in. and 48 in.</strong> above the floor.</li>\n<li>Within <strong>60 in. (5 ft)</strong> of the exit doorway at each exit on each floor.</li>\n<li>Grouped openings over 40 ft wide: boxes on both sides, each within 60 in. of its side.</li>\n<li>Travel distance to the nearest box: <strong>200 ft</strong> maximum on the same floor.</li>\n<li>Securely mounted, unobstructed, used only for fire alarm; listed protective covers are permitted.</li>\n</ul>\n\n<h3>Testing and replacement (Ch. 14)</h3>\n<ul>\n<li><strong>Smoke detector sensitivity (§14.4.4.3):</strong> within 1 year after installation and then every alternate year; after the second test within range, the interval may be extended up to 5 years. Never with unmeasured aerosol. Out of range: clean and recalibrate, or replace.</li>\n<li><strong>Smoke functional test (Table 14.4.3.2):</strong> annual, in place, with smoke or a listed aerosol acceptable to the manufacturer.</li>\n<li><strong>Nonrestorable heat detectors:</strong> never heat-tested; at 15 years, replace all or send 2 per 100 to a laboratory.</li>\n<li><strong>Waterflow:</strong> through the inspector's test connection. <strong>Tamper:</strong> count turns and verify restoration.</li>\n<li><strong>Duct detectors:</strong> besides the alarm, verify the detector is sampling the airstream (differential pressure per the manufacturer).</li>\n<li><strong>Replacements:</strong> a device listed and compatible with the panel (§10.3.3), the same programmed address, and reacceptance testing (§14.4.2).</li>\n</ul>\n\n<div class=\"callout warn\"><strong>Common traps:</strong> (1) the 4-in. rule is for heat detectors, not smoke; (2) the 12 in. is measured to the <em>top</em> of a smoke detector; (3) 0.7S of 30 ft is 21 ft and S/2 is 15 ft; (4) the height reduction starts only above 10 ft; (5) tamper = supervisory signal, waterflow = alarm signal; (6) manual box height is measured to the operable part, not the center of the box; (7) the 36 in. from diffusers is annex material: the mandatory rule is that airflow must not prevent operation; (8) canned aerosol tests function, not sensitivity.</div>\n\n<h3>Finding it fast in the printed code book</h3>\n<ul>\n<li>Every section number starts with its chapter: anything 17.x is in Chapter 17 (initiating devices), 14.x in Chapter 14 (ITM). Use the chapter tabs to land in the right chapter, then follow the numbers.</li>\n<li>Useful index entries at the back of NFPA 72: \"Heat detectors\", \"Smoke detectors\", \"Duct smoke detectors\", \"Air sampling-type detectors\", \"Manual fire alarm boxes\", \"Waterflow alarm-initiating devices\", \"Supervisory signal-initiating devices\", \"Sensitivity testing\".</li>\n<li>Recommended permanent tabs: Table 17.6.2.1, Table 17.6.3.5.1, §17.7.4.2, §17.7.6, §17.13, §17.15, §17.17, §14.4.4.3, and Table 14.4.3.2. Highlight the key numbers (4 in., 12 in., 30 ft, 0.7S, 90 s, 42–48 in., 2 revolutions) on those pages.</li>\n<li>Question clues: \"sensitivity\" → §14.4.4.3; \"test method\" or \"frequency\" → Table 14.4.3.2; \"located\", \"mounted\", or \"spacing\" → Chapter 17; \"shop drawings\" → Chapter 7.</li>\n<li>An asterisk (*) next to a section number means there is explanatory material in Annex A (A.17...). The annex explains the reason but is not mandatory; the answer comes from the body of the code.</li>\n</ul>\n","tabs":[{"ref":"NFPA 72 §17.4","what":"General requirements: protection, independent support, accessibility"},{"ref":"NFPA 72 §17.6.2 / Table 17.6.2.1","what":"Heat detector temperature classes and color codes; 20°F rule"},{"ref":"NFPA 72 §17.6.3.1","what":"Heat detectors on smooth ceilings: spacing S, 0.7S, and 4 in. / 12 in. location"},{"ref":"NFPA 72 §17.6.3.2 – §17.6.3.4","what":"Heat: solid joists (50 percent), beams, and sloped ceilings (36 in. from the peak)"},{"ref":"NFPA 72 Table 17.6.3.5.1","what":"Heat detector spacing reduction for ceiling height (above 10 ft)"},{"ref":"NFPA 72 §17.7.1","what":"Smoke: environmental conditions (32–100°F, 93 percent RH, 300 ft/min)"},{"ref":"NFPA 72 §17.7.2","what":"Protection of detectors during construction"},{"ref":"NFPA 72 §17.7.4.2","what":"Spot-type smoke: location (12 in.), 30 ft / 0.7S spacing, beams and joists"},{"ref":"NFPA 72 §17.7.4.6 / §17.7.4.7","what":"Air-sampling (120 s) and projected beam detectors"},{"ref":"NFPA 72 §17.7.5","what":"HVAC: do not locate where airflow prevents operation"},{"ref":"NFPA 72 §17.7.6","what":"Duct detectors and door release detectors"},{"ref":"NFPA 72 Table 17.7.7.3.3.2","what":"Smoke detector spacing in high air movement areas"},{"ref":"NFPA 72 §17.8 / §17.9","what":"Flame detectors; combination, multi-criteria, and multi-sensor detectors"},{"ref":"NFPA 72 §17.12","what":"Carbon monoxide (CO) detectors"},{"ref":"NFPA 72 §17.13","what":"Sprinkler waterflow: activation within 90 s"},{"ref":"NFPA 72 §17.15","what":"Manual boxes: 42–48 in., 5 ft from the exit, 200 ft travel"},{"ref":"NFPA 72 §17.17","what":"Supervisory: valves (2 revolutions or 1/5), pressure, level, and temperature"},{"ref":"NFPA 72 §14.4.4.3","what":"Smoke detector sensitivity testing"},{"ref":"NFPA 72 Table 14.4.3.2","what":"Test methods and frequencies for initiating devices"}],"glossary":[{"en":"Initiating device","def":"A component that originates an alarm, supervisory, or trouble signal when it detects a condition (detector, manual box, waterflow or valve switch)."},{"en":"Spot-type detector","def":"A detector whose sensing element is concentrated at one point, like most ceiling smoke and heat detectors."},{"en":"Listed spacing","def":"The maximum spacing between heat detectors determined by the listing laboratory and published by the manufacturer (the S value)."},{"en":"Nominal spacing","def":"For spot-type smoke detectors on smooth ceilings, 30 ft (9.1 m) between detectors."},{"en":"Smooth ceiling","def":"A ceiling without continuous projections (beams, joists) that obstruct the flow of smoke or heat beyond what NFPA 72 allows."},{"en":"Solid joist construction","def":"A ceiling with solid members projecting down at close intervals; reduces heat detector spacing to 50 percent at right angles to the joists."},{"en":"Beam pocket","def":"The ceiling area between two beams; deep beams may require a smoke detector in each pocket."},{"en":"Fixed-temperature detector","def":"Responds when its sensing element reaches a preset temperature (for example, 135°F or 194°F)."},{"en":"Rate-of-rise detector","def":"Responds when the temperature rises faster than a preset rate, typically about 15°F per minute."},{"en":"Rate-compensation detector","def":"Responds when the surrounding air reaches a preset level regardless of the rate of rise, compensating for thermal lag."},{"en":"Ionization smoke detection","def":"A principle that uses a small radioactive source to ionize the air; smoke reduces the ion current and causes an alarm."},{"en":"Photoelectric light-scattering detection","def":"Smoke entering the chamber scatters light onto a photosensor; responds well to smoldering fires with large particles."},{"en":"Projected beam-type detector","def":"A line-type smoke detector that measures the reduction (obscuration) of a light beam between a transmitter and a receiver or reflector."},{"en":"Air-sampling-type detector","def":"A system that draws air through a network of sampling pipes to a central detector; each sampling port counts as a spot-type detector."},{"en":"Duct smoke detector","def":"A detector listed to sample the air inside an HVAC duct, used to control the spread of smoke."},{"en":"Radiant energy-sensing fire detector","def":"A detector that responds to radiation (ultraviolet or infrared) from a flame or spark; requires line of sight."},{"en":"Stratification","def":"When smoke stops rising because it has cooled to the temperature of the surrounding air, so it does not reach the ceiling."},{"en":"Waterflow switch","def":"An alarm-initiating device that detects water flowing in a sprinkler system (vane or pressure type)."},{"en":"Retard","def":"A waterflow switch setting that prevents alarms from pressure surges; total activation must still occur within 90 s."},{"en":"Valve supervisory switch (tamper switch)","def":"A device that sends a supervisory signal when a sprinkler control valve moves from its normal position."},{"en":"Supervisory signal","def":"A signal indicating an off-normal condition in a fire protection system that needs action (closed valve, low pressure), not a fire."},{"en":"Manual fire alarm box (pull station)","def":"An initiating device operated by a person to send a fire alarm."},{"en":"Mechanical guard","def":"Impact protection for a detector; it must be listed for use with that detector."},{"en":"End-of-line device (EOL)","def":"A resistor or other device at the end of a Class B circuit that allows the wiring to be monitored for integrity."},{"en":"Sensitivity test","def":"A calibrated measurement that verifies a smoke detector is within its listed and marked sensitivity range."}]},"questions":[{"id":"init-001","task":"1.1.1","type":"single","diff":1,"freq":true,"q":{"en":"According to NFPA 72-2022, in the absence of a performance-based design, what is the nominal spacing between spot-type smoke detectors on a smooth ceiling?"},"opts":[{"en":"15 ft (4.6 m)"},{"en":"21 ft (6.4 m)"},{"en":"30 ft (9.1 m)"},{"en":"50 ft (15.2 m)"}],"ans":[2],"ref":"NFPA 72-2022 §17.7.4.2.3.1","exp":"On smooth ceilings, spot-type smoke detectors are spaced at a nominal 30 ft (9.1 m) and must be within one-half of that (15 ft) of the walls, measured at right angles (§17.7.4.2.3.1). 21 ft is the alternate 0.7S method, and 50 ft is a typical listed spacing for heat detectors, not smoke detectors."},{"id":"init-002","task":"1.1.1","type":"single","diff":2,"freq":true,"q":{"en":"A technician is checking spot-type smoke detector locations in an irregularly shaped room with a smooth ceiling. Using the 0.7S method with the nominal 30 ft spacing, what is the maximum distance allowed from any point on the ceiling to the nearest detector?"},"opts":[{"en":"15 ft"},{"en":"21 ft"},{"en":"25 ft"},{"en":"30 ft"}],"ans":[1],"ref":"NFPA 72-2022 §17.7.4.2.3.1(2)","exp":"With the alternate method, every point on the ceiling must be within 0.7 × 30 ft = 21 ft (6.4 m) of a detector (§17.7.4.2.3.1(2)). It is especially useful in corridors and irregular areas. 15 ft is the maximum distance to a wall with the standard method (S/2)."},{"id":"init-003","task":"1.1.1","type":"single","diff":1,"freq":true,"q":{"en":"A technician mounts a spot-type smoke detector on a sidewall so that the top of the detector is 14 in. below a smooth ceiling. What should be done?"},"opts":[{"en":"Leave it; sidewall smoke detectors are acceptable anywhere within the top 18 in. of the wall"},{"en":"Leave it, but reduce the spacing of the adjacent detectors by one-half"},{"en":"Lower it so the top of the detector is between 4 in. and 20 in. below the ceiling"},{"en":"Relocate it so the top of the detector is not more than 12 in. below the ceiling, or move it to the ceiling"}],"ans":[3],"ref":"NFPA 72-2022 §17.7.4.2.1","exp":"Spot-type smoke detectors go on the ceiling or, if on a sidewall, between the ceiling and 12 in. (300 mm) below it, measured to the top of the detector (§17.7.4.2.1). At 14 in. the detector is outside the permitted zone and must be relocated. The old 4-in. 'dead air space' rule no longer applies to smoke detectors, but it still applies to heat detectors."},{"id":"init-004","task":"1.1.1","type":"single","diff":2,"freq":true,"q":{"en":"A spot-type heat detector with a listed spacing of 50 ft is installed on a smooth, flat ceiling 9 ft high. Using the listed-spacing method (not the 0.7S method), what is the maximum distance from a detector to a sidewall, measured at right angles?"},"opts":[{"en":"35 ft"},{"en":"25 ft"},{"en":"50 ft"},{"en":"12.5 ft"}],"ans":[1],"ref":"NFPA 72-2022 §17.6.3.1.1","exp":"Under §17.6.3.1.1, heat detectors must be no farther apart than their listed spacing (S), and there must be a detector within S/2 of all walls (and of partitions extending to within the top 15 percent of the ceiling height), measured at right angles: 50 ÷ 2 = 25 ft. 35 ft is 0.7S, used only with the alternate 'every point on the ceiling' method, and a 9-ft ceiling needs no Table 17.6.3.5.1 reduction."},{"id":"init-005","task":"1.1.1","type":"multi","select":2,"diff":2,"q":{"en":"Which TWO of the following locations comply with NFPA 72-2022 for a spot-type heat detector on a smooth, flat ceiling? (Select TWO.)"},"opts":[{"en":"On the ceiling, 6 in. from the nearest sidewall"},{"en":"On the ceiling, 2 in. from the nearest sidewall"},{"en":"On the sidewall, with the top of the detector 8 in. below the ceiling"},{"en":"On the sidewall, with the top of the detector 2 in. below the ceiling"},{"en":"On the sidewall, with the top of the detector 16 in. below the ceiling"}],"ans":[0,2],"ref":"NFPA 72-2022 §17.6.3.1.3","exp":"Heat detector rule: on the ceiling 4 in. or more from the wall, or on the sidewall between 4 in. and 12 in. below the ceiling (§17.6.3.1.3). 6 in. on the ceiling and 8 in. on the wall comply. At 2 in. (ceiling or wall) the detector sits in the dead air space at the corner, and at 16 in. it is too low to receive heat from the ceiling jet."},{"id":"init-006","task":"1.1.1","type":"single","diff":1,"freq":true,"q":{"en":"A fixed-temperature spot-type heat detector rated 190°F (88°C) falls in the intermediate classification. Per NFPA 72 Table 17.6.2.1, what color code identifies it?"},"opts":[{"en":"Uncolored"},{"en":"Blue"},{"en":"White"},{"en":"Green"}],"ans":[2],"ref":"NFPA 72-2022 §17.6.2, Table 17.6.2.1","exp":"Table 17.6.2.1: ordinary 135–174°F = uncolored; intermediate 175–249°F = white; high 250–324°F = blue; extra high 325–399°F = red; very extra high 400–499°F = green; ultra high 500–575°F = orange. A 190°F detector is intermediate, so it is white."},{"id":"init-007","task":"1.1.1","type":"single","diff":2,"freq":true,"q":{"en":"A heat detector will be installed in an unconditioned attic where the maximum expected ceiling temperature is 150°F (66°C). Which fixed-temperature rating is the appropriate choice?"},"opts":[{"en":"135°F (ordinary classification)"},{"en":"160°F (ordinary classification)"},{"en":"117°F (low classification)"},{"en":"194°F (intermediate classification)"}],"ans":[3],"ref":"NFPA 72-2022 §17.6.2, Table 17.6.2.1","exp":"The detector's rating must be at least 20°F (11°C) above the maximum expected ceiling temperature (§17.6.2, Table 17.6.2.1). With 150°F you need 170°F or more, which puts you in the intermediate class (175–249°F, white): 194°F is correct. 135°F and 160°F are too close to the ambient, and 117°F (low) is only for controlled environments."},{"id":"init-008","task":"1.1.1","type":"single","diff":3,"freq":true,"q":{"en":"A spot-type heat detector has a listed spacing of 50 ft. It will be installed on a smooth, flat ceiling 15 ft above the floor. Using NFPA 72 Table 17.6.3.5.1, what is the maximum spacing between detectors?"},"opts":[{"en":"42 ft"},{"en":"38.5 ft"},{"en":"50 ft"},{"en":"35.5 ft"}],"ans":[1],"ref":"NFPA 72-2022 §17.6.3.5.1, Table 17.6.3.5.1","exp":"On ceilings higher than 10 ft, the listed spacing is reduced by the multiplier in Table 17.6.3.5.1. For more than 14 ft up to 16 ft the factor is 0.77: 50 × 0.77 = 38.5 ft. The 0.84 factor (42 ft) is for 12–14 ft and 0.71 (35.5 ft) for 16–18 ft; up to 10 ft there is no reduction."},{"id":"init-009","task":"1.1.1","type":"single","diff":3,"q":{"en":"A heat detector with a 50 ft listed spacing is installed on a 9 ft high ceiling of solid joist construction. What is the maximum spacing measured at right angles (perpendicular) to the joists?"},"opts":[{"en":"25 ft"},{"en":"33 ft"},{"en":"35 ft"},{"en":"50 ft"}],"ans":[0],"ref":"NFPA 72-2022 §17.6.3.2","exp":"On solid joist construction, heat detector spacing measured at right angles to the joists must not exceed 50 percent of the smooth-ceiling spacing: 50 × 0.5 = 25 ft (§17.6.3.2). The full spacing is used parallel to the joists, and at 9 ft Table 17.6.3.5.1 does not apply. 33 ft (2/3) is the beam-construction rule."},{"id":"init-010","task":"1.1.1","type":"single","diff":2,"freq":true,"q":{"en":"On a peaked (gabled) ceiling, where must the first row of spot-type detectors be located?"},"opts":[{"en":"Within 12 in. of the peak, measured along the slope"},{"en":"At least 4 in. below the peak, measured vertically, on each sloping side"},{"en":"Within 36 in. (910 mm) of the peak, measured horizontally"},{"en":"Within 36 in. of the low side (eave) of the ceiling"}],"ans":[2],"ref":"NFPA 72-2022 §17.6.3.4 and §17.7.4","exp":"On peaked ceilings, a row of detectors is first located within 36 in. (910 mm) of the peak, measured horizontally; additional detectors are spaced on the horizontal projection of the ceiling (§17.6.3.4 for heat, §17.7.4 for smoke). On shed (single-slope) ceilings the row goes within 36 in. of the high side."},{"id":"init-011","task":"1.1.1","type":"single","diff":1,"q":{"en":"A rate-of-rise heat detector typically initiates an alarm when the temperature at the detector rises faster than about:"},"opts":[{"en":"5°F (2.8°C) per minute"},{"en":"50°F (28°C) per minute"},{"en":"1°F (0.6°C) per minute"},{"en":"15°F (8.3°C) per minute"}],"ans":[3],"ref":"NFPA 72-2022 Ch. 3 (definition) and manufacturer's instructions (UL 521)","exp":"A rate-of-rise detector responds when the temperature rises faster than a preset rate; manufacturers typically set it at about 15°F/min (8.3°C/min). That is why it can false-alarm near ovens, loading doors, or heaters that cause sudden temperature changes. Many models combine rate-of-rise with a fixed-temperature element (for example, 135°F)."},{"id":"init-012","task":"1.1.1","type":"multi","select":2,"diff":2,"freq":true,"q":{"en":"Unless a smoke detector is specifically designed and listed for the expected conditions, NFPA 72 prohibits installing it where which TWO of the following ambient conditions exist? (Select TWO.)"},"opts":[{"en":"Ambient temperature of 105°F (41°C)"},{"en":"Ambient temperature of 50°F (10°C)"},{"en":"Relative humidity of 85 percent"},{"en":"Relative humidity of 95 percent"},{"en":"Air velocity of 250 ft/min (1.3 m/s)"}],"ans":[0,3],"ref":"NFPA 72-2022 §17.7.1","exp":"Unless designed and listed for those conditions, smoke detectors are not installed where the temperature is below 32°F (0°C) or above 100°F (38°C), relative humidity exceeds 93 percent, or air velocity exceeds 300 ft/min (1.5 m/s) (§17.7.1). 105°F and 95 percent RH exceed the limits; 50°F, 85 percent, and 250 ft/min are within them."},{"id":"init-013","task":"1.1.1","type":"single","diff":2,"q":{"en":"While installing a spot-type smoke detector on a box fed by conduit, a technician notices air flowing out of the conduit and through openings in the back of the detector. What does NFPA 72-2022 require?"},"opts":[{"en":"Nothing; airflow through the base helps draw smoke into the sensing chamber"},{"en":"Cover the holes in the back of the detector with a gasket, sealant, or equivalent so airflow does not prevent smoke entry"},{"en":"Move the detector at least 36 in. away from the conduit box"},{"en":"Replace the conduit with nonmetallic cable"}],"ans":[1],"ref":"NFPA 72-2022 §17.7.7.1.2","exp":"Holes in the back of the detector must be covered with a gasket, sealant, or equivalent, and the detector must be mounted so that airflow from the box or conduit does not prevent smoke from entering during a fire or test (§17.7.7.1.2). That airflow also carries dust and insects that contaminate the chamber."},{"id":"init-014","task":"1.1.1","type":"single","diff":1,"freq":true,"q":{"en":"Smoke detection is NOT required to be in service during construction of a new building. When may the spot-type smoke detectors be installed?"},"opts":[{"en":"As soon as the ceiling grid is installed"},{"en":"Before drywall sanding begins, provided dust covers are installed"},{"en":"Only after all other construction trades have completed cleanup"},{"en":"At any time, provided they are vacuumed before the acceptance test"}],"ans":[2],"ref":"NFPA 72-2022 §17.7.2","exp":"Where detection is not required during construction, detectors are not installed until all other construction trades have completed cleanup (§17.7.2). Construction dust contaminates the chamber and shifts sensitivity. If the AHJ requires detection during construction, the detectors are protected and then cleaned and verified, or replaced, before the final acceptance test."},{"id":"init-015","task":"1.1.1","type":"multi","select":2,"diff":1,"q":{"en":"Which TWO of the following are general requirements of NFPA 72-2022 Section 17.4 that apply to all initiating devices? (Select TWO.)"},"opts":[{"en":"Devices must be red in color"},{"en":"Devices must be supported independently of their attachment to the circuit conductors"},{"en":"Devices must be mounted between 42 in. and 48 in. above the floor"},{"en":"Devices must be connected only to Class A circuits"},{"en":"Devices must be installed so they are accessible for periodic inspection, testing, and maintenance"}],"ans":[1,4],"ref":"NFPA 72-2022 §17.4","exp":"Section 17.4 requires, for every initiating device: protection where subject to mechanical damage (with a guard listed for that detector), support independent of the circuit conductors (never hanging by its wires), and installation that keeps it accessible for inspection, testing, and maintenance. The 42–48 in. height applies only to manual fire alarm boxes (§17.15), and 17.4 does not set the circuit class."},{"id":"init-016","task":"1.1.1","type":"single","diff":2,"q":{"en":"Smoke detectors in a school gymnasium keep getting hit by balls. If wire guards are installed over the detectors, what does NFPA 72 require?"},"opts":[{"en":"Guards are not permitted; the smoke detectors must be replaced with heat detectors"},{"en":"Any metal guard with at least 50 percent open area may be used"},{"en":"The detector spacing must be reduced by one-third wherever guards are used"},{"en":"The guard must be listed for use with that detector"}],"ans":[3],"ref":"NFPA 72-2022 §17.4","exp":"Where an initiating device is subject to mechanical damage it must be protected, and a mechanical guard used on a smoke, heat, or radiant energy-sensing detector must be listed for use with that detector (§17.4). An unlisted guard can change how smoke or heat reaches the sensor and delay the response."},{"id":"init-017","task":"1.1.1","type":"single","diff":2,"freq":true,"q":{"en":"Where the detection of smoke in the supply air system is required, where must the duct smoke detector be located?"},"opts":[{"en":"In the supply air duct downstream of both the fan and the filters"},{"en":"In the supply air duct upstream of the filters"},{"en":"In the return air duct within 36 in. of the fan"},{"en":"On the ceiling of the mechanical room"}],"ans":[0],"ref":"NFPA 72-2022 §17.7.6","exp":"Where other standards require supply-side detection (for example, NFPA 90A or the mechanical code), a detector listed for the air velocity present is installed in the supply duct downstream of both the fan and the filters (§17.7.6). That way it detects smoke produced by the unit itself before it is distributed. On the return side, detectors go where the air leaves each smoke compartment or ahead of the common return."},{"id":"init-018","task":"1.1.1","type":"single","diff":2,"freq":true,"q":{"en":"An in-duct smoke detector is installed above a hard-lid ceiling, 14 ft above the finished floor, where its alarm indicator cannot be seen by responding personnel. What does NFPA 72 require?"},"opts":[{"en":"A second duct detector on the same duct, within 10 ft of the first"},{"en":"Nothing, as long as the control unit identifies the detector's address"},{"en":"A remote alarm or supervisory indicator in a location acceptable to the AHJ"},{"en":"Relocation of the detector to within 6 ft of the floor"}],"ans":[2],"ref":"NFPA 72-2022 §17.7.6.5","exp":"Duct detectors installed in concealed locations more than 10 ft (3 m) above the finished floor, or where their indicator is not visible to responding personnel, must have remote alarm or supervisory indication in a location acceptable to the AHJ (§17.7.6.5). Typically a remote indicator (LED) station labeled with the equipment served is installed."},{"id":"init-019","task":"1.1.1","type":"single","diff":1,"q":{"en":"An owner asks whether the duct smoke detectors in the HVAC return can count as the open-area smoke detection required for an office floor. According to NFPA 72, the answer is:"},"opts":[{"en":"Yes, if the air-handling system runs continuously"},{"en":"Yes, if one duct detector is provided for each 900 ft² of floor served"},{"en":"Yes, if the duct detectors are the ionization type"},{"en":"No; duct smoke detectors are not a substitute for open-area smoke detection"}],"ans":[3],"ref":"NFPA 72-2022 §17.7.6","exp":"Duct detectors are used to control the spread of smoke (shut down fans, close dampers); they are not a substitute for open-area protection (§17.7.6). With the air handler off, or with the smoke diluted by the airstream, they would not detect a fire in the space."},{"id":"init-020","task":"1.1.1","type":"single","diff":3,"q":{"en":"For an air-sampling-type smoke detection system, each sampling port is treated as a spot-type detector for spacing. What is the maximum air sample transport time from the farthest sampling port to the detector?"},"opts":[{"en":"60 seconds"},{"en":"120 seconds"},{"en":"90 seconds"},{"en":"180 seconds"}],"ans":[1],"ref":"NFPA 72-2022 §17.7.4.6","exp":"In air-sampling detection (ASD), each sampling port is treated as a spot-type detector for location and spacing, and the maximum transport time from the farthest port to the detector must not exceed 120 seconds (§17.7.4.6). The pipe network is supported by computer-based design calculations and is labeled as smoke detector sampling piping."},{"id":"init-021","task":"1.1.1","type":"single","diff":2,"q":{"en":"A technician is installing the transmitter and receiver of a projected beam-type smoke detector in a warehouse. Which practice is required by NFPA 72?"},"opts":[{"en":"Mount them on flexible brackets so they move with the building structure"},{"en":"Use mirrors to exceed the listed maximum beam length by up to 10 percent"},{"en":"Mount them on stable surfaces and keep the light path clear of opaque obstructions"},{"en":"Route the beam where forklift masts periodically interrupt it to verify supervision"}],"ans":[2],"ref":"NFPA 72-2022 §17.7.4.7","exp":"Projected beam detectors and their mirrors must be mounted on stable surfaces to prevent false or erratic operation caused by movement; the beam path is kept clear of opaque obstructions, and the beam length may not exceed the listed maximum (§17.7.4.7). Everything is installed per the manufacturer's published instructions."},{"id":"init-022","task":"1.1.1","type":"single","diff":1,"q":{"en":"A projected beam-type smoke detector senses smoke by which principle?"},"opts":[{"en":"Ionization of air by a small radioactive source"},{"en":"Light obscuration (reduction of the light reaching the receiver)"},{"en":"Light scattering inside a dark sensing chamber"},{"en":"Rate of temperature rise"}],"ans":[1],"ref":"NFPA 72-2022 Ch. 3 (definitions) and §17.7.4.7","exp":"A projected beam detector uses light obscuration: smoke between the transmitter and the receiver reduces the light received. A spot-type photoelectric detector normally uses light scattering inside a dark chamber, and an ionization detector uses a small radioactive source."},{"id":"init-023","task":"1.1.1","type":"multi","select":2,"diff":2,"q":{"en":"Which TWO statements about smoke detection principles are correct? (Select TWO.)"},"opts":[{"en":"Ionization detectors generally respond faster than photoelectric detectors to smoldering fires with large smoke particles"},{"en":"Ionization detectors use a small radioactive source to ionize the air between two charged electrodes"},{"en":"Photoelectric light-scattering detectors use americium-241 to sense smoke"},{"en":"Photoelectric light-scattering detectors generally respond faster to smoldering fires that produce larger, visible particles"},{"en":"Both types respond only to heat, not to smoke particles"}],"ans":[1,3],"ref":"NFPA 72-2022 Ch. 3 and Annex A.17.7; Bukowski","exp":"Ionization: a small radioactive source (americium-241) ionizes the air in the chamber, and smoke particles reduce the ion current; it responds best to flaming fires with small particles. Photoelectric light-scattering: smoke reflects light onto a photosensor; it responds best to smoldering fires with larger, visible particles."},{"id":"init-024","task":"1.1.1","type":"single","diff":3,"q":{"en":"A level ceiling is 12 ft high and has beams that project 10 in. below the ceiling. According to NFPA 72-2022, how may spot-type smoke detectors be spaced?"},"opts":[{"en":"Smooth ceiling spacing is permitted because the beam depth is less than 10 percent of the ceiling height"},{"en":"A detector is required in every beam pocket because the beams are deeper than 4 in."},{"en":"Spacing perpendicular to the beams must be reduced to one-half of smooth ceiling spacing"},{"en":"Spacing must be reduced to two-thirds of smooth ceiling spacing in both directions"}],"ans":[0],"ref":"NFPA 72-2022 §17.7.4.2.4","exp":"For smoke detectors on level beamed ceilings: if the beam depth is less than 10 percent of the ceiling height (0.1H), smooth-ceiling spacing is permitted, with detectors on the ceiling or on the bottom of the beams (§17.7.4.2.4). Here 0.1 × 144 in. = 14.4 in., and the beam is 10 in. If the beams were 0.1H or deeper and spaced 0.4H or more apart, a detector would go in each beam pocket. The 4-in. and 2/3 beam rules are for heat detectors."},{"id":"init-025","task":"1.1.1","type":"single","diff":2,"q":{"en":"A flame (radiant energy-sensing) detector is listed to detect a specified fire size at a given distance on its optical axis. The hazard it protects is located well off that axis. What does NFPA 72 require?"},"opts":[{"en":"No change; flame detectors have a 360-degree field of view"},{"en":"Reduce the distance or add detectors to compensate for the angular displacement, per the manufacturer's published instructions"},{"en":"Raise the detector's sensitivity setting to the maximum"},{"en":"Space the detectors using the 0.7S rule with S = 30 ft"}],"ans":[1],"ref":"NFPA 72-2022 §17.8.3.2.3","exp":"Radiant energy detectors need a line of sight to the hazard. If a fire can occur off the optical axis, the distance must be reduced or detectors added to compensate for the angular displacement, per the manufacturer's published instructions (§17.8.3.2.3). Their placement is based on field of view and listed distance, not on the 30-ft smoke detector spacing."},{"id":"init-026","task":"1.1.1","type":"single","diff":2,"q":{"en":"A combination smoke/heat detector is being installed. According to NFPA 72, how are its location and spacing determined?"},"opts":[{"en":"Only the smoke sensor requires a listing; the heat sensor always uses 30 ft spacing"},{"en":"It uses the spacing of whichever sensor has the larger listed spacing"},{"en":"It must be spaced at 15 ft because it contains two sensors"},{"en":"It must be listed for each sensor, and those listings determine the location and spacing criteria"}],"ans":[3],"ref":"NFPA 72-2022 §17.9","exp":"A combination or multi-sensor detector must be listed for each sensor, and each sensor's listing determines location and spacing under Chapter 17 (§17.9). A multi-criteria detector is listed for its primary function. In practice, follow the requirements of the more restrictive sensor and the manufacturer's instructions."},{"id":"init-027","task":"1.1.1","type":"single","diff":2,"q":{"en":"A carbon monoxide (CO) detector connected to the building fire alarm system is required in a room with a permanently installed gas-fired boiler. Per NFPA 72-2022 Section 17.12, where should the detector be installed in that room?"},"opts":[{"en":"On the floor, because CO is much heavier than air"},{"en":"Outside the room only, at least 21 ft from the boiler"},{"en":"On the ceiling, in accordance with the manufacturer's published instructions"},{"en":"Inside the boiler flue"}],"ans":[2],"ref":"NFPA 72-2022 §17.12","exp":"Section 17.12 (2022) covers system-connected CO detectors: where required by law or code, they are installed on the ceiling of the same room as permanently installed fuel-burning appliances, in the other required locations, and always per the manufacturer's instructions; they must be listed (for example, to UL 2075). CO has a density close to that of air and rises with warm combustion gases, so it is not mounted at floor level."},{"id":"init-028","task":"1.1.1","type":"single","diff":1,"freq":true,"q":{"en":"According to NFPA 72-2022, a sprinkler waterflow alarm-initiating device must activate within how many seconds of a flow equal to that from a single sprinkler of the smallest orifice size installed in the system?"},"opts":[{"en":"90 seconds"},{"en":"10 seconds"},{"en":"60 seconds"},{"en":"120 seconds"}],"ans":[0],"ref":"NFPA 72-2022 §17.13.2","exp":"The waterflow device must activate within 90 seconds of a flow equal to or greater than that from a single sprinkler of the smallest orifice size installed (§17.13.2). A retard prevents alarms from pressure surges, but the total time cannot exceed 90 s. The 10 s is the maximum time to actuate notification after an initiating device operates (§10.11.1)."},{"id":"init-029","task":"1.1.1","type":"multi","select":2,"diff":2,"q":{"en":"Which TWO statements about a vane-type (paddle) waterflow switch on a wet-pipe sprinkler system are correct? (Select TWO.)"},"opts":[{"en":"It initiates a supervisory signal rather than an alarm signal"},{"en":"It is the preferred waterflow device for dry-pipe and preaction systems"},{"en":"Its adjustable retard helps keep pressure surges from initiating an alarm"},{"en":"Its retard may be set to any value as long as the AHJ is notified"},{"en":"It must initiate the alarm within 90 seconds of a flow equal to one sprinkler of the smallest orifice installed"}],"ans":[2,4],"ref":"NFPA 72-2022 §17.13; NFPA 13 and manufacturer's instructions","exp":"Waterflow produces an ALARM signal. A vane switch's adjustable retard prevents alarms from surges or variable pressure (§17.13), but activation must still occur within 90 s (§17.13.2). Vane switches are for wet-pipe systems; dry-pipe, preaction, and deluge systems use a pressure switch, because the valve trip and water hammer would damage a paddle."},{"id":"init-030","task":"1.1.1","type":"single","diff":1,"freq":true,"q":{"en":"A valve supervisory (tamper) switch on an OS&Y gate valve must initiate the off-normal signal:"},"opts":[{"en":"During the first two revolutions of the handwheel or during one-fifth of the travel distance of the valve control apparatus"},{"en":"During the first five revolutions of the handwheel or one-half of the valve travel"},{"en":"Only when the valve is fully closed"},{"en":"Within one-quarter turn of the handwheel"}],"ans":[0],"ref":"NFPA 72-2022 §17.17.1","exp":"The valve supervisory switch must initiate the off-normal signal during the first two revolutions of the handwheel or during one-fifth of the travel distance of the valve control apparatus from its normal position (§17.17.1). It is a SUPERVISORY signal, not an alarm, and it must not restore at any position other than normal (fully open)."},{"id":"init-031","task":"1.1.1","type":"single","diff":2,"q":{"en":"A pressure supervisory switch monitors the air pressure of a dry-pipe sprinkler system. According to NFPA 72, the off-normal signal must be initiated when the pressure increases or decreases by:"},"opts":[{"en":"5 psi (35 kPa)"},{"en":"10 psi (70 kPa)"},{"en":"20 psi (140 kPa)"},{"en":"25 percent of the normal pressure"}],"ans":[1],"ref":"NFPA 72-2022 §17.17.2","exp":"Pressure supervisory devices must provide two distinct signals: off-normal and restoration. For a dry-pipe system, and also for pressure tanks, the off-normal signal is initiated when the pressure increases or decreases by 10 psi (70 kPa) (§17.17.2). A loss of air can indicate a leak that would trip the dry-pipe valve."},{"id":"init-032","task":"1.1.1","type":"single","diff":3,"q":{"en":"A supervisory switch monitors a gravity (non-pressure) water storage tank for a fire protection system. Per NFPA 72, the low water level signal must be initiated when the water level falls:"},"opts":[{"en":"3 in. (76 mm)"},{"en":"6 in. (150 mm)"},{"en":"12 in. (300 mm)"},{"en":"24 in. (610 mm)"}],"ans":[2],"ref":"NFPA 72-2022 §17.17.3","exp":"On pressure tanks, the level device must signal high and low level when the water rises or falls 3 in. (76 mm). On non-pressure tanks (gravity, suction), it must initiate a low-level signal when the water falls 12 in. (300 mm) (§17.17.3). In both cases a restoration signal is also required."},{"id":"init-033","task":"1.1.1","type":"single","diff":1,"q":{"en":"A room temperature supervisory device protects a sprinkler valve room exposed to freezing. At what temperature must it initiate the supervisory signal?"},"opts":[{"en":"32°F (0°C)"},{"en":"50°F (10°C)"},{"en":"35°F (1.7°C)"},{"en":"40°F (4.4°C)"}],"ans":[3],"ref":"NFPA 72-2022 §17.17.4 and §17.17.5","exp":"Temperature supervisory devices (for tank water or room temperature) signal when the temperature drops to 40°F (4.4°C) and again when it is restored above 40°F (§17.17.4 and §17.17.5). The warning comes before 32°F to allow time to act before the water freezes."},{"id":"init-034","task":"1.1.1","type":"single","diff":1,"freq":true,"q":{"en":"According to NFPA 72-2022, the operable part of a manual fire alarm box must be mounted:"},"opts":[{"en":"Not less than 36 in. and not more than 44 in. above floor level"},{"en":"Not less than 42 in. and not more than 48 in. above floor level"},{"en":"Not less than 48 in. and not more than 54 in. above floor level"},{"en":"At 80 in. above the floor or 6 in. below the ceiling, whichever is lower"}],"ans":[1],"ref":"NFPA 72-2022 §17.15","exp":"The operable part of a manual fire alarm box must be not less than 42 in. (1.07 m) and not more than 48 in. (1.22 m) above floor level (§17.15). It is measured to the handle or operating part, not to the center of the box. 54 in. was the maximum in older editions; 80 in. is the mounting height for wall-mounted visual appliances."},{"id":"init-035","task":"1.1.1","type":"single","diff":1,"freq":true,"q":{"en":"Manual fire alarm boxes must be located within what distance of the exit doorway opening at each exit on each floor?"},"opts":[{"en":"10 ft (3 m)"},{"en":"25 ft (7.6 m)"},{"en":"60 in. (1.52 m)"},{"en":"15 ft (4.6 m)"}],"ans":[2],"ref":"NFPA 72-2022 §17.15","exp":"A manual fire alarm box is installed within 60 in. (1.52 m, 5 ft) of the exit doorway opening at each exit on each floor (§17.15), so occupants can activate it as they leave. In addition, the travel distance to the nearest box must not exceed 200 ft."},{"id":"init-036","task":"1.1.1","type":"single","diff":2,"freq":true,"q":{"en":"A one-story building has a straight 500-ft corridor with an exit at each end and a manual fire alarm box at each exit. Considering travel along the corridor only, what is the minimum number of ADDITIONAL boxes needed so that the travel distance to the nearest box does not exceed the NFPA 72 limit?"},"opts":[{"en":"0"},{"en":"1"},{"en":"2"},{"en":"3"}],"ans":[1],"ref":"NFPA 72-2022 §17.15","exp":"In addition to the boxes at the exits, boxes are added so that the travel distance to the nearest one does not exceed 200 ft (61 m), measured horizontally on the same floor (§17.15). With boxes only at the ends, the midpoint is 250 ft away; one additional box at the center reduces the maximum travel to 125 ft."},{"id":"init-037","task":"1.1.1","type":"single","diff":3,"q":{"en":"A mall entrance has a group of exit doors with a total width of 60 ft. Where must manual fire alarm boxes be installed at this grouped opening?"},"opts":[{"en":"On both sides of the grouped opening, within 60 in. of each side"},{"en":"One box within 60 in. of the center of the group"},{"en":"One box for every 40 ft of opening width"},{"en":"No box is required at grouped openings wider than 40 ft"}],"ans":[0],"ref":"NFPA 72-2022 §17.15","exp":"Where a grouped exit opening is more than 40 ft (12.2 m) wide, manual boxes are installed on both sides, each within 60 in. (1.52 m) of its side of the grouped opening (§17.15). That way anyone leaving through the group passes close to a box."},{"id":"init-038","task":"1.1.1","type":"single","diff":3,"q":{"en":"Spot-type smoke detectors are to be installed in a room with 30 air changes per hour (one air change every 2 minutes). According to NFPA 72-2022 Table 17.7.7.3.3.2, what is the maximum area per detector?"},"opts":[{"en":"250 ft² (23 m²)"},{"en":"125 ft² (12 m²)"},{"en":"500 ft² (46 m²)"},{"en":"900 ft² (84 m²)"}],"ans":[0],"ref":"NFPA 72-2022 §17.7.7.3.3.2, Table 17.7.7.3.3.2","exp":"In high air movement areas, smoke detector spacing is adjusted with Table 17.7.7.3.3.2 before any other adjustment: 60 changes/h = 125 ft²; 30 changes/h = 250 ft²; 15 changes/h = 500 ft²; 7.5 changes/h or fewer = 900 ft² (the area of a 30 × 30 ft spacing). The table is not used for under-floor or above-ceiling spaces."},{"id":"init-039","task":"1.1.1","type":"single","diff":2,"q":{"en":"A technician is terminating a conventional detector base on a Class B initiating device circuit; the base has separate 'in' and 'out' terminals. Which practice ensures that a loose conductor or a removed device will produce a trouble signal?"},"opts":[{"en":"Loop the unbroken conductor around the terminal screw to save time"},{"en":"Feed the detector from the circuit through a T-tap"},{"en":"Place three conductors under a screw terminal listed for two"},{"en":"Cut the conductors and land the incoming and outgoing wires on separate terminals"}],"ans":[3],"ref":"NFPA 72-2022 §12.6 and §17.4; manufacturer's instructions","exp":"Separate in and out terminals exist so the connections are supervised: the conductor is cut and each end is landed separately. If a continuous wire is looped under the screw, removing the device leaves the circuit closed and no trouble signal results (integrity monitoring, §12.6). Never land more conductors under a terminal than the manufacturer permits."},{"id":"init-040","task":"1.1.1","type":"single","diff":3,"q":{"en":"Why is T-tapping (branching) not acceptable on a conventional Class B initiating device circuit supervised by an end-of-line resistor?"},"opts":[{"en":"An open on the branch would not be detected, so devices on it could be lost without a trouble signal"},{"en":"T-taps double the circuit voltage at the branch"},{"en":"T-taps are permitted only on notification appliance circuits"},{"en":"T-taps automatically convert the circuit to Class A"}],"ans":[0],"ref":"NFPA 72-2022 §12.6","exp":"On a conventional Class B IDC, supervision depends on a small current that flows through the entire run to the end-of-line (EOL) resistor. A T-tapped branch does not carry that current: if it opens, the panel does not detect it, and the devices on the branch are out of service with no trouble signal (§12.6). Some addressable Class B SLCs do allow branches where the manufacturer permits."},{"id":"init-041","task":"1.2.1","type":"single","diff":2,"freq":true,"q":{"en":"According to NFPA 72-2022, when must the sensitivity of system smoke detectors first be checked, and how often after that (before any extension of the interval)?"},"opts":[{"en":"At installation only, then every 5 years"},{"en":"Within 6 months after installation, then annually"},{"en":"Within 1 year after installation, then every alternate year"},{"en":"Every year, starting on the day of installation"}],"ans":[2],"ref":"NFPA 72-2022 §14.4.4.3","exp":"Smoke detector sensitivity is checked within 1 year after installation and every alternate year thereafter. After the second required test, if the detectors have remained within their listed range, the interval may be extended up to 5 years (§14.4.4.3). Do not confuse this with the functional test, which is annual."},{"id":"init-042","task":"1.2.1","type":"single","diff":3,"q":{"en":"After the second required sensitivity test, all smoke detectors in a building have remained within their listed and marked sensitivity range. To what maximum interval may the time between sensitivity tests be extended?"},"opts":[{"en":"2 years"},{"en":"3 years"},{"en":"10 years"},{"en":"5 years"}],"ans":[3],"ref":"NFPA 72-2022 §14.4.4.3","exp":"If, after the second required calibration test, the detectors have remained within their listed and marked sensitivity range, the interval between sensitivity tests may be extended to a maximum of 5 years (§14.4.4.3). Any detector later found outside its range must be cleaned and recalibrated, or replaced."},{"id":"init-043","task":"1.2.1","type":"single","diff":2,"q":{"en":"A technician proposes to 'measure' detector sensitivity by spraying canned aerosol into each detector and noting whether it alarms. Why is this not an acceptable sensitivity test?"},"opts":[{"en":"NFPA 72 prohibits measuring sensitivity with any device that administers an unmeasured concentration of smoke or other aerosol"},{"en":"Canned aerosol is never permitted for any detector test"},{"en":"Sensitivity can be measured only in a laboratory"},{"en":"Aerosol tests are permitted only on heat detectors"}],"ans":[0],"ref":"NFPA 72-2022 §14.4.4.3","exp":"Sensitivity cannot be tested or measured with any device that administers an unmeasured concentration of smoke or other aerosol (§14.4.4.3). Listed aerosol is fine for the annual FUNCTIONAL test (smoke entry and alarm), but it does not measure sensitivity. Use a calibrated test method, the manufacturer's calibrated sensitivity test instrument, or listed control equipment arranged for that purpose."},{"id":"init-044","task":"1.2.1","type":"single","diff":1,"q":{"en":"During the annual functional test of spot-type smoke detectors, which method is consistent with NFPA 72?"},"opts":[{"en":"Apply a heat gun until the detector alarms"},{"en":"Test each detector in place with smoke or a listed aerosol acceptable to the manufacturer, verifying smoke entry and an alarm response"},{"en":"Activate only the detector's built-in magnet test switch"},{"en":"Jumper the detector terminals at the base"}],"ans":[1],"ref":"NFPA 72-2022 Table 14.4.3.2","exp":"The annual functional test is done with the detector in place, using smoke or a listed aerosol acceptable to the manufacturer, to prove that smoke enters the chamber and an alarm results (Table 14.4.3.2). A magnet or test button does not prove smoke entry, a jumper at the base tests only the wiring, and heat can damage the detector."},{"id":"init-045","task":"1.2.1","type":"single","diff":2,"freq":true,"q":{"en":"Nonrestorable fixed-temperature spot-type heat detectors in a building have been in service for 15 years. Per NFPA 72 Table 14.4.3.2, what must be done?"},"opts":[{"en":"Heat-test each detector in place with a heat gun"},{"en":"Nothing; nonrestorable detectors never need replacement"},{"en":"Replace all of them, or have 2 detectors per 100 laboratory tested"},{"en":"Replace only the detectors that show visible corrosion"}],"ans":[2],"ref":"NFPA 72-2022 Table 14.4.3.2","exp":"Nonrestorable fixed-temperature heat detectors are never heat-tested (that would destroy them); they are tested mechanically and electrically. At 15 years after installation, replace them all or send 2 per 100 to a laboratory for testing (replacing those removed); if any fail, more are tested. The sampling is then repeated every 5 years (Table 14.4.3.2)."},{"id":"init-046","task":"1.2.1","type":"single","diff":2,"q":{"en":"A technician performs the waterflow alarm test on a wet-pipe sprinkler system. Which procedure is correct?"},"opts":[{"en":"Open the main drain fully and verify the alarm within 10 seconds"},{"en":"Move the paddle by hand through the switch housing"},{"en":"Jumper the switch terminals at the control unit"},{"en":"Open the inspector's test connection, flowing the equivalent of one sprinkler of the smallest orifice, and verify the alarm within 90 seconds"}],"ans":[3],"ref":"NFPA 72-2022 Table 14.4.3.2; §17.13.2","exp":"On wet-pipe systems, water is flowed through the inspector's test connection, which simulates one sprinkler of the smallest orifice, and the alarm must be received within 90 s (Table 14.4.3.2; §17.13.2). Dry-pipe, preaction, and deluge systems use the alarm test bypass connection per NFPA 25. Jumpering or moving the paddle by hand does not test the actual device."},{"id":"init-047","task":"1.2.1","type":"multi","select":2,"diff":2,"q":{"en":"During the test of a control valve supervisory switch on an OS&Y valve, which TWO observations indicate the switch is operating correctly? (Select TWO.)"},"opts":[{"en":"The supervisory signal is received after the fifth turn of the handwheel"},{"en":"The supervisory signal is received during the second turn of the handwheel"},{"en":"The signal restores only when the valve is returned to its fully open (normal) position"},{"en":"The signal restores while the valve is still half closed"},{"en":"The control unit indicates a fire alarm signal as soon as the valve begins to close"}],"ans":[1,2],"ref":"NFPA 72-2022 §17.17.1; Table 14.4.3.2","exp":"The switch must produce a supervisory signal within the first two revolutions of the handwheel (or 1/5 of the travel) and must not restore until the valve is back at its normal, fully open position (§17.17.1). A signal only after 5 turns, or a restoration while the valve is half closed, is a deficiency: adjust or replace the switch. The signal is supervisory, not alarm."},{"id":"init-048","task":"1.2.1","type":"single","diff":2,"q":{"en":"In addition to the functional alarm test, what must be verified on an air duct smoke detector during periodic testing per NFPA 72?"},"opts":[{"en":"That the duct air velocity is below 300 ft/min"},{"en":"That the detector is sampling the airstream, tested per the manufacturer's published instructions (for example, differential pressure across the sampling tubes)"},{"en":"That the detector is an ionization type"},{"en":"That the duct housing is at least 36 in. from any supply diffuser"}],"ans":[1],"ref":"NFPA 72-2022 Table 14.4.3.2","exp":"For duct detectors, in addition to the functional test, the device is tested or inspected to verify that it is actually sampling the airstream, per the manufacturer's instructions; typically the differential pressure across the inlet and exhaust tubes is measured and compared with the manufacturer's range (Table 14.4.3.2). A plugged, reversed, or poorly sealed tube leaves the detector 'blind.' Duct detectors are listed for velocities well above 300 ft/min."},{"id":"init-049","task":"1.2.2","type":"single","diff":1,"q":{"en":"A sensitivity test shows that a spot-type smoke detector is outside its listed and marked sensitivity range. What does NFPA 72 require?"},"opts":[{"en":"Clean and recalibrate the detector, or replace it"},{"en":"Increase the control unit's alarm verification time"},{"en":"Leave it in service and retest it next year"},{"en":"Move it closer to the nearest HVAC return"}],"ans":[0],"ref":"NFPA 72-2022 §14.4.4.3","exp":"A detector whose sensitivity is outside its listed and marked range must be cleaned and recalibrated, or replaced (§14.4.4.3). An overly sensitive detector causes nuisance alarms, and an insensitive one responds late. Record the result and the action taken in the inspection and test report."},{"id":"init-050","task":"1.2.2","type":"single","diff":3,"q":{"en":"A two-wire conventional smoke detector on an initiating device circuit has failed. Which replacement is acceptable?"},"opts":[{"en":"Any listed smoke detector with the same voltage rating"},{"en":"A detector listed for use with that control unit (per the compatibility listing), installed on the correct base"},{"en":"A single-station smoke alarm wired into the circuit"},{"en":"A four-wire detector connected to the two IDC conductors only"}],"ans":[1],"ref":"NFPA 72-2022 §10.3.3; manufacturer's instructions","exp":"Devices that receive their power from the IDC or SLC of a control unit must be listed for use with that control unit (compatibility, §10.3.3). Two-wire detectors draw their power from the circuit; an incompatible one may fail to alarm or may not be properly supervised. Check the manufacturer's compatibility list and the base type before replacing."},{"id":"init-051","task":"1.2.2","type":"single","diff":2,"q":{"en":"A technician replaces a damaged addressable heat detector with a new unit of the same model. What must be done before the job is complete?"},"opts":[{"en":"Assign the next unused address so the panel learns it automatically; no test is needed"},{"en":"Only verify that the device LED blinks"},{"en":"Test 10 percent of the devices in the building, but not the new one"},{"en":"Set the same address as the removed device (as programmed and shown on the records) and functionally test the new device"}],"ans":[3],"ref":"NFPA 72-2022 §14.4.2","exp":"When replacing an addressable device, set the same address (and device type) that is programmed in the panel and shown on the record drawings; a duplicate or different address causes troubles or reports the wrong location. Then perform reacceptance testing: the added or replaced device must be functionally tested (§14.4.2)."},{"id":"init-052","task":"1.2.2","type":"single","diff":2,"q":{"en":"At the end of a renovation, a technician finds that smoke detectors installed but not operational during construction are coated with drywall dust; some dust covers were missing. What does NFPA 72-2022 require before the final acceptance test?"},"opts":[{"en":"Remove the remaining dust covers and place the system in service; nothing else is required"},{"en":"Increase the control unit's alarm verification delay to compensate for the dust"},{"en":"Clean them per the manufacturer and verify they operate within their listed sensitivity, or replace them"},{"en":"Replace only the detectors that go into alarm"}],"ans":[2],"ref":"NFPA 72-2022 §17.7.2","exp":"Detectors installed during construction must be protected from dust and damage per the manufacturer and, before the final acceptance test, verified to be within their listed sensitivity (cleaned if needed) or replaced (§17.7.2). Simply removing the dust covers is not enough: dust inside the chamber shifts sensitivity and causes nuisance alarms."},{"id":"init-053","task":"1.3.1","type":"single","diff":2,"q":{"en":"According to NFPA 72 Chapter 7, where automatic detection is used, floor plan shop drawings must show the location of which of the following, because it affects detector placement?"},"opts":[{"en":"All plumbing fixtures"},{"en":"All general-purpose receptacles"},{"en":"All movable furniture"},{"en":"All supply and return air diffusers"}],"ans":[3],"ref":"NFPA 72-2022 Ch. 7 (§7.4, shop drawings)","exp":"Where automatic detection is used, shop drawings must show the locations of all supply and return air diffusers, along with walls, partitions extending to within the top 15 percent of the ceiling height, room descriptions, and device locations (Ch. 7, §7.4). This information lets you verify that detectors are not placed in the airstream."},{"id":"init-054","task":"1.3.1","type":"single","diff":3,"q":{"en":"The approved drawings show a spot-type smoke detector 12 in. from a ceiling supply-air diffuser. In the field, the technician sees that the diffuser blows directly across that location. What is the best action?"},"opts":[{"en":"Notify the supervisor or designer: NFPA 72 prohibits locating detectors where airflow prevents their operation, and its annex recommends at least 36 in. from supply diffusers and return-air openings"},{"en":"Install it exactly as shown; approved drawings always override NFPA 72"},{"en":"Install the detector inside the diffuser so it samples more air"},{"en":"Move it 4 in. farther from the diffuser without telling anyone"}],"ans":[0],"ref":"NFPA 72-2022 §17.7.5 and Annex A.17.7.5","exp":"In spaces served by air-handling systems, detectors must not be located where airflow prevents their operation (§17.7.5). The annex recommends keeping them out of the direct airstream and at least 36 in. (910 mm) from a supply diffuser or return-air opening. A Level I technician does not change the design alone: report the conflict so the designer can resolve it and the drawings are updated."},{"id":"init-055","task":"1.3.1","type":"single","diff":1,"q":{"en":"A technician needs to confirm the listed spacing of a specific spot-type heat detector model before installation. Where is this information found?"},"opts":[{"en":"In NFPA 70 (NEC), Article 760"},{"en":"In OSHA 29 CFR 1926"},{"en":"In the manufacturer's published instructions or data sheet, based on the device's listing"},{"en":"Nowhere; it is always 30 ft for every heat detector"}],"ans":[2],"ref":"NFPA 72-2022 §17.6.3.1.1; manufacturer's published instructions","exp":"A heat detector's listed spacing is determined by the testing laboratory (for example, under UL 521) and appears in the manufacturer's published instructions or data sheet. NFPA 72 uses that value as S in §17.6.3.1.1 (S/2 to walls, or 0.7S). NEC Article 760 covers fire alarm wiring, not detector spacing."}]},{"topic":{"id":"notif","title":"Notification Appliances (NFPA 72-2022 Ch. 18)","short":"Notification","tasks":["1.1.1","1.2.1","1.3.1","1.2.2"],"refs":["NFPA 72-2022 Ch. 18","NFPA 72-2022 Table 14.4.3.2","NFPA 72-2022 Ch. 12","Bukowski, Fire Alarm Signaling Systems"],"guide":"\n<h3>What NICET expects at Level I</h3>\n<p>A Level I technician mounts and terminates notification appliances (task 1.1.1), tests them (1.2.1), replaces them when they fail (1.2.2), and must be able to read drawings and data sheets (1.3.1), always under supervision. On this topic the exam mostly asks about <strong>mounting heights</strong>, <strong>candela selection</strong> from the room spacing tables, <strong>audibility levels</strong> (dB above ambient), <strong>signal patterns</strong> (Temporal-3 and Temporal-4), <strong>synchronization</strong>, the <strong>corridor</strong> and <strong>sleeping room</strong> rules, and good NAC wiring practice (polarity, end-of-line resistor, no T-taps). Almost everything is in <strong>Chapter 18</strong> of NFPA 72-2022; testing is in <strong>Table 14.4.3.2</strong>.</p>\n\n<h3>General requirements (§18.3)</h3>\n<ul>\n<li><strong>Listing:</strong> every appliance must be listed for the purpose for which it is used (§18.3.1). Appliances for special environments (outdoors, temperature extremes, humidity, dust, hazardous locations, or subject to tampering) must be listed for that application (§18.3.3.1).</li>\n<li><strong>Nameplate:</strong> shows the electrical requirements and the rated audible and/or visual performance, or refers to the installation documents (§18.3.2).</li>\n<li><strong>Markings:</strong> an appliance used for signals other than fire must not carry the word FIRE. In 2022, existing appliances may have their marking modified in the field per the manufacturer, or with a permanent sign stating that the appliance is multipurpose (§18.3.3).</li>\n<li><strong>Mechanical protection:</strong> where subject to damage, protect it; guards or covers must be <em>listed for use with that appliance</em> (§18.3.4).</li>\n<li><strong>Mounting:</strong> supported independently of the circuit conductors and installed per the manufacturer's published instructions (§18.3.5).</li>\n<li><strong>Connections and NACs:</strong> terminals must allow the connections to be monitored for integrity (§18.3.6). The NAC complies with Chapter 12 (§18.3.7, new in 2022). Annex A.18.3.7.1 reminds you that regulated 24 VDC appliances must operate from <strong>16 to 33 VDC</strong> and that the maximum listed current is used for load calculations.</li>\n</ul>\n\n<h3>Audible appliances (§18.4)</h3>\n<table>\n<thead><tr><th>Application</th><th>Requirement</th><th>Where measured</th><th>Ref.</th></tr></thead>\n<tbody>\n<tr><td>Public mode</td><td>15 dB above the average ambient or 5 dB above the maximum lasting 60 s or more (whichever is greater)</td><td>5 ft (1.5 m) above the floor, dBA</td><td>§18.4.4.1</td></tr>\n<tr><td>Private mode</td><td>10 dB above the average or 5 dB above the 60-s maximum (whichever is greater)</td><td>5 ft above the floor, dBA</td><td>§18.4.5.1</td></tr>\n<tr><td>Sleeping areas</td><td>15 dB / 5 dB / 75 dBA (whichever is greater) and a 520 Hz ±10 percent low-frequency signal from listed equipment</td><td>At pillow level, with doors or curtains closed</td><td>§18.4.6</td></tr>\n<tr><td>Maximum</td><td>110 dBA total (ambient plus all audible appliances)</td><td>At the minimum hearing distance</td><td>§18.4.1.2</td></tr>\n<tr><td>Ambient over 105 dBA</td><td>Visual appliances are required</td><td>—</td><td>§18.4.1.1</td></tr>\n<tr><td>Wall mounting (audible only)</td><td>Top not less than 90 in. above the floor and not less than 6 in. below the ceiling</td><td>—</td><td>§18.4.9.1</td></tr>\n<tr><td>Combination audible/visual</td><td>Located by the visual rules (§18.5.5)</td><td>—</td><td>§18.4.9.3</td></tr>\n</tbody>\n</table>\n<p>Other points: noise lasting 60 s or more counts toward the maximum (§18.4.1.3). Elevators and, with AHJ approval, restrooms may use the private mode criteria (§18.4.4.3–18.4.4.4). If the system shuts off music or machinery, the signal must be 15 dB above the <em>reduced</em> ambient and visual appliances are added (§18.4.4.5). Narrow band tone signaling (§18.4.7): 10 dB above the masked threshold per octave band or 13 dB per one-third octave band. Exit marking audible appliances (§18.4.8): at the entrance to exits and areas of refuge. The designer documents the design sound levels for acceptance testing (§18.4.1.5).</p>\n\n<h4>Signal patterns</h4>\n<ul>\n<li><strong>Evacuation:</strong> Temporal-3 per ANSI/ASA S3.41 (0.5 s on / 0.5 s off three times, then 1.5 s off; 4-s cycle), synchronized within the notification zone (§18.4.2).</li>\n<li><strong>Duration (2022 change):</strong> the signal repeats until authorized or emergency personnel manually silence or reset the system. Automatic silencing is permitted only with AHJ approval based on an emergency response plan, and never sooner than 180 s (§18.4.2.2–18.4.2.3).</li>\n<li><strong>Carbon monoxide (CO):</strong> Temporal-4, four cycles of 100 ms on / 100 ms off followed by 5 s off; after 4 minutes the off period may become 60 s (§18.4.3).</li>\n</ul>\n\n<h3>Visual appliances (§18.5)</h3>\n<ul>\n<li>Flash rate between <strong>1 and 2 Hz</strong>; clear or nominal white light; maximum <strong>1000 cd</strong> effective (§18.5.3). Light distribution per UL 1638 (§18.5.4).</li>\n<li><strong>Wall:</strong> the entire lens between <strong>80 and 96 in.</strong> above the floor (§18.5.5.1). If the ceiling is too low, mount within 6 in. of the ceiling and reduce the covered room size by twice the difference from 80 in.</li>\n<li><strong>Ceiling (new in 2022):</strong> an appliance listed for ceiling mounting goes not less than 80 in. above the floor or at the actual ceiling height, whichever is less (§18.5.5.5). Obstructions must be considered (§18.5.5.6).</li>\n<li><strong>Synchronization:</strong> more than two appliances (or groups) in the same field of view must flash in synchronization, even if separate systems or circuits feed them (§18.5.5.7.2).</li>\n</ul>\n<table>\n<thead><tr><th>Room (ft)</th><th>Wall, 1 appliance (cd) – Table 18.5.5.7.1(a)</th><th>Ceiling, ceiling height 10 / 20 / 30 ft (cd) – Table 18.5.5.7.1(b)</th></tr></thead>\n<tbody>\n<tr><td>20 × 20</td><td>15</td><td>15 / 30 / 55</td></tr>\n<tr><td>28 × 28</td><td>30</td><td>—</td></tr>\n<tr><td>30 × 30</td><td>34</td><td>30 / 45 / 75</td></tr>\n<tr><td>40 × 40</td><td>60</td><td>60 (10 ft)</td></tr>\n<tr><td>45 × 45</td><td>75</td><td>—</td></tr>\n<tr><td>50 × 50</td><td>94</td><td>95 (30 ft)</td></tr>\n<tr><td>54 × 54</td><td>110</td><td>—</td></tr>\n<tr><td>60 × 60</td><td>135</td><td>—</td></tr>\n<tr><td>68 × 68</td><td>177</td><td>177 (30 ft)</td></tr>\n<tr><td>70 × 70</td><td>184</td><td>185 (30 ft)</td></tr>\n</tbody>\n</table>\n<p><strong>Non-square rooms or off-center wall appliance:</strong> use the distance to the farthest wall or twice the distance to the farthest adjacent wall, whichever is greater. <strong>Off-center ceiling appliance:</strong> double the distance to the farthest wall. An irregular room is enclosed in a square or divided into squares. If the ceiling is higher than 30 ft, suspend the appliance at or below 30 ft or use wall mounting (§18.5.5.7).</p>\n\n<h4>Corridors (§18.5.5.8) and sleeping rooms (§18.5.5.10)</h4>\n<ul>\n<li><strong>Corridor 20 ft wide or less:</strong> appliances of at least 15 cd, not more than 15 ft from each end and not more than 100 ft apart. A fire door, elevation change, or other obstruction creates a separate corridor. More than two in view must be synchronized. They may be on the ceiling, a side wall, or the end wall. If the corridor is wider than 20 ft, use the room rules.</li>\n<li><strong>Sleeping room:</strong> if the top of the lens is 24 in. or more below the ceiling, 110 cd is enough. If it is less than 24 in., 177 cd is required (because of the smoke layer). In rooms larger than 16 ft, the appliance must be within 16 ft of the pillow. The performance-based method (§18.5.5.9) does not apply to sleeping rooms.</li>\n</ul>\n\n<h4>Other appliances</h4>\n<p>Textual and graphical visual appliances (message signs, §18.9); textual audible appliances (speakers); tactile appliances, such as bed shakers, per UL 1971 (§18.10). The Standard Emergency Service Interface requires annunciators and controls for fire fighters to be designed in coordination with the organizations that use them.</p>\n\n<h3>NAC installation and termination</h3>\n<ul>\n<li>Respect the marked <strong>polarity</strong>. DC appliances are polarized: the panel supervises with reversed polarity and reverses it in alarm.</li>\n<li>The <strong>end-of-line (EOL) resistor</strong> goes at the last appliance of a Class B NAC. Do not make <strong>T-taps</strong>, because the branch would not be supervised.</li>\n<li><strong>Cut the conductor</strong> at the terminals (in and out) so that a removed wire produces a trouble signal, per the manufacturer.</li>\n<li>Set every <strong>multi-candela</strong> appliance to the value on the approved drawings and record the setting.</li>\n<li>Use appliances and <strong>sync</strong> modules that share the same protocol. Calculate voltage drop with the maximum listed current, because low voltage causes loss of sync or weak output.</li>\n</ul>\n\n<h3>Testing (link to Ch. 14)</h3>\n<p>Per Table 14.4.3.2 (alarm notification appliances row):</p>\n<ul>\n<li><strong>Audible:</strong> at acceptance and reacceptance, measure the sound level with an ANSI/ASA S1.4 Type 2 meter set to FAST. At the annual test, verify that they operate.</li>\n<li><strong>Visual:</strong> at acceptance, verify locations against the drawings, that the marked candela matches the approved drawings, and that they flash. At the annual test, verify that each appliance flashes.</li>\n<li><strong>Exit marking:</strong> annual test per the manufacturer.</li>\n<li>Every replaced appliance is tested (reacceptance, §14.4.2).</li>\n</ul>\n\n<div class=\"callout warn\"><strong>Common traps:</strong>\n<ul>\n<li>The 90 in. / 6 in. rule is for audible-only appliances. A horn/strobe follows the 80–96 in. visual rule.</li>\n<li>30 cd covers 28 × 28 ft, not 30 × 30 ft, which needs 34 cd.</li>\n<li>The 75 dBA in sleeping rooms is a minimum measured at the pillow, not 5 ft above the floor.</li>\n<li>The maximum is 110 dBA. If the ambient exceeds 105 dBA, visual appliances are required.</li>\n<li>Calculate both criteria (15 dB above the average and 5 dB above the 60-s maximum) and use the greater.</li>\n<li>A strobe built into a ceiling-mounted smoke detector in a sleeping room needs 177 cd.</li>\n<li>In 2022 the evacuation signal is no longer just \"180 s minimum\": it sounds until manually silenced, unless the AHJ approves automatic silencing.</li>\n<li>Numbering: older material cites Table 18.5.5.4.1 (2013/2016 editions) or 18.5.5.5.1 (2019); in 2022 it is <strong>18.5.5.7.1</strong>. With the new §18.4.3 for CO, the 2022 numbers are: public mode 18.4.4, private 18.4.5, sleeping 18.4.6, exit marking 18.4.8, and location 18.4.9.</li>\n</ul></div>\n\n<h3>Finding it fast in the printed code book</h3>\n<ul>\n<li>Everything numbered 18.x is in Chapter 18. Put permanent tabs on §18.4 (audible), §18.5 (visual), and the two room spacing tables, Table 18.5.5.7.1(a) and (b), so you can flip straight to the candela values.</li>\n<li>Useful index entries at the back of NFPA 72: \"Notification appliances\", \"Visual notification appliances\", \"Audible notification appliances\", \"Sleeping areas\", \"Corridors\", \"Temporal pattern\", \"Synchronization\".</li>\n<li>Highlight the key numbers on the page: 90 in. / 6 in. (audible mounting), 80–96 in. (visual mounting), 110 dBA and 105 dBA, 15 dB / 10 dB / 5 dB, 75 dBA and 520 Hz, 15 ft / 100 ft (corridors), 24 in. / 110 cd / 177 cd (sleeping rooms).</li>\n<li>For testing, flip to Table 14.4.3.2 and find the \"Alarm notification appliances\" row; tab that page too.</li>\n<li>An asterisk (*) next to a section means there is explanatory material in Annex A (for example, A.18.3.7.1 on NAC voltage). It helps you understand the rule, but it is not mandatory.</li>\n</ul>\n<div class=\"callout\"><strong>Tip:</strong> on candela questions, first determine the room size (the square that encloses the room, or the farthest-wall / twice-the-adjacent-wall rule), then find the row in the table and pick the nearest value or setting that is <em>equal or higher</em>. On audibility questions, write down both calculations and keep the greater one.</div>\n","tabs":[{"ref":"NFPA 72-2022 §18.3","what":"General: listing, nameplate, mechanical protection (§18.3.4), mounting (§18.3.5), connections (§18.3.6), NAC (§18.3.7)"},{"ref":"NFPA 72-2022 A.18.3.7.1","what":"NAC design: 24 VDC appliances operate from 16 to 33 VDC; maximum listed current; voltage drop"},{"ref":"NFPA 72-2022 §18.4.1","what":"Audible general: ambient over 105 dBA → visual appliances; 110 dBA maximum; documentation of design levels"},{"ref":"NFPA 72-2022 §18.4.2","what":"Temporal-3 evacuation signal (ANSI/ASA S3.41); 2022 duration rule; synchronization"},{"ref":"NFPA 72-2022 §18.4.3","what":"Temporal-4 CO signal"},{"ref":"NFPA 72-2022 §18.4.4","what":"Public mode: 15 dB / 5 dB, 5 ft, dBA; elevators, restrooms, ambient noise reduction"},{"ref":"NFPA 72-2022 §18.4.5","what":"Private mode: 10 dB / 5 dB"},{"ref":"NFPA 72-2022 §18.4.6","what":"Sleeping areas: 75 dBA at the pillow, barriers, 520 Hz"},{"ref":"NFPA 72-2022 §18.4.8","what":"Exit marking audible notification appliances"},{"ref":"NFPA 72-2022 §18.4.9","what":"Audible location: 90 in. / 6 in.; combination A/V per §18.5.5"},{"ref":"NFPA 72-2022 §18.5.3","what":"Flash rate 1 to 2 Hz, clear or white light, 1000 cd maximum"},{"ref":"NFPA 72-2022 §18.5.5.1","what":"Wall-mounted visual: entire lens between 80 and 96 in.; low ceilings"},{"ref":"NFPA 72-2022 §18.5.5.5","what":"Ceiling-listed visual: minimum 80 in. or the ceiling height (2022)"},{"ref":"NFPA 72-2022 Table 18.5.5.7.1(a)","what":"Room spacing: wall-mounted visual appliances (candela by room size)"},{"ref":"NFPA 72-2022 Table 18.5.5.7.1(b)","what":"Room spacing: ceiling-mounted visual appliances (10, 20, or 30 ft ceiling height)"},{"ref":"NFPA 72-2022 §18.5.5.7.2","what":"Synchronization: more than two appliances in the field of view"},{"ref":"NFPA 72-2022 §18.5.5.8","what":"Corridors 20 ft wide or less: 15 cd, 15 ft from each end, 100 ft between appliances"},{"ref":"NFPA 72-2022 §18.5.5.10","what":"Sleeping rooms: 110 or 177 cd by distance from the ceiling (24 in.); within 16 ft of the pillow"},{"ref":"NFPA 72-2022 Table 14.4.3.2","what":"Testing: alarm notification appliances (audible, textual, visual) and exit marking"}],"glossary":[{"en":"Notification appliance","def":"A component (horn, strobe, speaker, etc.) activated by the system that alerts occupants with audible, visual, tactile, or textual output."},{"en":"Notification appliance circuit (NAC)","def":"A circuit or pathway connected directly to notification appliances; it must comply with Chapter 12 (§18.3.7)."},{"en":"Visual notification appliance (strobe)","def":"An appliance that alerts by sight; NFPA 72-2022 calls it 'visual' (formerly 'visible')."},{"en":"Effective intensity (cd)","def":"The luminous intensity of a flashing light expressed as an equivalent steady light; it is the cd value used in the spacing tables."},{"en":"Average ambient sound level","def":"The A-weighted RMS level measured over the period when people are present, or 24 hours, whichever is less."},{"en":"Minimum hearing distance","def":"The closest distance an occupant's ear can be to an audible appliance; the 110 dBA maximum applies there (new definition in 2022)."},{"en":"Public mode","def":"Audible or visual signaling to the general occupants of an area; requires 15 dB above the average ambient."},{"en":"Private mode","def":"Signaling only to the persons directing the emergency response (for example, a nurses' station); requires 10 dB above the average ambient."},{"en":"Temporal-3 (T3) pattern","def":"The standard evacuation signal per ANSI/ASA S3.41: 0.5 s on / 0.5 s off three times, then 1.5 s off."},{"en":"Temporal-4 (T4) pattern","def":"The CO signal: four cycles of 100 ms on / 100 ms off, then 5 s off."},{"en":"Low-frequency signal (520 Hz)","def":"An audible signal with a fundamental frequency of 520 Hz ±10 percent, required to awaken occupants in sleeping areas."},{"en":"Synchronization","def":"Visual appliances flashing at the same time; required when more than two are in the same field of view."},{"en":"Field of view","def":"The area an observer can see from one position; it determines whether strobes must be synchronized."},{"en":"Multi-candela (selectable) appliance","def":"A strobe with a switch or jumper to choose the intensity (for example, 15, 30, 75, 95, 110 cd); set it per the approved drawings."},{"en":"End-of-line (EOL) resistor","def":"A resistor at the end of a Class B circuit that lets the panel supervise the continuity of the wiring."},{"en":"Reverse polarity supervision","def":"A method in which the NAC is supervised in standby with reversed polarity (the appliance diodes block current) and the polarity is reversed in alarm to energize the appliances."},{"en":"Sync module","def":"A listed device that sends the manufacturer's synchronization protocol to the appliances on one or more NACs."},{"en":"Exit marking audible notification appliance","def":"A directional sounder that guides occupants to exits and areas of refuge (§18.4.8)."},{"en":"Sleeping area","def":"A space intended or reasonably used for sleeping (hotel room, room with a sofa bed, on-call room); requires 75 dBA, 520 Hz, and 110 or 177 cd visual appliances."},{"en":"Textual visual notification appliance","def":"An appliance that displays alphanumeric or pictorial messages, such as a message sign."},{"en":"Tactile notification appliance","def":"An appliance that alerts by touch (for example, a bed shaker); its performance is evaluated per UL 1971."},{"en":"Masked threshold (narrow band)","def":"The minimum level at which a tone can be heard in the presence of noise; the alternate method requires exceeding it by 10 dB per octave band or 13 dB per one-third octave band."},{"en":"Type 2 sound level meter","def":"An instrument meeting ANSI/ASA S1.4 Type 2, required to measure sound pressure levels during acceptance testing (A-weighting, FAST)."}]},"questions":[{"id":"notif-001","task":"1.1.1","type":"single","diff":1,"freq":true,"q":{"en":"According to NFPA 72, a wall-mounted visual notification appliance (strobe) must be mounted so that its entire lens is within which height range above the finished floor?"},"opts":[{"en":"Not less than 72 in. and not greater than 90 in."},{"en":"Not less than 80 in. and not greater than 96 in."},{"en":"Top not less than 90 in. and at least 6 in. below the ceiling"},{"en":"Not less than 80 in. and not greater than 120 in."}],"ans":[1],"ref":"NFPA 72-2022 §18.5.5.1","exp":"§18.5.5.1 requires the entire lens of a wall-mounted visual appliance to be between 80 in. (2.03 m) and 96 in. (2.44 m) above the finished floor, unless the performance-based method is used. The 90 in. / 6 in. rule is for audible-only appliances (§18.4.9.1)."},{"id":"notif-002","task":"1.1.1","type":"single","diff":2,"freq":true,"q":{"en":"A horn-only appliance (no strobe) will be wall-mounted in a room with a 9 ft (108 in.) ceiling. Which height for the TOP of the appliance complies with NFPA 72 without using any exception?"},"opts":[{"en":"88 in. above the finished floor"},{"en":"104 in. above the finished floor"},{"en":"98 in. above the finished floor"},{"en":"106 in. above the finished floor"}],"ans":[2],"ref":"NFPA 72-2022 §18.4.9.1","exp":"§18.4.9.1 requires the top of a wall-mounted audible appliance to be not less than 90 in. (2.29 m) above the floor and not less than 6 in. (150 mm) below the ceiling. With a 108-in. ceiling, the top must be between 90 and 102 in.; only 98 in. complies. At 104 and 106 in. the top is less than 6 in. from the ceiling, and 88 in. is below 90 in."},{"id":"notif-003","task":"1.1.1","type":"single","diff":2,"freq":true,"q":{"en":"An installer is mounting a combination horn/strobe on a wall. Which requirement determines its mounting height?"},"opts":[{"en":"The visual appliance location rules, so the entire lens must be between 80 in. and 96 in. above the floor"},{"en":"The audible rules, so the top must be at least 90 in. above the floor and 6 in. below the ceiling"},{"en":"Either rule, at the installer's choice"},{"en":"The higher of the two rules, so the top must be at 96 in. or more above the floor"}],"ans":[0],"ref":"NFPA 72-2022 §18.4.9.3 and §18.5.5.1","exp":"§18.4.9.3 states that the location of combination audible/visual appliances is determined by the visual requiremen
